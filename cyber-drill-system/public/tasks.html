<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>任务协同中心 · 盘州市人民医院网络安全应急演练系统</title>
<link rel="icon" type="image/png" href="img/logo.png">
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="tasks">
<script src="system.js"></script>
<script src="app.js"></script>
<script src="api.js"></script>
<script>
document.addEventListener('app:ready', function(e){
  var role = e.detail.role;
  var page = document.getElementById('page');
  var proj = API.activeProject();
  var canAll = role.id==='commander';
  var isCmd = role.id==='commander';
  /* 信息科负责人：可统筹处置本科室条线任务（值班员/网安员/系统员），不可见领导小组、上级主管、网信办、公安网安任务 */
  var MANAGED = role.id==='itlead' ? ['itlead','duty','netsec','sysadmin'] : null;
  /* 任务删除：仅指挥部/信息科负责人，且已归档项目不可删除 */
  var canDel = (role.id==='commander' || role.id==='itlead') && proj.status!=='已归档';

  /* 演练事件模拟数据：按当前项目场景 type 取 SIM_DATA，供表单自动预填与自动取证截图（全部为虚拟演练数据） */
  var SCEN = MOCK.SCENARIOS.filter(function(s){ return s.id===proj.scenarioId; })[0] || null;
  var FACTS = (function(){
    var SIM = MOCK.SIM_DATA || {};
    return (SCEN && SIM[SCEN.type]) || SIM['通用'] || {
      sys:'院内业务系统（模拟地址 10.20.x.x）', fault:'模拟故障现象（通用兜底，请按实际修改）',
      alert:'态势感知平台（模拟）：推送安全告警', ip:'10.20.x.x（模拟可疑IP）',
      sample:'模拟样本摘要（占位）', scope:'模拟范围（无真实业务影响）',
      action:'按预案模拟处置', progress:'按剧本推进中（模拟）',
      backup:'备份有效性校验（模拟）', impact:'无真实业务影响（模拟）', measure:'按预案启用纸质/人工兜底（模拟）'
    };
  })();

  /* 工作副本：按当前项目过滤 + 角色可见性（完成状态由服务端持久化，登录后随引导数据下发） */
  var tasks = MOCK.TASKS.filter(function(t){ return t.projectId===proj.id; }).map(function(t){
    return Object.assign({}, t);
  });
  if(MANAGED) tasks = tasks.filter(function(t){ return MANAGED.indexOf(t.role)>=0; });
  else if(!canAll) tasks = tasks.filter(function(t){ return t.role===role.id; });

  var curFilter = '全部', curRoleF = '全部';

  /* 页内局部图标helper：指定尺寸的裸图标（tab/表格单元格/section-title处无svg尺寸规则） */
  function ic(n,s){ return '<svg viewBox="0 0 24 24" style="width:'+s+'px;height:'+s+'px;flex:none;vertical-align:-2px">'+(App.ICONS[n]||App.ICONS.file)+'</svg>'; }

  function roleName(id){ var r = MOCK.ROLES.filter(function(x){ return x.id===id; })[0]; return r ? r.name : id; }
  function roleShort(id){ var r = MOCK.ROLES.filter(function(x){ return x.id===id; })[0]; return r ? r.short : id; }

  /* 关联剧本节点：优先按表单匹配，其次按接收角色匹配 */
  function nodeForTask(t){
    var n = null;
    if(t.forms && t.forms.length){
      n = MOCK.SCRIPT_NODES.filter(function(x){ return x.form===t.forms[0]; })[0];
    }
    if(!n){
      n = MOCK.SCRIPT_NODES.filter(function(x){
        return x.target.indexOf(roleShort(t.role))>=0 || x.target.indexOf(roleName(t.role))>=0;
      })[0];
    }
    return n;
  }

  /* ---------- 表单字段模拟值自动填充（按当前演练场景 FACTS，可修改后提交） ---------- */
  function simTimeVal(t, node){
    var d = new Date();
    function p2(n){ return n<10 ? '0'+n : String(n); }
    var tm = (node && node.time) || t.deadline || '09:00';
    return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+'T'+tm;
  }
  function simValue(fd, t, node){
    if(/时间/.test(fd)) return simTimeVal(t, node);
    if(/发现方式/.test(fd)) return String(FACTS.alert||'').split('：')[0] || '安全告警系统';
    if(/涉及系统|IP/i.test(fd)) return FACTS.sys;
    if(/描述|现象/.test(fd)) return FACTS.fault;
    if(/判断/.test(fd)) return '结合告警与样本特征（'+FACTS.sample+'），初步判定为'+(SCEN?SCEN.type:'模拟')+'类事件（模拟判定）';
    if(/核实人|确认人|审批人|联系人|报送人|填报人|研判人|报案人/.test(fd)) return App.curUser()||roleShort(t.role);
    if(/范围/.test(fd)) return FACTS.scope;
    if(/进展/.test(fd)) return FACTS.progress;
    if(/等级/.test(fd)) return (SCEN&&SCEN.level)||t.level||'较大';
    if(/类型/.test(fd)) return SCEN?SCEN.type:'模拟事件';
    if(/单位/.test(fd)) return (proj.units&&proj.units[0])||'盘州市人民医院';
    if(/摘要|经过|依据/.test(fd)) return (SCEN?SCEN.desc:FACTS.fault)+'（系统自动填充，请按实际修改）';
    if(/患者数/.test(fd)) return '0（虚拟数据，无真实患者）';
    if(/损失/.test(fd)) return FACTS.impact;
    if(/证据清单/.test(fd)) return FACTS.sample+'、告警与故障截图（自动取证）';
    if(/清单/.test(fd)) return FACTS.sys;
    if(/校验|备份/.test(fd)) return FACTS.backup;
    if(/结果|验证/.test(fd)) return '业务验证通过（模拟，无真实影响）';
    if(/兜底|方案/.test(fd)) return FACTS.measure;
    if(/措施/.test(fd)) return FACTS.action;
    if(/意见/.test(fd)) return '同意，按预案执行（模拟审批）';
    return '模拟数据·自动填充';
  }

  page.innerHTML =
    '<div class="page-head"><div><h1>任务协同中心</h1><div class="sub">'+App.esc(proj.name)+' · 任务按剧本节点自动下发 · 全部处置动作均为演练模拟记录</div></div>'
    + '<div class="acts">'
    + (isCmd ? '<button class="btn danger" id="btnSupervise">'+App.icon('bell')+'人工触发督办消息</button>' : '')
    + '<button class="btn" id="btnBackProj">'+App.icon('projects')+App.esc(proj.id)+'</button></div></div>'
    + '<div class="sim-banner">'+App.icon('alert')+'<span>本页所有接单、处置、提交、督办操作均为<b>演练模拟记录</b>，仅写入演练台账与取证模块，不会下发任何真实命令，不涉及真实患者数据。</span></div>'
    + '<div class="tabs" id="taskTabs"></div>'
    + '<div class="filters" id="taskFilters"></div>'
    + '<div class="table-wrap"><table class="table"><thead><tr>'
    + '<th>任务编号</th><th>标题</th><th>来源节点</th><th>接收角色</th><th>等级</th><th>时限</th><th>状态</th><th>操作</th>'
    + '</tr></thead><tbody id="taskTbody"></tbody></table></div>';

  document.getElementById('btnBackProj').onclick = function(){ location.href='projects.html'; };

  /* ---------- 筛选 tabs ---------- */
  var FILTERS = ['全部','待处理','处理中','已完成','超时'];
  function renderTabs(){
    document.getElementById('taskTabs').innerHTML = FILTERS.map(function(f){
      var cnt = f==='全部' ? tasks.length : tasks.filter(function(t){ return t.status===f; }).length;
      return '<span class="tab'+(curFilter===f?' active':'')+'" data-f="'+f+'">'+f+'<span class="cnt">'+cnt+'</span>'+(f==='超时'?'<span style="color:var(--err)">'+ic('alert',13)+'</span>':'')+'</span>';
    }).join('');
    document.querySelectorAll('#taskTabs .tab').forEach(function(el){
      el.onclick = function(){ curFilter = el.dataset.f; renderTabs(); renderTable(); };
    });
  }

  /* ---------- 角色筛选（可见全部任务的角色） ---------- */
  function renderFilters(){
    if(!canAll && !MANAGED){ document.getElementById('taskFilters').innerHTML=''; return; }
    var roles = [];
    tasks.forEach(function(t){ if(roles.indexOf(t.role)<0) roles.push(t.role); });
    document.getElementById('taskFilters').innerHTML =
      '<span class="small muted">接收角色：</span><select class="select" id="roleSel">'
      + ['全部'].concat(roles.map(function(r){ return roleName(r); })).map(function(n){
          return '<option'+(curRoleF===n?' selected':'')+'>'+n+'</option>';
        }).join('') + '</select>'
      + '<span class="tiny dim">'+(canAll?'当前角色可查看本项目全部任务':'信息科负责人可统筹处置本科室条线（值班员/网安员/系统员）任务，领导小组、上级主管、网信办、公安网安任务不可见')+'，普通角色仅可见本角色任务（分级权限）</span>';
    document.getElementById('roleSel').onchange = function(){ curRoleF=this.value; renderTable(); };
  }

  /* ---------- 表格 ---------- */
  function visibleTasks(){
    var list = tasks.filter(function(t){
      if(curFilter!=='全部' && t.status!==curFilter) return false;
      if((canAll||MANAGED) && curRoleF!=='全部' && roleName(t.role)!==curRoleF) return false;
      return true;
    });
    list.sort(function(a,b){
      var ao = a.status==='超时'?0:1, bo = b.status==='超时'?0:1;
      if(ao!==bo) return ao-bo;
      return a.deadline < b.deadline ? -1 : 1;
    });
    return list;
  }

  function renderTable(){
    var list = visibleTasks();
    var tb = document.getElementById('taskTbody');
    if(!list.length){
      tb.innerHTML = '<tr><td colspan="8"><div class="empty">'+App.icon('file')+'<div>当前筛选条件下暂无任务</div></div></td></tr>';
      return;
    }
    tb.innerHTML = list.map(function(t){
      var od = t.status==='超时';
      var node = nodeForTask(t);
      return '<tr data-id="'+t.id+'" style="cursor:pointer'+(od?';background:rgba(248,81,73,.06)':'')+'">'
        + '<td class="mono">'+(od?'<span style="color:var(--err)">'+ic('alert',14)+'</span> ':'')+t.id+'</td>'
        + '<td><span'+(od?' style="color:var(--err);font-weight:600"':'')+'>'+App.esc(t.title)+'</span></td>'
        + '<td class="small muted">'+App.esc(node?node.title:'—')+'</td>'
        + '<td class="small">'+App.esc(roleName(t.role))+'</td>'
        + '<td>'+App.levelTag(t.level)+'</td>'
        + '<td class="mono small"'+(od?' style="color:var(--err)"':'')+'>'+t.deadline+'</td>'
        + '<td>'+App.statusTag(t.status)+'</td>'
        + '<td><button class="btn sm" data-act="detail">详情</button>'
        + (isCmd && od ? ' <button class="btn sm danger" data-act="urge">督办</button>' : '')
        + (canDel ? ' <button class="btn sm outline" data-act="del">删除</button>' : '')
        + '</td></tr>';
    }).join('');
    tb.querySelectorAll('tr').forEach(function(tr){
      tr.onclick = function(ev){
        var btn = ev.target.closest('button');
        var t = tasks.filter(function(x){ return x.id===tr.dataset.id; })[0];
        if(btn && btn.dataset.act==='urge'){ urgeTask(t); return; }
        if(btn && btn.dataset.act==='del'){ delTask(t); return; }
        if(t) openDrawer(t.id);
      };
    });
  }

  /* ---------- 删除任务 ---------- */
  function delTask(t){
    if(!t) return;
    var nAtt = (t.atts||[]).length;
    App.confirmSim('删除任务 '+t.id+'「'+t.title+'」？该任务已上传的附件（'+nAtt+' 个）、表单提交与关联取证记录将一并清除，操作不可恢复（演练模拟）。', function(){
      API.deleteTask(t.id).then(function(r){
        tasks = tasks.filter(function(x){ return x.id!==t.id; });
        renderTabs(); renderTable(); App.refreshShell();
        App.toast('任务 '+t.id+' 已删除（附件 '+(r.attachments||0)+' 个 / 取证 '+(r.evidence||0)+' 条已清理）','ok');
      }).catch(function(err){ App.toast((err&&err.message)||'删除失败，请稍后重试','err'); });
    });
  }

  /* ---------- 督办 ---------- */
  function urgeTask(t){
    App.confirmSim('向「'+roleName(t.role)+'」推送任务 '+t.id+' 超时督办提醒（演练模拟消息，不产生真实外呼）。', function(){
      API.pushMessage({ level:'P1', source:'院应急指挥部人工督办（演练模拟）',
        text:'【演练模拟·督办提醒】任务 '+t.id+'「'+t.title+'」已超时（时限 '+t.deadline+'），请'+roleName(t.role)+'立即处理并反馈',
        targets:[t.role] });
      App.toast('督办提醒已推送至「'+roleShort(t.role)+'」（演练模拟）','ok');
    });
  }
  var btnSup = document.getElementById('btnSupervise');
  if(btnSup){
    btnSup.onclick = function(){
      var ods = tasks.filter(function(t){ return t.status==='超时'; });
      if(!ods.length){ App.toast('当前项目暂无超时任务','ok'); return; }
      App.modal({ title:'人工触发督办消息', body:'<div class="sim-banner">'+App.icon('alert')+'<span>对超时任务向接收角色推送提醒（演练模拟），记录写入消息流与审计日志。</span></div>'
        + ods.map(function(t){
            return '<div class="task-item overdue" data-id="'+t.id+'" style="margin-bottom:8px"><span class="tk-ic">'+App.icon('clock')+'</span>'
            + '<div><div class="tk-title">'+App.esc(t.id)+' · '+App.esc(t.title)+'</div>'
            + '<div class="tk-meta"><span>接收：'+App.esc(roleName(t.role))+'</span><span style="color:var(--err)">时限 '+t.deadline+' 已超时</span></div></div>'
            + '<span class="tk-right"><button class="btn sm danger">推送督办</button></span></div>';
          }).join(''),
        onOpen:function(ov){
          ov.querySelectorAll('.task-item').forEach(function(el){
            el.onclick = function(){
              var t = tasks.filter(function(x){ return x.id===el.dataset.id; })[0];
              ov.close(); urgeTask(t);
            };
          });
        } });
    };
  }

  /* ---------- 节点证据附件上传（真实文件选择 + 屏幕截图，内存态） ---------- */
  var BAD_EXT = /\.(exe|bat|cmd|vbs|scr|msi|com|pif|jar)$/i;
  var IMG_EXT = /\.(png|jpe?g|gif|bmp|webp|svg)$/i;
  var MAX_MB = 20;
  function fmtSize(b){ return b<1024 ? b+' B' : b<1048576 ? (b/1024).toFixed(1)+' KB' : (b/1048576).toFixed(1)+' MB'; }
  function guessType(name, mime){
    var n = String(name||'').toLowerCase();
    if(/^image\//.test(mime||'') || IMG_EXT.test(n)) return '截图';
    if(/\.(pcap|cap|pcapng)$/.test(n)) return '流量包摘要';
    if(/\.(log|txt|csv)$/.test(n)) return '日志片段';
    if(/\.(cfg|conf|ini|yaml|yml|json)$/.test(n)) return '配置备份';
    return '文档';
  }
  function attHtml(t){
    if(!(t.atts && t.atts.length)) return '<span class="small dim">无附件 · 可上传处置截图、日志片段等证据材料（支持选择本地文件或直接屏幕截图）</span>';
    return t.atts.map(function(a){
      var obj = (a && typeof a==='object') ? a : {name:a};
      var auto = (obj.by==='系统自动' || obj.auto) ? '⚙ ' : '';
      var nm = App.esc(obj.name || String(a));
      var meta = obj.time ? (obj.time+' · '+(obj.by||'')+(obj.size?(' · '+obj.size):'')) : '附件';
      if(obj.by==='系统自动' || obj.auto) meta = '自动生成 · '+meta;
      var isImg = obj.url && (/^data:image/.test(obj.url) || /\.(png|jpe?g|gif|webp|bmp)$/i.test(String(obj.url).split('?')[0]));
      if(isImg){
        return '<span class="file-chip att-img" title="点击放大预览" style="padding:4px 8px 4px 4px;cursor:pointer"><img src="'+App.esc(obj.url)+'" alt="" style="width:56px;height:40px;object-fit:cover;border-radius:4px;display:block;flex:none">'+auto+nm+'<span class="fc-size">'+meta+'</span></span>';
      }
      var dl = obj.url ? ' <a href="'+App.esc(obj.url)+'" target="_blank" rel="noopener" style="color:var(--accent2);margin-left:4px">下载</a>' : '';
      return '<span class="file-chip">'+App.icon('file')+auto+nm+'<span class="fc-size">'+meta+'</span>'+dl+'</span>';
    }).join('');
  }

  function refreshAtt(t, host){
    var box = host && host.querySelector ? host.querySelector('#attBox-'+t.id) : null;
    if(box) box.innerHTML = attHtml(t);
  }

  /* 真实文件上传：FormData 提交至服务端，落盘 uploads/ 并归档取证 */
  function uploadFiles(t, host, files, onDone){
    var valid = [], rejected = [];
    files.forEach(function(f){
      if(BAD_EXT.test(f.name)) rejected.push(f.name + '（禁止的可执行/脚本类型）');
      else if(f.size > MAX_MB*1048576) rejected.push(f.name + '（超出' + MAX_MB + 'MB）');
      else valid.push(f);
    });
    if(!valid.length){
      App.toast('所选文件未通过校验：' + rejected.join('；'), 'err');
      if(onDone) onDone(0, rejected.length);
      return;
    }
    var fd = new FormData();
    valid.forEach(function(f){ fd.append('files', f); });
    API.uploadTaskAttachments(t.id, fd).then(function(r){
      var list = r.attachments || [];
      if(!t.atts) t.atts = [];
      list.forEach(function(a){ t.atts.push(a); });
      refreshAtt(t, host);
      var msg = list.length + ' 个附件已上传并归档至取证模块';
      if(rejected.length) msg += '，' + rejected.length + ' 个被校验拦截';
      App.toast(msg, rejected.length ? 'warn' : 'ok');
      if(onDone) onDone(list.length, rejected.length);
    });
  }

  /* 自动取证/屏幕截图：dataURL 交给服务端存为真实文件，并登记为任务附件（按任务+名称幂等） */
  function pushAutoAtt(t, host, att, onDone){
    API.addEvidence({ type: att.type || '截图', name: att.name, size: att.size || '-',
      taskId: t.id, auto: true, asAttachment: true, dataUrl: att.url }).then(function(r){
      var rec = { id: r.attId, name: att.name, type: att.type || '截图', size: r.size || att.size || '-',
        url: r.url || att.url, by: '系统自动', time: att.time, auto: true };
      if(!t.atts) t.atts = [];
      var dup = t.atts.filter(function(x){ return x && x.name === att.name; })[0];
      if(dup){ dup.url = rec.url; dup.size = rec.size; }
      else t.atts.push(rec);
      refreshAtt(t, host);
      if(onDone) onDone(rec);
    });
  }
  /* 屏幕截图：浏览器原生屏幕捕获，抓取一帧存为PNG证据附件 */
  function openScreenshot(t, host){
    if(!(navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia)){
      App.toast('当前浏览器不支持屏幕截图，请使用“选择文件”上传截图','err'); return;
    }
    navigator.mediaDevices.getDisplayMedia({video:true}).then(function(stream){
      var video = document.createElement('video');
      video.muted = true;
      video.srcObject = stream;
      video.onloadedmetadata = function(){
        video.play();
        setTimeout(function(){
          var c = document.createElement('canvas');
          c.width = video.videoWidth || 1280; c.height = video.videoHeight || 720;
          c.getContext('2d').drawImage(video, 0, 0, c.width, c.height);
          stream.getTracks().forEach(function(tr){ tr.stop(); });
          var url = c.toDataURL('image/png');
          var d = new Date();
          function p2(n){ return n<10 ? '0'+n : String(n); }
          var name = '屏幕截图-'+t.id+'-'+p2(d.getHours())+p2(d.getMinutes())+p2(d.getSeconds())+'.png';
          pushAutoAtt(t, host, { name:name, time:d.toTimeString().slice(0,5), by:'系统自动', type:'截图', size:fmtSize(Math.round(url.length*0.75)), url:url });
          App.toast('屏幕截图完成：证据附件已归档至取证模块','ok');
        }, 350);
      };
      video.onerror = function(){ App.toast('截图失败：无法读取屏幕画面','err'); };
    }, function(){ /* 用户取消共享，不提示 */ });
  }
  function openAttUpload(t, host){
    var picked = [];
    App.modal({ title:'上传证据附件 · '+t.id,
      body:'<div class="sim-banner">'+App.icon('alert')+'<span>真实文件上传：可选择本地证据文件，或直接<b>屏幕截图</b>取证。<b>严禁上传可执行程序/脚本/恶意样本</b>，单文件限 '+MAX_MB+'MB（原型内文件仅存内存，演练模拟留痕）。</span></div>'
        + '<div class="flex wrap gap2 mb3">'
        + '<button class="btn primary" id="attPick">'+App.icon('file')+'选择文件</button>'
        + '<button class="btn" id="attShot">'+App.icon('camera')+'屏幕截图</button>'
        + '<input type="file" id="attFile" multiple style="display:none">'
        + '</div>'
        + '<div id="attList" class="small muted">尚未选择文件 · 选择后将在此显示类型/大小校验结果</div>',
      foot:'<button class="btn" id="attNo">取消</button><button class="btn primary" id="attYes">'+App.icon('upload')+'上传归档</button>',
      onOpen:function(ov){
        var listBox = ov.querySelector('#attList');
        var fileIn = ov.querySelector('#attFile');
        function renderPicked(){
          if(!picked.length){ listBox.innerHTML = '<span class="small muted">尚未选择文件 · 选择后将在此显示类型/大小校验结果</span>'; return; }
          listBox.innerHTML = picked.map(function(p, i){
            return '<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line)">'
              + (p.url ? '<img src="'+p.url+'" style="width:44px;height:32px;object-fit:cover;border-radius:4px;flex:none">' : App.icon('file'))
              + '<span class="mono small" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+App.esc(p.name)+'</span>'
              + '<span class="tiny dim">'+p.type+' · '+p.sizeTxt+'</span>'
              + '<span class="tiny" style="color:'+(p.ok?'var(--ok)':'var(--err)')+'">'+(p.ok?'✓ 校验通过':'✕ '+p.err)+'</span>'
              + '<span class="att-del" data-i="'+i+'" title="移除" style="cursor:pointer;color:var(--err);flex:none">✕</span></div>';
          }).join('');
          listBox.querySelectorAll('.att-del').forEach(function(el){
            el.onclick = function(){ picked.splice(parseInt(el.dataset.i,10),1); renderPicked(); };
          });
        }
        function addFile(f){
          var p = { name:f.name, size:f.size, sizeTxt:fmtSize(f.size), type:guessType(f.name, f.type), ok:true, err:'', file:f };
          if(BAD_EXT.test(f.name)){ p.ok=false; p.err='禁止的可执行/脚本类型'; }
          else if(f.size > MAX_MB*1048576){ p.ok=false; p.err='超出'+MAX_MB+'MB限制'; }
          picked.push(p);
          if(p.ok && (/^image\//.test(f.type||'') || IMG_EXT.test(f.name))){
            var fr = new FileReader();
            fr.onload = function(){ p.url = fr.result; renderPicked(); };
            fr.readAsDataURL(f);
          }
          renderPicked();
        }
        ov.querySelector('#attPick').onclick = function(){ fileIn.click(); };
        fileIn.onchange = function(){
          var fs = fileIn.files || [];
          for(var i=0;i<fs.length;i++) addFile(fs[i]);
          fileIn.value = '';
        };
        ov.querySelector('#attShot').onclick = function(){ openScreenshot(t, host); };
        ov.querySelector('#attNo').onclick = ov.close;
        ov.querySelector('#attYes').onclick = function(){
          if(!picked.length){ App.toast('请先选择文件或使用屏幕截图','err'); return; }
          var valid = picked.filter(function(p){ return p.ok; });
          if(!valid.length){ App.toast('所选文件均未通过校验：禁止可执行/脚本文件或超出'+MAX_MB+'MB','err'); return; }
          var files = valid.map(function(p){ return p.file; }).filter(Boolean);
          if(!files.length){ App.toast('所选文件无法读取，请重新选择','err'); return; }
          ov.close();
          uploadFiles(t, host, files);
        };
      } });
  }

  /* ---------- 演练事件自动取证截图（canvas本地绘制，模拟告警/系统故障界面） ---------- */
  function wrapLines(g, text, maxW){
    var lines = [], cur = '', chars = String(text||'').split('');
    for(var i=0;i<chars.length;i++){
      var trial = cur + chars[i];
      if(g.measureText(trial).width > maxW && cur){ lines.push(cur); cur = chars[i]; }
      else cur = trial;
    }
    if(cur) lines.push(cur);
    return lines;
  }
  function drawSimShot(kind, t){
    var c = document.createElement('canvas');
    c.width = 640; c.height = 360;
    var g = c.getContext('2d');
    var d = new Date();
    function p2(n){ return n<10 ? '0'+n : String(n); }
    var ts = d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+' '+p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds());
    var lines, i, y;
    if(kind==='alert'){
      g.fillStyle='#0d1117'; g.fillRect(0,0,640,360);
      g.fillStyle='#161b22'; g.fillRect(0,0,640,40);
      g.strokeStyle='#30363d'; g.lineWidth=1; g.strokeRect(0.5,0.5,639,359);
      var dots = ['#f85149','#d29922','#3fb950'];
      for(i=0;i<3;i++){ g.beginPath(); g.arc(18+i*16,20,5,0,Math.PI*2); g.fillStyle=dots[i]; g.fill(); }
      g.fillStyle='#c9d1d9'; g.font='bold 14px "Microsoft YaHei",sans-serif';
      g.fillText('态势感知平台（模拟） · 安全告警详情',80,25);
      g.fillStyle='rgba(248,81,73,.15)'; g.fillRect(20,52,118,26);
      g.strokeStyle='#f85149'; g.strokeRect(20.5,52.5,117,25);
      g.fillStyle='#f85149'; g.font='bold 13px "Microsoft YaHei",sans-serif';
      g.fillText((t.level||'P0')+' 高危告警',30,70);
      g.fillStyle='#8b949e'; g.font='12px Consolas,monospace';
      g.fillText('告警时间 '+ts,156,70);
      g.fillStyle='#e6edf3'; g.font='13px "Microsoft YaHei",sans-serif';
      y = 104;
      lines = wrapLines(g,'告警内容：'+FACTS.alert,590);
      for(i=0;i<lines.length;i++){ g.fillText(lines[i],22,y); y+=20; }
      lines = wrapLines(g,'可疑地址：'+FACTS.ip,590);
      for(i=0;i<lines.length;i++){ g.fillText(lines[i],22,y); y+=20; }
      lines = wrapLines(g,'样本特征：'+FACTS.sample,590);
      for(i=0;i<lines.length;i++){ g.fillText(lines[i],22,y); y+=20; }
      lines = wrapLines(g,'关联处置：'+FACTS.action,590);
      for(i=0;i<lines.length;i++){ g.fillText(lines[i],22,y); y+=20; }
      g.fillStyle='#484f58'; g.font='12px "Microsoft YaHei",sans-serif';
      g.fillText('【模拟数据 · 系统自动取证 · 不含真实患者数据】 任务 '+t.id,22,340);
    } else {
      g.fillStyle='#eef1f5'; g.fillRect(0,0,640,360);
      g.fillStyle='#2f81f7'; g.fillRect(0,0,640,36);
      g.fillStyle='#ffffff'; g.font='bold 14px "Microsoft YaHei",sans-serif';
      g.fillText('HIS 医院信息系统（模拟） — 门诊工作站',16,23);
      g.fillStyle='#ffffff'; g.fillRect(0,36,640,324);
      g.strokeStyle='#d0d7de'; g.lineWidth=1;
      g.beginPath(); g.moveTo(0,36.5); g.lineTo(640,36.5); g.stroke();
      g.fillStyle='#f6f8fa'; g.fillRect(60,74,520,178);
      g.strokeStyle='#d0d7de'; g.strokeRect(60.5,74.5,519,177);
      g.beginPath(); g.arc(96,112,16,0,Math.PI*2); g.fillStyle='#f85149'; g.fill();
      g.strokeStyle='#ffffff'; g.lineWidth=3;
      g.beginPath(); g.moveTo(89,105); g.lineTo(103,119); g.moveTo(103,105); g.lineTo(89,119); g.stroke();
      g.fillStyle='#1f2328'; g.font='bold 15px "Microsoft YaHei",sans-serif';
      g.fillText('系统连接异常（模拟故障界面）',124,117);
      g.font='13px "Microsoft YaHei",sans-serif'; g.fillStyle='#57606a';
      lines = wrapLines(g,FACTS.fault,470);
      y = 146;
      for(i=0;i<lines.length;i++){ g.fillText(lines[i],80,y); y+=19; }
      g.fillStyle='#2f81f7'; g.fillRect(368,214,96,28);
      g.fillStyle='#ffffff'; g.font='13px "Microsoft YaHei",sans-serif';
      g.fillText('重试连接',392,232);
      g.fillStyle='#ffffff'; g.fillRect(252,214,104,28);
      g.strokeStyle='#57606a'; g.strokeRect(252.5,214.5,103,27);
      g.fillStyle='#57606a'; g.fillText('切换纸质流程',266,232);
      g.strokeStyle='rgba(248,81,73,.7)'; g.lineWidth=2; g.strokeRect(20.5,296.5,330,32);
      g.fillStyle='rgba(248,81,73,.85)'; g.font='bold 13px "Microsoft YaHei",sans-serif';
      g.fillText('【模拟数据 · 系统自动取证 · 无真实患者数据】任务 '+t.id,30,317);
      g.fillStyle='#8b949e'; g.font='12px Consolas,monospace';
      g.fillText(ts,520,317);
    }
    return c.toDataURL('image/png');
  }
  function ensureAutoAtts(t, host){
    if(t._autoAtt) return;
    t._autoAtt = true;
    var d = new Date();
    function p2(n){ return n<10 ? '0'+n : String(n); }
    var tm = p2(d.getHours())+':'+p2(d.getMinutes());
    [{ name:'自动取证-告警截图-'+t.id+'.png', kind:'alert' },
     { name:'自动取证-系统故障截图-'+t.id+'.png', kind:'fault' }].forEach(function(s){
      var url;
      try{ url = drawSimShot(s.kind, t); }catch(err){ return; }
      pushAutoAtt(t, host, { name:s.name, time:tm, by:'系统自动', type:'截图', size:fmtSize(Math.round(url.length*0.75)), url:url });
    });
  }

  /* ---------- 任务详情抽屉 ---------- */
  function openDrawer(id){
    var t = tasks.filter(function(x){ return x.id===id; })[0];
    if(!t) return;
    var node = nodeForTask(t);
    var recs = MOCK.TIMELINE.filter(function(x){ return x.role===t.role; });
    var forms = (t.forms||[]).map(function(fid){ return MOCK.FORM_TEMPLATES.filter(function(f){ return f.id===fid; })[0]; }).filter(Boolean);

    var body = '<div class="kv mb4">'
      + '<span class="k">任务编号</span><span class="mono">'+t.id+'</span>'
      + '<span class="k">任务标题</span><span class="bold">'+App.esc(t.title)+'</span>'
      + '<span class="k">接收角色</span><span>'+App.esc(roleName(t.role))+'</span>'
      + '<span class="k">等级 / 时限</span><span>'+App.levelTag(t.level)+' <span class="mono">今日 '+t.deadline+'</span></span>'
      + '<span class="k">当前状态</span><span>'+App.statusTag(t.status)+(t.status==='超时'?' <span class="tiny" style="color:var(--err)">已置顶并标红</span>':'')+'</span>'
      + '</div>'
      + '<div class="section-title">'+ic('flow',15)+'关联剧本节点</div>'
      + '<div class="card mb4" style="padding:12px 14px">'+ (node
          ? '<div class="small bold">'+App.esc(node.title)+' <span class="mono dim">'+node.time+'</span></div><div class="tiny muted mt2">'+App.esc(node.desc)+(node.timeout?(' · 超时'+node.timeout+'分钟提醒'):'')+'</div>'
          : '<div class="small muted">未匹配到剧本节点（模拟兜底）</div>') + '</div>'
      + '<div class="section-title">'+ic('clock',15)+'处置记录时间线</div>'
      + (recs.length
          ? '<div class="timeline mb4">'+recs.map(function(r){
              return '<div class="tl-item '+(r.level==='P0'?'err':r.level==='P1'?'warn':'ok')+'"><span class="tl-dot"></span>'
              + '<div class="tl-time">'+r.t+' · '+App.esc(r.actor)+'</div><div class="tl-title">'+App.esc(r.action)+'</div>'
              + '<div class="tl-desc">'+App.esc(r.detail)+'</div></div>';
            }).join('')+'</div>'
          : '<div class="small muted mb4">暂无处置记录 · 接单后按剧本推进将自动留痕（演练模拟）</div>')
      + '<div class="section-title">'+ic('file',15)+'附件清单 <button class="btn sm outline" id="btnAtt-'+t.id+'">'+App.icon('upload')+'上传证据附件</button></div>'
      + '<div class="flex wrap gap2 mb4" id="attBox-'+t.id+'">'+attHtml(t)+'</div>';

    if(forms.length){
      body += '<div class="section-title">'+ic('edit',15)+'需提交表单 <span class="tiny dim" style="font-weight:400">系统已按场景【'+App.esc(SCEN?SCEN.type:'通用')+'】自动填充模拟数据，<b style="color:var(--warn)">请参演人员核对并按本岗实际情况修改后提交</b></span></div>';
      forms.forEach(function(f, fi){
        body += '<div class="card mb4" style="padding:14px 16px"><div class="small bold mb3">'+App.esc(f.name)+' <span class="tag gray">'+f.id+'</span></div>'
          + '<div class="form-grid">'
          + f.fields.map(function(fd, di){
              var long = /描述|意见|摘要|进展|清单|方案|依据|经过|情况|范围|措施/.test(fd);
              var isTime = /时间$/.test(fd);
              var isWay = fd==='发现方式';
              var idc = 'fld-'+t.id+'-'+fi+'-'+di;
              var sv = simValue(fd, t, node);
              var ctl;
              if(isTime){
                ctl = '<input class="input" type="datetime-local" id="'+idc+'" value="'+App.esc(sv)+'" title="点击选择日期与时间，保证时间格式正确">';
              } else if(isWay){
                var did = 'dlWay-'+t.id+'-'+fi;
                ctl = '<input class="input" id="'+idc+'" list="'+did+'" value="'+App.esc(sv)+'" placeholder="下拉选择，也可自由填写">'
                  + '<datalist id="'+did+'">'+['安全告警系统','值班巡检','医护人员报障','外部单位通报','第三方监测','供应商反馈'].map(function(o){ return '<option value="'+o+'"></option>'; }).join('')+'</datalist>';
              } else {
                ctl = long ? '<textarea class="textarea" id="'+idc+'" rows="2" placeholder="模拟填写，不含真实患者信息">'+App.esc(sv)+'</textarea>'
                           : '<input class="input" id="'+idc+'" value="'+App.esc(sv)+'" placeholder="模拟填写">';
              }
              return '<div class="form-row'+(long?' span2':'')+'" style="margin-bottom:10px">'
                + '<label class="f-label" for="'+idc+'">'+App.esc(fd)+(isTime||isWay?'<span class="tiny dim">（'+(isTime?'选择':'可选/可填')+'）</span>':'')+'<span class="tiny dim">已自动填充</span><span class="req"> *</span></label>'
                + ctl + '</div>';
            }).join('')
          + '</div><button class="btn primary sm" id="btnForm-'+t.id+'-'+fi+'">'+App.icon('upload')+'提交表单（模拟）</button></div>';
      });
    }

    body += '<div class="divider"></div>'
      + '<div class="flex wrap gap2">'
      + ((t.status==='待处理'||t.status==='超时') ? '<button class="btn" id="btnAccept">'+App.icon('check')+'接单</button>' : '')
      + (t.status!=='已完成' ? '<button class="btn outline" id="btnHandle">'+App.icon('edit')+'提交处置</button>' : '')
      + (t.status!=='已完成' ? '<button class="btn ok" id="btnDone">'+App.icon('check')+'完成任务</button>' : '<span class="tag green"><span class="dot"></span>任务已完成，记录已归档</span>')
      + '</div>'
      + '<div class="tiny dim mt3">流转操作仅写入演练台账与不可篡改审计日志（服务端数据库），不触发真实系统动作。</div>';

    App.drawer({ title:'任务详情 · '+t.id, body:body, onOpen:function(ov){
      ensureAutoAtts(t, ov);
      var bu = ov.querySelector('#btnAtt-'+t.id);
      if(bu) bu.onclick = function(){ openAttUpload(t, ov); };
      var abox = ov.querySelector('#attBox-'+t.id);
      if(abox) abox.onclick = function(e){
        var chip = e.target.closest ? e.target.closest('.att-img') : null;
        if(!chip) return;
        var im = chip.querySelector('img');
        if(!im) return;
        App.modal({ title:'证据预览 · '+t.id, wide:true,
          body:'<img src="'+im.src+'" style="max-width:100%;display:block;border-radius:6px">',
          foot:'<button class="btn" id="pvNo">关闭</button>',
          onOpen:function(m){ m.querySelector('#pvNo').onclick = m.close; } });
      };
      forms.forEach(function(f, fi){
        var b = ov.querySelector('#btnForm-'+t.id+'-'+fi);
        if(b) b.onclick = function(){
          var data = {}, missing = [];
          f.fields.forEach(function(fd, di){
            var el = ov.querySelector('#fld-'+t.id+'-'+fi+'-'+di);
            var v = el ? String(el.value||'').trim() : '';
            if(!v) missing.push(fd); else data[fd] = v;
          });
          if(missing.length){ App.toast('《'+f.name+'》仍有必填项未填写：'+App.esc(missing.slice(0,3).join('、')),'err'); return; }
          b.disabled = true; b.textContent = '提交中…';
          API.submitForm(t.id, f.id, data).then(function(){
            App.toast('《'+f.name+'》已提交并归档至取证模块','ok');
            b.disabled = false; b.innerHTML = App.icon('upload')+'重新提交表单';
          }).catch(function(e){
            b.disabled = false; b.innerHTML = App.icon('upload')+'提交表单（模拟）';
            App.toast((e&&e.message)||'表单提交失败','err');
          });
        };
      });
      var ba = ov.querySelector('#btnAccept');
      if(ba) ba.onclick = function(){
        ba.disabled = true;
        API.acceptTask(t.id).then(function(){
          t.status='处理中'; renderTabs(); renderTable(); ov.close();
          App.refreshShell();
          App.toast('已接单（演练模拟），任务状态更新为处理中','ok');
        }).catch(function(e){ ba.disabled = false; App.toast((e&&e.message)||'接单失败','err'); });
      };
      var bh = ov.querySelector('#btnHandle');
      if(bh) bh.onclick = function(){
        App.confirmSim('提交任务 '+t.id+'「'+t.title+'」的处置记录（演练模拟留痕）。', function(){
          bh.disabled = true;
          API.submitTask(t.id, '').then(function(){
            bh.disabled = false;
            App.toast('演练模拟：处置记录已提交并归档','ok');
          }).catch(function(e){ bh.disabled = false; App.toast((e&&e.message)||'提交失败','err'); });
        });
      };
      var bd = ov.querySelector('#btnDone');
      if(bd) bd.onclick = function(){
        App.confirmSim('确认任务 '+t.id+'「'+t.title+'」已完成？完成后将归档至取证与复盘模块。', function(){
          bd.disabled = true;
          API.completeTask(t.id).then(function(){
            t.status='已完成';
            renderTabs(); renderTable(); ov.close();
            App.refreshShell();
            App.toast('任务已完成（演练模拟），处置留痕已归档','ok');
          }).catch(function(e){ bd.disabled = false; App.toast((e&&e.message)||'操作失败','err'); });
        });
      };
    } });
  }

  renderTabs(); renderFilters(); renderTable();
});
App.boot('tasks');
</script>
</body>
