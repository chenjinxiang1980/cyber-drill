<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>复盘评估 · 盘州市人民医院网络安全应急演练系统</title>
<link rel="stylesheet" href="styles.css">
<style>
.ev-row{display:flex;align-items:flex-start;gap:14px;padding:14px 0;border-bottom:1px dashed var(--border)}
.ev-row:last-child{border-bottom:none}
.ev-row .ev-name{width:170px;flex:none}
.ev-row .ev-rule{flex:1;font-size:11.5px;color:var(--text3);line-height:1.7}
.ev-row .ev-ro{width:250px;flex:none;text-align:right}
.ev-ro .ev-score{font-family:var(--mono);font-size:18px;font-weight:700}
.ev-total{font-size:34px;font-weight:700;font-family:var(--mono);color:var(--accent2)}
</style>
</head>
<body data-page="evaluation">
<script src="mock.js"></script><script src="app.js"></script><script src="api.js"></script>
<script>
document.addEventListener('app:ready', function(e){
  var role = e.detail.role;
  var page = document.getElementById('page');
  var proj = API.activeProject();
  var canReEval = ['commander','itlead','platformadmin'].indexOf(role.id) >= 0;

  /* ---------- 自动考评引擎：按演练模拟数据确定性计算 ---------- */
  function mins(hhmm){ var p = String(hhmm).split(':'); return (+p[0])*60 + (+p[1]); }
  function tlOf(action){ var a = MOCK.TIMELINE.filter(function(x){ return x.action===action; }); return a[0]||null; }

  function collectCtx(){
    var tasks = MOCK.TASKS.filter(function(t){ return !proj || t.projectId===proj.id; });
    return {
      overdue: tasks.filter(function(t){ return t.status==='超时'; }),
      done: tasks.filter(function(t){ return t.status==='已完成'; }),
      running: tasks.filter(function(t){ return t.status==='处理中'; }),
      pending: tasks.filter(function(t){ return t.status==='待处理'; }),
      evTotal: MOCK.EVIDENCE.length,
      evAuto: MOCK.EVIDENCE.filter(function(x){ return x.auto; }).length,
      hasReport: MOCK.EVIDENCE.filter(function(x){ return x.type==='表单文书' && x.name.indexOf('上报表')>=0; }).length>0,
      tlStart: tlOf('启动应急预案'),
      tlBackup: tlOf('启用业务兜底'),
      tlBlock: tlOf('模拟IP封堵'),
      tlRecover: tlOf('系统恢复'),
      tlWin: tlOf('窗口恢复确认'),
      tlJudge: tlOf('提交研判简报'),
      tlReport: tlOf('批准上报'),
      extNodes: MOCK.TIMELINE.filter(function(x){ return ['healthbureau','cyberpolice','cac'].indexOf(x.role)>=0; }).length,
      pendingOp: MOCK.OPINION.filter(function(o){ return o.status==='待研判'; })
    };
  }

  /* 每项指标一条确定性规则：得分 = 满分 - 按演练数据状态命中的扣分 */
  var RULES = {
    K1: function(c,w){ var d = c.overdue.length*2;
      return { score: Math.max(0, w-d), basis: c.overdue.length
        ? c.overdue.map(function(t){ return t.id; }).join('、')+' 超时未上报，按规则扣 '+d+' 分（演练模拟计算）'
        : '本链路任务均在时限内完成（演练模拟计算）'}; },
    K2: function(c,w){ return c.hasReport
      ? { score: w, basis:'《网络安全事件上报表》已提交审批并归档（取证留痕 '+c.evTotal+' 项），表单要素齐全（演练模拟计算）' }
      : { score: Math.max(0, w-5), basis:'未检出上报表归档，按规则扣 5 分（演练模拟计算）' }; },
    K3: function(c,w){ var ok = c.tlBlock && c.tlRecover && mins(c.tlBlock.t)<=mins(c.tlRecover.t);
      return ok
        ? { score: w, basis:'时序校验通过：封堵('+c.tlBlock.t+')→恢复('+c.tlRecover.t+') 顺序正确，共 '+MOCK.TIMELINE.length+' 个节点（演练模拟计算）' }
        : { score: Math.max(0, w-5), basis:'处置时序异常，按规则扣 5 分/次（演练模拟计算）' }; },
    K4: function(c,w){ if(!c.tlStart||!c.tlBackup) return { score: Math.max(0, w-2), basis:'兜底时序节点缺失，扣 2 分（演练模拟计算）' };
      var gap = mins(c.tlBackup.t)-mins(c.tlStart.t);
      return gap<=30
        ? { score: w, basis:'应急启动('+c.tlStart.t+')后 '+gap+' 分钟启用纸质兜底('+c.tlBackup.t+')，满足 30 分钟时限（演练模拟计算）' }
        : { score: Math.max(0, w-2), basis:'兜底启用用时 '+gap+' 分钟，超出 30 分钟时限扣 2 分（演练模拟计算）' }; },
    K5: function(c,w){ var d = (c.extNodes>=2?0:2) + (c.overdue.length>0?1:0);
      return { score: Math.max(0, w-d), basis:'跨部门时序节点 '+c.extNodes+' 项（督办/报案）已闭环'
        + (c.overdue.length>0?'；因 '+c.overdue[0].id+' 超时联动提醒占用协同带宽，扣 1 分':'')
        + (c.extNodes<2?'；外部节点未闭环扣 2 分':'')+'（演练模拟计算）' }; },
    K6: function(c,w){ if(!c.tlJudge||!c.tlReport) return { score: Math.max(0, w-3), basis:'上报时序节点缺失，扣 3 分（演练模拟计算）' };
      var gap = mins(c.tlReport.t)-mins(c.tlJudge.t);
      return gap<=120
        ? { score: w, basis:'研判简报('+c.tlJudge.t+')→批准上报('+c.tlReport.t+') 用时 '+gap+' 分钟，满足 2 小时时限（演练模拟计算）' }
        : { score: Math.max(0, w-3), basis:'上报用时 '+gap+' 分钟，超 2 小时时限扣 3 分（演练模拟计算）' }; },
    K7: function(c,w){ var d = c.evTotal>=8?0:2;
      return { score: Math.max(0, w-d), basis:'取证归档 '+c.evTotal+' 项（自动留痕 '+c.evAuto+' 项）'
        + (d?'，低于完整阈值 8 项，扣 '+d+' 分':'，覆盖完整')+'（演练模拟计算）' }; },
    K8: function(c,w){ var d = c.pendingOp.length>0?1:0;
      return { score: Math.max(0, w-d), basis:'对外口径均经审批流转'
        + (d?'；模拟舆情 '+c.pendingOp.map(function(o){ return o.id; }).join('、')+' 仍待研判，扣 1 分':'，无擅自发布')+'（演练模拟计算）' }; },
    K9: function(c,w){ var ok = c.tlRecover && c.tlWin;
      return ok
        ? { score: w, basis:'系统恢复('+c.tlRecover.t+')与窗口恢复确认('+c.tlWin.t+') 双节点闭环（演练模拟计算）' }
        : { score: Math.max(0, w-2), basis:'恢复验证节点缺失，扣 2 分（演练模拟计算）' }; }
  };

  function autoEval(){
    var c = collectCtx();
    return MOCK.SCORE_ITEMS.map(function(it){
      var rule = RULES[it.id] || function(cc,ww){ return { score:ww, basis:'暂无自动规则，按达标计满分（演练模拟计算）' }; };
      var r = rule(c, it.weight);
      return { itemId:it.id, name:it.name, score:r.score, max:it.weight, basis:r.basis };
    });
  }

  var results = autoEval();

  function totals(){
    var sum=0, max=0;
    results.forEach(function(r){ sum+=r.score; max+=r.max; });
    return { sum:sum, max:max, pct: max?Math.round(sum/max*100):0 };
  }
  function grade(pct){ return pct>=90?'优秀':pct>=80?'良好':pct>=70?'合格':'不合格'; }
  function gradeTagCls(g){ return g==='优秀'?'green':g==='良好'?'blue':g==='合格'?'yellow':'red'; }
  function autoComment(pct){
    if(pct>=90) return '演练组织有序，响应处置链路完整闭环，多角色与跨部门协同高效，建议保持现有流程并增加无脚本实战抽测。';
    if(pct>=80) return '整体处置规范高效，个别环节在响应时效与留痕完整性上存在优化空间，建议纳入下一轮演练整改跟踪。';
    if(pct>=70) return '基本达成演练目标，但响应时效、取证留痕等环节需重点改进，建议组织专项培训与复训。';
    return '多个关键环节未达预案要求，建议重新开展预案培训并针对性组织复演练。';
  }
  function sugText(){
    var lines = results.filter(function(r){ return r.score<r.max; }).map(function(r,i){
      return (i+1)+'. 【'+r.name+'】'+r.basis+'——建议纳入下一轮演练整改跟踪。';
    });
    if(!lines.length) lines.push('本次演练各指标均达标，建议保持现有流程并增加无脚本实战抽测。');
    return lines.join('\n');
  }

  var t = totals();
  page.innerHTML =
    '<div class="page-head"><div><h1>复盘评估</h1><div class="sub">'+(proj?proj.name:'')+' · 系统自动考评 · 自动评语与改进建议 · 演练报告生成</div></div>'
    + '<div class="acts">'
    + (canReEval?'<button class="btn" id="evReEval">'+App.icon('refresh')+'重新自动考评</button>':'')
    + '<button class="btn primary" id="evReport">'+App.icon('file')+'生成演练报告</button></div></div>'
    + '<div class="sim-banner">'+App.icon('alert')+'<span>考评由系统按演练数据（任务状态、处置时序、取证留痕）<b>自动计算</b>，演练模拟；评估对象为本次<b>演练模拟</b>推演过程记录，评分与报告仅用于演练复盘归档，不评价真实生产事件。</span></div>'
    + '<div class="grid" style="grid-template-columns:1.6fr 1fr;gap:16px">'
    +   '<div class="card"><div class="card-title">'+App.icon('score')+'指标自动考评区<span class="more">考评引擎：规则引擎自动计分 · 共 '+MOCK.SCORE_ITEMS.length+' 项指标</span></div><div id="evItems"></div></div>'
    +   '<div class="col gap4">'
    +     '<div class="card"><div class="card-title">'+App.icon('dashboard')+'评估汇总</div>'
    +       '<div class="flex" style="align-items:baseline;gap:10px"><span class="ev-total" id="smTotal"></span><span class="muted" id="smMax"></span><span class="right tag" id="smRate"></span></div>'
    +       '<div class="progress mt3"><div class="bar" id="smBar" style="width:0%"></div></div>'
    +       '<div class="flex mt3" style="justify-content:space-between;align-items:center"><span class="small dim">评估等级（自动）</span><span id="smGrade"></span></div>'
    +       '<div class="tiny dim mt2" id="smComment"></div>'
    +       '<div class="section-title mt4">各指标自动得分</div><div id="smBars"></div>'
    +       '<div class="section-title mt4">任务状态分布（演练数据）</div><div id="smStats"></div><div id="smDonut" class="mt2"></div></div>'
    +     '<div class="card"><div class="card-title">'+App.icon('edit')+'改进建议（自动生成）</div>'
    +       '<div class="small" id="evSug" style="line-height:1.9;white-space:pre-wrap"></div>'
    +       '<div class="tiny dim mt3">依据各指标自动扣分项生成，随复盘档案归档（演练模拟）</div></div>'
    +   '</div>'
    + '</div>';

  /* ---------- 指标列表（只读自动结果） ---------- */
  function renderItems(){
    document.getElementById('evItems').innerHTML = MOCK.SCORE_ITEMS.map(function(it){
      var r = results.filter(function(x){ return x.itemId===it.id; })[0];
      var full = r.score>=it.weight;
      return '<div class="ev-row">'
        + '<div class="ev-name"><div class="bold">'+it.id+' '+it.name+'</div><div class="mt2"><span class="tag gray">上限 '+it.weight+' 分</span> <span class="tag blue">自动</span></div></div>'
        + '<div class="ev-rule">'+App.esc(it.rule)+'</div>'
        + '<div class="ev-ro"><span class="ev-score" style="color:'+(full?'var(--ok)':'var(--warn)')+'">'+r.score+'</span><span class="dim">/'+it.weight+'</span>'
        + '<div class="tiny dim mt2">'+App.esc(r.basis)+'</div></div></div>';
    }).join('');
  }

  /* ---------- 汇总 ---------- */
  function renderSummary(){
    var tt = totals();
    var g = grade(tt.pct);
    document.getElementById('smTotal').textContent = tt.sum;
    document.getElementById('smMax').textContent = '/ '+tt.max+' 分';
    var rateTag = document.getElementById('smRate');
    rateTag.className = 'right tag '+(tt.pct>=85?'green':tt.pct>=70?'yellow':'red');
    rateTag.textContent = '得分率 '+tt.pct+'%';
    var bar = document.getElementById('smBar');
    bar.style.width = tt.pct+'%';
    bar.className = 'bar '+(tt.pct>=85?'ok':tt.pct>=70?'warn':'err');
    document.getElementById('smGrade').innerHTML = '<span class="tag '+gradeTagCls(g)+'"><span class="dot"></span>'+g+' · 系统自动考评</span>';
    document.getElementById('smComment').textContent = '自动评语：'+autoComment(tt.pct);
    App.hbar(document.getElementById('smBars'), results.map(function(r){
      return { label: r.name, value: r.score, max: r.max, color: r.score>=r.max ? 'var(--ok)' : (r.score/r.max<0.75 ? 'var(--warn)' : 'var(--accent)') };
    }));
    var c = collectCtx();
    var pairs = [['已完成',c.done.length],['处理中',c.running.length],['待处理',c.pending.length],['超时',c.overdue.length]];
    document.getElementById('smStats').innerHTML = '<div class="flex gap3 wrap">'+pairs.filter(function(x){ return x[1]>0; }).map(function(x){
      return App.statusTag(x[0])+'<span class="small dim">'+x[1]+' 项</span>';
    }).join('')+'</div>';
    App.donut(document.getElementById('smDonut'), [
      { label:'已完成', value:c.done.length, color:'var(--ok)' },
      { label:'处理中', value:c.running.length, color:'var(--warn)' },
      { label:'待处理', value:c.pending.length, color:'var(--accent)' },
      { label:'超时', value:c.overdue.length, color:'var(--err)' }
    ].filter(function(x){ return x.value>0; }), 130);
  }

  /* ---------- 改进建议（自动生成，只读） ---------- */
  function renderSug(){ document.getElementById('evSug').textContent = sugText(); }

  /* ---------- 重新自动考评 ---------- */
  if(canReEval){
    document.getElementById('evReEval').onclick = function(){
      var btn = this;
      btn.disabled = true;
      btn.innerHTML = App.icon('refresh')+'自动考评计算中…';
      API.actSim('触发重新自动考评', '按演练数据重算 '+MOCK.SCORE_ITEMS.length+' 项指标（演练模拟）');
      setTimeout(function(){
        results = autoEval();
        renderItems(); renderSummary(); renderSug();
        btn.disabled = false;
        btn.innerHTML = App.icon('refresh')+'重新自动考评';
        var tt = totals();
        App.toast('系统自动考评完成：总分 '+tt.sum+' / '+tt.max+'（得分率 '+tt.pct+'% · '+grade(tt.pct)+'）','ok');
      }, 700);
    };
  }

  /* ---------- 生成演练报告 ---------- */
  document.getElementById('evReport').onclick = function(){
    var p = proj || {name:'—', id:'—', type:'—', level:'—', date:'—', units:[], target:'—', members:[], observers:[]};
    var sc = MOCK.SCENARIOS.filter(function(x){ return x.id===p.scenarioId; })[0] || {};
    var tt = totals();
    var g = grade(tt.pct);
    var issues = results.filter(function(r){ return r.score<r.max; }).map(function(r){
      return '<li>【'+App.esc(r.name)+'】扣'+(r.max-r.score)+'分：'+App.esc(r.basis)+'</li>';
    }).join('');
    var sugs = sugText().split('\n').filter(function(x){ return x.trim(); }).map(function(x){ return '<li>'+App.esc(x)+'</li>'; }).join('');
    var seqRows = MOCK.SEQ_FLOW.map(function(n){ return '<tr><td>'+n.time+'</td><td>'+App.esc(n.name)+'</td><td>'+App.esc(n.role)+'</td></tr>'; }).join('');
    var scoreRows = results.map(function(r){
      return '<tr><td>'+r.itemId+' '+App.esc(r.name)+'</td><td>'+r.max+'</td><td>'+r.score+'</td><td>'+App.esc(r.basis)+'</td></tr>';
    }).join('');
    var attRows = MOCK.EVIDENCE.map(function(e){ return '<li>'+App.esc(e.name)+'（'+App.esc(e.type)+' · '+App.esc(e.time)+'）</li>'; }).join('');

    var body = '<div class="report-doc">'
      + '<span class="stamp right" style="float:right">演练模拟</span>'
      + '<h1>盘州市人民医院网络安全应急演练复盘评估报告</h1>'
      + '<div class="rd-sub">报告编号 DR-'+App.esc(p.id)+'-RP01 · 编制：系统自动考评引擎（演练模拟） · 数据均为演练模拟生成</div>'
      + '<h2>一、演练概况</h2>'
      + '<table><tr><th style="width:120px">项目名称</th><td>'+App.esc(p.name)+'</td><th style="width:100px">项目编号</th><td>'+App.esc(p.id)+'</td></tr>'
      + '<tr><th>演练类型</th><td>'+App.esc(p.type)+'</td><th>事件等级</th><td>'+App.esc(p.level)+'</td></tr>'
      + '<tr><th>启动时间</th><td>'+App.esc(p.date)+'</td><th>场景剧本</th><td>'+App.esc(sc.name||'—')+' '+App.esc(sc.version||'')+'</td></tr>'
      + '<tr><th>参演单位</th><td colspan="3">'+App.esc((p.units||[]).join('、'))+'</td></tr>'
      + '<tr><th>演练目标</th><td colspan="3">'+App.esc(p.target||'—')+'</td></tr>'
      + '<tr><th>参演/观察</th><td colspan="3">角色成员 '+(p.members||[]).length+' 人 · 观察员 '+(p.observers||[]).length+' 人 · 考评方式：系统自动考评</td></tr></table>'
      + '<h2>二、处置时序摘要</h2>'
      + '<table><tr><th style="width:70px">时刻</th><th>环节</th><th>责任角色</th></tr>'+seqRows+'</table>'
      + '<h2>三、发现问题</h2>'+(issues ? '<ul>'+issues+'</ul>' : '<p>本次演练未发现扣分问题。</p>')
      + '<h2>四、改进建议</h2><ul>'+sugs+'</ul>'
      + '<h2>五、评分明细（系统自动计算）</h2>'
      + '<table><tr><th>指标</th><th style="width:60px">上限</th><th style="width:60px">得分</th><th>自动依据</th></tr>'+scoreRows+'</table>'
      + '<p style="text-align:right;font-weight:700">总分：'+tt.sum+' / '+tt.max+'（得分率 '+tt.pct+'% · 评估等级 '+g+'）</p>'
      + '<h2>六、附件清单</h2><ul>'+attRows+'</ul>'
      + '<p class="dim" style="margin-top:18px;font-size:11px">本报告由演练系统按演练数据自动考评生成，全部为虚拟演练数据，不含真实患者信息与生产系统数据。</p></div>';

    App.modal({ title:'演练报告预览（演练模拟 · 系统自动考评）', wide:true, body:body,
      foot:'<button class="btn" id="rpWord">'+App.icon('download')+'导出Word</button><button class="btn primary" id="rpPdf">'+App.icon('download')+'导出PDF</button>',
      onOpen:function(ov){
        ov.querySelector('#rpWord').onclick = function(){ API.addAudit('导出演练报告（Word模拟）'); App.toast('演练模拟：报告已导出（模拟文件）','ok'); };
        ov.querySelector('#rpPdf').onclick = function(){ API.addAudit('导出演练报告（PDF模拟）'); App.toast('演练模拟：报告已导出（模拟文件）','ok'); };
      } });
  };

  renderItems();
  renderSummary();
  renderSug();
});
App.boot('evaluation');
</script>
</body>
</html>
