<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公告与舆情模拟 · 盘州市人民医院网络安全应急演练系统</title>
<link rel="stylesheet" href="styles.css">
<style>
.op-card{margin-bottom:12px}
.op-card .op-title{font-size:13.5px;font-weight:600;margin-top:8px;line-height:1.5}
.op-meta{font-size:11.5px;color:var(--text3);margin-top:6px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.appr-item{border:1px solid var(--border);border-radius:var(--r-sm);padding:10px 12px;margin-bottom:10px;background:var(--elev)}
</style>
</head>
<body data-page="opinion">
<script src="mock.js"></script><script src="app.js"></script><script src="api.js"></script>
<script>
document.addEventListener('app:ready', function(e){
  var role = e.detail.role;
  var page = document.getElementById('page');

  function nowHM(){ return new Date().toTimeString().slice(0,5); }
  function opStatusTag(s){
    var m = {'待研判':'blue','研判中':'yellow','审批中':'purple','已归档':'gray','已发布':'green','已处置':'green','已退回':'red'};
    return '<span class="tag '+(m[s]||'gray')+'"><span class="dot"></span>'+s+'</span>';
  }
  function riskTag(r){
    if(!r || r==='—') return '<span class="dim">风险 —</span>';
    var m = {'重大':'red','较大':'yellow','一般':'blue'};
    return '<span class="tag '+(m[r]||'gray')+'">风险 '+r+'</span>';
  }

  /* 口径审核记录：初始由 OPINION 现有数据构造，页内操作追加内存态 */
  var reviewLogs = MOCK.OPINION.map(function(o){
    return { time:o.time, doc:o.title, reviewer:o.source, conclusion:o.status };
  });

  var isCac = role.id==='cac';
  var isCmd = role.id==='commander';
  var canDraft = isCmd || role.id==='medlead';

  page.innerHTML =
    '<div class="page-head"><div><h1>公告与舆情模拟</h1><div class="sub">舆情监测流 · 公告口径审批链 · 处置动作登记（'+App.esc(role.name)+'视角）</div></div></div>'
    + '<div class="sim-banner">'+App.icon('alert')+'<span><b>本模块舆情数据全部为演练模拟生成，非真实网络舆情</b>；所有公告、口径、处置动作仅用于演练推演记录。</span></div>'
    + '<div class="grid" style="grid-template-columns:1.4fr 1fr;gap:16px">'
    +   '<div class="card"><div class="card-title">'+App.icon('opinion')+'舆情消息流<span class="more" id="opRefresh">刷新监测（模拟）</span></div><div id="opList"></div></div>'
    +   '<div class="col gap4">'
    +     (isCac ? '<div class="card"><div class="card-title">'+App.icon('send')+'接收院方上报公告</div><div id="opRecv"></div><div class="tiny dim mt2">外部单位仅可见医院主动上报的公告材料，不可查看院内原始监测数据。</div></div>' : '')
    +     (canDraft ? '<div class="card"><div class="card-title">'+App.icon('edit')+'公告文稿起草提交</div><textarea class="textarea" id="opDraft" style="min-height:110px" placeholder="按指挥部审定口径起草对外公告，提交后进入审批流…"></textarea><div class="flex gap2 mt3"><button class="btn primary" id="opSubmit">'+App.icon('send')+'提交审批</button><span class="tiny dim">提交即写入审核记录</span></div></div>' : '')
    +     (isCmd ? '<div class="card"><div class="card-title">'+App.icon('check')+'公告待审批</div><div id="opApprove"></div></div>' : '')
    +     '<div class="card"><div class="card-title">'+App.icon('ledger')+'口径审核记录</div><div class="table-wrap"><table class="table"><thead><tr><th>时间</th><th>文稿/事项</th><th>审核环节</th><th>结论</th></tr></thead><tbody id="opLogs"></tbody></table></div></div>'
    +   '</div>'
    + '</div>';

  function renderList(){
    var list = MOCK.OPINION.slice().reverse();
    document.getElementById('opList').innerHTML = list.map(function(o){
      return '<div class="card op-card" style="background:var(--elev)">'
        + '<div class="flex"><span class="tag blue">'+App.esc(o.channel)+'</span><span class="right">'+opStatusTag(o.status)+'</span></div>'
        + '<div class="op-title">'+App.esc(o.title)+'</div>'
        + '<div class="op-meta"><span class="mono">'+o.time+'</span><span>来源：'+App.esc(o.source)+'</span><span>热度：'+o.heat+'</span>'+riskTag(o.risk)+'</div>'
        + '<div class="mt3"><button class="btn sm" data-reg="'+o.id+'">'+App.icon('edit')+'登记处置动作</button></div></div>';
    }).join('');
    document.querySelectorAll('#opList [data-reg]').forEach(function(btn){
      btn.onclick = function(){ openReg(btn.dataset.reg); };
    });
  }

  function openReg(id){
    var o = MOCK.OPINION.filter(function(x){ return x.id===id; })[0];
    if(!o) return;
    App.modal({ title:'登记处置动作 · 演练模拟', body:
      '<div class="small muted" style="margin-bottom:12px">'+App.esc(o.title)+'</div>'
      + '<div class="form-row"><label class="f-label">处置措施 <span class="req">*</span></label><textarea class="textarea" id="regAct" placeholder="如：统一口径由指挥部审定后发布；提请网信办指导；留存监测截图归档取证模块…"></textarea></div>'
      + '<div class="tiny dim">处置动作仅记录于演练档案，不执行任何真实删帖/封堵/发布操作。</div>',
      foot:'<button class="btn" id="regNo">取消</button><button class="btn primary" id="regYes">确认登记（模拟）</button>',
      onOpen:function(ov){
        ov.querySelector('#regNo').onclick = ov.close;
        ov.querySelector('#regYes').onclick = function(){
          var act = ov.querySelector('#regAct').value.trim();
          if(!act){ App.toast('请填写处置措施','err'); return; }
          ov.close();
          API.updateOpinion(o.id, { status:'已处置' }).then(function(){
            return API.addAudit('登记舆情处置动作：'+o.title.slice(0,20)+'…（'+act.slice(0,20)+'…）');
          }).then(function(){
            reviewLogs.push({ time:nowHM(), doc:o.title, reviewer:App.curUser()||role.short, conclusion:'已处置' });
            renderAll();
            App.toast('演练模拟：处置动作已登记，状态更新为「已处置」','ok');
          });
        };
      } });
  }

  function renderRecv(){
    var el = document.getElementById('opRecv');
    if(!el) return;
    var subs = MOCK.OPINION.filter(function(o){ return o.source==='院办提交'; });
    el.innerHTML = subs.length ? subs.map(function(o){
      return '<div class="appr-item"><div class="flex"><span class="bold small">'+App.esc(o.title)+'</span><span class="right">'+opStatusTag(o.status)+'</span></div><div class="tiny dim mt2">'+o.time+' · 医院上报材料</div></div>';
    }).join('') : '<div class="empty">'+App.icon('file')+'<div>暂无院方上报公告</div></div>';
  }

  function renderApprove(){
    var el = document.getElementById('opApprove');
    if(!el) return;
    var pend = MOCK.OPINION.filter(function(o){ return o.status==='审批中'; });
    el.innerHTML = pend.length ? pend.map(function(o){
      return '<div class="appr-item"><div class="small bold">'+App.esc(o.title)+'</div><div class="tiny dim mt2">'+o.time+' · '+App.esc(o.source)+'</div>'
        + '<div class="flex gap2 mt3"><button class="btn sm ok" data-ok="'+o.id+'">'+App.icon('check')+'审批通过</button><button class="btn sm danger" data-no="'+o.id+'">'+App.icon('x')+'退回修改</button></div></div>';
    }).join('') : '<div class="empty">'+App.icon('check')+'<div>当前无待审批公告文稿</div></div>';
    el.querySelectorAll('[data-ok]').forEach(function(b){ b.onclick = function(){ decide(b.dataset.ok, '已发布'); }; });
    el.querySelectorAll('[data-no]').forEach(function(b){ b.onclick = function(){ decide(b.dataset.no, '已退回'); }; });
  }

  function decide(id, st){
    var o = MOCK.OPINION.filter(function(x){ return x.id===id; })[0];
    if(!o) return;
    App.confirmSim('指挥部'+(st==='已发布'?'审批通过':'退回')+'公告文稿「'+o.title+'」？'+(st==='已发布'?'通过后由院办按审定口径发布（演练模拟）。':'退回后由起草角色修改重新提交。'), function(){
      API.updateOpinion(id, { status:st }).then(function(){
        return API.addAudit('公告口径'+(st==='已发布'?'审批通过':'退回')+'：'+o.title.slice(0,20)+'…');
      }).then(function(){
        reviewLogs.push({ time:nowHM(), doc:o.title, reviewer:App.curUser()||role.short, conclusion:st });
        renderAll();
        App.toast('演练模拟：公告文稿已'+(st==='已发布'?'审批通过并归档':'退回修改'),'ok');
      });
    });
  }

  var submitBtn = document.getElementById('opSubmit');
  if(submitBtn){
    submitBtn.onclick = function(){
      var txt = document.getElementById('opDraft').value.trim();
      if(!txt){ App.toast('请先起草公告文稿','err'); return; }
      App.confirmSim('将公告文稿提交院应急指挥部审批（进入口径审核流程）？', function(){
        API.addOpinion({ channel:'医院公众号', title:'院方公告文稿：'+txt.slice(0,24)+(txt.length>24?'…':''), heat:'-', risk:'—', status:'审批中', source:'院办提交' }).then(function(){
          return API.addAudit('提交公告文稿进入审批');
        }).then(function(){
          document.getElementById('opDraft').value = '';
          renderAll();
          App.toast('演练模拟：公告文稿已提交，状态「审批中」','ok');
        });
      });
    };
  }

  document.getElementById('opRefresh').onclick = function(){
    App.toast('演练模拟：舆情监测已刷新（无新增真实数据）','ok');
  };

  function renderLogs(){
    document.getElementById('opLogs').innerHTML = reviewLogs.slice().reverse().map(function(l){
      return '<tr><td class="mono">'+l.time+'</td><td>'+App.esc(l.doc)+'</td><td>'+App.esc(l.reviewer)+'</td><td>'+opStatusTag(l.conclusion)+'</td></tr>';
    }).join('');
  }

  function renderAll(){ renderList(); renderRecv(); renderApprove(); renderLogs(); }
  renderAll();
});
App.boot('opinion');
</script>
</body>
</html>
