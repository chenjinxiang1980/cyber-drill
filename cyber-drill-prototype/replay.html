<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>演练时序回放 · 盘州市人民医院网络安全应急演练系统</title>
<link rel="stylesheet" href="styles.css">
<style>
.rp-bar{display:flex;align-items:center;gap:14px;background:var(--elev);border:1px solid var(--border);border-radius:var(--r-md);padding:12px 16px;margin-bottom:14px;flex-wrap:wrap}
.rp-clock{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--accent2);min-width:92px;text-align:center;background:#0c1626;border:1px solid var(--border);border-radius:var(--r-sm);padding:2px 12px}
.rp-track{flex:1;min-width:180px;height:10px;background:#0c1626;border-radius:5px;cursor:pointer;position:relative;border:1px solid var(--border)}
.rp-fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:5px;transition:width .25s}
.rp-knob{position:absolute;top:-3px;left:0;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--accent);transform:translateX(-50%);transition:left .25s;pointer-events:none}
.rp-prog{font-size:11px;color:var(--text3);font-family:var(--mono);min-width:66px;text-align:right}
.rp-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.rp-chip{font-size:12px;color:var(--text2);background:var(--elev);border:1px solid var(--border);border-radius:14px;padding:3px 12px;cursor:pointer;transition:.15s}
.rp-chip:hover{color:var(--text);border-color:var(--border2)}
.rp-chip.on{border-color:var(--accent);background:var(--accent-dim);color:#fff}
.rp-evbox{border:1px solid transparent;border-radius:var(--r-sm);padding:6px 10px;transition:.2s}
.tl-item.active .tl-dot{background:var(--accent);box-shadow:0 0 0 4px var(--accent-dim)}
.tl-item.active .rp-evbox{border-color:var(--accent);background:var(--accent-dim)}
.seq-node.lit{border-color:var(--accent);background:var(--accent-dim);box-shadow:0 0 0 3px var(--accent-dim);opacity:1}
.seq-node.lit .s-name{color:#fff}
.seq-node.lit .s-time{color:var(--accent2)}
#rpTl{max-height:560px;overflow-y:auto;padding-right:6px}
</style>
</head>
<body data-page="replay">
<script src="mock.js"></script><script src="app.js"></script><script src="api.js"></script>
<script>
document.addEventListener('app:ready', function(e){
  var role = e.detail.role;
  var page = document.getElementById('page');
  var proj = API.activeProject();

  function mins(t){ var p = t.split(':'); return (+p[0])*60 + (+p[1]); }
  function catOf(ev){
    var a = ev.action;
    if(/超时/.test(a)) return '超时';
    if(/兜底/.test(a)) return '兜底';
    if(/督办/.test(a)) return '督办';
    if(/封堵|隔离/.test(a)) return '处置';
    if(/上报/.test(a)) return '上报';
    if(/报案/.test(a)) return '报案';
    if(/恢复/.test(a)) return '恢复';
    if(/核实|接收/.test(a)) return '核实';
    if(/研判/.test(a)) return '研判';
    if(/启动/.test(a)) return '指令';
    if(/终止/.test(a)) return '终止';
    if(/告警|推送/.test(a)) return '告警';
    return '其他';
  }

  var events = MOCK.TIMELINE.slice().sort(function(a,b){ return mins(a.t)-mins(b.t); });
  var CATS = ['告警','核实','超时','研判','指令','处置','兜底','上报','督办','报案','恢复','终止','其他'];
  var present = CATS.filter(function(c){ return events.some(function(ev){ return catOf(ev)===c; }); });
  var filterCat = '全部';
  var idx = -1, timer = null, speed = 1, playing = false;

  var p0 = events.filter(function(x){ return x.level==='P0'; }).length;
  var p1 = events.filter(function(x){ return x.level==='P1'; }).length;
  var span = mins(events[events.length-1].t) - mins(events[0].t);

  page.innerHTML =
    '<div class="page-head"><div><h1>演练时序回放</h1><div class="sub">'+(proj?proj.name:'')+' · 事件流回放与处置时序图（'+events.length+' 个节点 · P0×'+p0+' P1×'+p1+' · 闭环 '+Math.floor(span/60)+'小时'+(span%60)+'分钟）</div></div>'
    + '<div class="acts"><button class="btn" id="rpExport">'+App.icon('download')+'导出回放记录</button></div></div>'
    + '<div class="sim-banner">'+App.icon('alert')+'<span>回放内容为本次演练的<b>模拟事件时序记录</b>，用于复盘推演，不对应任何真实生产系统操作。</span></div>'
    + '<div class="rp-bar">'
    +   '<button class="btn primary" id="rpPlay">'+App.icon('play')+'播放</button>'
    +   '<span class="dim small nowrap">倍速</span>'
    +   '<select class="select" id="rpSpeed" style="width:auto"><option value="1">1x</option><option value="2">2x</option><option value="4">4x</option></select>'
    +   '<span class="rp-clock" id="rpClock">--:--</span>'
    +   '<div class="rp-track" id="rpTrack"><div class="rp-fill" id="rpFill"></div><span class="rp-knob" id="rpKnob"></span></div>'
    +   '<span class="rp-prog" id="rpProg">0 / '+events.length+'</span>'
    + '</div>'
    + '<div class="rp-chips" id="rpChips"></div>'
    + '<div class="grid" style="grid-template-columns:1.5fr 1fr;gap:16px">'
    +   '<div class="card"><div class="card-title">'+App.icon('clock')+'处置事件时间轴<span class="more" id="rpReset">重置回放</span></div><div class="timeline" id="rpTl"></div></div>'
    +   '<div class="col gap4">'
    +     '<div class="card"><div class="card-title">'+App.icon('flow')+'处置时序图（自动生成）</div><div class="seqflow" id="rpSeq"></div><div class="tiny dim mt2">回放至对应时刻自动点亮节点 · 告警→核实→指令→处置→兜底→上报→报案→恢复→终止</div></div>'
    +     '<div class="card"><div class="card-title">'+App.icon('dashboard')+'回放统计</div><div class="kv" id="rpStats"></div></div>'
    +   '</div>'
    + '</div>';

  /* ---------- 过滤芯片 ---------- */
  function renderChips(){
    var box = document.getElementById('rpChips');
    box.innerHTML = ['全部'].concat(present).map(function(c){
      return '<span class="rp-chip'+(c===filterCat?' on':'')+'" data-c="'+c+'">'+c+'</span>';
    }).join('');
    box.querySelectorAll('.rp-chip').forEach(function(ch){
      ch.onclick = function(){
        stop();
        filterCat = ch.dataset.c; idx = -1;
        renderChips(); renderTimeline(); renderSeq(null);
        document.getElementById('rpClock').textContent = '--:--';
        setProg(0);
      };
    });
  }

  /* ---------- 时间轴 ---------- */
  function shown(){ return filterCat==='全部' ? events : events.filter(function(ev){ return catOf(ev)===filterCat; }); }
  function renderTimeline(){
    var list = shown();
    var box = document.getElementById('rpTl');
    if(!list.length){ box.innerHTML = '<div class="empty">'+App.icon('clock')+'<div>该类型暂无事件</div></div>'; return; }
    box.innerHTML = list.map(function(ev,i){
      var st = ev.level==='P0' ? 'err' : (ev.level==='P1' ? 'warn' : (i===0?'ok':''));
      return '<div class="tl-item '+st+'" data-i="'+i+'"><span class="tl-dot"></span><div class="rp-evbox">'
        + '<div class="tl-time">'+ev.t+' · '+App.esc(ev.actor)+' <span class="dim">· '+catOf(ev)+'</span></div>'
        + '<div class="tl-title">'+App.esc(ev.action)+' '+(ev.level?App.levelTag(ev.level):'')+'</div>'
        + '<div class="tl-desc">'+App.esc(ev.detail)+'</div></div></div>';
    }).join('');
    box.querySelectorAll('.tl-item').forEach(function(el){
      el.onclick = function(){ idx = +el.dataset.i; highlight(idx); };
    });
    document.getElementById('rpProg').textContent = (idx<0?0:idx+1)+' / '+list.length;
  }

  /* ---------- 时序图 ---------- */
  function renderSeq(curT){
    var box = document.getElementById('rpSeq');
    box.innerHTML = MOCK.SEQ_FLOW.map(function(n,i){
      var cls;
      if(curT==null) cls = n.state==='done' ? 'done' : 'pending';
      else cls = mins(n.time) <= mins(curT) ? 'done lit' : 'pending';
      return (i?'<span class="seq-arrow">▸</span>':'')
        + '<div class="seq-node '+cls+'"><div class="s-idx">'+(i+1<10?'0':'')+(i+1)+'</div><div class="s-name">'+n.name+'</div><div class="s-time">'+n.time+'</div><div class="s-role">'+n.role+'</div></div>';
    }).join('');
  }

  /* ---------- 回放控制 ---------- */
  function setProg(pct){
    document.getElementById('rpFill').style.width = pct+'%';
    document.getElementById('rpKnob').style.left = pct+'%';
  }
  function highlight(i){
    var list = shown();
    if(i<0 || i>=list.length) return;
    idx = i;
    var els = document.querySelectorAll('#rpTl .tl-item');
    els.forEach(function(el,j){ el.classList.toggle('active', j===i); });
    var cur = list[i];
    if(els[i]) els[i].scrollIntoView({block:'nearest', behavior:'smooth'});
    document.getElementById('rpClock').textContent = cur.t;
    setProg(Math.round((i+1)/list.length*100));
    document.getElementById('rpProg').textContent = (i+1)+' / '+list.length;
    renderSeq(cur.t);
  }
  function play(){
    var list = shown();
    if(!list.length){ App.toast('当前过滤条件下无事件可回放','warn'); return; }
    if(idx>=list.length-1) idx = -1;
    playing = true;
    document.getElementById('rpPlay').innerHTML = App.icon('pause')+'暂停';
    timer = setInterval(function(){
      idx++;
      if(idx>=list.length){
        stop();
        App.toast('回放完成：已播至演练终止节点（演练模拟）','ok');
        return;
      }
      highlight(idx);
    }, Math.round(1200/speed));
  }
  function stop(){
    playing = false;
    if(timer){ clearInterval(timer); timer = null; }
    document.getElementById('rpPlay').innerHTML = App.icon('play')+'播放';
  }

  document.getElementById('rpPlay').onclick = function(){ playing ? stop() : play(); };
  document.getElementById('rpSpeed').onchange = function(){
    speed = +this.value;
    if(playing){ clearInterval(timer); play(); }
  };
  document.getElementById('rpTrack').onclick = function(ev){
    var list = shown();
    if(!list.length) return;
    var r = this.getBoundingClientRect();
    var ratio = Math.min(1, Math.max(0, (ev.clientX - r.left) / r.width));
    highlight(Math.min(list.length-1, Math.floor(ratio*list.length)));
  };
  document.getElementById('rpReset').onclick = function(){
    stop(); idx = -1; renderTimeline(); renderSeq(null);
    document.getElementById('rpClock').textContent = '--:--'; setProg(0);
    App.toast('回放已重置','ok');
  };
  document.getElementById('rpExport').onclick = function(){
    API.addAudit('导出演练时序回放记录');
    App.toast('演练模拟：回放记录已导出（模拟文件）','ok');
  };

  /* ---------- 统计 ---------- */
  document.getElementById('rpStats').innerHTML =
    '<span class="k">事件总数</span><span class="mono">'+events.length+' 条</span>'
    + '<span class="k">P0事件</span><span class="mono" style="color:var(--err)">'+p0+' 条</span>'
    + '<span class="k">P1事件</span><span class="mono" style="color:var(--warn)">'+p1+' 条</span>'
    + '<span class="k">闭环时长</span><span class="mono">'+Math.floor(span/60)+'小时'+(span%60)+'分钟（'+events[0].t+'—'+events[events.length-1].t+'）</span>'
    + '<span class="k">超时节点</span><span class="mono" style="color:var(--err)">1 处（值班上报T101超时3分钟）</span>'
    + '<span class="k">回放视角</span><span>'+App.esc(role.name)+'</span>';

  renderChips(); renderTimeline(); renderSeq(null);
});
App.boot('replay');
</script>
</body>
</html>
