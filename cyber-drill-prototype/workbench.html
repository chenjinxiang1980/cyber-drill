<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>角色工作台 · 盘州市人民医院网络安全应急演练系统</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="workbench">
<script src="mock.js"></script>
<script src="app.js"></script>
<script src="api.js"></script>
<script>
document.addEventListener('app:ready', function(e){
  var role = e.detail.role;
  var page = document.getElementById('page');
  var proj = API.activeProject();

  /* ---------- 11角色差异化配置：模拟处置动作 + 关注态势 ---------- */
  var ROLE_UI = {
    commander: {
      feed:'messages',
      actions:[
        { ic:'check', label:'审批应急启动', detail:'审批《应急启动审批单》，下达Ⅱ级响应启动指令（演练模拟记录）' },
        { ic:'send', label:'批准上报主管部门', detail:'批准《网络安全事件上报表》流转市卫健局（演练模拟记录）' },
        { ic:'opinion', label:'审批对外口径', detail:'审批院方公告口径，未经审批不得对外发布（演练模拟记录）' },
        { ic:'bell', label:'下达全院指令', detail:'向全部参演角色广播指挥部指令（演练模拟消息）' },
        { ic:'power', label:'终止演练进入复盘', detail:'确认闭环后终止演练，进入时序回放与评估（演练模拟记录）' }
      ]
    },
    duty: {
      feed:'messages',
      actions:[
        { ic:'bell', label:'接收告警确认', detail:'确认接收态势感知平台模拟告警（演练模拟记录）' },
        { ic:'file', label:'提交初步核实单', detail:'填写《事件初步核实单》并提交（演练模拟记录）' },
        { ic:'send', label:'上报信息科负责人', detail:'向信息科负责人上报初步核实情况（演练模拟记录）' },
        { ic:'camera', label:'截图取证留痕', detail:'对模拟告警界面截图归档至取证模块（演练模拟记录）' }
      ]
    },
    netsec: {
      feed:'evidence',
      actions:[
        { ic:'net', label:'模拟IP封堵', detail:'对模拟C2地址 185.2xx.xx.77 执行封堵策略登记（演练模拟，不下发真实策略）', danger:true },
        { ic:'power', label:'感染终端断网隔离', detail:'对3台模拟感染终端登记断网隔离操作（演练模拟记录）', danger:true },
        { ic:'flow', label:'异常流量排查', detail:'登记外联流量排查结果与受影响网段（演练模拟记录）' },
        { ic:'upload', label:'样本摘要上传', detail:'上传勒索信文本摘要与样本哈希（演练模拟，不含真实恶意样本）' }
      ]
    },
    sysadmin: {
      feed:'impact',
      actions:[
        { ic:'db', label:'HIS模拟停机隔离', detail:'登记HIS数据库服务器模拟停机与隔离状态（演练模拟记录）', danger:true },
        { ic:'refresh', label:'灾备切换演练', detail:'执行PACS/LIS灾备切换推演并记录（演练模拟记录）' },
        { ic:'archive', label:'备份有效性校验', detail:'校验今早6点存储快照可用于恢复（演练模拟记录）' },
        { ic:'check', label:'业务恢复验证', detail:'恢复上线后提交《业务恢复确认单》并验证（演练模拟记录）' }
      ]
    },
    itlead: {
      feed:'messages',
      actions:[
        { ic:'chat', label:'组织线上研判会商', detail:'召集网安员、系统员进入院内会商组研判（演练模拟记录）' },
        { ic:'file', label:'汇总研判简报', detail:'形成阶段性研判简报提交院应急指挥部（演练模拟记录）' },
        { ic:'tasks', label:'分配技术处置任务', detail:'向网安组/运维组下发处置任务（演练模拟记录）' },
        { ic:'send', label:'向指挥部汇报', detail:'提交《网络安全事件上报表》待指挥部审批（演练模拟记录）' }
      ]
    },
    medlead: {
      feed:'impact',
      actions:[
        { ic:'hospital', label:'启用纸质兜底流程', detail:'启动纸质处方、人工登记、人工收费兜底（演练模拟记录）' },
        { ic:'file', label:'登记业务影响评估', detail:'填写《业务影响评估表》勾选受影响业务（演练模拟记录）' },
        { ic:'user', label:'患者风险评估', detail:'评估业务中断对在院患者（虚拟数据）的诊疗风险（演练模拟记录）' },
        { ic:'edit', label:'发布临床工作指引', detail:'向临床科室下发应急处置工作指引（演练模拟记录）' }
      ]
    },
    clinical: {
      feed:'impact',
      actions:[
        { ic:'file', label:'张贴窗口公告', detail:'在门诊收费窗口张贴系统维护公告（口径需经指挥部审批，演练模拟）' },
        { ic:'edit', label:'登记患者诉求投诉', detail:'记录现场患者咨询与投诉诉求（虚拟登记，演练模拟）' },
        { ic:'alert', label:'上报业务卡点', detail:'将纸质流程卡点上报医务部与指挥部（演练模拟记录）' },
        { ic:'tasks', label:'执行纸质登记流程', detail:'按兜底流程执行手工处方/登记/收费（演练模拟记录）' }
      ]
    },
    healthbureau: {
      feed:'docs',
      actions:[
        { ic:'download', label:'接收医院上报材料', detail:'查看医院报送的《网络安全事件上报表》等文书（演练模拟）' },
        { ic:'bell', label:'下达督办意见', detail:'对医院处置进展填写督办意见（演练模拟记录）' },
        { ic:'building', label:'统筹区域资源', detail:'登记区域应急资源协调意向（演练模拟记录）' },
        { ic:'check', label:'确认处置进展', detail:'确认医院阶段性处置进展并反馈（演练模拟记录）' }
      ]
    },
    cac: {
      feed:'docs_opinion',
      actions:[
        { ic:'download', label:'接收事件通报', detail:'接收医院报送的事件通报材料（演练模拟）' },
        { ic:'eye', label:'舆情风险研判', detail:'对模拟舆情监测信息填写《舆情风险研判表》（演练模拟）' },
        { ic:'send', label:'下达口径指导', detail:'向院方下达对外口径指导意见（演练模拟记录）' },
        { ic:'archive', label:'归档监测记录', detail:'将舆情监测记录归档留存（演练模拟记录）' }
      ]
    },
    cyberpolice: {
      feed:'docs',
      actions:[
        { ic:'file', label:'登记报案材料', detail:'接收《报案登记表》及证据清单并登记（演练模拟记录）' },
        { ic:'check', label:'出具受理回执', detail:'对报案材料出具受理回执（演练模拟记录）' },
        { ic:'evidence', label:'下发取证指引', detail:'向医院下发取证指引单（勒索信截图/样本哈希/文件清单）（演练模拟）' },
        { ic:'camera', label:'固定证据摘要', detail:'对报送证据材料固定摘要（演练模拟记录）' }
      ]
    },
    platformadmin: {
      feed:'audit',
      actions:[
        { ic:'play', label:'启用演练剧本', detail:'启用/停用剧本版本供项目调用（演练模拟记录）' },
        { ic:'eye', label:'查看审计日志', detail:'检查各角色操作留痕是否完整（仅查看，不可删改）' },
        { ic:'archive', label:'执行数据备份', detail:'对演练数据执行模拟备份（演练模拟记录）' },
        { ic:'admin', label:'维护字典与账号', detail:'维护事件等级字典与参演账号（演练模拟记录）' }
      ]
    }
  };

  var cfg = ROLE_UI[role.id] || ROLE_UI.duty;
  var isExternal = !!role.external;

  page.innerHTML =
    '<div class="page-head"><div><h1>'+App.esc(role.name)+' · 工作台</h1>'
    + '<div class="sub">'+App.esc(proj.name)+' · 按角色职责渲染差异化面板'+(isExternal?' · <span style="color:var(--warn)">外部单位受限视图</span>':'')+'</div></div>'
    + '<div class="acts"><button class="btn" id="btnToTasks">'+App.icon('tasks')+'前往任务中心</button></div></div>'
    + '<div class="sim-banner">'+App.icon('alert')+'<span>工作台所有处置动作均为<b>演练模拟记录</b>（写入审计日志与取证模块），系统不会向医院真实网络、HIS/EMR等生产系统下发任何命令。</span></div>'
    + '<div class="wb-grid">'
    +   '<div class="card"><div class="card-title">'+App.icon('shield')+'岗位职责</div>'
    +     '<div class="kv">'
    +     '<span class="k">角色</span><span class="bold">'+App.esc(role.name)+' <span class="tag gray">'+App.esc(role.short)+'</span>'+(isExternal?' <span class="tag yellow">外部单位</span>':'')+'</span>'
    +     '<span class="k">职责描述</span><span class="small">'+App.esc(role.desc)+'</span>'
    +     '<span class="k">当前用户</span><span class="small">'+App.esc(App.curUser())+'</span>'
    +     '<span class="k">可见模块</span><span class="small muted">'+App.esc((role.nav||[]).length)+' 个（分级权限隔离）</span>'
    +     '</div>'
    +     (isExternal?'<div class="tiny dim mt3">依据分级权限策略：外部单位仅可查看医院主动上报的文书与公告材料，不可查看内网原始技术日志、告警明细与会商内部讨论。</div>':'')
    +   '</div>'
    +   '<div class="card"><div class="card-title">'+App.icon('tasks')+'本角色待办任务<span class="more" onclick="location.href=\'tasks.html\'">全部任务 ▸</span></div><div id="wbTasks"><div class="small dim">加载中…</div></div></div>'
    +   '<div class="card"><div class="card-title">'+App.icon('workbench')+'常用模拟处置动作</div>'
    +     '<div class="sim-actions" id="wbActions"></div>'
    +     '<div class="tiny dim mt3">点击任一动作 → 演练模拟确认弹窗 → 记录写入审计日志（演练模拟：动作已记录）</div></div>'
    +   '<div class="card"><div class="card-title">'+App.icon('eye')+'本角色关注态势</div><div id="wbFeed"><div class="small dim">加载中…</div></div></div>'
    + '</div>';

  document.getElementById('btnToTasks').onclick = function(){ location.href='tasks.html'; };

  /* ---------- 待办任务摘要 ---------- */
  API.getTasks().then(function(ts){
    var mine = ts.filter(function(t){ return t.projectId===proj.id; });
    var box = document.getElementById('wbTasks');
    if(!mine.length){ box.innerHTML='<div class="empty">'+App.icon('check')+'<div>本角色暂无待办任务</div></div>'; return; }
    box.innerHTML = mine.slice(0,5).map(function(t){
      return '<div class="task-item'+(t.status==='超时'?' overdue':'')+(t.status==='已完成'?' done':'')+'" style="margin-bottom:8px" onclick="location.href=\'tasks.html\'">'
        + '<span class="tk-ic">'+App.icon(t.status==='超时'?'alert':'tasks')+'</span>'
        + '<div><div class="tk-title">'+App.esc(t.title)+'</div>'
        + '<div class="tk-meta"><span class="mono">'+t.id+'</span><span>时限 '+t.deadline+'</span>'+App.levelTag(t.level)+'</div></div>'
        + '<span class="tk-right">'+App.statusTag(t.status)+'</span></div>';
    }).join('')
    + '<div class="tiny dim mt2">共 '+mine.length+' 项 · 待处理 '+mine.filter(function(t){return t.status==='待处理'||t.status==='超时';}).length+' 项</div>';
  });

  /* ---------- 模拟处置动作 ---------- */
  document.getElementById('wbActions').innerHTML = cfg.actions.map(function(a,i){
    return '<button class="sim-btn'+(a.danger?' danger-sim':'')+'" data-i="'+i+'">'+App.icon(a.ic)+App.esc(a.label)+'</button>';
  }).join('');
  document.querySelectorAll('#wbActions .sim-btn').forEach(function(btn){
    btn.onclick = function(){
      var a = cfg.actions[+btn.dataset.i];
      App.confirmSim(a.detail, function(){
        API.actSim(role.short+'·'+a.label, a.detail);
        App.toast('演练模拟：动作「'+a.label+'」已记录','ok');
      });
    };
  });

  /* ---------- 态势小块（按角色裁剪） ---------- */
  function docList(){
    return MOCK.EVIDENCE.filter(function(x){ return x.type==='表单文书' || x.type==='处置记录'; });
  }
  function renderFeed(){
    var box = document.getElementById('wbFeed');
    if(cfg.feed==='docs' || cfg.feed==='docs_opinion'){
      var docs = docList();
      box.innerHTML = '<div class="small muted mb3">医院已上报文书/公告材料（外部单位可见范围）</div>'
        + docs.map(function(d){
            return '<div class="file-chip" style="display:flex;margin-bottom:8px;width:100%">'+App.icon('file')+'<span class="grow ellip">'+App.esc(d.name)+'</span><span class="fc-size">'+d.time+' · '+App.esc(d.uploader)+'</span></div>';
          }).join('')
        + (cfg.feed==='docs_opinion'
            ? '<div class="section-title mt3">'+App.icon('opinion')+'院方公告文稿</div>'
              + MOCK.OPINION.filter(function(o){ return o.source==='院办提交'; }).map(function(o){
                  return '<div class="file-chip" style="display:flex;margin-bottom:8px;width:100%">'+App.icon('opinion')+'<span class="grow ellip">'+App.esc(o.title)+'</span><span class="fc-size">'+o.time+' · '+App.esc(o.status)+'</span></div>';
                }).join('')
            : '')
        + '<div class="tiny dim mt2">内网原始告警、操作日志、会商内部讨论不在外部单位权限范围内（演练模拟权限隔离）</div>';
    } else if(cfg.feed==='impact'){
      API.getImpact().then(function(imp){
        box.innerHTML = '<div class="small muted mb3">业务系统影响态势（演练模拟）</div>'
          + imp.map(function(i){
              var c = i.pct>=100?'ok':i.pct>=60?'warn':'err';
              return '<div style="margin-bottom:10px"><div class="flex small" style="justify-content:space-between"><span>'+App.esc(i.sys)+'</span><span class="tag '+c+'">'+App.esc(i.state)+'</span></div><div class="progress mt2"><div class="bar '+c+'" style="width:'+i.pct+'%"></div></div></div>';
            }).join('');
      });
    } else if(cfg.feed==='evidence'){
      API.getEvidence().then(function(ev){
        var mine = ev.filter(function(x){ return x.role===role.id || x.type==='操作日志' || x.type==='附件截图'; });
        box.innerHTML = '<div class="small muted mb3">取证留痕（技术类，本角色可见）</div>'
          + mine.map(function(d){
              return '<div class="file-chip" style="display:flex;margin-bottom:8px;width:100%">'+App.icon(d.type==='操作日志'?'db':'file')+'<span class="grow ellip">'+App.esc(d.name)+'</span><span class="fc-size">'+d.time+' · '+App.esc(d.type)+'</span></div>';
            }).join('');
      });
    } else if(cfg.feed==='scores'){
      API.getScoreItems().then(function(items){
        API.getScores().then(function(scores){
          var total = scores.reduce(function(s,x){ return s+x.score; },0);
          var max = scores.reduce(function(s,x){ return s+x.max; },0);
          box.innerHTML = '<div class="small muted mb3">评分进度（演练模拟）</div>'
            + '<div class="kpi info" style="margin-bottom:12px"><div class="k-label">'+App.icon('score')+'当前累计得分</div><div class="k-value">'+total+'<span class="small dim">/'+max+'</span></div><div class="k-foot">已打分 '+scores.length+' / '+items.length+' 项指标</div></div>'
            + items.slice(0,4).map(function(it){
                var sc = scores.filter(function(x){ return x.itemId===it.id; })[0];
                return '<div class="hbar-row"><span class="muted">'+App.esc(it.name)+'</span><div class="hb-track"><div class="hb-fill" style="width:'+(sc?Math.round(sc.score/sc.max*100):0)+'%"></div></div><span class="hb-val">'+(sc?sc.score:'-')+'</span></div>';
              }).join('')
            + '<div class="tiny dim mt2">完整打分请前往复盘评估模块</div>';
        });
      });
    } else if(cfg.feed==='audit'){
      API.getAuditLogs().then(function(logs){
        box.innerHTML = '<div class="small muted mb3">平台审计日志（仅查看，不可删改）</div>'
          + '<div class="timeline">'+logs.slice(-6).reverse().map(function(l){
              return '<div class="tl-item gray"><span class="tl-dot"></span><div class="tl-time">'+App.esc(l.time)+'</div>'
                + '<div class="tl-title">'+App.esc(l.user)+' · '+App.esc(l.action)+'</div>'
                + '<div class="tl-desc mono tiny">IP '+App.esc(l.ip)+'</div></div>';
            }).join('')+'</div>';
      });
    } else { // messages
      API.getMessages().then(function(ms){
        var mine = ms.filter(function(m){ return (m.targets||[]).indexOf(role.id)>=0 || (m.targets||[]).indexOf('*')>=0; }).slice(-6).reverse();
        box.innerHTML = '<div class="small muted mb3">与本角色相关的消息流（演练模拟）</div>'
          + '<div class="timeline">'+ (mine.length ? mine.map(function(m){
              return '<div class="tl-item '+(m.level==='P0'?'err':m.level==='P1'?'warn':'gray')+'"><span class="tl-dot"></span>'
                + '<div class="tl-time">'+m.time+' · '+App.esc(m.source)+'</div>'
                + '<div class="tl-desc">'+App.levelTag(m.level)+' '+App.esc(m.text)+'</div></div>';
            }).join('') : '<div class="small dim">暂无定向消息</div>') + '</div>';
      });
    }
  }
  renderFeed();
});
App.boot('workbench');
</script>
</body>
</html>
