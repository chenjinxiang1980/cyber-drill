<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · 盘州市人民医院网络安全应急演练系统</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="login-bg">
  <div class="login-card">
    <div class="login-left">
      <div class="flex gap3"><span class="logo" style="width:42px;height:42px;border-radius:10px;background:var(--accent-dim);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;color:var(--accent2)" id="brandIcon"></span><div><div style="font-size:15px;font-weight:700">盘州市人民医院</div><div class="dim small">网络安全应急演练推演平台</div></div></div>
      <div class="l-title" style="margin-top:34px">常态化应急演练<br>标准化协同推演</div>
      <div class="l-sub">覆盖告警发现 → 核实研判 → 启动预案 → 处置 → 业务兜底 → 上报 → 报案取证 → 恢复 → 复盘完整闭环</div>
      <div class="l-features" id="featList"></div>
      <div class="l-foot">
        ⚠ 本系统仅用于应急演练与桌面推演，所有告警、处置动作均为<b>模拟记录</b>，不下发真实网络配置命令，与医院生产网络物理隔离。<br>
        演练内容不具备真实法律效力；演练数据请使用虚拟测试数据。
      </div>
    </div>
    <div class="login-right">
      <h2>选择参演角色登录</h2>
      <div class="lr-sub">系统内置 11 类业务角色，登录后按角色权限展示差异化工作台</div>
      <div class="role-grid" id="roleGrid"></div>
      <div class="form-row"><label class="f-label">账号 <span class="req">*</span></label><input class="input" id="inUser" placeholder="请输入账号（演示可任意）"></div>
      <div class="form-row"><label class="f-label">密码 <span class="req">*</span></label><input class="input" id="inPass" type="password" placeholder="强密码策略：≥8位含字母数字（演示不校验）"></div>
      <div class="form-row"><label class="f-label">验证码 <span class="req">*</span></label>
        <div class="captcha-row"><input class="input" id="inCap" maxlength="4" placeholder="不区分大小写"><span class="captcha-box" id="capBox" title="点击刷新"></span></div>
      </div>
      <div class="login-err" id="loginErr"></div>
      <button class="btn primary block" id="btnLogin" style="padding:10px;font-size:14px">登 录</button>
      <div class="tiny dim mt3" style="text-align:center">连续 5 次失败将锁定账号 10 分钟（演示策略）</div>
    </div>
  </div>
</div>
<script src="mock.js"></script>
<script src="app.js"></script>
<script src="api.js"></script>
<script>
(function(){
  document.getElementById('brandIcon').innerHTML = App.icon('shield');
  var feats = [['net','8类内置医疗高频安全事件场景库'],['flow','可视化剧本编排 · 难度分级 · 版本管理'],['dashboard','态势总看板 · 多角色协同推演'],['replay','时序回放 · 自动评分 · 演练报告导出']];
  document.getElementById('featList').innerHTML = feats.map(function(f){ return '<div class="f-item">'+App.icon(f[0])+'<span>'+f[1]+'</span></div>'; }).join('');

  var selRole = null, cap = '';
  function genCap(){ var s='ABCDEFGHJKMNPQRSTUVWXY345678'; cap=''; for(var i=0;i<4;i++) cap+=s[Math.floor(Math.random()*s.length)]; document.getElementById('capBox').textContent=cap; }
  genCap();
  document.getElementById('capBox').onclick = genCap;

  var grid = document.getElementById('roleGrid');
  grid.innerHTML = MOCK.ROLES.map(function(r){
    return '<div class="role-cell" data-id="'+r.id+'" title="'+r.desc+'"><span class="r-ic">'+App.icon(r.id==='commander'?'shield':r.id==='duty'?'bell':r.id==='netsec'?'net':r.id==='sysadmin'?'db':r.id==='itlead'?'user':r.id==='medlead'?'hospital':r.id==='clinical'?'building':r.id==='healthbureau'?'hospital':r.id==='cac'?'opinion':r.id==='cyberpolice'?'evidence':'admin')+'</span>'+r.name+'</div>';
  }).join('');
  grid.addEventListener('click', function(e){
    var c = e.target.closest('.role-cell'); if(!c) return;
    grid.querySelectorAll('.role-cell').forEach(function(x){ x.classList.remove('sel'); });
    c.classList.add('sel'); selRole = c.dataset.id;
    var u = MOCK.USERS.filter(function(x){ return x.role===selRole; })[0];
    if(u) document.getElementById('inUser').value = u.name;
  });

  var fails = 0;
  function err(m){ document.getElementById('loginErr').textContent = m; }
  document.getElementById('btnLogin').onclick = function(){
    err('');
    if(!selRole){ err('请先选择参演角色'); return; }
    var user = document.getElementById('inUser').value.trim();
    var pass = document.getElementById('inPass').value;
    var capIn = document.getElementById('inCap').value.trim().toUpperCase();
    if(!user){ err('请输入账号'); return; }
    if(pass.length<1){ err('请输入密码'); return; }
    if(capIn !== cap){ fails++; genCap(); document.getElementById('inCap').value='';
      err('验证码错误（第'+fails+'次）'+(fails>=5?' 账号已模拟锁定10分钟':'')); if(fails>=5) document.getElementById('btnLogin').disabled=true; return; }
    var role = MOCK.ROLES.filter(function(r){ return r.id===selRole; })[0];
    API.login(role.id, user, role.external? role.name : '盘州市人民医院').then(function(){
      App.toast('登录成功，欢迎 '+user, 'ok');
      setTimeout(function(){ location.href = role.nav.indexOf('dashboard')>=0 ? 'dashboard.html' : (role.nav[0]==='scenarios'?'scenarios.html':role.nav[0]==='tasks'?'tasks.html':'admin.html'); }, 400);
    });
  };
  document.getElementById('inCap').addEventListener('keydown', function(e){ if(e.key==='Enter') document.getElementById('btnLogin').click(); });
})();
</script>
</body>
</html>
