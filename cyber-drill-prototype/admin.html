<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>系统基础管理 · 盘州市人民医院网络安全应急演练系统</title>
<link rel="stylesheet" href="styles.css">
<style>
.mx-y{color:var(--ok);display:inline-flex} .mx-y svg{width:15px;height:15px}
.mx-n{color:var(--text3);opacity:.45;display:inline-flex} .mx-n svg{width:14px;height:14px}
table.mx-table th, table.mx-table td{padding:8px 10px;text-align:center}
table.mx-table td:first-child, table.mx-table th:first-child{text-align:left;white-space:nowrap}
tr.ext td{background:rgba(210,153,34,.07)}
.adm-pane{display:none} .adm-pane.on{display:block}
.chan-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px dashed var(--border)}
.chan-row:last-child{border-bottom:none}
</style>
</head>
<body data-page="admin">
<script src="mock.js"></script><script src="app.js"></script><script src="api.js"></script>
<script>
document.addEventListener('app:ready', function(e){
  var role = e.detail.role;
  var page = document.getElementById('page');

  /* 页内兜底：USERS 无账号/状态字段，页面内派生（不改动全局MOCK） */
  var users = MOCK.USERS.map(function(u,i){
    return { account: u.role+'.'+String(i+1).padStart(2,'0'), name:u.name, role:u.role, org:u.org, status:'启用' };
  });
  var templates = MOCK.FORM_TEMPLATES.slice();
  var auditBase = MOCK.AUDIT_LOGS.slice();
  var channels = [
    { name:'站内消息', desc:'任务/告警实时推送至工作台铃铛', on:true },
    { name:'短信（模拟）', desc:'P0事件与超时督办短信提醒，演练中不真实发送', on:true },
    { name:'邮件（模拟）', desc:'日报与归档通知，演练中不真实发送', on:false }
  ];

  var MODS = [['dashboard','演练看板'],['tasks','任务协同'],['workbench','角色工作台'],['collab','协同会商'],['scenarios','场景剧本库'],['projects','演练项目'],['evidence','取证归档'],['replay','时序回放'],['evaluation','复盘评估'],['ledger','台账统计'],['opinion','公告舆情'],['knowledge','预案知识库'],['admin','系统管理']];
  function roleName(id){ var r = MOCK.ROLES.filter(function(x){ return x.id===id; })[0]; return r ? r.name : id; }
  function objOf(a){ var m = a.match(/《(.+?)》/); if(m) return m[1]; var i = a.indexOf('：'); return i>=0 ? a.slice(i+1) : '—'; }

  page.innerHTML =
    '<div class="page-head"><div><h1>系统基础管理</h1><div class="sub">账号 · 权限矩阵 · 表单模板 · 审计日志 · 通知与备份（'+App.esc(role.name)+'）</div></div></div>'
    + '<div class="sim-banner">'+App.icon('alert')+'<span>本页面所有增删改操作均为<b>演练平台自身配置模拟</b>，不触达医院真实生产系统与数据。</span></div>'
    + '<div class="tabs" id="admTabs">'
    +   '<div class="tab active" data-t="users">'+App.icon('user')+'用户账号</div>'
    +   '<div class="tab" data-t="matrix">'+App.icon('lock')+'角色权限矩阵</div>'
    +   '<div class="tab" data-t="forms">'+App.icon('file')+'表单模板</div>'
    +   '<div class="tab" data-t="audit">'+App.icon('eye')+'审计日志</div>'
    +   '<div class="tab" data-t="ops">'+App.icon('db')+'通知与备份</div>'
    + '</div>'
    + '<div class="adm-pane on" id="pane-users">'
    +   '<div class="card"><div class="card-title">'+App.icon('user')+'用户账号<span class="more" id="uAddBtn">'+App.icon('plus')+'新增用户</span></div>'
    +   '<div class="table-wrap"><table class="table"><thead><tr><th>账号</th><th>姓名</th><th>角色</th><th>部门/单位</th><th>状态</th><th>操作</th></tr></thead><tbody id="uBody"></tbody></table></div></div>'
    + '</div>'
    + '<div class="adm-pane" id="pane-matrix">'
    +   '<div class="card"><div class="card-title">'+App.icon('lock')+'角色 × 模块 可见性矩阵（依据各角色导航授权渲染）</div>'
    +   '<div class="table-wrap"><table class="table mx-table"><thead><tr><th>角色</th>'+MODS.map(function(m){ return '<th>'+m[1]+'</th>'; }).join('')+'</tr></thead><tbody id="mxBody"></tbody></table></div>'
    +   '<div class="tiny mt3"><span class="tag yellow">高亮行</span> = 外部单位角色（卫健局/网信办/网安大队），仅可见医院主动上报的报送材料，不可见内网原始数据与技术日志。</div></div>'
    + '</div>'
    + '<div class="adm-pane" id="pane-forms">'
    +   '<div class="card"><div class="card-title">'+App.icon('file')+'上报文书表单模板<span class="more" id="fAddBtn">'+App.icon('plus')+'新建模板</span></div>'
    +   '<div class="table-wrap"><table class="table"><thead><tr><th>编号</th><th>模板名称</th><th>字段数</th><th>操作</th></tr></thead><tbody id="fBody"></tbody></table></div></div>'
    + '</div>'
    + '<div class="adm-pane" id="pane-audit">'
    +   '<div class="sim-banner" style="border-color:rgba(248,81,73,.5);color:var(--err);background:var(--err-dim)">'+App.icon('lock')+'<span><b>日志仅可查看，不可删除修改（防篡改）。</b>本模块不提供任何删除/编辑入口，导出留痕同样写入审计。</span></div>'
    +   '<div class="card"><div class="card-title">'+App.icon('eye')+'审计日志<span class="more">共 <span id="aCnt" class="mono">0</span> 条</span></div>'
    +   '<div class="filters" style="margin-bottom:12px"><input class="input grow" id="aKw" placeholder="搜索用户 / 操作 / 时间…"></div>'
    +   '<div class="table-wrap"><table class="table"><thead><tr><th>时间</th><th>用户</th><th>角色</th><th>操作</th><th>对象</th><th>IP</th></tr></thead><tbody id="aBody"></tbody></table></div></div>'
    + '</div>'
    + '<div class="adm-pane" id="pane-ops">'
    +   '<div class="grid grid-2">'
    +     '<div class="card"><div class="card-title">'+App.icon('bell')+'消息通知渠道配置</div><div id="chBody"></div>'
    +     '<div class="tiny dim mt3">渠道开关仅作用于演练平台提醒链路（模拟），真实应急通讯以院内应急通讯录为准。</div></div>'
    +     '<div class="card"><div class="card-title">'+App.icon('db')+'数据备份</div>'
    +       '<div class="kv"><span class="k">备份范围</span><span>账号配置 / 剧本库 / 台账 / 审计日志 / 取证档案索引</span>'
    +       '<span class="k">上次备份</span><span class="mono">2026-10-22 23:00（模拟）</span>'
    +       '<span class="k">保留策略</span><span>近 12 次演练档案</span></div>'
    +       '<div class="progress mt3" id="bkProg" style="display:none"><div class="bar" id="bkBar" style="width:0%"></div></div>'
    +       '<div class="tiny dim mt2" id="bkPct"></div>'
    +       '<button class="btn primary mt3" id="bkBtn">'+App.icon('archive')+'立即备份</button></div>'
    +   '</div>'
    + '</div>';

  /* ---------- 页签 ---------- */
  document.querySelectorAll('#admTabs .tab').forEach(function(tab){
    tab.onclick = function(){
      document.querySelectorAll('#admTabs .tab').forEach(function(x){ x.classList.toggle('active', x===tab); });
      document.querySelectorAll('.adm-pane').forEach(function(p){ p.classList.toggle('on', p.id==='pane-'+tab.dataset.t); });
    };
  });

  /* ---------- a) 用户账号 ---------- */
  function renderUsers(){
    document.getElementById('uBody').innerHTML = users.map(function(u,i){
      return '<tr><td class="mono">'+App.esc(u.account)+'</td><td>'+App.esc(u.name)+'</td><td>'+App.esc(roleName(u.role))+'</td><td class="dim">'+App.esc(u.org)+'</td><td>'+App.statusTag(u.status)+'</td>'
        + '<td><button class="btn sm '+(u.status==='启用'?'danger':'ok')+'" data-tg="'+i+'">'+(u.status==='启用'?'停用':'启用')+'</button></td></tr>';
    }).join('');
    document.querySelectorAll('#uBody [data-tg]').forEach(function(b){
      b.onclick = function(){
        var u = users[+b.dataset.tg];
        var next = u.status==='启用' ? '停用' : '启用';
        App.confirmSim('将账号「'+u.account+'」（'+u.name+'）状态切换为「'+next+'」？', function(){
          u.status = next;
          API.addAudit('账号状态切换：'+u.account+' → '+next).then(function(){
            renderUsers();
            App.toast('演练模拟：账号已'+next,'ok');
          });
        });
      };
    });
  }
  document.getElementById('uAddBtn').onclick = function(){
    App.modal({ title:'新增用户账号（演练模拟）', body:
      '<div class="form-grid">'
      + '<div class="form-row"><label class="f-label">账号 <span class="req">*</span></label><input class="input" id="naAcc" placeholder="如 duty.13"></div>'
      + '<div class="form-row"><label class="f-label">姓名 <span class="req">*</span></label><input class="input" id="naName" placeholder="虚拟姓名"></div>'
      + '<div class="form-row"><label class="f-label">角色</label><select class="select" id="naRole">'+MOCK.ROLES.map(function(r){ return '<option value="'+r.id+'">'+App.esc(r.name)+'</option>'; }).join('')+'</select></div>'
      + '<div class="form-row"><label class="f-label">部门/单位</label><input class="input" id="naOrg" placeholder="如 信息科" value="信息科"></div></div>'
      + '<div class="tiny dim">新账号仅用于演练登录，不接入真实组织架构与统一身份认证。</div>',
      foot:'<button class="btn" id="naNo">取消</button><button class="btn primary" id="naYes">创建账号（模拟）</button>',
      onOpen:function(ov){
        ov.querySelector('#naNo').onclick = ov.close;
        ov.querySelector('#naYes').onclick = function(){
          var acc = ov.querySelector('#naAcc').value.trim(), nm = ov.querySelector('#naName').value.trim();
          if(!acc || !nm){ App.toast('账号与姓名必填','err'); return; }
          users.push({ account:acc, name:nm, role:ov.querySelector('#naRole').value, org:ov.querySelector('#naOrg').value.trim()||'—', status:'启用' });
          API.addAudit('新增用户账号：'+acc).then(function(){ ov.close(); renderUsers(); App.toast('演练模拟：账号「'+acc+'」已创建','ok'); });
        };
      } });
  };

  /* ---------- b) 权限矩阵 ---------- */
  document.getElementById('mxBody').innerHTML = MOCK.ROLES.map(function(r){
    var cells = MODS.map(function(m){
      var has = (r.nav||[]).indexOf(m[0]) >= 0;
      return '<td>'+(has ? '<span class="mx-y">'+App.icon('check')+'</span>' : '<span class="mx-n">'+App.icon('x')+'</span>')+'</td>';
    }).join('');
    return '<tr'+(r.external?' class="ext"':'')+'><td><b>'+App.esc(r.name)+'</b><div class="tiny dim">'+App.esc(r.desc.slice(0,18))+'…</div></td>'+cells+'</tr>';
  }).join('');

  /* ---------- c) 表单模板 ---------- */
  function renderForms(){
    document.getElementById('fBody').innerHTML = templates.map(function(f,i){
      return '<tr><td class="mono">'+App.esc(f.id)+'</td><td>'+App.esc(f.name)+'</td><td class="mono">'+f.fields.length+'</td><td><button class="btn sm" data-vw="'+i+'">'+App.icon('eye')+'查看</button></td></tr>';
    }).join('');
    document.querySelectorAll('#fBody [data-vw]').forEach(function(b){
      b.onclick = function(){
        var f = templates[+b.dataset.vw];
        App.drawer({ title:'模板结构 · '+f.name, body:
          '<div class="kv"><span class="k">模板编号</span><span class="mono">'+App.esc(f.id)+'</span><span class="k">模板名称</span><span>'+App.esc(f.name)+'</span><span class="k">字段数</span><span class="mono">'+f.fields.length+'</span></div>'
          + '<div class="section-title mt4">字段结构</div>'
          + '<table class="table"><thead><tr><th style="width:60px">序号</th><th>字段名</th><th>控件（模拟）</th></tr></thead><tbody>'
          + f.fields.map(function(x,i){ return '<tr><td class="mono">'+(i+1)+'</td><td>'+App.esc(x)+'</td><td class="dim">'+(/附件|截图|清单/.test(x)?'附件上传':/时间|日期/.test(x)?'日期时间':/描述|意见|摘要|经过|方案|建议/.test(x)?'多行文本':'单行输入')+'</td></tr>'; }).join('')
          + '</tbody></table>'
          + '<div class="tiny dim mt3">模板供任务表单填报引用，字段校验规则在剧本编排中配置。</div>' });
      };
    });
  }
  document.getElementById('fAddBtn').onclick = function(){
    App.modal({ title:'新建表单模板（演练模拟）', body:
      '<div class="form-row"><label class="f-label">模板名称 <span class="req">*</span></label><input class="input" id="ftName" placeholder="如 恢复后业务抽查记录表"></div>'
      + '<div class="form-row"><label class="f-label">字段（每行一个） <span class="req">*</span></label><textarea class="textarea" id="ftFields" placeholder="填报单位&#10;抽查系统&#10;验证结果&#10;填报人&#10;填报时间"></textarea></div>',
      foot:'<button class="btn" id="ftNo">取消</button><button class="btn primary" id="ftYes">创建模板（模拟）</button>',
      onOpen:function(ov){
        ov.querySelector('#ftNo').onclick = ov.close;
        ov.querySelector('#ftYes').onclick = function(){
          var nm = ov.querySelector('#ftName').value.trim();
          var fs = ov.querySelector('#ftFields').value.split('\n').map(function(x){ return x.trim(); }).filter(Boolean);
          if(!nm || !fs.length){ App.toast('名称与字段必填','err'); return; }
          templates.push({ id:'F'+(templates.length+1), name:nm, fields:fs });
          API.addAudit('新建表单模板：'+nm).then(function(){ ov.close(); renderForms(); App.toast('演练模拟：模板「'+nm+'」已创建','ok'); });
        };
      } });
  };

  /* ---------- d) 审计日志 ---------- */
  function renderAudit(){
    var kw = document.getElementById('aKw').value.trim().toLowerCase();
    var list = auditBase.filter(function(a){
      if(!kw) return true;
      return (a.time+' '+a.user+' '+roleName(a.role)+' '+a.action).toLowerCase().indexOf(kw) >= 0;
    });
    document.getElementById('aCnt').textContent = auditBase.length;
    document.getElementById('aBody').innerHTML = list.length ? list.map(function(a){
      return '<tr><td class="mono">'+App.esc(a.time)+'</td><td>'+App.esc(a.user)+'</td><td class="dim">'+App.esc(roleName(a.role))+'</td><td>'+App.esc(a.action)+'</td><td class="dim">'+App.esc(objOf(a.action))+'</td><td class="mono dim">'+App.esc(a.ip)+'</td></tr>';
    }).join('') : '<tr><td colspan="6"><div class="empty">'+App.icon('search')+'<div>无匹配日志</div></div></td></tr>';
  }
  document.getElementById('aKw').addEventListener('input', renderAudit);

  /* ---------- e) 通知与备份 ---------- */
  function renderChannels(){
    document.getElementById('chBody').innerHTML = channels.map(function(c,i){
      return '<div class="chan-row"><span class="grow"><b>'+App.esc(c.name)+'</b><div class="tiny dim">'+App.esc(c.desc)+'</div></span>'
        + '<button class="btn sm '+(c.on?'ok':'')+'" data-ch="'+i+'">'+(c.on?'已开启':'已关闭')+'</button></div>';
    }).join('');
    document.querySelectorAll('#chBody [data-ch]').forEach(function(b){
      b.onclick = function(){
        var c = channels[+b.dataset.ch];
        var next = c.on ? '关闭' : '开启';
        App.confirmSim('将通知渠道「'+c.name+'」'+next+'？', function(){
          c.on = !c.on;
          API.addAudit('通知渠道'+next+'：'+c.name).then(function(){
            renderChannels();
            App.toast('演练模拟：渠道已'+next,'ok');
          });
        });
      };
    });
  }
  document.getElementById('bkBtn').onclick = function(){
    App.confirmSim('立即执行全量数据备份（演练模拟，不接触真实生产库）？', function(){
      var prog = document.getElementById('bkProg'), bar = document.getElementById('bkBar'), pctEl = document.getElementById('bkPct');
      prog.style.display = ''; bar.style.width = '0%'; pctEl.textContent = '正在备份：账号配置 / 剧本库 / 台账 / 审计日志…';
      var p = 0;
      var tm = setInterval(function(){
        p = Math.min(100, p + 8);
        bar.style.width = p+'%';
        if(p>=100){
          clearInterval(tm);
          pctEl.textContent = '备份完成（模拟文件 drill_backup_'+new Date().toISOString().slice(0,10)+'.zip）';
          API.addAudit('执行数据备份（演练模拟）');
          App.toast('演练模拟：数据备份完成','ok');
        }
      }, 120);
    });
  };

  renderUsers(); renderForms(); renderAudit(); renderChannels();
});
App.boot('admin');
</script>
</body>
</html>
