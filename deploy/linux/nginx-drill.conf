# =============================================================================
# drill-server —— Nginx 反向代理 + TLS 示例
#
# 用法：
#   sudo cp nginx-drill.conf /etc/nginx/conf.d/drill.conf
#   # 把 __REPLACE_WITH_DOMAIN__ 改成你的域名
#   sudo nginx -t && sudo systemctl reload nginx
#
# 前置：
#   - Go 后端监听 127.0.0.1:8090（已在 /etc/drill/drill.env 里配）
#   - Nginx 监听 80 + 443，TLS 证书放 /etc/nginx/certs/（或 Let's Encrypt）
#   - 建议 certbot 自动签发：certbot --nginx -d drill.example.com
#   - Go 进程的 TRUSTED_PROXIES 环境变量需包含 127.0.0.1/32
# =============================================================================

server {
    listen 80;
    server_name __REPLACE_WITH_DOMAIN__;  # ← 改成你的域名，例如 drill.example.com
    # HTTP 全站 301 到 HTTPS（certbot 也会自动加同样的块）
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name __REPLACE_WITH_DOMAIN__;

    # ---------- TLS ----------
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 证书路径（certbot 通常放在 /etc/letsencrypt/live/__REPLACE_WITH_DOMAIN__/）
    ssl_certificate     /etc/letsencrypt/live/__REPLACE_WITH_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__REPLACE_WITH_DOMAIN__/privkey.pem;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # ---------- HSTS ----------
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ---------- 上传大小 ----------
    # 必须与 drill.env 里的 UPLOAD_MAX_MB 对齐（当前 20）
    client_max_body_size 20m;
    client_body_buffer_size 128k;

    # ---------- 根路径重写 ----------
    # 前端 HTML 页面间裸相对链接（/projects.html、/knowledge.html）
    # 直接回源 Go 进程，Go 已在 NoRoute 里做 SPA fallback
    location = / {
        proxy_pass http://127.0.0.1:8090;
    }

    # ---------- /api ----------
    # WebSocket 升级头（演练看板等实时推送场景需要）
    location /api/ {
        proxy_pass http://127.0.0.1:8090;

        # WebSocket 升级
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 真实客户端 IP
        # Go 端 TRUSTED_PROXIES 必须包含 127.0.0.1/32，
        # 这样 Gin SetTrustedProxies 才会信任 nginx 的 X-Forwarded-For
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # ---------- /public 静态前端 ----------
    location /public/ {
        proxy_pass http://127.0.0.1:8090;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- /uploads ----------
    location /uploads/ {
        proxy_pass http://127.0.0.1:8090;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 大文件下载
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ---------- 裸 .html 路径（直接回源 Go）----------
    # 让 /dashboard.html 等前端页面正确命中
    location ~ \.html$ {
        proxy_pass http://127.0.0.1:8090;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- 健康检查（跳过大部分 header）----------
    location = /api/health {
        proxy_pass http://127.0.0.1:8090;
        access_log off;
    }

    # ---------- 默认：全部回源 Go ----------
    location / {
        proxy_pass http://127.0.0.1:8090;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
