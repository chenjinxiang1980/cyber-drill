# =============================================================================
# Drill System —— Docker Compose（可分发形态，面向终端用户）
#
# 三步启动：
#   1. cp .env.example .env   （或复制一份，改成真实值）
#   2. 编辑 .env：必须替换 JWT_SECRET / SESSION_SECRET / DB_PASSWORD 等占位符
#   3. docker compose up -d
#
# 停止与清理：
#   docker compose down              # 保留数据卷
#   docker compose down -v           # 彻底删除（含 MySQL 数据 + 上传文件）—— 慎用
#   docker compose pull              # 更新镜像到最新 tag（或 digest）
#
# 架构说明：
#   - mysql 用官方 mysql:8.0.42（固定小版本，建议进一步 pin digest 防供应链）
#   - app 由 docker-entrypoint.sh 负责：等 MySQL → 跑 migrations → exec drill-server
#   - public/ 已内嵌在镜像中，不需要 bind mount
#   - 命名卷持久化 MySQL 数据 + 应用上传文件
# =============================================================================

services:
  # ---------- MySQL 8.0 ----------
  mysql:
    # 固定到小版本 tag。生产建议进一步 pin digest，例如：
    #   image: mysql:8.0.42@sha256:a1b2c3d4...
    # （digest 在 docker pull 后用 docker image inspect mysql:8.0.42 取得）
    image: mysql:8.0.42
    # 容器名可用 MYSQL_CONTAINER_NAME 覆盖（同一宿主并行测试时避免冲突）
    container_name: ${MYSQL_CONTAINER_NAME:-drill-mysql}
    restart: unless-stopped
    environment:
      # ⚠️ 全部 __REPLACE_WITH__ 占位符必须替换成真实值
      # 与 .env 里 DB_PASSWORD / DB_USER / DB_ROOT_PASSWORD 保持一致
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-__REPLACE_WITH_ROOT_PW__}
      MYSQL_DATABASE:      ${DB_NAME:-drill_system}
      MYSQL_USER:          ${DB_USER:-__REPLACE_WITH_DB_USER__}
      MYSQL_PASSWORD:      ${DB_PASSWORD:-__REPLACE_WITH_DB_PASSWORD__}
      TZ:                  Asia/Shanghai
    # 端口仅绑定宿主机回环地址：容器网络内 app 仍可通过 mysql:3306 访问，
    # 外部主机无法直连数据库。确需远程调试时再显式改为指定网卡 IP。
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - drill-mysql-data:/var/lib/mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
      --max-connections=300
      --default-time-zone='+08:00'
    healthcheck:
      # root ping —— 用 MYSQL_ROOT_PASSWORD（compose 里已定义）
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - drill-net

  # ---------- App ----------
  app:
    # 用户有两种获取方式：
    #   方式 A：docker pull 后填入 image
    #     image: your-registry/drill-server:latest
    #   方式 B：本地构建（下面的 build 段）
    build:
      context: ../..
      dockerfile: deploy/docker-dist/Dockerfile
      args:
        VERSION: ${VERSION:-1.0.3}
    image: drill-server:${VERSION:-1.0.3}
    # 容器名可用 APP_CONTAINER_NAME 覆盖（同一宿主并行测试时避免冲突）
    container_name: ${APP_CONTAINER_NAME:-drill-app}
    restart: unless-stopped
    # 环境文件名可用 DRILL_ENV_FILE 覆盖（一键安装器默认生成 drill.env）
    env_file:
      - ${DRILL_ENV_FILE:-.env}
    environment:
      # compose 内部 DNS —— 强制覆盖 .env 里的 DB_HOST 为 mysql
      DB_HOST: mysql
      APP_ENV: production
      HTTP_ADDR: 0.0.0.0:8090
      TRUSTED_PROXIES: "172.17.0.0/16,127.0.0.1/32"
      # 部署环境文件在容器内的路径。首次改密成功后，服务端会把其中
      # ADMIN_INIT_PASSWORD / PLATFORMADMIN_INIT_PASSWORD 置空并标注失效。
      DRILL_ENV_FILE_PATH: /opt/drill/etc/drill.env
    ports:
      - "${APP_HOST_PORT:-8090}:8090"
    volumes:
      # 持久化数据（上传文件 / 运行时 data 目录）
      - drill-app-data:/opt/drill/data
      - drill-app-uploads:/opt/drill/uploads
      # 与 env_file 同一份部署文件，仅用于清空一次性初始口令明文。
      # 文件不存在时 compose 会报错（env_file 本身也要求存在）。
      - ${DRILL_ENV_FILE:-.env}:/opt/drill/etc/drill.env
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - drill-net

# ---------- 命名卷 ----------
volumes:
  drill-mysql-data:   # MySQL 数据（不会因容器删而丢；彻底重置用 docker compose down -v）
  drill-app-data:     # /opt/drill/data（运行时数据）
  drill-app-uploads:  # /opt/drill/uploads（用户上传文件）

# ---------- 网络 ----------
networks:
  drill-net:
    driver: bridge
