<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>态势总看板 · 盘州市人民医院网络安全应急演练系统</title>
<link rel="icon" type="image/png" href="img/logo.png">
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="dashboard">
<script src="system.js"></script>
<script src="app.js"></script>
<script src="api.js"></script>
<script>
document.addEventListener('app:ready', function(e){
  var role = e.detail.role;
  var page = document.getElementById('page');
  var proj = API.activeProject();
  /* 监视大屏：指挥部 / 平台管理员 / 信息科负责人 */
  var canScreen = ['commander','platformadmin','itlead'].indexOf(role.id)>=0;

  page.innerHTML =
    '<div class="page-head"><div><h1>演练态势总看板</h1><div class="sub">'+proj.name+' · '+proj.type+' · 参演单位：'+proj.units.join('、')+'</div></div>'
    + '<div class="acts">'
    + (canScreen ? '<button class="btn" id="btnScreen">'+App.icon('screen')+'演练监视大屏</button>' : '')
    + '<select class="select" id="autoSel" style="width:132px" title="自动刷新间隔">'
    +   '<option value="0">手动刷新</option>'
    +   '<option value="10">每 10 秒</option>'
    +   '<option value="30" selected>每 30 秒</option>'
    +   '<option value="60">每 60 秒</option>'
    +   '<option value="120">每 2 分钟</option>'
    + '</select>'
    + '<button class="btn" id="btnSnap">'+App.icon('camera')+'关键节点快照</button>'
    + '<button class="btn primary" id="btnRefresh">'+App.icon('refresh')+'刷新态势</button></div></div>'
    + '<div class="sim-banner">'+App.icon('alert')+'<span>本看板所有告警、事件、系统状态均为<b>演练模拟数据</b>，与医院真实生产环境无关，系统不操作任何生产网络与设备。</span></div>'
    + '<div class="grid grid-4" id="kpis"></div>'
    + '<div class="grid mt4" style="grid-template-columns:1.5fr 1fr;margin-top:16px">'
    +   '<div class="card"><div class="card-title">'+App.icon('flow')+'剧本时序进度<span class="more" onclick="location.href=\'scenarios.html?edit=1\'">查看剧本 ▸</span></div>'
    +     '<div class="scroll-panel" id="scriptBox"></div></div>'
    +   '<div class="card"><div class="card-title">'+App.icon('tasks')+'角色任务完成状态<span class="more dim tiny">悬停暂停滚动</span></div>'
    +     '<div class="scroll-panel" id="roleBox"></div></div>'
    + '</div>'
    + '<div class="grid mt4" style="grid-template-columns:1fr 1.2fr 1fr;gap:16px;margin-top:16px">'
    +   '<div class="card"><div class="card-title">'+App.icon('file')+'已上报文书清单</div><div id="docs" class="doc-list"></div></div>'
    +   '<div class="card"><div class="card-title">'+App.icon('bell')+'消息通知流</div><div class="timeline scroll-panel" id="msgFlow" style="padding-left:22px;height:300px;overflow-y:auto"></div></div>'
    +   '<div class="card"><div class="card-title">'+App.icon('hospital')+'业务影响范围</div><div id="impact" class="doc-list"></div></div>'
    + '</div>';

  /* ---------- 自动上滚：内容超高时复制一份并匀速上滚，不足高时静止 ---------- */
  function autoScroll(box, html){
    /* 内容未变化时不重建，避免自动刷新打断滚动位置 */
    if(box.getAttribute('data-sig') === html) return;
    box.setAttribute('data-sig', html);
    box.innerHTML = '<div class="scroll-track">'+html+'</div>';
    var track = box.firstChild;
    track.classList.add('static');
    requestAnimationFrame(function(){
      var h = track.scrollHeight;
      if(h <= box.clientHeight + 4) return;
      track.innerHTML = html + html;
      track.classList.remove('static');
      /* 22px/秒 的匀速滚动 */
      track.style.animationDuration = Math.max(12, Math.round(h / 22)) + 's';
    });
  }

  /* ---------- 数据快照（刷新时由接口返回值覆盖） ---------- */
  var DATA = {
    tasks: MOCK.TASKS || [], msgs: MOCK.MESSAGES || [], ev: MOCK.EVIDENCE || [],
    imp: MOCK.IMPACT || [], nodes: MOCK.SCRIPT_NODES || []
  };
  function pick(v, fb){ return Array.isArray(v) ? v : fb; }

  /* ---------- 各区块渲染 ---------- */
  function renderKpis(){
    var allTasks = DATA.tasks.filter(function(t){ return t.projectId===proj.id; });
    var overdue = allTasks.filter(function(t){ return t.status==='超时'; }).length;
    var k = [
      { l:'当前事件等级', v:proj.level, cls:'err', f:'依据剧本S01研判', ic:'alert' },
      { l:'待办任务', v:allTasks.filter(function(t){return t.status!=='已完成';}).length, cls:'warn', f:'超时 '+overdue+' 项', ic:'tasks' },
      { l:'参演角色在线', v:proj.members.length, cls:'info', f:'观察员 '+proj.observers.length+' 人', ic:'user' },
      { l:'演练已进行', v:API.drillElapsed(), cls:'ok', f:(proj.startedAt?'启动于 '+String(proj.startedAt).slice(0,16):'项目状态：'+(proj.status||'未开始')), ic:'clock', id:'d-elapsed' }
    ];
    document.getElementById('kpis').innerHTML = k.map(function(x){
      return '<div class="kpi '+x.cls+'"'+(x.id?' id="'+x.id+'"':'')+'><div class="k-label">'+App.icon(x.ic)+x.l+'</div><div class="k-value">'+x.v+'</div><div class="k-foot">'+x.f+'</div></div>';
    }).join('');
  }
  /* 每秒本地推算真实计时 */
  setInterval(function(){
    var el = document.querySelector('#d-elapsed .k-value');
    if(el) el.textContent = API.drillElapsed();
  }, 1000);

  function renderScript(){
    var nodes = DATA.nodes || [];
    if(!nodes.length){ autoScroll(document.getElementById('scriptBox'), '<div class="tiny dim">当前剧本暂无节点</div>'); return; }
    var html = '<div class="timeline">' + nodes.map(function(n, i){
      var icon = n.type==='alert'?'bell':n.type==='branch'?'flow':n.type==='report'?'send':n.type==='end'?'power':'tasks';
      return '<div class="tl-item gray"><span class="tl-dot"></span><div class="flex gap2"><span class="tl-time">第 '+(i+1)+' 节点</span></div><div class="tl-title">'+App.icon(icon)+' '+n.title+'</div><div class="tl-desc">接收：'+n.target+(n.form?' · 需提交：'+(MOCK.FORM_TEMPLATES.filter(function(f){return f.id===n.form;})[0]||{}).name:'')+(n.timeout?' · 处置时长 '+n.timeout+' 分钟':'')+'</div></div>';
    }).join('') + '</div>';
    autoScroll(document.getElementById('scriptBox'), html);
  }

  function renderRoles(){
    var rows = proj.members.map(function(m){
      var r = MOCK.ROLES.filter(function(x){ return x.id===m.role; })[0] || { name:m.role };
      var ts = DATA.tasks.filter(function(t){ return t.projectId===proj.id && t.role===m.role; });
      var done = ts.filter(function(t){ return t.status==='已完成'; }).length;
      var od = ts.filter(function(t){ return t.status==='超时'; }).length;
      var pct = ts.length? Math.round(done/ts.length*100):0;
      return '<div style="margin-bottom:12px"><div class="flex small" style="justify-content:space-between"><span>'+r.name+'<span class="dim"> · '+(m.user||'按角色参演')+'</span></span><span class="mono dim">'+done+'/'+ts.length+(od?' <b style="color:var(--err)">超时'+od+'</b>':'')+'</span></div><div class="progress mt2"><div class="bar '+(od?'err':pct===100?'ok':'')+'" style="width:'+pct+'%"></div></div></div>';
    }).join('');
    autoScroll(document.getElementById('roleBox'), rows || '<div class="tiny dim">暂无参演角色</div>');
  }

  function renderDocs(){
    var docs = DATA.ev.filter(function(e){ return e.type==='表单文书' || e.type==='处置记录'; });
    document.getElementById('docs').innerHTML = docs.map(function(d){
      return '<div class="file-chip" style="display:flex;margin-bottom:8px;width:100%">'+App.icon('file')+'<span class="grow ellip">'+d.name+'</span><span class="fc-size">'+d.time+' · '+d.uploader+'</span></div>';
    }).join('') + '<div class="tiny dim mt2">文书共 '+docs.length+' 份 · 全部归档于取证模块，支持一键打包</div>';
  }

  function renderMsgs(){
    var ms = (DATA.msgs||[]).slice().reverse();
    document.getElementById('msgFlow').innerHTML = ms.map(function(m){
      return '<div class="tl-item '+(m.level==='P0'?'err':m.level==='P1'?'warn':'gray')+'"><span class="tl-dot"></span><div class="tl-time">'+m.time+' · '+m.source+'</div><div class="tl-desc">'+App.levelTag(m.level)+' '+m.text+'</div></div>';
    }).join('') + (ms.length?'':'<div class="tiny dim">暂无消息</div>');
  }

  function renderImpact(){
    document.getElementById('impact').innerHTML = (DATA.imp||[]).map(function(i){
      var c = i.pct>=100?'ok':i.pct>=60?'warn':'err';
      var tc = c==='ok'?'green':c==='warn'?'yellow':'red';
      return '<div style="margin-bottom:10px"><div class="flex small" style="justify-content:space-between"><span>'+i.sys+'</span><span class="tag '+tc+'">'+i.state+'</span></div><div class="progress mt2"><div class="bar '+c+'" style="width:'+i.pct+'%"></div></div></div>';
    }).join('');
  }

  /* 从服务端拉取最新数据后再渲染（MOCK 缓存由各接口回写） */
  function refreshAll(silent){
    return Promise.all([API.getTasks(), API.getMessages(), API.getEvidence(), API.getImpact(), API.getScriptNodes()]).then(function(r){
      DATA.tasks = pick(r[0], DATA.tasks);
      DATA.msgs  = pick(r[1], DATA.msgs);
      DATA.ev    = pick(r[2], DATA.ev);
      DATA.imp   = pick(r[3], DATA.imp);
      DATA.nodes = pick(r[4], DATA.nodes);
      renderKpis(); renderScript(); renderRoles(); renderDocs(); renderMsgs(); renderImpact();
      if(!silent) App.toast('态势数据已刷新','ok');
    }).catch(function(err){
      if(!silent) App.toast((err&&err.message)||'刷新失败','err');
    });
  }

  /* ---------- 自动刷新 ---------- */
  var timer = null;
  var autoSel = document.getElementById('autoSel');
  function applyAuto(){
    if(timer){ clearInterval(timer); timer = null; }
    var sec = parseInt(autoSel.value, 10) || 0;
    if(sec > 0) timer = setInterval(function(){ refreshAll(true); }, sec*1000);
  }
  autoSel.onchange = function(){
    applyAuto();
    var sec = parseInt(autoSel.value, 10) || 0;
    App.toast(sec ? ('已开启自动刷新：每 '+sec+' 秒') : '已关闭自动刷新', 'ok');
  };

  document.getElementById('btnRefresh').onclick = function(){ refreshAll(false); };

  var screenBtn = document.getElementById('btnScreen');
  /* 同标签页跳转：令牌存于 sessionStorage，新开标签页会丢失登录态 */
  if(screenBtn) screenBtn.onclick = function(){
    location.href = 'screen.html?projectId='+encodeURIComponent(proj.id);
  };

  document.getElementById('btnSnap').onclick = function(){
    App.modal({ title:'创建复盘快照', body:'<div class="form-row"><label class="f-label">快照名称</label><input class="input" value="当前态势快照"></div><div class="form-row"><label class="f-label">备注</label><textarea class="textarea" placeholder="记录当前关键状态…"></textarea></div>',
      foot:'<button class="btn" id="c1">取消</button><button class="btn primary" id="c2">保存快照</button>',
      onOpen:function(ov){ ov.querySelector('#c1').onclick=ov.close; ov.querySelector('#c2').onclick=function(){ API.addSnapshot('当前态势快照','看板手动创建'); App.toast('快照已保存，用于复盘定格','ok'); ov.close(); }; } });
  };

  refreshAll(true);
  applyAuto();
});
App.boot('dashboard');
</script>
</body>
</html>
