<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>态势总看板 · 盘州市人民医院网络安全应急演练系统</title>
<link rel="icon" type="image/png" href="img/logo.png">
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="dashboard">
<script src="system.js"></script>
<script src="app.js"></script>
<script src="api.js"></script>
<script>
document.addEventListener('app:ready', function(e){
  var role = e.detail.role;
  var page = document.getElementById('page');
  /* 监视大屏：指挥部 / 平台管理员 / 信息科负责人 */
  var canScreen = ['commander','platformadmin','itlead'].indexOf(role.id)>=0;
  var ROLE_NAME = (e.detail.role && e.detail.role.name) || '';

  /* ---------- 无演练：展示空态 ---------- */
  function showStandby(){
    page.innerHTML =
      '<div class="standby-hero">'
      + '<div class="sb-icon">'+App.icon('shield')+'</div>'
      + '<div class="sb-body">'
      +   '<span class="sb-tag"><span class="dot"></span>SYSTEM STANDBY · 待机模式</span>'
      +   '<h2>当前无进行中的安全演练</h2>'
      +   '<div class="sb-sub">系统已就绪，所有剧本节点、流程字典、模拟场景均已加载。请先创建演练项目或从剧本库选择场景启动推演。</div>'
      +   '<div class="sb-acts">'
      +     '<a class="btn primary" href="projects.html">'+App.icon('projects')+'创建演练项目</a>'
      +     '<a class="btn" href="scenarios.html">'+App.icon('scenarios')+'浏览剧本库</a>'
      +     '<a class="btn" href="knowledge.html">'+App.icon('knowledge')+'查阅应急预案</a>'
      +   '</div>'
      + '</div></div>';
  }

  /* ---------- 构建页面骨架 ---------- */
  function buildSkeleton(projectName, projectId){
    page.innerHTML =
      '<div class="page-head"><div><h1>演练态势总看板</h1><div class="sub" id="d-sub">'+App.esc(projectName)+'</div></div>'
      + '<div class="acts">'
      + (canScreen ? '<button class="btn" id="btnScreen">'+App.icon('screen')+'演练监视大屏</button>' : '')
      + '<select class="select" id="autoSel" style="width:132px" title="自动刷新间隔">'
      +   '<option value="0">手动刷新</option>'
      +   '<option value="10">每 10 秒</option>'
      +   '<option value="30" selected>每 30 秒</option>'
      +   '<option value="60">每 60 秒</option>'
      +   '<option value="120">每 2 分钟</option>'
      + '</select>'
      + '<button class="btn" id="btnSnap">'+App.icon('camera')+'关键节点快照</button>'
      + '<button class="btn primary" id="btnRefresh">'+App.icon('refresh')+'刷新态势</button></div></div>'
      + '<div class="sim-banner">'+App.icon('alert')+'<span>本看板所有告警、事件、系统状态均为<b>演练模拟数据</b>，与医院真实生产环境无关。</span></div>'
      + '<div class="grid grid-4" id="kpis"></div>'
      + '<div class="grid mt4" style="grid-template-columns:1.5fr 1fr;margin-top:16px">'
      +   '<div class="card"><div class="card-title">'+App.icon('flow')+'剧本时序进度</div>'
      +     '<div class="scroll-panel" id="scriptBox"></div></div>'
      +   '<div class="card"><div class="card-title">'+App.icon('tasks')+'角色任务完成状态</div>'
      +     '<div class="scroll-panel" id="roleBox"></div></div>'
      + '</div>'
      + '<div class="grid mt4" style="grid-template-columns:1fr 1.2fr 1fr;gap:16px;margin-top:16px">'
      +   '<div class="card"><div class="card-title">'+App.icon('file')+'已上报文书清单</div><div id="docs" class="doc-list"></div></div>'
      +   '<div class="card"><div class="card-title">'+App.icon('bell')+'消息通知流</div><div class="timeline scroll-panel" id="msgFlow" style="padding-left:22px;height:300px;overflow-y:auto"></div></div>'
      +   '<div class="card"><div class="card-title">'+App.icon('hospital')+'业务影响范围</div><div id="impact" class="doc-list"></div></div>'
      + '</div>';
    if(canScreen){ var sb=document.getElementById('btnScreen'); if(sb) sb.onclick=function(){ location.href='screen.html?projectId='+encodeURIComponent(projectId); }; }
    var snap = document.getElementById('btnSnap');
    if(snap) snap.onclick = function(){
      App.modal({ title:'创建复盘快照', body:'<div class="form-row"><label class="f-label">快照名称</label><input class="input" value="当前态势快照"></div><div class="form-row"><label class="f-label">备注</label><textarea class="textarea" placeholder="记录当前关键状态…"></textarea></div>',
        foot:'<button class="btn" id="c1">取消</button><button class="btn primary" id="c2">保存快照</button>',
        onOpen:function(ov){ ov.querySelector('#c1').onclick=ov.close; ov.querySelector('#c2').onclick=function(){ API.addSnapshot('当前态势快照','看板手动创建'); App.toast('快照已保存','ok'); ov.close(); }; } });
    };
    document.getElementById('btnRefresh').onclick = function(){ refreshAll(false); };
  }

  /* ---------- 自动上滚 ---------- */
  function autoScroll(box, html){
    if(!box) return;
    if(box.getAttribute('data-sig') === html) return;
    box.setAttribute('data-sig', html);
    box.innerHTML = '<div class="scroll-track">'+html+'</div>';
    var track = box.firstChild;
    track.classList.add('static');
    requestAnimationFrame(function(){
      var h = track.scrollHeight;
      if(h <= box.clientHeight + 4) return;
      track.innerHTML = html + html;
      track.classList.remove('static');
      track.style.animationDuration = Math.max(12, Math.round(h / 22)) + 's';
    });
  }

  /* ---------- 渲染各区块 ---------- */
  var CUR = null;

  function stateTag(s){
    var cls = 'gray';
    if(s==='已完成') cls = 'green';
    else if(s==='超时完成') cls = 'red';
    else if(s==='处置中') cls = 'yellow';
    else if(s==='已执行') cls = 'red';
    else if(s==='已跳过') cls = 'gray';
    return '<span class="tag '+cls+'">'+s+'</span>';
  }

  function renderKpis(){
    var st = CUR.stats || {};
    var project = CUR.project || {};
    var now = Date.now();
    var elapsed = '';
    if(project.startedAt){
      var stMs = new Date(project.startedAt).getTime();
      if(isNaN(stMs)) stMs = Date.now();
      var diff = Math.max(0, Math.floor((now - stMs)/1000));
      elapsed = 'T+' + String(Math.floor(diff/3600)).padStart(2,'0') + ':' + String(Math.floor((diff%3600)/60)).padStart(2,'0') + ':' + String(diff%60).padStart(2,'0');
    }
    var scoreTxt = st.score !== null && st.score !== undefined ? (st.score + ' 分 · ' + (st.grade||'')) : '—';
    var k = [
      { l:'当前事件等级', v: project.level || '—', cls:'err', f: (project.mode||'') + ' 模式', ic:'alert' },
      { l:'待办任务', v: st.pendingTasks || 0, cls:'warn', f:'超时 '+(st.overdueTasks||0)+' 项', ic:'tasks' },
      { l:'参演角色在线', v: st.onlineActors || 0, cls:'info', f:'启用账号 '+(st.totalActors||0)+' 人', ic:'user' },
      { l:'演练已进行', v: elapsed || '—', cls:'ok', f:'综合得分 ' + scoreTxt, ic:'clock' }
    ];
    document.getElementById('kpis').innerHTML = k.map(function(x){
      return '<div class="kpi '+x.cls+'"><div class="k-label">'+App.icon(x.ic)+x.l+'</div><div class="k-value">'+x.v+'</div><div class="k-foot">'+x.f+'</div></div>';
    }).join('');
    document.getElementById('d-sub').textContent = (project.name || '') + ' · ' + (project.mode || '');
  }
  /* 每秒更新计时 */
  setInterval(function(){ if(CUR && CUR.project && CUR.project.startedAt) renderKpis(); }, 1000);

  function renderScript(){
    var nodes = CUR.seqFlow || [];
    if(!nodes.length){ autoScroll(document.getElementById('scriptBox'), '<div class="tiny dim">当前剧本暂无节点</div>'); return; }
    var html = '<div class="timeline">' + nodes.map(function(n, i){
      var icon = n.flowType==='distractor' ? 'alert' : 'tasks';
      var ct = '';
      if(n.completedAt) ct = '<span class="dim tiny"> · 完成于 '+App.esc(n.completedAt)+'</span>';
      var deductTxt = n.deduct ? ('<span class="dim tiny"> · 扣 '+n.deduct+' 分</span>') : '';
      return '<div class="tl-item '+(n.flowType==='distractor'?'err':'')+'"><span class="tl-dot"></span>'
        + '<div class="tl-time">'+n.id+' · '+stateTag(n.state)+'</div>'
        + '<div class="tl-title">'+App.icon(icon)+' '+App.esc(n.title)+ct+deductTxt+'</div>'
        + '<div class="tl-desc tiny dim">接收：'+App.esc(n.role)+' · 分值 '+n.score+'</div>'
        + '</div>';
    }).join('') + '</div>';
    autoScroll(document.getElementById('scriptBox'), html);
  }

  function renderRoles(){
    var rows = CUR.roles || [];
    if(!rows.length){ autoScroll(document.getElementById('roleBox'), '<div class="tiny dim">暂无参演角色数据</div>'); return; }
    var html = rows.map(function(r){
      var pct = r.total ? Math.round(r.done/r.total*100) : 0;
      var err = r.overtime > 0 || r.wrong > 0;
      return '<div style="margin-bottom:12px"><div class="flex small" style="justify-content:space-between">'
        + '<span>'+App.icon('user')+' '+App.esc(r.roleName)+'</span>'
        + '<span class="mono dim">'+r.done+'/'+r.total
        + (r.overtime?' <b style="color:var(--err)">超时'+r.overtime+'</b>':'')
        + (r.wrong?' <b style="color:var(--warn)">混淆'+r.wrong+'</b>':'')
        + '</span></div>'
        + '<div class="progress mt2"><div class="bar '+(err?'err':(pct===100?'ok':''))+'" style="width:'+pct+'%"></div></div></div>';
    }).join('');
    autoScroll(document.getElementById('roleBox'), html);
  }

  function renderDocs(){
    var docs = CUR.docs || [];
    document.getElementById('docs').innerHTML = docs.map(function(d){
      return '<div class="file-chip" style="display:flex;margin-bottom:8px;width:100%">'
        + App.icon('file')+'<span class="grow ellip">'+App.esc(d.name)+'</span>'
        + '<span class="fc-size">'+App.esc(d.time||'—')+' · '+App.esc(d.uploader||'')+'</span></div>';
    }).join('') + (docs.length ? ('<div class="tiny dim mt2">文书共 '+docs.length+' 份 · 全部归档于取证模块</div>') : '<div class="tiny dim mt2">暂无已上报文书</div>');
  }

  function renderMsgs(){
    var ms = (CUR.msgs||[]).slice();
    document.getElementById('msgFlow').innerHTML = ms.map(function(m){
      var cls = m.level==='P0'?'err':m.level==='P1'?'warn':'gray';
      return '<div class="tl-item '+cls+'"><span class="tl-dot"></span>'
        + '<div class="tl-time">'+App.esc(m.time)+' · '+App.esc(m.actor||'系统')+'</div>'
        + '<div class="tl-desc">'+App.levelTag(m.level||'')+' '+App.esc(m.action||'')
        + (m.detail ? ('<div class="tiny dim mt1">'+App.esc(m.detail)+'</div>') : '')
        + '</div></div>';
    }).join('') + (ms.length?'':'<div class="tiny dim">暂无消息</div>');
  }

  function renderImpact(){
    var imp = CUR.impact || [];
    document.getElementById('impact').innerHTML = imp.map(function(i){
      var c = i.pct>=100?'ok':i.pct>=60?'warn':'err';
      var tc = c==='ok'?'green':c==='warn'?'yellow':'red';
      return '<div style="margin-bottom:10px"><div class="flex small" style="justify-content:space-between"><span>'+App.icon('hospital')+' '+App.esc(i.sys)+'</span><span class="tag '+tc+'">'+App.esc(i.state)+'</span></div><div class="progress mt2"><div class="bar '+c+'" style="width:'+i.pct+'%"></div></div></div>';
    }).join('') + (imp.length?'':'<div class="tiny dim">暂无业务系统</div>');
  }

  function renderAll(){
    renderKpis(); renderScript(); renderRoles(); renderDocs(); renderMsgs(); renderImpact();
  }

  /* ---------- 拉取聚合数据 ---------- */
  function refreshAll(silent){
    var pid = CUR && CUR.project && CUR.project.id;
    if(!pid){ if(!silent) App.toast('当前无演练项目','err'); return; }
    return DRILL.get('/content/dashboard?projectId=' + encodeURIComponent(pid)).then(function(data){
      CUR = data;
      renderAll();
      if(!silent) App.toast('态势数据已刷新','ok');
    }).catch(function(err){
      if(!silent) App.toast((err&&err.message)||'刷新失败','err');
    });
  }

  /* ---------- 入口 ---------- */
  DRILL.get('/content/projects').then(function(ps){
    var list = Array.isArray(ps) ? ps : (ps && ps.projects) || [];
    var active = list.filter(function(p){ return p.status === '演练中'; })[0] || list[0];
    if(!active){ showStandby(); return; }
    buildSkeleton(active.name, active.id);
    /* 先塞一个临时 CUR 避免 CUR 为 null */
    CUR = { project: active, stats:{}, seqFlow:[], roles:[], docs:[], msgs:[], impact:[] };
    refreshAll(true);

    /* 自动刷新 */
    var timer = null;
    var autoSel = document.getElementById('autoSel');
    function applyAuto(){
      if(timer){ clearInterval(timer); timer = null; }
      var sec = parseInt(autoSel.value, 10) || 0;
      if(sec > 0) timer = setInterval(function(){ refreshAll(true); }, sec*1000);
    }
    autoSel.onchange = function(){
      applyAuto();
      var sec = parseInt(autoSel.value, 10) || 0;
      App.toast(sec ? ('已开启自动刷新：每 '+sec+' 秒') : '已关闭自动刷新', 'ok');
    };
    applyAuto();
  }).catch(function(){ showStandby(); });
});
App.boot('dashboard');
</script>
</body>
</html>
