<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · 盘州市人民医院网络安全应急演练系统</title>
<link rel="icon" type="image/png" href="img/logo.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="screen-entry" id="screenEntry" href="screen.html" target="_blank" rel="noopener">
  <span class="dot"></span><span id="screenEntryIcon"></span>演练监视大屏<em>免登录 · 全屏投屏</em>
</a>
<div class="login-bg">
  <div class="login-card">
    <div class="login-left">
      <div class="flex gap3"><span class="logo login-logo" id="brandIcon"><img src="img/logo.png" alt="盘州市人民医院院徽"></span><div><div data-brand="unit" style="font-size:15px;font-weight:700">盘州市人民医院</div><div class="dim small" data-brand="system">网络安全应急演练推演平台</div></div></div>
      <div class="l-title" style="margin-top:34px">常态化应急演练<br>标准化协同推演</div>
      <div class="l-sub">覆盖告警发现 → 核实研判 → 启动预案 → 处置 → 业务兜底 → 上报 → 报案取证 → 恢复 → 复盘完整闭环</div>
      <div class="l-features" id="featList"></div>
      <div class="l-foot">
        ⚠ 本系统仅用于应急演练与桌面推演，所有告警、处置动作均为<b>模拟记录</b>，不下发真实网络配置命令，与医院生产网络物理隔离。<br>
        演练内容不具备真实法律效力；演练数据请使用虚拟测试数据。
      </div>
    </div>
    <div class="login-right">
      <h2>选择参演角色登录</h2>
      <div class="lr-sub" id="roleCount">系统内置角色，登录后按角色权限展示差异化工作台</div>
      <div class="role-grid" id="roleGrid"></div>
      <div class="form-row"><label class="f-label">账号 <span class="req">*</span></label>
        <select class="select" id="selAccount" style="display:none"></select>
        <input class="input" id="inUser" placeholder="选择角色后列出本角色账号，也可手动输入">
        <div class="tiny mt2"><a id="accToggle" style="color:var(--accent2);cursor:pointer">手动输入账号</a></div>
      </div>
      <div class="form-row"><label class="f-label">密码 <span class="req">*</span></label><input class="input" id="inPass" type="password" placeholder="初始密码 Pzy@2026，登录后请尽快修改"></div>
      <div class="form-row"><label class="f-label">验证码 <span class="req">*</span></label>
        <div class="captcha-row"><input class="input" id="inCap" maxlength="4" placeholder="不区分大小写"><span class="captcha-box" id="capBox" title="点击刷新"></span></div>
      </div>
      <div class="login-err" id="loginErr"></div>
      <button class="btn primary block" id="btnLogin" style="padding:10px;font-size:14px">登 录</button>
      <div class="tiny dim mt3" style="text-align:center">连续 5 次验证码错误将锁定 10 分钟 · 账号由平台管理员统一分配</div>
    </div>
  </div>
</div>
<script src="system.js"></script>
<script src="app.js"></script>
<script src="api.js"></script>
<script>
(function(){
  DRILL.loadBrand().then(function(b){ if(b) DRILL.applyBrand(b); });
  document.getElementById('screenEntryIcon').innerHTML = App.icon('screen');
  var feats = [['net','8类内置医疗高频安全事件场景库'],['flow','场景剧本库与可视化编排 · 版本管理'],['dashboard','态势总看板 · 多角色协同推演'],['replay','时序回放 · 系统自动考评 · 演练报告导出']];
  document.getElementById('featList').innerHTML = feats.map(function(f){ return '<div class="f-item">'+App.icon(f[0])+'<span>'+f[1]+'</span></div>'; }).join('');

  var ROLE_ICON = { commander:'shield', duty:'bell', netsec:'net', sysadmin:'db', itlead:'user', medlead:'hospital', clinical:'building', healthbureau:'hospital', cac:'bell', cyberpolice:'evidence', platformadmin:'admin' };
  var HREF = { dashboard:'dashboard.html', screen:'screen.html', workbench:'workbench.html', collab:'collab.html',
    scenarios:'scenarios.html', projects:'projects.html', evidence:'evidence.html',
    knowledge:'knowledge.html', replay:'replay.html', evaluation:'evaluation.html',
    report:'report.html', ledger:'ledger.html', admin:'admin.html' };

  var selRole = null, cap = '', ROLES = [], ACCOUNTS = [], accMode = 'manual';
  var selAccount = document.getElementById('selAccount');
  var inUser = document.getElementById('inUser');
  var accToggle = document.getElementById('accToggle');

  function accountsOfRole(rid){
    return ACCOUNTS.filter(function(a){ return (a.roles||[]).some(function(x){ return x.id===rid; }); });
  }
  /* 角色 → 账号下拉；无可用账号时退回手动输入 */
  function fillAccounts(){
    if(!selRole) return;
    var list = accountsOfRole(selRole);
    selAccount.innerHTML = list.map(function(a){ return '<option value="'+App.esc(a.username)+'">'+App.esc(a.username+'（'+a.name+'）')+'</option>'; }).join('');
    if(list.length){
      accMode = 'select';
      selAccount.style.display = '';
      inUser.style.display = 'none';
      accToggle.textContent = '手动输入账号';
      accToggle.style.display = '';
    }else{
      accMode = 'manual';
      selAccount.style.display = 'none';
      inUser.style.display = '';
      inUser.value = '';
      accToggle.style.display = 'none';
      err('该角色暂无可用账号，请手动输入或联系平台管理员');
    }
  }
  accToggle.onclick = function(){
    if(accMode === 'select'){
      accMode = 'manual';
      selAccount.style.display = 'none';
      inUser.style.display = '';
      inUser.value = '';
      inUser.focus();
      accToggle.textContent = '改为下拉选择';
    }else{
      accMode = 'select';
      accToggle.textContent = '手动输入账号';
      if(selRole) fillAccounts(); else { inUser.style.display=''; selAccount.style.display='none'; }
    }
  };

  function genCap(){ var s='ABCDEFGHJKMNPQRSTUVWXY345678'; cap=''; for(var i=0;i<4;i++) cap+=s[Math.floor(Math.random()*s.length)]; document.getElementById('capBox').textContent=cap; }
  genCap();
  document.getElementById('capBox').onclick = genCap;

  var grid = document.getElementById('roleGrid');
  function err(m){ document.getElementById('loginErr').textContent = m; }
  grid.innerHTML = '<div class="tiny dim" style="grid-column:1/-1;padding:14px 4px">正在加载角色…</div>';

  function renderRoles(){
    grid.classList.toggle('dense', ROLES.length > 9);
    grid.innerHTML = ROLES.map(function(r){
      return '<div class="role-cell" data-id="'+r.id+'" title="'+App.esc(r.desc||'')+'"><span class="r-ic">'+App.icon(ROLE_ICON[r.id]||'user')+'</span>'+App.esc(r.name)+'</div>';
    }).join('');
  }

  Promise.all([
    fetch('/api/auth/roles').then(function(r){ if(!r.ok) throw new Error('角色加载失败'); return r.json(); }),
    fetch('/api/auth/accounts').then(function(r){ return r.ok ? r.json() : []; })
  ]).then(function(res){
    ROLES = res[0]; ACCOUNTS = res[1];
    document.getElementById('roleCount').textContent = '系统内置 ' + ROLES.length + ' 类业务角色，登录后按角色权限展示差异化工作台';
    renderRoles();
  }).catch(function(e){
    grid.innerHTML = '';
    err('无法连接服务端，请确认服务已启动后刷新页面');
  });

  grid.addEventListener('click', function(e){
    var c = e.target.closest('.role-cell'); if(!c) return;
    grid.querySelectorAll('.role-cell').forEach(function(x){ x.classList.remove('sel'); });
    c.classList.add('sel'); selRole = c.dataset.id;
    fillAccounts();
  });

  var fails = 0, locked = false;
  document.getElementById('btnLogin').onclick = function(){
    err('');
    if(locked){ err('账号已锁定，请稍后再试'); return; }
    var user = accMode === 'select' ? (selAccount.value || '') : document.getElementById('inUser').value.trim();
    var pass = document.getElementById('inPass').value;
    /* 未点选角色卡时按账号自动识别角色（角色以服务端校验结果为准） */
    if(!selRole && user){
      var acc = ACCOUNTS.filter(function(x){ return x.username===user; })[0];
      if(acc) selRole = acc.role;
    }
    if(!selRole){ err('请先选择参演角色（或输入已分配的账号）'); return; }
    var capIn = document.getElementById('inCap').value.trim().toUpperCase();
    if(!user){ err('请选择或输入账号'); return; }
    if(pass.length < 1){ err('请输入密码'); return; }
    if(capIn !== cap){ fails++; genCap(); document.getElementById('inCap').value='';
      err('验证码错误（第'+fails+'次）'+(fails>=5?' 账号已锁定 10 分钟':'')); if(fails>=5){ locked=true; document.getElementById('btnLogin').disabled=true; setTimeout(function(){ locked=false; fails=0; document.getElementById('btnLogin').disabled=false; }, 10*60*1000); } return; }

    var btn = document.getElementById('btnLogin');
    btn.disabled = true; btn.textContent = '登录中…';
    API.login(user, pass, selRole).then(function(r){
      if(selRole !== r.role.id){
        App.toast('所选角色与账号角色不一致，已按账号角色登录', 'warn');
      }
      App.toast('登录成功，欢迎 ' + r.user.name, 'ok');
      var nav = r.role.nav || [];
      var target = nav.indexOf('dashboard') >= 0 ? 'dashboard.html' : (HREF[nav[0]] || 'workbench.html');
      setTimeout(function(){ location.href = target; }, 450);
    }).catch(function(e){
      btn.disabled = false; btn.textContent = '登 录';
      genCap(); document.getElementById('inCap').value = '';
      err((e && e.message) || '登录失败，请检查账号与密码');
    });
  };
  document.getElementById('inCap').addEventListener('keydown', function(e){ if(e.key==='Enter') document.getElementById('btnLogin').click(); });
  document.getElementById('inPass').addEventListener('keydown', function(e){ if(e.key==='Enter') document.getElementById('btnLogin').click(); });
})();
</script>
</body>
</html>
