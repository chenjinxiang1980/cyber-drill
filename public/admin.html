<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>系统基础管理 · 盘州市人民医院网络安全应急演练系统</title>
<link rel="icon" type="image/png" href="img/logo.png">
<link rel="stylesheet" href="styles.css">
<style>
.mx-y{color:var(--ok);display:inline-flex} .mx-y svg{width:15px;height:15px}
.mx-n{color:var(--text3);opacity:.45;display:inline-flex} .mx-n svg{width:14px;height:14px}
table.mx-table th, table.mx-table td{padding:8px 10px;text-align:center}
table.mx-table th{white-space:normal;font-size:11px;line-height:1.3;min-width:62px;vertical-align:bottom}
table.mx-table td:first-child, table.mx-table th:first-child{text-align:left;white-space:nowrap;min-width:196px}
.mx-off td, .mx-off td b{opacity:.6}
.mx-off .mx-cell{opacity:.4}
.mx-cell{cursor:pointer;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;padding:2px;transition:.15s}
.mx-cell:hover{background:var(--elev2)}
.mx-cell.mx-lock{cursor:not-allowed;opacity:.7}
tr.ext td{background:rgba(210,153,34,.07)}
.adm-pane{display:none} .adm-pane.on{display:block}

/* ===== 权限矩阵：双方向粘性锁定 ===== */
#pane-matrix .table-wrap{max-height:calc(100vh - 320px);max-height:calc(100dvh - 320px);overflow:auto}
table.mx-table thead th{position:sticky;top:0;z-index:10;background:var(--elev);box-shadow:0 1px 0 var(--border)}
table.mx-table th:first-child,
table.mx-table td:first-child{position:sticky;left:0;z-index:5;background:var(--panel);box-shadow:1px 0 0 var(--border)}
table.mx-table thead th:first-child{z-index:20;background:var(--elev);box-shadow:1px 1px 0 var(--border)}
table.mx-table tr.ext td:first-child{background:rgba(210,153,34,.07)}
table.mx-table tr:hover td:first-child{background:var(--hover)}
table.mx-table tr.ext:hover td:first-child{background:rgba(210,153,34,.14)}

</style>
</head>
<body data-page="admin">
<script src="system.js"></script><script src="app.js"></script><script src="api.js"></script>
<script>
document.addEventListener('app:ready', function(e){
  var role = e.detail.role;
  var page = document.getElementById('page');

  /* 真实账号列表（来自服务端数据库） */
  var users = MOCK.USERS.map(function(u){
    return { id:u.id, account:u.username, name:u.name, role:u.role, roles:(u.roles||[u.role]).slice(), org:u.org, status:u.status||'启用' };
  });
  var templates = MOCK.FORM_TEMPLATES.slice();
  var auditBase = MOCK.AUDIT_LOGS.slice();
  var auditPage = 1;
  var auditPageSize = 10;
  var BRAND_ADMIN = role.id === 'platformadmin'; /* 系统设置仅平台管理员可维护 */
  var MODS = [['dashboard','演练看板'],['workbench','角色工作台'],['collab','演练导调'],['scenarios','剧本库与编排'],['projects','演练项目'],['screen','监视大屏'],['evidence','取证归档'],['replay','时序回放'],['evaluation','复盘评估'],['report','演练报告'],['ledger','台账统计'],['knowledge','预案知识库'],['admin','系统设置'],['dictionary','流程字典']];
  function roleName(id){ var r = MOCK.ROLES.filter(function(x){ return x.id===id; })[0]; return r ? r.name : id; }
  function objOf(a){ var m = a.match(/《(.+?)》/); if(m) return m[1]; var i = a.indexOf('：'); return i>=0 ? a.slice(i+1) : '—'; }

  page.innerHTML =
    '<div class="page-head"><div><h1>系统设置</h1><div class="sub">账号 · 权限矩阵 · 表单模板 · 审计日志 · 通知与备份（'+App.esc(role.name)+'）</div></div></div>'
    + '<div class="sim-banner">'+App.icon('alert')+'<span>本页面所有增删改操作均为<b>演练平台自身配置模拟</b>，不触达医院真实生产系统与数据。</span></div>'
    + '<div class="tabs" id="admTabs">'
    +   '<div class="tab active" data-t="users">'+App.icon('user')+'用户账号</div>'
    +   '<div class="tab" data-t="matrix">'+App.icon('lock')+'角色权限矩阵</div>'
    +   '<div class="tab" data-t="forms">'+App.icon('file')+'表单模板</div>'
    +   '<div class="tab" data-t="audit">'+App.icon('eye')+'审计日志</div>'
    +   '<div class="tab" data-t="ops">'+App.icon('db')+'通知与备份</div>'
    +   (BRAND_ADMIN ? '<div class="tab" data-t="brand">'+App.icon('admin')+'基本信息设置</div>' : '')
    + '</div>'
    + '<div class="adm-pane on" id="pane-users">'
    +   '<div class="card"><div class="card-title">'+App.icon('user')+'用户账号<span class="more" id="uAddBtn">'+App.icon('plus')+'新增用户</span></div>'
    +   '<div class="table-wrap"><table class="table"><thead><tr><th>账号</th><th>姓名</th><th>角色</th><th>部门/单位</th><th>状态</th><th>操作</th></tr></thead><tbody id="uBody"></tbody></table></div></div>'
    + '</div>'
    + '<div class="adm-pane" id="pane-matrix">'
    +   '<div class="card"><div class="card-title">'+App.icon('lock')+'角色 × 模块 可见性矩阵（依据各角色导航授权渲染）<span class="more tiny dim">点击单元格可切换可见性</span></div>'
    +   '<div class="table-wrap"><table class="table mx-table"><thead><tr><th>角色 / 说明</th>'+MODS.map(function(m){ return '<th>'+m[1]+'</th>'; }).join('')+'</tr></thead><tbody id="mxBody"></tbody></table></div>'
    +   '<div class="tiny mt3"><span class="tag yellow">高亮行</span> = 外部单位角色（卫健局/网信办/网安大队），仅可见医院主动上报的报送材料，不可见内网原始数据与技术日志。平台管理员「系统管理」权限不可移除；停用角色不再出现在登录页；仍有账号绑定的角色不可删除；上移/下移调整登录页角色卡片顺序。</div>'
    +   '<div class="flex gap3 mt4" style="align-items:center;flex-wrap:wrap"><button class="btn" id="mxAddBtn">'+App.icon('plus')+'新增角色</button><button class="btn primary" id="mxSaveBtn">'+App.icon('check')+'保存权限变更</button><span class="tiny dim">新增角色后可为其分配账号；保存后已登录账号刷新页面即生效</span></div>'
    + '</div></div>'
    + '<div class="adm-pane" id="pane-forms">'
    +   '<div class="card"><div class="card-title">'+App.icon('file')+'上报文书表单模板<span class="more" id="fAddBtn">'+App.icon('plus')+'新建模板</span></div>'
    +   '<div class="table-wrap"><table class="table"><thead><tr><th>编号</th><th>模板名称</th><th>字段数</th><th>已配置说明</th><th>操作</th></tr></thead><tbody id="fBody"></tbody></table></div></div>'
    +   '<div class="tiny dim mt3">内置模板可由平台管理员修改；字段说明将在参演人员分步填表时逐项展示，用于引导填写。</div>'
    + '</div>'
    + '<div class="adm-pane" id="pane-audit">'
    +   '<div class="sim-banner" style="border-color:rgba(248,81,73,.5);color:var(--err);background:var(--err-dim)">'+App.icon('lock')+'<span><b>日志仅可查看，不可删除修改（防篡改）。</b>本模块不提供任何删除/编辑入口，导出留痕同样写入审计。</span></div>'
    +   '<div class="card"><div class="card-title">'+App.icon('eye')+'审计日志<span class="more">共 <span id="aCnt" class="mono">0</span> 条</span></div>'
    +   '<div class="filters" style="margin-bottom:12px"><input class="input grow" id="aKw" placeholder="搜索用户 / 操作 / 时间…"><span class="tiny dim" style="white-space:nowrap">每页</span><select class="select" id="aPageSize" style="width:auto;min-width:96px" title="每页显示条数"><option value="10" selected>10 条</option><option value="20">20 条</option><option value="50">50 条</option><option value="100">100 条</option></select></div>'
    +   '<div class="table-wrap"><table class="table"><thead><tr><th>时间</th><th>用户</th><th>角色</th><th>操作</th><th>对象</th><th>IP</th></tr></thead><tbody id="aBody"></tbody></table></div>'
    +   '<div class="pager" id="aPager"></div></div>'
    + '</div>'
    + '<div class="adm-pane" id="pane-ops">'
    +   '<div class="grid '+(BRAND_ADMIN?'grid-3':'grid-2')+'" style="align-items:start">'
    +     '<div class="card"><div class="card-title">'+App.icon('bell')+'站内消息通知<span class="more tiny dim">默认开启 · 无需配置</span></div>'
    +       '<div class="kv">'
    +         '<span class="k">消息渠道</span><span>站内消息（唯一渠道）</span>'
    +         '<span class="k">推送内容</span><span>演练开始/继续、节点完成情况、处置得分、演练结束综合得分、系统自动考评结果</span>'
    +         '<span class="k">查看方式</span><span>点击页面右上角铃铛查看，角标数字为未读消息数</span>'
    +       '</div>'
    +       '<div class="tiny dim mt3">已取消短信、邮件模拟渠道配置；所有提醒仅在演练平台内展示，不对外发送。</div></div>'
    +     (BRAND_ADMIN ? '<div class="card"><div class="card-title danger">'+App.icon('trash')+'系统初始化<span class="more tiny dim">慎用：清空全部业务数据</span></div>'
    +       '<div id="rsStatus" class="tiny dim" style="padding:10px;background:var(--elev);border-radius:var(--r-sm);line-height:1.7">加载中…</div>'
    +       '<div class="flex gap3 mt4"><button class="btn danger" id="rsBtn" style="width:100%">'+App.icon('trash')+'重置系统为初始状态</button></div>'
    +       '<div class="tiny dim mt3" style="line-height:1.8">会清空：角色权限、账号、场景剧本、项目任务、会商/取证/台账/评分/审计日志、表单模板。<br><b style="color:var(--warn)">不会删除</b>：uploads/ 上传文件、data/backups/ 备份文件。<br>重置后当前登录态失效，需用初始密码重新登录。</div>'
    +     '</div>' : '')
    +     '<div class="card"><div class="card-title">'+App.icon('db')+'数据备份与恢复</div>'
    +       '<div class="kv"><span class="k">备份范围</span><span>全量数据库快照（账号 / 剧本 / 台账 / 审计日志 / 取证索引）</span>'
    +       '<span class="k">上次备份</span><span class="mono" id="bkLast">读取中…</span>'
    +       '<span class="k">恢复来源</span><span>从备份文件恢复（或上传 .db 文件）</span></div>'
    +       '<div class="progress mt3" id="bkProg" style="display:none"><div class="bar" id="bkBar" style="width:0%"></div></div>'
    +       '<div class="tiny dim mt2" id="bkPct"></div>'
    +       '<div class="flex gap3 mt3" style="flex-wrap:wrap">'
    +         '<button class="btn primary" id="bkBtn">'+App.icon('archive')+'立即备份</button>'
    +         '<label class="btn" id="bkUploadBtn">'+App.icon('upload')+'上传备份恢复<input type="file" id="bkFile" accept=".db" style="display:none"></label>'
    +       '</div>'
    +       '<div class="tiny dim mt3" style="color:var(--warn)">恢复将覆盖当前数据库，操作前会自动备份当前状态（安全网）。恢复后所有用户需重新登录。</div>'
    +       '<div class="mt4" style="border-top:1px solid var(--elev);padding-top:12px">'
    +         '<div class="tiny dim mb2">备份文件列表</div>'
    +         '<div id="bkList" class="bk-list"></div>'
    +       '</div>'
    +     '</div>'
    +   '</div>'
    + '</div>'
    + (BRAND_ADMIN ?
      '<div class="adm-pane" id="pane-brand">'
      + '<div class="grid grid-3">'
      + '<div class="card"><div class="card-title">'+App.icon('admin')+'系统基本信息</div>'
      +   '<div class="form-grid" style="grid-template-columns:1fr">'
      +     '<div class="form-row"><label class="f-label">系统名称 <span class="req">*</span></label><input class="input" id="bsName" maxlength="40" placeholder="如 网络安全应急演练系统"></div>'
      +     '<div class="form-row"><label class="f-label">单位名称 <span class="req">*</span></label><input class="input" id="bsUnit" maxlength="40" placeholder="如 盘州市人民医院"></div>'
      +     '<div class="form-row"><label class="f-label">系统版本</label><input class="input" id="bsVer" disabled style="background:rgba(60,70,90,.3);cursor:not-allowed" title="版本号由系统自动维护，不可手动修改"></div>'
      +   '</div>'
      +   '<div class="flex gap3 mt4"><button class="btn primary" id="bsSaveBtn" style="flex:1">'+App.icon('check')+'保存设置</button><button class="btn" id="bsResetBtn">'+App.icon('refresh')+'恢复默认</button></div>'
      +   '<div class="tiny dim mt3">保存后同步到登录页、大屏与全部业务页面。</div>'
      + '</div>'
      + '<div class="card"><div class="card-title">'+App.icon('github')+'项目仓库链接</div>'
      +   '<div class="form-grid" style="grid-template-columns:1fr">'
      +     '<div class="form-row"><label class="f-label">GitHub 项目地址</label><input class="input" id="bsGh" type="url" placeholder="https://github.com/..."></div>'
      +     '<div class="form-row"><label class="f-label">Gitee 项目地址</label><input class="input" id="bsGe" type="url" placeholder="https://gitee.com/..."></div>'
      +   '</div>'
      +   '<div class="tiny dim mt3">两个仓库地址会展示在侧边栏底部登录信息区。</div>'
      + '</div>'
      + '<div class="card"><div class="card-title">'+App.icon('building')+'单位 Logo</div>'
      +   '<div style="display:flex;flex-direction:column;gap:var(--sp3);align-items:center">'
      +     '<span class="logo" style="width:80px;height:80px;border-radius:50%;background:#fff;border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;padding:4px;overflow:hidden"><img id="bsLogo" src="img/logo.png" alt="单位 Logo" style="width:100%;height:100%;object-fit:contain;border-radius:50%"></span>'
      +     '<input class="input" type="file" id="bsLogoFile" accept="image/png,image/jpeg,image/webp,image/gif">'
      +     '<button class="btn primary" id="bsUploadBtn" style="width:100%">'+App.icon('upload')+'上传并应用</button>'
      +     '<div class="tiny dim" style="text-align:center">PNG / JPG / WebP / GIF<br>单个文件 ≤ 2MB</div>'
      +   '</div>'
      + '</div>'
      + '</div>'
      + '</div>' : '')
    + '';

  /* ---------- 页签 ---------- */
  document.querySelectorAll('#admTabs .tab').forEach(function(tab){
    tab.onclick = function(){
      document.querySelectorAll('#admTabs .tab').forEach(function(x){ x.classList.toggle('active', x===tab); });
      document.querySelectorAll('.adm-pane').forEach(function(p){ p.classList.toggle('on', p.id==='pane-'+tab.dataset.t); });
    };
  });

  /* ---------- a) 用户账号 ---------- */
  function roleTags(u){
    var rs = (u.roles && u.roles.length) ? u.roles : [u.role];
    return rs.map(function(id){ return '<span class="tag">'+App.esc(roleName(id))+'</span>'; }).join(' ');
  }
  function renderUsers(){
    document.getElementById('uBody').innerHTML = users.map(function(u,i){
      return '<tr><td class="mono">'+App.esc(u.account)+'</td><td>'+App.esc(u.name)+'</td><td>'+roleTags(u)+'</td><td class="dim">'+App.esc(u.org)+'</td><td>'+App.statusTag(u.status)+'</td>'
        + '<td><button class="btn sm" data-ed="'+i+'">编辑</button> <button class="btn sm" data-rp="'+i+'">重置密码</button> <button class="btn sm '+(u.status==='启用'?'danger':'ok')+'" data-tg="'+i+'">'+(u.status==='启用'?'停用':'启用')+'</button></td></tr>';
    }).join('');
    document.querySelectorAll('#uBody [data-ed]').forEach(function(b){
      b.onclick = function(){ openUserModal(users[+b.dataset.ed], +b.dataset.ed); };
    });
    document.querySelectorAll('#uBody [data-rp]').forEach(function(b){
      b.onclick = function(){
        var u = users[+b.dataset.rp];
        App.confirmSim('将账号「'+u.account+'」（'+u.name+'）的密码重置为初始密码 Pzy@2026？', function(){
          API.resetUserPassword(u.id, 'Pzy@2026').then(function(){
            App.toast('已重置「'+u.account+'」的密码为 Pzy@2026','ok');
          }).catch(function(e){ App.toast((e&&e.message)||'重置失败','err'); });
        });
      };
    });
    document.querySelectorAll('#uBody [data-tg]').forEach(function(b){
      b.onclick = function(){
        var u = users[+b.dataset.tg];
        var next = u.status==='启用' ? '停用' : '启用';
        App.confirmSim('将账号「'+u.account+'」（'+u.name+'）状态切换为「'+next+'」？', function(){
          API.updateUser(u.id, { status: next }).then(function(){
            u.status = next;
            renderUsers();
            App.toast('账号已'+next,'ok');
          });
        });
      };
    });
  }
  /* 新增 / 编辑账号共用弹窗（角色支持多选） */
  function openUserModal(u, idx){
    var editing = !!u;
    var cur = editing ? ((u.roles && u.roles.length) ? u.roles : [u.role]) : [];
    var roleBoxes = MOCK.ROLES.map(function(r){
      var off = (r.status||'启用') === '停用';
      return '<label class="tiny" style="display:inline-flex;align-items:center;gap:4px;margin-right:14px;margin-bottom:6px'+(off?';opacity:.55':'')+'"><input type="checkbox" class="euRole" value="'+r.id+'"'+(cur.indexOf(r.id)>=0?' checked':'')+'>'+App.esc(r.name)+(off?'（已停用）':'')+'</label>';
    }).join('');
    App.modal({ title: editing ? '编辑用户账号' : '新增用户账号', body:
      '<div class="form-grid">'
      + '<div class="form-row"><label class="f-label">账号 <span class="req">*</span></label><input class="input" id="euAcc" maxlength="32" placeholder="3-32 位字母、数字或 _ . -" value="'+(editing?App.esc(u.account):'')+'"></div>'
      + '<div class="form-row"><label class="f-label">姓名 <span class="req">*</span></label><input class="input" id="euName" placeholder="虚拟姓名" value="'+(editing?App.esc(u.name):'')+'"></div>'
      + '<div class="form-row"><label class="f-label">部门/单位</label><input class="input" id="euOrg" placeholder="如 信息科" value="'+(editing?App.esc(u.org):'信息科')+'"></div>'
      + (editing ? '<div class="form-row"><label class="f-label">状态</label><select class="select" id="euStatus"><option value="启用"'+(u.status!=='停用'?' selected':'')+'>启用</option><option value="停用"'+(u.status==='停用'?' selected':'')+'>停用</option></select></div>' : '')
      + '<div class="form-row" style="grid-column:1/-1"><label class="f-label">角色（可多选）<span class="req">*</span></label><div>'+roleBoxes+'</div><div class="tiny dim">一个账号可绑定多个角色；登录时选择其一，会话权限按所选角色生效。</div></div>'
      + '</div>',
      foot:'<button class="btn" id="euNo">取消</button><button class="btn primary" id="euYes">'+(editing?'保存修改':'创建账号')+'</button>',
      onOpen:function(ov){
        ov.querySelector('#euNo').onclick = ov.close;
        ov.querySelector('#euYes').onclick = function(){
          var acc = ov.querySelector('#euAcc').value.trim();
          var nm = ov.querySelector('#euName').value.trim();
          var org = ov.querySelector('#euOrg').value.trim() || ((DRILL.brand()||{}).unitName) || '盘州市人民医院';
          var roles = Array.prototype.slice.call(ov.querySelectorAll('.euRole:checked')).map(function(x){ return x.value; });
          if(!/^[A-Za-z0-9_.-]{3,32}$/.test(acc)){ App.toast('账号需为 3-32 位字母、数字或 _ . -','err'); return; }
          if(!nm){ App.toast('姓名必填','err'); return; }
          if(!roles.length){ App.toast('请至少选择一个角色','err'); return; }
          if(editing){
            var patch = { username:acc, name:nm, org:org, roles:roles };
            if(ov.querySelector('#euStatus')) patch.status = ov.querySelector('#euStatus').value;
            API.updateUser(u.id, patch).then(function(){
              u.account = acc; u.name = nm; u.org = org; u.roles = roles; u.role = roles[0];
              if(patch.status) u.status = patch.status;
              ov.close(); renderUsers();
              App.toast('账号「'+acc+'」已保存','ok');
            }).catch(function(e){ App.toast((e&&e.message)||'保存失败','err'); });
          }else{
            API.addUser({ username:acc, name:nm, roles:roles, org:org }).then(function(r){
              users.push({ id:r.id, account:acc, name:nm, role:roles[0], roles:roles, org:org, status:'启用' });
              ov.close(); renderUsers();
              App.toast('账号「'+acc+'」已创建，初始密码 Pzy@2026','ok');
            }).catch(function(e){ App.toast((e&&e.message)||'创建失败','err'); });
          }
        };
      } });
  }
  document.getElementById('uAddBtn').onclick = function(){ openUserModal(null, -1); };

  /* ---------- b) 权限矩阵（可编辑：模块可见性 + 角色名称/说明 + 顺序 + 停用/删除） ---------- */
  var rolesState = MOCK.ROLES.map(function(r){
    return { id:r.id, name:r.name, desc:r.desc||'', nav:(r.nav||[]).slice(), external:!!r.external, status:r.status||'启用' };
  });
  var dirtyRoles = {};

  function reorderSave(){
    API.reorderRoles(rolesState.map(function(x){ return x.id; })).then(function(){
      App.toast('角色显示顺序已保存，登录页同步生效','ok');
    }).catch(function(e){
      App.toast((e&&e.message)||'排序保存失败','err');
      API.adminRoles().then(function(list){
        if(!list || !list.length) return;
        rolesState = list.map(function(r){ return { id:r.id, name:r.name, desc:r.desc||'', nav:(r.nav||[]).slice(), external:!!r.external, status:r.status||'启用' }; });
        renderMatrix();
      }).catch(function(){});
    });
  }

  function renderMatrix(){
    document.getElementById('mxBody').innerHTML = rolesState.map(function(r,ri){
      var cells = MODS.map(function(m){
        var has = r.nav.indexOf(m[0]) >= 0;
        var locked = r.id === 'platformadmin' && m[0] === 'admin';
        return '<td><span class="mx-cell '+(has?'mx-y':'mx-n')+(locked?' mx-lock':'')+'" data-r="'+ri+'" data-m="'+m[0]+'"'
          + ' title="'+(locked?'平台管理员的「系统管理」权限不可移除':'点击'+(has?'移除':'授予')+'「'+m[1]+'」')+'">'+App.icon(has?'check':'x')+'</span></td>';
      }).join('');
      var on = (r.status||'启用') === '启用';
      return '<tr class="'+(r.external?'ext ':'')+(on?'':'mx-off')+'"><td><b>'+App.esc(r.name)+'</b> '+App.statusTag(r.status||'启用')
        + '<div class="tiny dim">'+App.esc((r.desc||'').slice(0,26))+'</div>'
        + '<div class="mt2" style="display:flex;gap:4px;flex-wrap:wrap">'
        + '<button class="btn sm" data-up="'+ri+'"'+(ri===0?' disabled':'')+'>上移</button>'
        + '<button class="btn sm" data-down="'+ri+'"'+(ri===rolesState.length-1?' disabled':'')+'>下移</button>'
        + '<button class="btn sm" data-desc="'+ri+'">编辑</button>'
        + '<button class="btn sm '+(on?'danger':'ok')+'" data-st="'+ri+'">'+(on?'停用':'启用')+'</button>'
        + '<button class="btn sm danger" data-del="'+ri+'">删除</button>'
        + '</div></td>'+cells+'</tr>';
    }).join('');

    document.querySelectorAll('#mxBody .mx-cell').forEach(function(c){
      c.onclick = function(){
        var r = rolesState[+c.dataset.r], m = c.dataset.m;
        if(r.id === 'platformadmin' && m === 'admin'){ App.toast('平台管理员的「系统管理」权限不可移除','warn'); return; }
        var i = r.nav.indexOf(m);
        if(i >= 0) r.nav.splice(i,1); else r.nav.push(m);
        dirtyRoles[r.id] = true;
        renderMatrix();
      };
    });
    document.querySelectorAll('#mxBody [data-up]').forEach(function(b){
      b.onclick = function(){ var i=+b.dataset.up; if(i<=0) return; var t=rolesState[i-1]; rolesState[i-1]=rolesState[i]; rolesState[i]=t; renderMatrix(); reorderSave(); };
    });
    document.querySelectorAll('#mxBody [data-down]').forEach(function(b){
      b.onclick = function(){ var i=+b.dataset.down; if(i>=rolesState.length-1) return; var t=rolesState[i+1]; rolesState[i+1]=rolesState[i]; rolesState[i]=t; renderMatrix(); reorderSave(); };
    });
    document.querySelectorAll('#mxBody [data-st]').forEach(function(b){
      b.onclick = function(){
        var r = rolesState[+b.dataset.st];
        var to = (r.status||'启用') === '启用' ? '停用' : '启用';
        App.modal({ title:(to==='停用'?'停用角色':'启用角色')+' · '+r.name, body:
          '<p style="font-size:13.5px">'+(to==='停用'
            ? '停用后该角色将不再出现在登录页与账号角色选择中，已用该角色登录的会话会立即失效。账号绑定关系保留，可随时重新启用。'
            : '启用后该角色将重新出现在登录页与账号角色选择中。')+'</p>',
          foot:'<button class="btn" id="stNo">取消</button><button class="btn primary" id="stYes">确认'+(to==='停用'?'停用':'启用')+'</button>',
          onOpen:function(ov){
            ov.querySelector('#stNo').onclick = ov.close;
            ov.querySelector('#stYes').onclick = function(){
              API.setRoleStatus(r.id, to).then(function(){
                r.status = to;
                var m = MOCK.ROLES.filter(function(x){ return x.id===r.id; })[0];
                if(m) m.status = to;
                ov.close(); renderMatrix();
                App.toast('角色「'+r.name+'」已'+to,'ok');
              }).catch(function(e){ App.toast((e&&e.message)||'操作失败','err'); });
            };
          } });
      };
    });
    document.querySelectorAll('#mxBody [data-del]').forEach(function(b){
      b.onclick = function(){
        var r = rolesState[+b.dataset.del];
        App.modal({ title:'删除角色 · '+r.name, body:
          '<div class="sim-banner">'+App.icon('alert')+'<span>删除后不可恢复；若仍有账号绑定该角色，需先在「用户账号」中解除绑定。</span></div>'
          + '<p style="font-size:13.5px">确认删除角色「'+App.esc(r.name)+'」？</p>',
          foot:'<button class="btn" id="rdelNo">取消</button><button class="btn danger" id="rdelYes">确认删除</button>',
          onOpen:function(ov){
            ov.querySelector('#rdelNo').onclick = ov.close;
            ov.querySelector('#rdelYes').onclick = function(){
              API.deleteRole(r.id).then(function(){
                rolesState = rolesState.filter(function(x){ return x.id!==r.id; });
                MOCK.ROLES = MOCK.ROLES.filter(function(x){ return x.id!==r.id; });
                delete dirtyRoles[r.id];
                ov.close(); renderMatrix();
                App.toast('角色「'+r.name+'」已删除','ok');
              }).catch(function(e){ App.toast((e&&e.message)||'删除失败','err'); });
            };
          } });
      };
    });
    document.querySelectorAll('#mxBody [data-desc]').forEach(function(b){
      b.onclick = function(){
        var r = rolesState[+b.dataset.desc];
        App.modal({ title:'编辑角色 · '+r.name, body:
          '<div class="form-row"><label class="f-label">角色组名称 <span class="req">*</span></label><input class="input" id="rdName" maxlength="20" value="'+App.esc(r.name)+'">'
          + '<div class="tiny dim mt2">最多 20 字，保存后同步到登录页角色卡片、账号角色标签与各页面。</div></div>'
          + '<div class="form-row"><label class="f-label">角色说明</label><textarea class="input" id="rdDesc" rows="4" maxlength="200" placeholder="简要说明该角色在演练中的职责与权限边界">'+App.esc(r.desc||'')+'</textarea>'
          + '<div class="tiny dim mt2">最多 200 字，保存权限变更后同步到登录页角色卡提示与矩阵说明。</div></div>',
          foot:'<button class="btn" id="rdNo">取消</button><button class="btn primary" id="rdYes">确定</button>',
          onOpen:function(ov){
            ov.querySelector('#rdNo').onclick = ov.close;
            ov.querySelector('#rdYes').onclick = function(){
              var nm = ov.querySelector('#rdName').value.trim();
              if(!nm){ App.toast('角色组名称不能为空','err'); return; }
              r.name = nm;
              r.desc = ov.querySelector('#rdDesc').value.trim().slice(0,200);
              dirtyRoles[r.id] = true;
              ov.close(); renderMatrix();
              App.toast('角色信息已更新，点击「保存权限变更」后生效','ok');
            };
          } });
      };
    });
  }

  document.getElementById('mxAddBtn').onclick = function(){
    var boxes = MODS.map(function(m){
      var def = (m[0]==='dashboard' || m[0]==='workbench');
      return '<label class="tiny" style="display:inline-flex;align-items:center;gap:4px;margin-right:12px;margin-bottom:6px"><input type="checkbox" class="nrMod" value="'+m[0]+'"'+(def?' checked':'')+'>'+m[1]+'</label>';
    }).join('');
    App.modal({ title:'新增角色', body:
      '<div class="form-row"><label class="f-label">角色组名称 <span class="req">*</span></label><input class="input" id="nrName" maxlength="20" placeholder="如 信息化支撑组"></div>'
      + '<div class="form-row"><label class="f-label">角色说明</label><textarea class="input" id="nrDesc" rows="3" maxlength="200" placeholder="简要说明该角色在演练中的职责与权限边界"></textarea></div>'
      + '<div class="form-row"><label class="f-label">模块可见权限</label><div>'+boxes+'</div><div class="tiny dim">可先勾选基础模块，创建后仍可在矩阵中调整。</div></div>',
      foot:'<button class="btn" id="nrNo">取消</button><button class="btn primary" id="nrYes">创建角色</button>',
      onOpen:function(ov){
        ov.querySelector('#nrNo').onclick = ov.close;
        ov.querySelector('#nrYes').onclick = function(){
          var nm = ov.querySelector('#nrName').value.trim();
          var nav = Array.prototype.slice.call(ov.querySelectorAll('.nrMod:checked')).map(function(x){ return x.value; });
          if(!nm){ App.toast('角色组名称不能为空','err'); return; }
          API.addRole({ name:nm, desc:ov.querySelector('#nrDesc').value.trim(), nav:nav }).then(function(r){
            var role = { id:r.role.id, name:r.role.name, desc:r.role.desc, nav:r.role.nav.slice(), external:false, status:'启用' };
            rolesState.push(role);
            MOCK.ROLES.push({ id:role.id, name:role.name, short:r.role.short, icon:r.role.icon, color:r.role.color, desc:role.desc, nav:role.nav.slice(), external:false, status:'启用' });
            ov.close(); renderMatrix();
            App.toast('角色「'+nm+'」已创建，可在用户账号中分配','ok');
          }).catch(function(e){ App.toast((e&&e.message)||'创建失败','err'); });
        };
      } });
  };

  document.getElementById('mxSaveBtn').onclick = function(){
    var ids = Object.keys(dirtyRoles);
    if(!ids.length){ App.toast('暂无权限变更','warn'); return; }
    var tasks = ids.map(function(id){
      var r = rolesState.filter(function(x){ return x.id===id; })[0];
      return API.updateRole(id, { name:r.name, nav:r.nav, desc:r.desc });
    });
    Promise.all(tasks).then(function(){
      dirtyRoles = {};
      DRILL.bootstrap().then(function(){ App.refreshShell(); });
      App.toast('角色权限已保存，刷新页面即对已登录账号生效','ok');
    }).catch(function(e){ App.toast((e&&e.message)||'保存失败','err'); });
  };

  renderMatrix();
  API.adminRoles().then(function(list){
    if(!list || !list.length) return;
    rolesState = list.map(function(r){ return { id:r.id, name:r.name, desc:r.desc||'', nav:(r.nav||[]).slice(), external:!!r.external, status:r.status||'启用' }; });
    renderMatrix();
  }).catch(function(){});

  /* ---------- c) 表单模板（字段可编辑：名称 / 说明 / 必填 / 控件类型 / 顺序） ---------- */
  function fldOf(x){
    if(typeof x === 'string') return { label:x, hint:'', required:true, type:'auto', options:[] };
    return {
      label:(x&&x.label)||'', hint:(x&&x.hint)||'', required:!(x&&x.required===false),
      type:(x&&x.type)||'auto',
      options:Array.isArray(x&&x.options)?x.options.slice():(typeof (x&&x.options)==='string'?x.options.split(/[、,，|｜]/).map(function(s){return s.trim();}).filter(Boolean):[])
    };
  }
  var TYPE_OPTS = [['auto','自动识别'],['text','单行文本'],['textarea','多行文本'],['select','下拉选择'],['multiselect','下拉多选'],['datetime','日期时间']];
  function typeName(t){
    for(var i=0;i<TYPE_OPTS.length;i++) if(TYPE_OPTS[i][0]===t) return TYPE_OPTS[i][1];
    return '自动识别';
  }

  function renderForms(){
    document.getElementById('fBody').innerHTML = templates.map(function(f,i){
      var nf = (f.fields||[]).map(fldOf);
      var withHint = nf.filter(function(x){ return !!x.hint; }).length;
      return '<tr><td class="mono">'+App.esc(f.id)+'</td><td>'+App.esc(f.name)+'</td><td class="mono">'+nf.length+'</td>'
        + '<td class="mono">'+(withHint?'<span class="tag green">'+withHint+'</span>':'<span class="dim">0</span>')+'</td>'
        + '<td><button class="btn sm" data-vw="'+i+'" title="查看结构">'+App.icon('eye')+'</button> <button class="btn sm primary" data-ed="'+i+'">'+App.icon('edit')+'编辑</button></td></tr>';
    }).join('');

    document.querySelectorAll('#fBody [data-vw]').forEach(function(b){
      b.onclick = function(){
        var f = templates[+b.dataset.vw], nf = (f.fields||[]).map(fldOf);
        App.drawer({ title:'模板结构 · '+f.name, body:
          '<div class="kv"><span class="k">模板编号</span><span class="mono">'+App.esc(f.id)+'</span><span class="k">模板名称</span><span>'+App.esc(f.name)+'</span><span class="k">字段数</span><span class="mono">'+nf.length+'</span></div>'
          + '<div class="section-title mt4">字段结构</div>'
          + '<table class="table"><thead><tr><th style="width:52px">序号</th><th style="width:140px">字段名</th><th>字段说明</th><th style="width:76px">必填</th><th style="width:88px">控件</th><th style="width:160px">下拉选项</th></tr></thead><tbody>'
          + nf.map(function(x,i){ return '<tr><td class="mono">'+(i+1)+'</td><td>'+App.esc(x.label)+'</td><td class="dim">'+(x.hint?App.esc(x.hint):'—')+'</td><td>'+(x.required?'<span class="tag green">必填</span>':'<span class="tag">选填</span>')+'</td><td class="dim">'+typeName(x.type)+'</td><td class="tiny dim">'+((x.type==='select'||x.type==='multiselect')?(x.options||[]).join('、'):'—')+'</td></tr>'; }).join('')
          + '</tbody></table>'
          + '<div class="tiny dim mt3">字段说明用于参演人员分步填表时的引导提示；下拉选择用于事件等级等标准化取值；日期时间控件支持选择或手动填写。可在「编辑」中逐项维护。</div>' });
      };
    });

    document.querySelectorAll('#fBody [data-ed]').forEach(function(b){
      b.onclick = function(){ openFormEdit(+b.dataset.ed); };
    });
  }

  function openFormEdit(idx){
    var f = templates[idx];
    var editFields = (f.fields||[]).map(fldOf);
    App.modal({ title:'编辑表单模板 · '+f.id, wide:true, body:
      '<div class="form-row"><label class="f-label">模板名称 <span class="req">*</span></label><input class="input" id="efName" maxlength="40" value="'+App.esc(f.name)+'"></div>'
      + '<div class="flex gap3 mt3" style="align-items:center;justify-content:space-between"><div class="f-label" style="margin:0">字段明细 <span class="tiny dim">（字段说明将展示在参演人员填表引导中）</span></div><button class="btn sm" id="efAdd">'+App.icon('plus')+'添加字段</button></div>'
      + '<div id="efRows" class="mt2"></div>',
      foot:'<button class="btn" id="efNo">取消</button><button class="btn primary" id="efYes">'+App.icon('check')+'保存模板</button>',
      onOpen:function(ov){
        var rowsEl = ov.querySelector('#efRows');
        function paint(){
          rowsEl.innerHTML = '<table class="table ef-table"><thead><tr><th style="width:38px">#</th><th style="width:140px">字段名</th><th>字段说明</th><th style="width:64px">必填</th><th style="width:100px">控件</th><th style="width:180px">下拉选项</th><th style="width:90px">操作</th></tr></thead><tbody>'
            + editFields.map(function(x,i){
                return '<tr><td class="mono">'+(i+1)+'</td>'
                  + '<td><input class="input sm" data-lab="'+i+'" maxlength="40" value="'+App.esc(x.label)+'" placeholder="字段名"></td>'
                  + '<td><input class="input sm" data-hint="'+i+'" maxlength="200" value="'+App.esc(x.hint)+'" placeholder="填写说明与注意事项"></td>'
                  + '<td><input type="checkbox" data-req="'+i+'"'+(x.required?' checked':'')+'></td>'
                  + '<td><select class="input sm" data-type="'+i+'">'+TYPE_OPTS.map(function(o){ return '<option value="'+o[0]+'"'+(x.type===o[0]?' selected':'')+'>'+o[1]+'</option>'; }).join('')+'</select></td>'
                  + '<td><input class="input sm" data-opt="'+i+'" maxlength="300" value="'+App.esc((x.options||[]).join('、'))+'" placeholder="仅下拉：选项用顿号分隔"></td>'
                  + '<td style="white-space:nowrap"><button class="btn sm" data-up="'+i+'"'+(i===0?' disabled':'')+' title="上移">↑</button><button class="btn sm" data-dn="'+i+'"'+(i===editFields.length-1?' disabled':'')+' title="下移">↓</button><button class="btn sm danger" data-rm="'+i+'" title="删除">'+App.icon('trash')+'</button></td></tr>';
              }).join('')
            + '</tbody></table>';
          rowsEl.querySelectorAll('[data-lab]').forEach(function(el){ el.oninput = function(){ editFields[+el.dataset.lab].label = el.value; }; });
          rowsEl.querySelectorAll('[data-hint]').forEach(function(el){ el.oninput = function(){ editFields[+el.dataset.hint].hint = el.value; }; });
          rowsEl.querySelectorAll('[data-req]').forEach(function(el){ el.onchange = function(){ editFields[+el.dataset.req].required = el.checked; }; });
          rowsEl.querySelectorAll('[data-type]').forEach(function(el){ el.onchange = function(){ editFields[+el.dataset.type].type = el.value; }; });
          rowsEl.querySelectorAll('[data-opt]').forEach(function(el){ el.oninput = function(){
            editFields[+el.dataset.opt].options = el.value.split(/[、,，|｜]/).map(function(s){ return s.trim(); }).filter(Boolean);
          }; });
          rowsEl.querySelectorAll('[data-up]').forEach(function(el){ el.onclick = function(){ var i=+el.dataset.up; if(i<=0) return; var t=editFields[i-1]; editFields[i-1]=editFields[i]; editFields[i]=t; paint(); }; });
          rowsEl.querySelectorAll('[data-dn]').forEach(function(el){ el.onclick = function(){ var i=+el.dataset.dn; if(i>=editFields.length-1) return; var t=editFields[i+1]; editFields[i+1]=editFields[i]; editFields[i]=t; paint(); }; });
          rowsEl.querySelectorAll('[data-rm]').forEach(function(el){ el.onclick = function(){ var i=+el.dataset.rm; if(editFields.length<=1){ App.toast('至少保留一个字段','warn'); return; } editFields.splice(i,1); paint(); }; });
        }
        paint();
        ov.querySelector('#efAdd').onclick = function(){ editFields.push({ label:'', hint:'', required:true, type:'auto', options:[] }); paint(); };
        ov.querySelector('#efNo').onclick = ov.close;
        ov.querySelector('#efYes').onclick = function(){
          var nm = ov.querySelector('#efName').value.trim();
          if(!nm){ App.toast('模板名称不能为空','err'); return; }
          var fs = [], seen = {};
          for(var i=0;i<editFields.length;i++){
            var lb = String(editFields[i].label||'').trim();
            if(!lb){ App.toast('第 '+(i+1)+' 个字段名称不能为空','err'); return; }
            if(seen[lb]){ App.toast('字段名称重复：'+lb,'err'); return; }
            seen[lb] = 1;
            var tp = editFields[i].type;
            var opts = (editFields[i].options||[]).map(function(s){ return String(s||'').trim(); }).filter(Boolean);
            var hasOptsType = tp==='select' || tp==='multiselect';
            if(hasOptsType && !opts.length){ App.toast('第 '+(i+1)+' 个字段为'+(tp==='multiselect'?'下拉多选':'下拉选择')+'，请填写选项','err'); return; }
            fs.push({ label:lb, hint:String(editFields[i].hint||'').trim(), required:editFields[i].required !== false, type:tp, options:hasOptsType?opts:[] });
          }
          if(!fs.length){ App.toast('至少保留一个字段','err'); return; }
          API.updateFormTemplate(f.id, { name:nm, fields:fs }).then(function(r){
            templates[idx] = { id:r.template.id, name:r.template.name, fields:r.template.fields };
            ov.close(); renderForms();
            App.toast('模板《'+nm+'》已保存','ok');
          }).catch(function(e){ App.toast((e&&e.message)||'保存失败','err'); });
        };
      } });
  }

  document.getElementById('fAddBtn').onclick = function(){
    App.modal({ title:'新建表单模板', wide:true, body:
      '<div class="form-row"><label class="f-label">模板名称 <span class="req">*</span></label><input class="input" id="ftName" maxlength="40" placeholder="如 恢复后业务抽查记录表"></div>'
      + '<div class="form-row"><label class="f-label">字段（每行一个，格式：字段名｜字段说明） <span class="req">*</span></label><textarea class="textarea" id="ftFields" rows="7" placeholder="填报单位｜填写本院全称&#10;抽查系统｜本次抽查覆盖的业务系统&#10;验证结果｜逐项记录验证结论&#10;填报人｜完成填报的人员姓名&#10;填报时间｜填报完成时间"></textarea></div>',
      foot:'<button class="btn" id="ftNo">取消</button><button class="btn primary" id="ftYes">创建模板</button>',
      onOpen:function(ov){
        ov.querySelector('#ftNo').onclick = ov.close;
        ov.querySelector('#ftYes').onclick = function(){
          var nm = ov.querySelector('#ftName').value.trim();
          var fs = ov.querySelector('#ftFields').value.split('\n').map(function(line){
            var parts = line.split(/[|｜]/);
            var label = (parts[0]||'').trim();
            var hint = (parts.slice(1).join('｜')||'').trim();
            return label ? { label:label, hint:hint, required:true, type:'auto' } : null;
          }).filter(Boolean);
          if(!nm || !fs.length){ App.toast('名称与字段必填','err'); return; }
          API.addFormTemplate({ name:nm, fields:fs }).then(function(r){
            templates.push({ id:r.id, name:r.name, fields:r.fields });
            ov.close(); renderForms();
            App.toast('模板「'+nm+'」已创建','ok');
          }).catch(function(e){ App.toast((e&&e.message)||'创建失败','err'); });
        };
      } });
  };

  /* ---------- d) 审计日志 ---------- */
  /* 页码窗口：总页数≤7 全显示，否则显示首尾页与当前页±2，中间以省略号连接 */
  function auditPageSeq(total, cur){
    if(total <= 7){ var all = []; for(var i=1;i<=total;i++) all.push(i); return all; }
    var out = [1];
    var start = Math.max(2, cur - 2), end = Math.min(total - 1, cur + 2);
    if(start > 2) out.push('…');
    for(var j=start;j<=end;j++) out.push(j);
    if(end < total - 1) out.push('…');
    out.push(total);
    return out;
  }
  function renderAudit(){
    var kw = document.getElementById('aKw').value.trim().toLowerCase();
    var list = auditBase.filter(function(a){
      if(!kw) return true;
      return (a.time+' '+a.user+' '+roleName(a.role)+' '+a.action).toLowerCase().indexOf(kw) >= 0;
    });
    var total = list.length;
    var pages = Math.max(1, Math.ceil(total / auditPageSize));
    if(auditPage > pages) auditPage = pages;
    if(auditPage < 1) auditPage = 1;
    var rows = list.slice((auditPage-1)*auditPageSize, auditPage*auditPageSize);
    document.getElementById('aCnt').textContent = total;
    document.getElementById('aBody').innerHTML = rows.length ? rows.map(function(a){
      return '<tr><td class="mono">'+App.esc(a.time)+'</td><td>'+App.esc(a.user)+'</td><td class="dim">'+App.esc(roleName(a.role))+'</td><td>'+App.esc(a.action)+'</td><td class="dim">'+App.esc(objOf(a.action))+'</td><td class="mono dim">'+App.esc(a.ip)+'</td></tr>';
    }).join('') : '<tr><td colspan="6"><div class="empty">'+App.icon('search')+'<div>无匹配日志</div></div></td></tr>';

    var pager = document.getElementById('aPager');
    if(!total){ pager.innerHTML = '<span class="pg-info">共 0 条</span>'; return; }
    var html = '<span class="pg-info">第 '+auditPage+' / '+pages+' 页 · 共 '+total+' 条</span>'
      + '<button class="btn sm" data-pg="'+(auditPage-1)+'"'+(auditPage<=1?' disabled':'')+'>上一页</button>';
    auditPageSeq(pages, auditPage).forEach(function(p){
      html += p==='…'
        ? '<span class="pg-ellipsis">…</span>'
        : '<button class="btn sm'+(p===auditPage?' primary':'')+'" data-pg="'+p+'">'+p+'</button>';
    });
    html += '<button class="btn sm" data-pg="'+(auditPage+1)+'"'+(auditPage>=pages?' disabled':'')+'>下一页</button>';
    pager.innerHTML = html;
    pager.querySelectorAll('[data-pg]').forEach(function(b){
      b.onclick = function(){
        auditPage = Number(b.dataset.pg) || 1;
        renderAudit();
      };
    });
  }
  document.getElementById('aKw').addEventListener('input', function(){ auditPage = 1; renderAudit(); });
  document.getElementById('aPageSize').addEventListener('change', function(){
    auditPageSize = Number(this.value) || 10;
    auditPage = 1;
    renderAudit();
  });

  /* ---------- e) 数据备份与恢复 ---------- */
  document.getElementById('bkBtn').onclick = function(){
    App.confirmSim('立即将演练数据库备份到服务器 data/backups 目录？', function(){
      var prog = document.getElementById('bkProg'), bar = document.getElementById('bkBar'), pctEl = document.getElementById('bkPct');
      prog.style.display = ''; bar.style.width = '30%'; pctEl.textContent = '正在备份：演练数据库 / 取证索引 / 审计日志…';
      API.backupData().then(function(r){
        bar.style.width = '100%';
        pctEl.textContent = '备份完成：'+r.file+'（'+Math.round((r.size||0)/1024)+' KB，'+r.time+'）';
        App.toast('数据备份完成：'+r.file,'ok');
        renderBackupList();
        loadLastBackup();
      }).catch(function(e){
        bar.style.width = '0%';
        pctEl.textContent = '备份失败：'+((e&&e.message)||'请检查目录写入权限');
      });
    });
  };

  /* 上传 .db 备份文件恢复 */
  var bkFileInput = document.getElementById('bkFile');
  if (bkFileInput) {
    bkFileInput.addEventListener('change', function(e){
      var file = this.files && this.files[0];
      if (!file) return;
      if (!/\.db$/i.test(file.name)) {
        App.toast('请选择 .db 格式的备份文件','err');
        this.value = ''; return;
      }
      App.confirmSim(
        '确认从上传的备份文件恢复？<br><b>'+file.name+'</b>（'+Math.round(file.size/1024)+' KB）<br><br>当前数据库将被替换为此备份版本。恢复前会自动创建当前数据库的备份。恢复后所有用户需重新登录。',
        function(){
          var prog = document.getElementById('bkProg'), bar = document.getElementById('bkBar'), pctEl = document.getElementById('bkPct');
          prog.style.display = ''; bar.style.width = '20%'; pctEl.textContent = '正在上传备份文件…';
          var fd = new FormData(); fd.append('file', file);
          API.restoreFromUpload(fd).then(function(r){
            bar.style.width = '100%';
            pctEl.textContent = '恢复成功：'+r.file+'（安全网：'+r.preBackup+'）';
            App.toast('恢复成功，请重新登录','ok');
            setTimeout(function(){ location.href='index.html'; }, 1500);
          }).catch(function(err){
            bar.style.width = '0%';
            pctEl.textContent = '恢复失败：'+((err&&err.message)||'请检查文件完整性');
          });
        }
      );
      this.value = '';
    });
  }

  function loadLastBackup(){
    API.listBackups().then(function(list){
      var el = document.getElementById('bkLast');
      if(el) el.textContent = list.length ? (list[0].time+'（'+list[0].file+'）') : '暂无备份';
    }).catch(function(){ var el=document.getElementById('bkLast'); if(el) el.textContent='暂无备份'; });
  }

  function renderBackupList(){
    var el = document.getElementById('bkList');
    if (!el) return;
    API.listBackups().then(function(list){
      if (!list.length) { el.innerHTML = '<div class="tiny dim">暂无备份文件。点击「立即备份」创建第一个。</div>'; return; }
      el.innerHTML = list.map(function(b){
        var sz = b.size < 1024 ? b.size+' B' : b.size < 1024*1024 ? Math.round(b.size/1024)+' KB' : (b.size/1024/1024).toFixed(1)+' MB';
        return '<div class="bk-item" data-file="'+App.esc(b.file)+'">'
          + '<span class="mono" style="font-size:12px;word-break:break-all">'+App.esc(b.file)+'</span>'
          + '<span class="tiny dim">'+b.time+' · '+sz+'</span>'
          + '<div class="bk-actions">'
          +   '<button class="btn tiny" data-act="restore">'+App.icon('refresh')+'恢复</button>'
          +   '<button class="btn tiny" data-act="dl">'+App.icon('download')+'下载</button>'
          +   '<button class="btn tiny danger" data-act="del">'+App.icon('trash')+'删</button>'
          + '</div></div>';
      }).join('');

      el.querySelectorAll('.bk-item').forEach(function(row){
        var file = row.getAttribute('data-file');
        row.querySelector('[data-act="restore"]').onclick = function(){
          App.confirmSim(
            '确认从备份文件恢复？<br><b>'+App.esc(file)+'</b><br><br>当前数据库将被替换为此备份版本。恢复前会自动创建当前数据库的备份。恢复后所有用户需重新登录。',
            function(){
              var prog = document.getElementById('bkProg'), bar = document.getElementById('bkBar'), pctEl = document.getElementById('bkPct');
              prog.style.display = ''; bar.style.width = '20%'; pctEl.textContent = '正在恢复 '+file+'…';
              API.restoreFromBackup(file).then(function(r){
                bar.style.width = '100%';
                pctEl.textContent = '恢复成功：'+r.file+'（安全网：'+r.preBackup+'）';
                App.toast('恢复成功，请重新登录','ok');
                setTimeout(function(){ location.href='index.html'; }, 1500);
              }).catch(function(err){
                bar.style.width = '0%';
                pctEl.textContent = '恢复失败：'+((err&&err.message)||'操作失败');
              });
            }
          );
        };
        row.querySelector('[data-act="dl"]').onclick = function(){
          window.location.href = '/api/admin/backups/'+encodeURIComponent(file);
        };
        row.querySelector('[data-act="del"]').onclick = function(){
          App.confirmSim('确认删除备份文件？<br><b>'+App.esc(file)+'</b>', function(){
            API.deleteBackup(file).then(function(){
              App.toast('已删除','ok');
              renderBackupList();
              loadLastBackup();
            });
          });
        };
      });
    }).catch(function(err){
      el.innerHTML = '<div class="tiny dim">加载失败：'+((err&&err.message)||err)+'</div>';
    });
  }

  /* ---------- f) 系统设置（仅平台管理员） ---------- */
  var BRAND_DEFAULTS = {
    systemName:'网络安全应急演练系统', unitName:'盘州市人民医院', logo:'img/logo.png',
    github:'https://github.com/chenjinxiang1980/cyber-drill', gitee:'https://gitee.com/habeas/cyber-drill'
  };
  var brandLogoUrl = 'img/logo.png';

  function fillBrandForm(b){
    b = b || {};
    document.getElementById('bsName').value = b.systemName || '';
    document.getElementById('bsUnit').value = b.unitName || '';
    document.getElementById('bsVer').value = b.version || '';
    document.getElementById('bsGh').value = b.github || '';
    document.getElementById('bsGe').value = b.gitee || '';
    brandLogoUrl = b.logo || 'img/logo.png';
    document.getElementById('bsLogo').src = brandLogoUrl;
  }

  function initBrand(){
    var cached = DRILL.brand();
    if(cached) fillBrandForm(cached);
    DRILL.loadBrand().then(function(b){ if(b) fillBrandForm(b); });

    document.getElementById('bsUploadBtn').onclick = function(){
      var input = document.getElementById('bsLogoFile');
      var f = input.files && input.files[0];
      if(!f){ App.toast('请先选择 Logo 图片','warn'); return; }
      if(f.size > 2*1024*1024){ App.toast('Logo 文件不能超过 2MB','err'); return; }
      var fd = new FormData(); fd.append('file', f);
      API.uploadBrandLogo(fd).then(function(r){
        brandLogoUrl = r.url;
        document.getElementById('bsLogo').src = r.url;
        App.toast('Logo 已上传，点击「保存设置」后同步到全站','ok');
      }).catch(function(e){ App.toast((e&&e.message)||'Logo 上传失败','err'); });
    };

    document.getElementById('bsSaveBtn').onclick = function(){
      var payload = {
        systemName: document.getElementById('bsName').value.trim(),
        unitName: document.getElementById('bsUnit').value.trim(),
        logo: brandLogoUrl,
        github: document.getElementById('bsGh').value.trim(),
        gitee: document.getElementById('bsGe').value.trim()
      };
      if(!payload.systemName || !payload.unitName){ App.toast('系统名称与单位名称必填','err'); return; }
      if(payload.github && !/^https?:\/\//i.test(payload.github)){ App.toast('GitHub 地址必须以 http(s):// 开头','err'); return; }
      if(payload.gitee && !/^https?:\/\//i.test(payload.gitee)){ App.toast('Gitee 地址必须以 http(s):// 开头','err'); return; }
      API.saveBrand(payload).then(function(r){
        var b = r.brand || payload;
        fillBrandForm(b);
        DRILL.applyBrand(b);
        DRILL.loadBrand().then(function(nb){ if(nb) DRILL.applyBrand(nb); });
        App.refreshShell();
        App.toast('系统设置已保存，并同步到全站页面','ok');
      }).catch(function(e){ App.toast((e&&e.message)||'保存失败','err'); });
    };

    document.getElementById('bsResetBtn').onclick = function(){
      fillBrandForm(BRAND_DEFAULTS);
      App.toast('已恢复默认值（点击「保存设置」后生效）','warn');
    };
  }

  /* ---------- g) 系统重置（仅平台管理员） ---------- */
  function initReset(){
    var btn = document.getElementById('rsBtn');
    var statusEl = document.getElementById('rsStatus');
    function refreshStatus(){
      API.getSystemStatus().then(function(s){
        if(!s){ statusEl.textContent = '无法获取状态'; return; }
        var c = s.counts || {};
        var t = s.initializedAt ? new Date(Number(s.initializedAt)*1000).toLocaleString('zh-CN') : '（未初始化）';
        statusEl.innerHTML =
          '初始化时间：'+App.esc(t)+' &nbsp;|&nbsp; '
          +'活动项目：'+App.esc(s.activeProject||'—')+' &nbsp;|&nbsp; '
          +'角色 <b>'+(c.roles||0)+'</b> · 用户 <b>'+(c.users||0)+'</b> · 场景 <b>'+(c.scenarios||0)+'</b> · 项目 <b>'+(c.projects||0)+'</b>'
          +' · 剧本节点 <b>'+(c.script_nodes||0)+'</b> · 表单 <b>'+(c.form_templates||0)+'</b> · 知识库 <b>'+(c.knowledge||0)+'</b>';
      }).catch(function(){ statusEl.textContent = '状态获取失败'; });
    }
    refreshStatus();
    btn.onclick = function(){
      App.modal({
        title: '⚠️ 即将执行系统重置',
        body:
          '<div style="line-height:1.9">'
          +'<div style="margin-bottom:10px;font-weight:600;color:var(--red)">以下数据将被清空并恢复到初始基线：</div>'
          +'<div>✅ 11 个角色权限矩阵</div>'
          +'<div>✅ 11 个内置账号（admin / yuanzhang / liming …）</div>'
          +'<div>✅ 8 类演练场景（S01–S08）与全部剧本节点</div>'
          +'<div>✅ 示例项目、任务编排</div>'
          +'<div>✅ 所有会商记录、取证材料、台账、评分、审计日志</div>'
          +'<div>✅ 内置表单模板（F1–F8）</div>'
          +'<div style="margin-top:12px;color:var(--green)">不会删除：uploads/ 上传文件、data/backups/ 数据库备份</div>'
          +'<div style="margin-top:12px;color:var(--red)">⚠️ 重置后当前登录态将失效，需用初始密码 <code>Pzy@2026</code> 重新登录</div>'
          +'</div>',
        footer: '<button class="btn" id="rsCancel">取消</button><button class="btn danger" id="rsConfirm">确认重置</button>',
        onOpen: function(m){
          m.querySelector('#rsCancel').onclick = function(){ m.remove(); };
          m.querySelector('#rsConfirm').onclick = function(){
            var b = m.querySelector('#rsConfirm');
            b.disabled = true; b.textContent = '重置中…';
            API.resetSystem().then(function(r){
              m.remove();
              App.toast('系统已重置为初始基线，即将跳转登录页…','ok');
              setTimeout(function(){ DRILL.logout(); }, 1500);
            }).catch(function(e){
              m.remove();
              refreshStatus();
              App.toast((e&&e.message)||'重置失败','err');
            });
          };
        }
      });
    };
  }


  renderUsers(); renderForms(); renderAudit(); loadLastBackup(); renderBackupList();
  if(BRAND_ADMIN){ initBrand(); initReset(); }
});
App.boot('admin');
</script>
