<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>系统基础管理 · 示例医院网络安全应急演练系统</title>
<link rel="icon" type="image/png" href="img/logo.png">
<link rel="stylesheet" href="styles.css?v=20261104b">
<style>
.mx-y{color:var(--ok);display:inline-flex} .mx-y svg{width:15px;height:15px}
.mx-n{color:var(--text3);opacity:.45;display:inline-flex} .mx-n svg{width:14px;height:14px}
table.mx-table th, table.mx-table td{padding:8px 10px;text-align:center}
table.mx-table th{white-space:normal;font-size:11px;line-height:1.3;min-width:62px;vertical-align:bottom}
table.mx-table td:first-child, table.mx-table th:first-child{text-align:left;white-space:nowrap;min-width:196px}
.mx-off td, .mx-off td b{opacity:.6}
.mx-off .mx-cell{opacity:.4}
.mx-cell{cursor:pointer;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;padding:2px;transition:.15s}
.mx-cell:hover{background:var(--elev2)}
.mx-cell.mx-lock{cursor:not-allowed;opacity:.7}
tr.ext td{background:rgba(210,153,34,.07)}
.adm-pane{display:none} .adm-pane.on{display:block}

/* ===== 权限矩阵：双方向粘性锁定 ===== */
#pane-matrix .table-wrap{max-height:calc(100vh - 320px);max-height:calc(100dvh - 320px);overflow:auto}
table.mx-table thead th{position:sticky;top:0;z-index:10;background:var(--elev);box-shadow:0 1px 0 var(--border)}
table.mx-table th:first-child,
table.mx-table td:first-child{position:sticky;left:0;z-index:5;background:var(--panel);box-shadow:1px 0 0 var(--border)}
table.mx-table thead th:first-child{z-index:20;background:var(--elev);box-shadow:1px 1px 0 var(--border)}
table.mx-table tr.ext td:first-child{background:rgba(210,153,34,.07)}
table.mx-table tr:hover td:first-child{background:var(--hover)}
table.mx-table tr.ext:hover td:first-child{background:rgba(210,153,34,.14)}

/* ===== 字典编辑器（业务字典 / 通知模板 / 会商频道） ===== */
#admTabs{flex-wrap:wrap}
.dict-mini-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:var(--sp3)}
.dict-mini-tabs .tab{padding:5px 12px;font-size:12px;border-radius:var(--r-sm);border:1px solid var(--border2);background:var(--elev);margin-bottom:0}
.dict-mini-tabs .tab:hover{border-color:var(--accent)}
.dict-mini-tabs .tab.on{background:var(--accent-dim);border-color:var(--accent);color:#fff}
.dict-edit-area{padding:var(--sp4);background:var(--bg);border-radius:var(--r-sm);min-height:120px;border:1px solid var(--border)}
.dict-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.dict-hint{font-size:12px;color:var(--text3);padding:8px 12px;background:rgba(88,166,255,.06);border-left:2px solid var(--info);border-radius:4px;margin-bottom:12px;line-height:1.7}
.dict-sub-card{padding:12px;margin-bottom:10px;border:1px solid var(--border);border-radius:var(--r-sm)}
.nt-ev-name{font-size:11px;color:var(--text3);background:var(--elev);padding:2px 8px;border-radius:10px;font-weight:400}
.nt-var-chips{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin:2px 0 8px 56px}
.nt-var-chips .btn{font-size:11px;padding:2px 8px;line-height:1.6}
.nt-var-chips .nt-lbl{font-size:11px;color:var(--text3);margin-right:2px}

</style>
</head>
<body data-page="admin">
<script src="system.js"></script><script src="app.js"></script><script src="api.js"></script>

    +   '<div class="tab" data-t="ops">'+App.icon('db')+'通知与备份</div>'

    +     '<span class="more" style="display:flex;gap:8px;align-items:center">'
    +       '<button class="btn sm danger" id="uCleanBtn">'+App.icon('trash')+'清理测试账号</button>'

    +       '<button class="btn sm" id="uAddBtn" style="white-space:nowrap">'+App.icon('plus')+'新增用户</button>'

    +   '</div>'
    +   '<div class="table-wrap"><table class="table"><thead><tr><th>账号</th><th>姓名</th><th>角色</th><th>部门/单位</th><th>状态</th><th>操作</th></tr></thead><tbody id="uBody"></tbody></table></div></div>'

    +   '<div class="table-wrap"><table class="table"><thead><tr><th>编号</th><th>模板名称</th><th>字段数</th><th>已配置说明</th><th>操作</th></tr></thead><tbody id="fBody"></tbody></table></div></div>'

    + '</div>'
    + '<div class="adm-pane" id="pane-audit">'
    +   '<div class="sim-banner" style="border-color:rgba(248,81,73,.5);color:var(--err);background:var(--err-dim)">'+App.icon('lock')+'<span><b>日志仅可查看，不可删除修改（防篡改）。</b>本模块不提供任何删除/编辑入口，导出留痕同样写入审计。</span></div>'
    +   '<div class="card"><div class="card-title">'+App.icon('eye')+'审计日志<span class="more">共 <span id="aCnt" class="mono">0</span> 条</span></div>'
    +   '<div class="filters" style="margin-bottom:12px"><input class="input grow" id="aKw" placeholder="搜索用户 / 操作 / 时间…"><span class="tiny dim" style="white-space:nowrap">每页</span><select class="select" id="aPageSize" style="width:auto;min-width:96px" title="每页显示条数"><option value="10" selected>10 条</option><option value="20">20 条</option><option value="50">50 条</option><option value="100">100 条</option></select></div>'
    +   '<div class="table-wrap"><table class="table"><thead><tr><th>时间</th><th>用户</th><th>角色</th><th>操作</th><th>对象</th><th>IP</th></tr></thead><tbody id="aBody"></tbody></table></div>'
    +   '<div class="pager" id="aPager"></div></div>'
    + '</div>'
    + '<div class="adm-pane" id="pane-ops">'
    +   '<div class="grid '+(BRAND_ADMIN?'grid-3':'grid-2')+'" style="align-items:start">'
    +     '<div class="card"><div class="card-title">'+App.icon('bell')+'站内消息通知<span class="more tiny dim">默认开启 · 无需配置</span></div>'
    +       '<div class="kv">'
    +         '<span class="k">消息渠道</span><span>站内消息（唯一渠道）</span>'
    +         '<span class="k">推送内容</span><span>演练开始/继续、节点完成情况、处置得分、演练结束综合得分、系统自动考评结果</span>'
    +         '<span class="k">查看方式</span><span>点击页面右上角铃铛查看，角标数字为未读消息数</span>'
    +       '</div>'
    +       '<div class="tiny dim mt3">已取消短信、邮件模拟渠道配置；所有提醒仅在演练平台内展示，不对外发送。</div></div>'
    +     (BRAND_ADMIN ? '<div class="card"><div class="card-title danger">'+App.icon('trash')+'系统初始化<span class="more tiny dim">慎用：清空全部业务数据</span></div>'
    +       '<div id="rsStatus" class="tiny dim" style="padding:10px;background:var(--elev);border-radius:var(--r-sm);line-height:1.7">加载中…</div>'
    +       '<div class="flex gap3 mt4"><button class="btn danger" id="rsBtn" style="width:100%">'+App.icon('trash')+'重置系统为初始状态</button></div>'
    +       '<div class="tiny dim mt3" style="line-height:1.8">会清空：角色权限、账号、场景剧本、项目任务、会商/取证/台账/评分/审计日志、表单模板。<br><b style="color:var(--warn)">不会删除</b>：uploads/ 上传文件、data/backups/ 备份文件。<br>重置后当前登录态失效，需用初始密码重新登录。</div>'
    +     '</div>' : '')
    +     '<div class="card"><div class="card-title">'+App.icon('db')+'数据备份与恢复</div>'
    +       '<div class="kv"><span class="k">备份范围</span><span>全量数据库快照（账号 / 剧本 / 台账 / 审计日志 / 取证索引）</span>'
    +       '<span class="k">上次备份</span><span class="mono" id="bkLast">读取中…</span>'
    +       '<span class="k">恢复来源</span><span>从备份文件恢复（或上传 .db 文件）</span></div>'
    +       '<div class="progress mt3" id="bkProg" style="display:none"><div class="bar" id="bkBar" style="width:0%"></div></div>'
    +       '<div class="tiny dim mt2" id="bkPct"></div>'
    +       '<div class="flex gap3 mt3" style="flex-wrap:wrap">'
    +         '<button class="btn primary" id="bkBtn">'+App.icon('archive')+'立即备份</button>'
    +         '<label class="btn" id="bkUploadBtn">'+App.icon('upload')+'上传备份恢复<input type="file" id="bkFile" accept=".db" style="display:none"></label>'
    +       '</div>'
    +       '<div class="tiny dim mt3" style="color:var(--warn)">恢复将覆盖当前数据库，操作前会自动备份当前状态（安全网）。恢复后所有用户需重新登录。</div>'
    +       '<div class="mt4" style="border-top:1px solid var(--elev);padding-top:12px">'
    +         '<div class="tiny dim mb2">备份文件列表</div>'
    +         '<div id="bkList" class="bk-list"></div>'
    +       '</div>'
    +     '</div>'
    +   '</div>'
    + (BRAND_ADMIN ? '<div class="card mt4" id="ntCard"><div class="card-title">'+App.icon('bell')+'站内消息模板<span class="more tiny dim">8 种系统事件 · {变量} 发送时替换</span></div>'
        + '<div id="ntBox"><span class="tiny dim">加载中…</span></div></div>' : '')
    + '</div>'
    + (BRAND_ADMIN ?
      '<div class="adm-pane" id="pane-dict">'
      + '<div class="card"><div class="card-title">'+App.icon('file')+'业务字典<span class="more tiny dim">前端下拉与枚举的唯一真源 · 修改后保存即生效</span></div>'
      +   '<div class="dict-mini-tabs" id="bdTabs"></div>'
      +   '<div class="dict-edit-area" id="bdBox"><span class="tiny dim">加载中…</span></div>'
      + '</div>'
      + '</div>' : '')
    + (BRAND_ADMIN ?
      '<div class="adm-pane" id="pane-brand">'
      + '<div class="grid grid-3">'
      + '<div class="card"><div class="card-title">'+App.icon('admin')+'系统基本信息</div>'
      +   '<div class="form-grid" style="grid-template-columns:1fr">'
      +     '<div class="form-row"><label class="f-label">系统名称 <span class="req">*</span></label><input class="input" id="bsName" maxlength="40" placeholder="如 网络安全应急演练系统"></div>'
      +     '<div class="form-row"><label class="f-label">单位名称 <span class="req">*</span></label><input class="input" id="bsUnit" maxlength="40" placeholder="如 示例医院"></div>'
      +     '<div class="form-row"><label class="f-label">系统版本</label><input class="input" id="bsVer" disabled style="background:rgba(60,70,90,.3);cursor:not-allowed" title="版本号由系统自动维护，不可手动修改"></div>'
      +   '</div>'
      +   '<div class="flex gap3 mt4"><button class="btn primary" id="bsSaveBtn" style="flex:1">'+App.icon('check')+'保存设置</button><button class="btn" id="bsResetBtn">'+App.icon('refresh')+'恢复默认</button></div>'
      +   '<div class="tiny dim mt3">保存后同步到登录页、大屏与全部业务页面。</div>'
      + '</div>'

      +   '<div class="form-grid" style="grid-template-columns:1fr">'
      +     '<div class="form-row"><label class="f-label">GitHub 项目地址</label><input class="input" id="bsGh" type="url" placeholder="https://github.com/..."></div>'

      +   '</div>'
      +   '<div class="tiny dim mt3">两个仓库地址会展示在侧边栏底部登录信息区。</div>'

      +     '<button class="btn primary" id="bsUploadBtn" style="width:100%">'+App.icon('upload')+'上传并应用</button>'

  /* ---------- 页签 ---------- */
  function showTab(name){
    var pane = document.getElementById('pane-'+name);
    if(!pane) return false;
    document.querySelectorAll('#admTabs .tab').forEach(function(x){ x.classList.toggle('active', x.dataset.t===name); });
    document.querySelectorAll('.adm-pane').forEach(function(p){ p.classList.toggle('on', p.id==='pane-'+name); });
    return true;
  }
  document.querySelectorAll('#admTabs .tab').forEach(function(tab){
    tab.onclick = function(){ showTab(tab.dataset.t); };
  });
  if(/^#(users|matrix|forms|audit|ops|dict|brand)$/.test(location.hash)){ showTab(location.hash.slice(1)); }

  /* ---------- a) 用户账号 ---------- */
  function roleTags(u){
    var rs = (u.roles && u.roles.length) ? u.roles : [u.role];
    return rs.map(function(id){ return '<span class="tag">'+App.esc(roleName(id))+'</span>'; }).join(' ');
  }
  function renderUsers(){
    document.getElementById('uBody').innerHTML = users.map(function(u,i){
      return '<tr><td class="mono">'+App.esc(u.account)+'</td><td>'+App.esc(u.name)+'</td><td>'+roleTags(u)+'</td><td class="dim">'+App.esc(u.org)+'</td><td>'+App.statusTag(u.status)+'</td>'
        + '<td><button class="btn sm" data-ed="'+i+'">编辑</button> <button class="btn sm" data-rp="'+i+'">重置密码</button> <button class="btn sm '+(u.status==='启用'?'danger':'ok')+'" data-tg="'+i+'">'+(u.status==='启用'?'停用':'启用')+'</button></td></tr>';
    }).join('');
    document.querySelectorAll('#uBody [data-ed]').forEach(function(b){
      b.onclick = function(){ openUserModal(users[+b.dataset.ed], +b.dataset.ed); };
    });
    document.querySelectorAll('#uBody [data-rp]').forEach(function(b){
      b.onclick = function(){
        var u = users[+b.dataset.rp];
        App.confirmSim('将账号「'+u.account+'」（'+u.name+'）的密码重置为初始密码？', function(){
          API.resetUserPassword(u.id).then(function(){
            App.toast('已重置「'+u.account+'」的密码（新密码请从 .env 查看 DRILL_INIT_PWD）','ok');
          }).catch(function(e){ App.toast((e&&e.message)||'重置失败','err'); });
        });
      };
    });
    document.querySelectorAll('#uBody [data-tg]').forEach(function(b){
      b.onclick = function(){
        var u = users[+b.dataset.tg];
        var next = u.status==='启用' ? '停用' : '启用';
        App.confirmSim('将账号「'+u.account+'」（'+u.name+'）状态切换为「'+next+'」？', function(){
          API.updateUser(u.id, { status: next }).then(function(){
            u.status = next;
            renderUsers();
            App.toast('账号已'+next,'ok');
          });
        });
      };
    });
  }
  /* 新增 / 编辑账号共用弹窗（角色支持多选） */
  function openUserModal(u, idx){
    var editing = !!u;
    var cur = editing ? ((u.roles && u.roles.length) ? u.roles : [u.role]) : [];
    var roleBoxes = MOCK.ROLES.map(function(r){
      var off = (r.status||'启用') === '停用';
      return '<label class="tiny" style="display:inline-flex;align-items:center;gap:4px;margin-right:14px;margin-bottom:6px'+(off?';opacity:.55':'')+'"><input type="checkbox" class="euRole" value="'+r.id+'"'+(cur.indexOf(r.id)>=0?' checked':'')+'>'+App.esc(r.name)+(off?'（已停用）':'')+'</label>';

      '<div class="form-grid">'
      + '<div class="form-row"><label class="f-label">账号 <span class="req">*</span></label><input class="input" id="euAcc" maxlength="32" placeholder="3-32 位字母、数字或 _ . -" value="'+(editing?App.esc(u.account):'')+'"></div>'
      + '<div class="form-row"><label class="f-label">姓名 <span class="req">*</span></label><input class="input" id="euName" placeholder="虚拟姓名" value="'+(editing?App.esc(u.name):'')+'"></div>'
      + '<div class="form-row"><label class="f-label">部门/单位</label><input class="input" id="euOrg" placeholder="如 信息科" value="'+(editing?App.esc(u.org):'信息科')+'"></div>'
      + (editing ? '<div class="form-row"><label class="f-label">状态</label><select class="select" id="euStatus"><option value="启用"'+(u.status!=='停用'?' selected':'')+'>启用</option><option value="停用"'+(u.status==='停用'?' selected':'')+'>停用</option></select></div>' : '')
      + '<div class="form-row" style="grid-column:1/-1"><label class="f-label">角色（可多选）<span class="req">*</span></label><div>'+roleBoxes+'</div><div class="tiny dim">一个账号可绑定多个角色；登录时选择其一，会话权限按所选角色生效。</div></div>'
      + '</div>',
      foot:'<button class="btn" id="euNo">取消</button><button class="btn primary" id="euYes">'+(editing?'保存修改':'创建账号')+'</button>',
      onOpen:function(ov){
        ov.querySelector('#euNo').onclick = ov.close;
        ov.querySelector('#euYes').onclick = function(){
          var acc = ov.querySelector('#euAcc').value.trim();
          var nm = ov.querySelector('#euName').value.trim();
          var org = ov.querySelector('#euOrg').value.trim() || ((DRILL.brand()||{}).unitName) || '示例医院';
          var roles = Array.prototype.slice.call(ov.querySelectorAll('.euRole:checked')).map(function(x){ return x.value; });
          if(!/^[A-Za-z0-9_.-]{3,32}$/.test(acc)){ App.toast('账号需为 3-32 位字母、数字或 _ . -','err'); return; }
          if(!nm){ App.toast('姓名必填','err'); return; }
          if(!roles.length){ App.toast('请至少选择一个角色','err'); return; }
          if(editing){
            var patch = { username:acc, name:nm, org:org, roles:roles };
            if(ov.querySelector('#euStatus')) patch.status = ov.querySelector('#euStatus').value;
            API.updateUser(u.id, patch).then(function(){
              u.account = acc; u.name = nm; u.org = org; u.roles = roles; u.role = roles[0];
              if(patch.status) u.status = patch.status;
              ov.close(); renderUsers();
              App.toast('账号「'+acc+'」已保存','ok');
            }).catch(function(e){ App.toast((e&&e.message)||'保存失败','err'); });
          }else{
            API.addUser({ username:acc, name:nm, roles:roles, org:org }).then(function(r){
              users.push({ id:r.id, account:acc, name:nm, role:roles[0], roles:roles, org:org, status:'启用' });
              ov.close(); renderUsers();
              App.toast('账号「'+acc+'」已创建，初始密码见 .env 的 DRILL_INIT_PWD','ok');
            }).catch(function(e){ App.toast((e&&e.message)||'创建失败','err'); });

      } });

  document.getElementById('uAddBtn').onclick = function(){ openUserModal(null, -1); };

  /* ---------- 清理测试账号 ---------- */
  document.getElementById('uCleanBtn').onclick = function(){
    var btn = document.getElementById('uCleanBtn');
    btn.disabled = true; var prev = btn.textContent; btn.textContent = '加载中…';
    DRILL.post('/admin/users/cleanup-test-accounts', { dryRun: true }).then(function(data){
      btn.disabled = false; btn.innerHTML = prev;
      openCleanupModal(data);
    }).catch(function(e){
      btn.disabled = false; btn.innerHTML = prev;
      App.modal({ title:'清理测试账号',
        body:'<div class="tiny dim">无法获取预览：'+App.esc((e&&e.message)||'未知错误')+'</div>',
        foot:'<button class="btn primary" id="cuClose">关闭</button>',
        onOpen:function(ov){ ov.querySelector('#cuClose').onclick = ov.close; } });
    });
  };
  function openCleanupModal(data){
    var removable = (data && data.removable) || [];
    var kept = (data && data.keptCount) !== undefined ? data.keptCount : null;

    if(!removable.length){
      App.modal({ title:'清理测试账号',
        body:'<div style="text-align:center;padding:24px 8px">'
        +'<div style="font-size:32px;margin-bottom:8px">✓</div>'
        +'<div style="font-size:14px;color:var(--tx)">没有可删除的测试账号</div>'
        +(kept !== null ? '<div class="tiny dim mt3">当前共有 '+((data&&data.usersCount)||'?')+' 个账号，其中基线 '+kept+' 个</div>' : '')
        +'</div>',
        foot:'<button class="btn primary" id="cuNo">关闭</button>',
        onOpen:function(ov){ ov.querySelector('#cuNo').onclick = ov.close; } });
      return;
    }

    var rows = removable.map(function(a){
      return '<tr><td class="mono">'+App.esc(a.username)+'</td><td>'+roleName(a.roleId)+'</td></tr>';
    }).join('');
    var bodyHtml =
      '<div class="tiny dim sim-banner" style="margin-bottom:10px">'+App.icon('alert')+'<span>这是预览，尚未删除。确认执行后将永久删除以下 '+removable.length+' 个测试账号。</span></div>'
      +'<div class="tiny dim">共 <b class="mono">'+((data&&data.usersCount)||'?')+'</b> 个账号，其中基线 <b class="mono">'+(kept!==null?kept:'?')+'</b> 个将被保留。</div>'
      +'<div class="table-wrap mt3"><table class="table tiny"><thead><tr><th>账号</th><th>角色</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
      +'<div class="form-row mt3" style="gap:8px"><label style="display:inline-flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" id="cuConfirm"> <span>我已确认，这些账号将被永久删除</span></label></div>';

    App.modal({ title:'清理测试账号 · 预览', wide:true, body:bodyHtml,
      foot:'<button class="btn" id="cuNo">取消</button>'
          +'<button class="btn danger" id="cuGo" disabled>'+App.icon('trash')+'执行清理</button>',
      onOpen:function(ov){
        var yes = ov.querySelector('#cuConfirm'), go = ov.querySelector('#cuGo');
        yes.onchange = function(){ go.disabled = !yes.checked; };
        ov.querySelector('#cuNo').onclick = ov.close;
        go.onclick = function(){
          go.disabled = true; go.textContent = '正在执行…';
          DRILL.post('/admin/users/cleanup-test-accounts', { dryRun:false, confirm:'DELETE-TEST-ACCOUNTS' }).then(function(d2){
            ov.close();
            App.toast('清理完成，已删除 '+(d2&&d2.removedCount||removable.length)+' 个测试账号', 'ok');
            // 刷新列表：重新拉取真实账号（走已有 API）
            Promise.all([ fetch('/api/auth/accounts').then(function(r){ return r.ok?r.json():[]; }),
                          fetch('/api/auth/roles').then(function(r){ return r.ok?r.json():[]; }) ]).then(function(ra){
              ACCOUNTS = ra[0]; ROLES = ra[1];
              users = ACCOUNTS.map(function(u){ return { id:u.id, account:u.username, name:u.name, role:u.role, roles:(u.roles||[u.role]).slice(), org:u.org, status:u.status||'启用' }; });
              renderUsers();
            });
          }).catch(function(e){
            go.disabled = false; go.textContent = App.icon('trash')+'执行清理';

  /* ---------- b) 权限矩阵（可编辑：模块可见性 + 角色名称/说明 + 顺序 + 停用/删除） ---------- */
  var rolesState = MOCK.ROLES.map(function(r){
    return { id:r.id, name:r.name, desc:r.desc||'', nav:(r.nav||[]).slice(), external:!!r.external, status:r.status||'启用' };
  });
  var dirtyRoles = {};

  function reorderSave(){
    API.reorderRoles(rolesState.map(function(x){ return x.id; })).then(function(){
      App.toast('角色显示顺序已保存，登录页同步生效','ok');
    }).catch(function(e){
      App.toast((e&&e.message)||'排序保存失败','err');
      API.adminRoles().then(function(list){
        if(!list || !list.length) return;
        rolesState = list.map(function(r){ return { id:r.id, name:r.name, desc:r.desc||'', nav:(r.nav||[]).slice(), external:!!r.external, status:r.status||'启用' }; });
        renderMatrix();
      }).catch(function(){});
    });
  }

  function renderMatrix(){
    document.getElementById('mxBody').innerHTML = rolesState.map(function(r,ri){
      var cells = MODS.map(function(m){
        var has = r.nav.indexOf(m[0]) >= 0;
        var locked = r.id === 'platformadmin' && m[0] === 'admin';
        return '<td><span class="mx-cell '+(has?'mx-y':'mx-n')+(locked?' mx-lock':'')+'" data-r="'+ri+'" data-m="'+m[0]+'"'
          + ' title="'+(locked?'平台管理员的「系统管理」权限不可移除':'点击'+(has?'移除':'授予')+'「'+m[1]+'」')+'">'+App.icon(has?'check':'x')+'</span></td>';
      }).join('');
      var on = (r.status||'启用') === '启用';
      return '<tr class="'+(r.external?'ext ':'')+(on?'':'mx-off')+'"><td><b>'+App.esc(r.name)+'</b> '+App.statusTag(r.status||'启用')
        + '<div class="tiny dim">'+App.esc((r.desc||'').slice(0,26))+'</div>'
        + '<div class="mt2" style="display:flex;gap:4px;flex-wrap:wrap">'
        + '<button class="btn sm" data-up="'+ri+'"'+(ri===0?' disabled':'')+'>上移</button>'
        + '<button class="btn sm" data-down="'+ri+'"'+(ri===rolesState.length-1?' disabled':'')+'>下移</button>'
        + '<button class="btn sm" data-desc="'+ri+'">编辑</button>'
        + '<button class="btn sm '+(on?'danger':'ok')+'" data-st="'+ri+'">'+(on?'停用':'启用')+'</button>'
        + '<button class="btn sm danger" data-del="'+ri+'">删除</button>'
        + '</div></td>'+cells+'</tr>';
    }).join('');

    document.querySelectorAll('#mxBody .mx-cell').forEach(function(c){
      c.onclick = function(){
        var r = rolesState[+c.dataset.r], m = c.dataset.m;
        if(r.id === 'platformadmin' && m === 'admin'){ App.toast('平台管理员的「系统管理」权限不可移除','warn'); return; }
        var i = r.nav.indexOf(m);
        if(i >= 0) r.nav.splice(i,1); else r.nav.push(m);
        dirtyRoles[r.id] = true;
        renderMatrix();
      };
    });
    document.querySelectorAll('#mxBody [data-up]').forEach(function(b){
      b.onclick = function(){ var i=+b.dataset.up; if(i<=0) return; var t=rolesState[i-1]; rolesState[i-1]=rolesState[i]; rolesState[i]=t; renderMatrix(); reorderSave(); };
    });
    document.querySelectorAll('#mxBody [data-down]').forEach(function(b){
      b.onclick = function(){ var i=+b.dataset.down; if(i>=rolesState.length-1) return; var t=rolesState[i+1]; rolesState[i+1]=rolesState[i]; rolesState[i]=t; renderMatrix(); reorderSave(); };
    });
    document.querySelectorAll('#mxBody [data-st]').forEach(function(b){
      b.onclick = function(){
        var r = rolesState[+b.dataset.st];
        var to = (r.status||'启用') === '启用' ? '停用' : '启用';
        App.modal({ title:(to==='停用'?'停用角色':'启用角色')+' · '+r.name, body:
          '<p style="font-size:13.5px">'+(to==='停用'
            ? '停用后该角色将不再出现在登录页与账号角色选择中，已用该角色登录的会话会立即失效。账号绑定关系保留，可随时重新启用。'
            : '启用后该角色将重新出现在登录页与账号角色选择中。')+'</p>',
          foot:'<button class="btn" id="stNo">取消</button><button class="btn primary" id="stYes">确认'+(to==='停用'?'停用':'启用')+'</button>',
          onOpen:function(ov){
            ov.querySelector('#stNo').onclick = ov.close;
            ov.querySelector('#stYes').onclick = function(){
              API.setRoleStatus(r.id, to).then(function(){
                r.status = to;
                var m = MOCK.ROLES.filter(function(x){ return x.id===r.id; })[0];
                if(m) m.status = to;
                ov.close(); renderMatrix();
                App.toast('角色「'+r.name+'」已'+to,'ok');
              }).catch(function(e){ App.toast((e&&e.message)||'操作失败','err'); });
            };
          } });
      };
    });
    document.querySelectorAll('#mxBody [data-del]').forEach(function(b){
      b.onclick = function(){
        var r = rolesState[+b.dataset.del];
        App.modal({ title:'删除角色 · '+r.name, body:
          '<div class="sim-banner">'+App.icon('alert')+'<span>删除后不可恢复；若仍有账号绑定该角色，需先在「用户账号」中解除绑定。</span></div>'
          + '<p style="font-size:13.5px">确认删除角色「'+App.esc(r.name)+'」？</p>',
          foot:'<button class="btn" id="rdelNo">取消</button><button class="btn danger" id="rdelYes">确认删除</button>',
          onOpen:function(ov){
            ov.querySelector('#rdelNo').onclick = ov.close;
            ov.querySelector('#rdelYes').onclick = function(){
              API.deleteRole(r.id).then(function(){
                rolesState = rolesState.filter(function(x){ return x.id!==r.id; });
                MOCK.ROLES = MOCK.ROLES.filter(function(x){ return x.id!==r.id; });
                delete dirtyRoles[r.id];
                ov.close(); renderMatrix();
                App.toast('角色「'+r.name+'」已删除','ok');
              }).catch(function(e){ App.toast((e&&e.message)||'删除失败','err'); });
            };
          } });
      };
    });
    document.querySelectorAll('#mxBody [data-desc]').forEach(function(b){
      b.onclick = function(){
        var r = rolesState[+b.dataset.desc];
        App.modal({ title:'编辑角色 · '+r.name, body:
          '<div class="form-row"><label class="f-label">角色组名称 <span class="req">*</span></label><input class="input" id="rdName" maxlength="20" value="'+App.esc(r.name)+'">'
          + '<div class="tiny dim mt2">最多 20 字，保存后同步到登录页角色卡片、账号角色标签与各页面。</div></div>'
          + '<div class="form-row"><label class="f-label">角色说明</label><textarea class="input" id="rdDesc" rows="4" maxlength="200" placeholder="简要说明该角色在演练中的职责与权限边界">'+App.esc(r.desc||'')+'</textarea>'
          + '<div class="tiny dim mt2">最多 200 字，保存权限变更后同步到登录页角色卡提示与矩阵说明。</div></div>',
          foot:'<button class="btn" id="rdNo">取消</button><button class="btn primary" id="rdYes">确定</button>',
          onOpen:function(ov){
            ov.querySelector('#rdNo').onclick = ov.close;
            ov.querySelector('#rdYes').onclick = function(){
              var nm = ov.querySelector('#rdName').value.trim();
              if(!nm){ App.toast('角色组名称不能为空','err'); return; }
              r.name = nm;
              r.desc = ov.querySelector('#rdDesc').value.trim().slice(0,200);
              dirtyRoles[r.id] = true;
              ov.close(); renderMatrix();
              App.toast('角色信息已更新，点击「保存权限变更」后生效','ok');
            };
          } });
      };
    });
  }

  document.getElementById('mxAddBtn').onclick = function(){
    var boxes = MODS.map(function(m){
      var def = (m[0]==='dashboard' || m[0]==='workbench');
      return '<label class="tiny" style="display:inline-flex;align-items:center;gap:4px;margin-right:12px;margin-bottom:6px"><input type="checkbox" class="nrMod" value="'+m[0]+'"'+(def?' checked':'')+'>'+m[1]+'</label>';
    }).join('');
    App.modal({ title:'新增角色', body:
      '<div class="form-row"><label class="f-label">角色组名称 <span class="req">*</span></label><input class="input" id="nrName" maxlength="20" placeholder="如 信息化支撑组"></div>'
      + '<div class="form-row"><label class="f-label">角色说明</label><textarea class="input" id="nrDesc" rows="3" maxlength="200" placeholder="简要说明该角色在演练中的职责与权限边界"></textarea></div>'
      + '<div class="form-row"><label class="f-label">模块可见权限</label><div>'+boxes+'</div><div class="tiny dim">可先勾选基础模块，创建后仍可在矩阵中调整。</div></div>',
      foot:'<button class="btn" id="nrNo">取消</button><button class="btn primary" id="nrYes">创建角色</button>',
      onOpen:function(ov){
        ov.querySelector('#nrNo').onclick = ov.close;
        ov.querySelector('#nrYes').onclick = function(){
          var nm = ov.querySelector('#nrName').value.trim();
          var nav = Array.prototype.slice.call(ov.querySelectorAll('.nrMod:checked')).map(function(x){ return x.value; });
          if(!nm){ App.toast('角色组名称不能为空','err'); return; }
          API.addRole({ name:nm, desc:ov.querySelector('#nrDesc').value.trim(), nav:nav }).then(function(r){
            var role = { id:r.role.id, name:r.role.name, desc:r.role.desc, nav:r.role.nav.slice(), external:false, status:'启用' };
            rolesState.push(role);
            MOCK.ROLES.push({ id:role.id, name:role.name, short:r.role.short, icon:r.role.icon, color:r.role.color, desc:role.desc, nav:role.nav.slice(), external:false, status:'启用' });
            ov.close(); renderMatrix();
            App.toast('角色「'+nm+'」已创建，可在用户账号中分配','ok');
          }).catch(function(e){ App.toast((e&&e.message)||'创建失败','err'); });
        };
      } });
  };

  document.getElementById('mxSaveBtn').onclick = function(){
    var ids = Object.keys(dirtyRoles);
    if(!ids.length){ App.toast('暂无权限变更','warn'); return; }
    var tasks = ids.map(function(id){
      var r = rolesState.filter(function(x){ return x.id===id; })[0];
      return API.updateRole(id, { name:r.name, nav:r.nav, desc:r.desc });
    });
    Promise.all(tasks).then(function(){
      dirtyRoles = {};
      DRILL.bootstrap().then(function(){ App.refreshShell(); });
      App.toast('角色权限已保存，刷新页面即对已登录账号生效','ok');
    }).catch(function(e){ App.toast((e&&e.message)||'保存失败','err'); });
  };

  renderMatrix();
  API.adminRoles().then(function(list){
    if(!list || !list.length) return;
    rolesState = list.map(function(r){ return { id:r.id, name:r.name, desc:r.desc||'', nav:(r.nav||[]).slice(), external:!!r.external, status:r.status||'启用' }; });
    renderMatrix();
  }).catch(function(){});

  /* ---------- c) 表单模板（字段可编辑：名称 / 说明 / 必填 / 控件类型 / 顺序） ---------- */
  function fldOf(x){
    if(typeof x === 'string') return { label:x, hint:'', required:true, type:'auto', options:[] };
    return {
      label:(x&&x.label)||'', hint:(x&&x.hint)||'', required:!(x&&x.required===false),
      type:(x&&x.type)||'auto',
      options:Array.isArray(x&&x.options)?x.options.slice():(typeof (x&&x.options)==='string'?x.options.split(/[、,，|｜]/).map(function(s){return s.trim();}).filter(Boolean):[])
    };
  }
  var TYPE_OPTS = [['auto','自动识别'],['text','单行文本'],['textarea','多行文本'],['select','下拉选择'],['multiselect','下拉多选'],['datetime','日期时间']];
  function typeName(t){
    for(var i=0;i<TYPE_OPTS.length;i++) if(TYPE_OPTS[i][0]===t) return TYPE_OPTS[i][1];
    return '自动识别';
  }

  function renderForms(){
    document.getElementById('fBody').innerHTML = templates.map(function(f,i){
      var nf = (f.fields||[]).map(fldOf);
      var withHint = nf.filter(function(x){ return !!x.hint; }).length;
      return '<tr><td class="mono">'+App.esc(f.code || f.id)+'</td><td>'+App.esc(App.formDisplayName(f))+'</td><td class="mono">'+nf.length+'</td>'
        + '<td class="mono">'+(withHint?'<span class="tag green">'+withHint+'</span>':'<span class="dim">0</span>')+'</td>'
        + '<td><button class="btn sm" data-vw="'+i+'" title="查看结构">'+App.icon('eye')+'</button> <button class="btn sm primary" data-ed="'+i+'">'+App.icon('edit')+'编辑</button></td></tr>';
    }).join('');

    document.querySelectorAll('#fBody [data-vw]').forEach(function(b){
      b.onclick = function(){
        var f = templates[+b.dataset.vw], nf = (f.fields||[]).map(fldOf);
        App.drawer({ title:'模板结构 · '+App.formDisplayName(f), body:
          '<div class="kv"><span class="k">模板编号</span><span class="mono">'+App.esc(f.code || f.id)+'</span><span class="k">内部标识</span><span class="mono tiny dim">'+App.esc(f.id)+'</span><span class="k">模板名称</span><span>'+App.esc(App.formDisplayName(f))+'</span><span class="k">字段数</span><span class="mono">'+nf.length+'</span></div>'

  /* ---------- d) 审计日志 ---------- */
  /* 页码窗口：总页数≤7 全显示，否则显示首尾页与当前页±2，中间以省略号连接 */
  function auditPageSeq(total, cur){
    if(total <= 7){ var all = []; for(var i=1;i<=total;i++) all.push(i); return all; }
    var out = [1];
    var start = Math.max(2, cur - 2), end = Math.min(total - 1, cur + 2);
    if(start > 2) out.push('…');
    for(var j=start;j<=end;j++) out.push(j);
    if(end < total - 1) out.push('…');
    out.push(total);
    return out;
  }
  function renderAudit(){
    var kw = document.getElementById('aKw').value.trim().toLowerCase();
    var list = auditBase.filter(function(a){
      if(!kw) return true;
      return (a.time+' '+a.user+' '+roleName(a.role)+' '+a.action).toLowerCase().indexOf(kw) >= 0;
    });
    var total = list.length;
    var pages = Math.max(1, Math.ceil(total / auditPageSize));
    if(auditPage > pages) auditPage = pages;
    if(auditPage < 1) auditPage = 1;
    var rows = list.slice((auditPage-1)*auditPageSize, auditPage*auditPageSize);
    document.getElementById('aCnt').textContent = total;
    document.getElementById('aBody').innerHTML = rows.length ? rows.map(function(a){
      return '<tr><td class="mono">'+App.esc(a.time)+'</td><td>'+App.esc(a.user)+'</td><td class="dim">'+App.esc(roleName(a.role))+'</td><td>'+App.esc(a.action)+'</td><td class="dim">'+App.esc(objOf(a.action))+'</td><td class="mono dim">'+App.esc(a.ip)+'</td></tr>';
    }).join('') : '<tr><td colspan="6"><div class="empty">'+App.icon('search')+'<div>无匹配日志</div></div></td></tr>';

    var pager = document.getElementById('aPager');
    if(!total){ pager.innerHTML = '<span class="pg-info">共 0 条</span>'; return; }
    var html = '<span class="pg-info">第 '+auditPage+' / '+pages+' 页 · 共 '+total+' 条</span>'
      + '<button class="btn sm" data-pg="'+(auditPage-1)+'"'+(auditPage<=1?' disabled':'')+'>上一页</button>';
    auditPageSeq(pages, auditPage).forEach(function(p){
      html += p==='…'
        ? '<span class="pg-ellipsis">…</span>'
        : '<button class="btn sm'+(p===auditPage?' primary':'')+'" data-pg="'+p+'">'+p+'</button>';
    });
    html += '<button class="btn sm" data-pg="'+(auditPage+1)+'"'+(auditPage>=pages?' disabled':'')+'>下一页</button>';
    pager.innerHTML = html;
    pager.querySelectorAll('[data-pg]').forEach(function(b){
      b.onclick = function(){
        auditPage = Number(b.dataset.pg) || 1;
        renderAudit();
      };
    });
  }
  document.getElementById('aKw').addEventListener('input', function(){ auditPage = 1; renderAudit(); });
  document.getElementById('aPageSize').addEventListener('change', function(){
    auditPageSize = Number(this.value) || 10;
    auditPage = 1;
    renderAudit();
  });

          var d = NT_VARS[v] || {cn:v,sample:''};

        }).join('') + '</div>';

  function ntSourceOptions(cur){

      return '<option value="'+App.esc(s.v)+'"'+(cur===s.v?' selected':'')+'>'+App.esc(s.l)+'</option>';
    }).join('');
    if(cur && !NT_SOURCES.some(function(s){ return s.v===cur; })){
      html += '<option value="'+App.esc(cur)+'" selected>'+App.esc(cur)+'（历史值，非系统内置）</option>';
    }
    return html;
  }
  function markDirty(boxId, id){
    var d = document.getElementById(id); if(d) d.style.display = '';
  }
  function dictSave(key, value, btn, okMsg){

      App.toast(okMsg||'字典已保存','ok');

      btn.disabled = false;
      App.toast((e&&e.message)||(e&&e.error)||'保存失败','err');

  /* --- 站内消息模板（通知与备份页签） --- */
  function initNotif(){
    var box = document.getElementById('ntBox'); if(!box) return;
    var cur = {};
    function paint(){
      var keys = Object.keys(cur);
      if(!keys.length){ box.innerHTML = '<span class="dim">未读取到 notif_templates，请检查种子数据。</span>'; return; }
      var html = '<div class="dict-hint">模板中 <code>{变量名}</code> 会在发送时自动替换；点击「插入变量」可插入到标题/正文的光标位置。'
        + '消息来源只能从系统内置的 '+NT_SOURCES.length+' 个来源中选择。level：P0=紧急 / P1=重要 / P2=一般。</div>';
      keys.forEach(function(evKey){
        var ev = cur[evKey] || {title:'',desc:'',source:'',level:'P2'};
        var meta = ntEventMeta(evKey);
        var lvSel = ['P0','P1','P2'].map(function(l){ return '<option value="'+l+'"'+(l===ev.level?' selected':'')+'>'+l+'</option>'; }).join('');
        html += '<div class="dict-sub-card nt-ev-card" data-ev="'+App.esc(evKey)+'">'
          + '<div class="dict-row" style="margin-bottom:8px">'
          +  '<span style="font-weight:700;color:var(--text);font-family:monospace">event: '+App.esc(evKey)+'</span>'
          +  (meta ? '<span class="nt-ev-name">'+App.esc(meta.name)+'</span>' : '<span class="nt-ev-name" style="color:var(--warn)">未被系统读取的事件键</span>')
          +  '<button class="btn sm danger ntDel" data-ev="'+App.esc(evKey)+'" style="margin-left:auto">'+App.icon('trash')+'</button></div>'
          + '<div class="dict-row"><label class="tiny dim" style="min-width:48px">标题 <span class="req">*</span></label><input class="input ntTitle" data-ev="'+App.esc(evKey)+'" value="'+App.esc(ev.title||'')+'" style="flex:1"></div>'
          + ntVarChips(evKey,'title')
          + '<div class="dict-row" style="align-items:flex-start"><label class="tiny dim" style="min-width:48px">正文 <span class="req">*</span></label><textarea class="input ntDesc" data-ev="'+App.esc(evKey)+'" rows="3" style="flex:1;resize:vertical">'+App.esc(ev.desc||'')+'</textarea></div>'
          + ntVarChips(evKey,'desc')
          + '<div class="dict-row"><label class="tiny dim" style="min-width:48px">来源 <span class="req">*</span></label><select class="input ntSource" data-ev="'+App.esc(evKey)+'" style="max-width:340px">'+ntSourceOptions(ev.source||'')+'</select>'
          +  '<label class="tiny dim" style="margin-left:16px">等级</label><select class="input ntLevel" data-ev="'+App.esc(evKey)+'" style="max-width:100px">'+lvSel+'</select></div>'
          + '</div>';
      });
      html += '<div class="flex gap3 mt3" style="align-items:center;flex-wrap:wrap"><button class="btn primary" id="ntSaveBtn">'+App.icon('check')+'保存模板</button>'
        + '<button class="btn" id="ntReloadBtn">'+App.icon('refresh')+'重新加载</button>'
        + '<span class="tiny dim" id="ntDirty" style="display:none;color:var(--warn)">有未保存的修改</span></div>';
      box.innerHTML = html;
      box.querySelectorAll('.ntTitle,.ntDesc').forEach(function(inp){
        ['click','keyup','select','blur'].forEach(function(evt){
          inp.addEventListener(evt, function(){ inp.dataset.caret = inp.selectionStart==null?inp.value.length:inp.selectionStart; });
        });
      });
      box.querySelectorAll('.ntTitle,.ntDesc,.ntSource,.ntLevel').forEach(function(inp){
        inp.addEventListener('input', function(){ markDirty('ntBox','ntDirty'); });
      });
    }
    function collect(){
      var obj = {}, seen = {};
      box.querySelectorAll('.ntTitle,.ntDesc,.ntSource,.ntLevel').forEach(function(inp){
        var ev = inp.getAttribute('data-ev');
        if(!seen[ev]){ seen[ev]=1; obj[ev] = {title:'',desc:'',source:'',level:'P2'}; }
        if(inp.classList.contains('ntTitle')) obj[ev].title = (inp.value||'').trim();
        if(inp.classList.contains('ntDesc')) obj[ev].desc = (inp.value||'').trim();
        if(inp.classList.contains('ntSource')) obj[ev].source = (inp.value||'').trim();
        if(inp.classList.contains('ntLevel')) obj[ev].level = inp.value||'P2';
      });
      return obj;
    }
    function validate(){
      var missing = [], unknown = [], unused = [];
      box.querySelectorAll('.nt-ev-card').forEach(function(card){
        var evKey = card.getAttribute('data-ev'), meta = ntEventMeta(evKey);
        var title = (card.querySelector('.ntTitle')||{}).value||'';
        var desc = (card.querySelector('.ntDesc')||{}).value||'';
        var source = (card.querySelector('.ntSource')||{}).value||'';
        var name = meta ? meta.name : evKey;
        if(!title.trim()) missing.push(name+' 的标题');
        if(!desc.trim()) missing.push(name+' 的正文');
        if(!source.trim()) missing.push(name+' 的消息来源');
        if(!meta){ unused.push(evKey); return; }
        [title,desc].forEach(function(txt){
          var re = /\{([A-Za-z0-9_]+)\}/g, m;
          while((m = re.exec(txt))){ if(meta.vars.indexOf(m[1])<0 && unknown.indexOf('{'+m[1]+'}')<0) unknown.push('{'+m[1]+'}'); }
        });
      });
      return {ok:!missing.length, missing:missing, unknown:unknown, unused:unused};
    }
    box.addEventListener('click', function(ev){
      var chip = ev.target.closest('.ntVarChip');
      if(chip){
        var card = chip.closest('.nt-ev-card');
        var inp = card && card.querySelector(chip.getAttribute('data-target')==='title'?'.ntTitle':'.ntDesc');
        if(inp){
          var token = '{'+chip.getAttribute('data-var')+'}';
          var pos = inp.dataset.caret==null ? inp.value.length : Math.min(+inp.dataset.caret, inp.value.length);
          inp.value = inp.value.slice(0,pos)+token+inp.value.slice(pos);
          var next = pos+token.length;
          inp.dataset.caret = next; inp.focus();
          if(inp.setSelectionRange) inp.setSelectionRange(next,next);
          inp.dispatchEvent(new Event('input',{bubbles:true}));
        }
        return;
      }
      if(ev.target.closest('#ntReloadBtn')){ load(); return; }
      if(ev.target.closest('#ntSaveBtn')){
        var btn = ev.target.closest('#ntSaveBtn'), chk = validate();
        if(!chk.ok){ App.toast('请补全必填项：'+chk.missing.slice(0,4).join('、')+(chk.missing.length>4?' 等':''),'err'); return; }
        dictSave('notif_templates', collect(), btn, '站内消息模板已保存');
        var d = document.getElementById('ntDirty'); if(d) d.style.display='none';
        var warn = [];
        if(chk.unknown.length) warn.push('未知变量 '+chk.unknown.join(' ')+' 不会被替换');
        if(chk.unused.length) warn.push('event 键 '+chk.unused.join('、')+' 未被系统读取');
        if(warn.length) setTimeout(function(){ App.toast(warn.join('；'),'warn'); }, 600);
        return;
      }
      var del = ev.target.closest('.ntDel');
      if(del){
        var evKey = del.getAttribute('data-ev'), meta = ntEventMeta(evKey);
        var doDel = function(){ delete cur[evKey]; paint(); };
        if(!meta){ doDel(); return; }
        App.modal({ title:'删除站内消息模板',
          body:'<div class="sim-banner" style="border-color:rgba(248,81,73,.5);color:var(--err);background:var(--err-dim)">'+App.icon('alert')
            +'<span>Go 服务端没有内置兜底：删除后「'+App.esc(meta.name)+'」事件将<b>不再发送任何站内消息</b>。保存后生效。</span></div>',
          foot:'<button class="btn" id="ntDelNo">取消</button><button class="btn danger" id="ntDelYes">'+App.icon('trash')+'确认删除</button>',
          onOpen:function(ov){
            ov.querySelector('#ntDelNo').onclick = ov.close;
            ov.querySelector('#ntDelYes').onclick = function(){ ov.close(); doDel(); };
          } });
      }
    });
    function load(){
      box.innerHTML = '<span class="tiny dim">加载中…</span>';
      API.getDict('notif_templates').then(function(res){ cur = res.value||{}; paint(); })
        .catch(function(e){ box.innerHTML='<span class="dim">加载失败：'+App.esc((e&&e.message)||'未知错误')+'</span>'; });
    }
    load();
  }

  function initChannels(){

        }).join('');
        html += '<div class="dict-sub-card"><div class="dict-row">'
          + '<input class="input chKey" style="max-width:150px" value="'+App.esc(chKey)+'" data-old="'+App.esc(chKey)+'" placeholder="频道key">'
          + '<input class="input chLabel" style="max-width:280px;flex:1" value="'+App.esc(ch.label||'')+'" data-ch="'+App.esc(chKey)+'" placeholder="频道名称">'
          + '<button class="btn sm danger chDel" data-ch="'+App.esc(chKey)+'">'+App.icon('trash')+'</button></div>'
          + '<div class="mt2">'+rolesChk+'</div></div>';
      });
      html += '<div class="flex gap3 mt3" style="align-items:center;flex-wrap:wrap"><button class="btn primary" id="chSaveBtn">'+App.icon('check')+'保存频道配置</button>'
        + '<button class="btn" id="chAddBtn">'+App.icon('plus')+'新增频道</button>'
        + '<button class="btn" id="chReloadBtn">'+App.icon('refresh')+'重新加载</button>'
        + '<span class="tiny dim" id="chDirty" style="display:none;color:var(--warn)">有未保存的修改</span></div>';
      box.innerHTML = html;
      box.querySelectorAll('input,select').forEach(function(inp){ inp.addEventListener('input', function(){ markDirty('chBox','chDirty'); }); });
    }
    function collect(){
      var obj = {};
      box.querySelectorAll('.chKey').forEach(function(kInput){
        var oldKey = kInput.getAttribute('data-old'), newKey = (kInput.value||'').trim();
        if(!newKey) return;
        var labelInput = box.querySelector('.chLabel[data-ch="'+oldKey+'"]');
        var roles = [];
        box.querySelectorAll('.chRole[data-ch="'+oldKey+'"]:checked').forEach(function(c){ roles.push(c.value); });
        obj[newKey] = { label: labelInput ? (labelInput.value||'').trim() : '', roles: roles };
      });
      return obj;
    }
    box.addEventListener('click', function(ev){
      if(ev.target.closest('#chReloadBtn')){ load(); return; }
      if(ev.target.closest('#chAddBtn')){ cur['频道'+Object.keys(cur).length] = {label:'新频道',roles:[]}; paint(); return; }
      var del = ev.target.closest('.chDel');
      if(del){ delete cur[del.getAttribute('data-ch')]; paint(); return; }
      if(ev.target.closest('#chSaveBtn')){
        var v = collect();
        if(!Object.keys(v).length){ App.toast('至少保留一个频道','err'); return; }
        dictSave('chat_channels', v, ev.target.closest('#chSaveBtn'), '会商频道配置已保存');
        var d = document.getElementById('chDirty'); if(d) d.style.display='none';
      }
    });
    function load(){
      box.innerHTML = '<span class="tiny dim">加载中…</span>';
      API.getDict('chat_channels').then(function(res){ cur = res.value||{}; paint(); })
        .catch(function(e){ box.innerHTML='<span class="dim">加载失败：'+App.esc((e&&e.message)||'未知错误')+'</span>'; });
    }
    load();
  }

    }
    function collect(){
      return Array.prototype.map.call(box.querySelectorAll('.bdItem'), function(i){ return (i.value||'').trim(); }).filter(Boolean);
    }
    function load(key){
      curKey = key; box.innerHTML = '<span class="tiny dim">加载中…</span>';
      API.getDict(key).then(function(res){
        curVal = Array.isArray(res.value) ? res.value.slice() : [];
        loaded[key] = true; paint();
      }).catch(function(e){ box.innerHTML = '<span class="dim">加载失败：'+App.esc((e&&e.message)||'未知错误')+'</span>'; });
    }
    tabsEl.addEventListener('click', function(ev){
      var t = ev.target.closest('.bdTab'); if(!t) return;
      load(t.getAttribute('data-key'));
    });
    box.addEventListener('input', function(ev){ if(ev.target.classList.contains('bdItem')) markDirty('bdBox','bdDirty'); });
    box.addEventListener('click', function(ev){
      if(ev.target.closest('#bdReloadBtn')){ load(curKey); return; }
      if(ev.target.closest('#bdAddBtn')){ curVal = collect(); curVal.push('新条目'); paint(); return; }
      var del = ev.target.closest('.bdDel');
      if(del){ curVal = collect(); curVal.splice(+del.getAttribute('data-i'),1); paint(); return; }
      if(ev.target.closest('#bdSaveBtn')){
        var v = collect();
        if(!v.length){ App.toast('字典至少保留一项','err'); return; }
        dictSave(curKey, v, ev.target.closest('#bdSaveBtn'), '「'+meta().label+'」已保存');
        var d = document.getElementById('bdDirty'); if(d) d.style.display='none';
      }
    });
    load(curKey);
  }

  renderUsers(); renderForms(); renderAudit(); loadLastBackup(); renderBackupList();
  if(BRAND_ADMIN){ initBrand(); initReset(); initNotif(); initChannels(); initBizDict(); }
});
App.boot('admin');
</script>
</body>
</html>
