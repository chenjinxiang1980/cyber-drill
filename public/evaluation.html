<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>复盘评估 · 盘州市人民医院网络安全应急演练系统</title>
<link rel="icon" type="image/png" href="img/logo.png">
<link rel="stylesheet" href="styles.css">
<style>
.ev-mode{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ev-mode .badge{padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--border2)}
.ev-mode .badge.base{color:var(--accent2);background:var(--accent-dim)}
.ev-mode .badge.real{color:var(--warn);background:rgba(210,153,34,.1);border-color:rgba(210,153,34,.4)}
.ev-row{display:flex;align-items:flex-start;gap:14px;padding:12px 0;border-bottom:1px dashed var(--border)}
.ev-row:last-child{border-bottom:none}
.ev-row .ev-name{width:210px;flex:none;font-size:12.5px;line-height:1.65}
.ev-row .ev-rule{flex:1;font-size:11.5px;color:var(--text3);line-height:1.7}
.ev-row .ev-ro{width:180px;flex:none;text-align:right}
.ev-total{font-size:34px;font-weight:700;font-family:var(--mono);color:var(--accent2)}
.ev-legend{font-size:11.5px;color:var(--text3);line-height:1.9}
.st-list{max-height:340px;overflow:auto}
.st-item{padding:9px 0;border-bottom:1px dashed var(--border);font-size:12.5px}
.st-item:last-child{border-bottom:none}
.st-item .st-h{display:flex;justify-content:space-between;gap:8px;align-items:center}
</style>
</head>
<body data-page="evaluation">
<script src="system.js"></script><script src="app.js"></script><script src="api.js"></script>
<script>
document.addEventListener('app:ready', function(e){
  var role = e.detail.role;
  var page = document.getElementById('page');
  var proj = API.activeProject();
  var canEval = ['commander','itlead','platformadmin'].indexOf(role.id) >= 0;
  var canAdd = true;
  var WB = null;

  /* ---------- 无演练：展示空态 ---------- */
  if (!proj) {
    Promise.all([API.getScenarios(), API.getProjects(), API.getScriptNodes()]).then(function(r){
      var scens = Array.isArray(r[0]) ? r[0] : [];
      var projs = Array.isArray(r[1]) ? r[1] : [];
      var nodes = Array.isArray(r[2]) ? r[2] : [];
      page.innerHTML =
        '<div class="standby-hero">'
        + '<div class="sb-icon" style="background:rgba(210,153,34,.12);border-color:rgba(210,153,34,.28);color:var(--warn)">'+App.icon('score')+'</div>'
        + '<div class="sb-body">'
        +   '<span class="sb-tag" style="color:var(--warn);background:rgba(210,153,34,.12);border-color:rgba(210,153,34,.28)"><span class="dot" style="background:var(--warn)"></span>AWAITING DRILL · 待复盘</span>'
        +   '<h2>暂无演练可复盘评估</h2>'
        +   '<div class="sb-sub">复盘评估依据演练项目中的处置记录、节点完成情况与剧本基线自动计算。请先创建演练项目并完成至少一次推演，系统将自动生成本次演练的考评明细、改进建议与评估汇总。</div>'
        +   '<div class="sb-acts">'
        +     '<a class="btn primary" href="projects.html">'+App.icon('projects')+'创建演练项目</a>'
        +     '<a class="btn" href="scenarios.html">'+App.icon('flow')+'选择剧本启动推演</a>'
        +     '<a class="btn" href="dashboard.html">'+App.icon('dashboard')+'返回态势总看板</a>'
        +   '</div>'
        +   '<div class="sb-meta">'
        +     '<div class="m-item"><b>'+scens.length+'</b>内置场景</div>'
        +     '<div class="m-item"><b>'+nodes.length+'</b>剧本节点</div>'
        +     '<div class="m-item"><b>'+projs.length+'</b>历史项目</div>'
        +   '</div>'
        + '</div></div>'
        + '<div class="card"><div class="card-title">'+App.icon('score')+'复盘评估机制说明</div>'
        +   '<div class="small" style="line-height:2">系统支持<b>两种演练模式</b>，考评口径不同：<br>'
        +   '<b>· 基础版（诱导演练）</b>：逐节点下发任务并提供引导提示，考评仅统计<b>处置时长达成率</b>（按时完成率 × 100 分）。<br>'
        +   '<b>· 实战版（自主研判）</b>：仅展示已发现故障，参演人员在角色工作台自主选择处置动作。按<b>与剧本基线偏离、处置超时、未处置、额外无效操作</b>扣分，满分 100 分。<br>'
        +   '演练模式在创建项目时选定，创建后不可切换。系统在演练进行中即可实时显示考评，演练结束后可一键导出报告。</div>'
        + '</div>';
    }).catch(function(){
      page.innerHTML = '<div class="forbidden">'+App.icon('alert')+'<h2>数据加载失败</h2><p>请检查网络或联系管理员</p></div>';
    });
    return;
  }

  function mins(t){ var m=/^(\d{1,2}):(\d{2})/.exec(String(t||'')); return m ? (+m[1])*60 + (+m[2]) : null; }
  function grade(v){ return v>=90?'优秀':v>=80?'良好':v>=70?'合格':'不合格'; }
  function gradeCls(v){ return v>=90?'green':v>=80?'blue':v>=70?'yellow':'red'; }
  function stateTag(s){ return s==='按时'?'<span class="tag green">按时</span>':s==='超时'?'<span class="tag yellow">超时</span>':s==='遗漏'?'<span class="tag red">遗漏</span>':s==='待处置'?'<span class="tag yellow">待处置</span>':s==='决策有误'?'<span class="tag red">决策有误</span>':'<span class="tag gray">'+App.esc(s)+'</span>'; }

  page.innerHTML =
    '<div class="page-head"><div><h1>复盘评估</h1><div class="sub">'+App.esc(proj.name)+' · 系统自动考评 · '+
      (WB?'':'按演练模式差异化计分')+'</div></div>'
    + '<div class="acts">'
    + (canEval?'<button class="btn" id="evReEval">'+App.icon('refresh')+'重新自动考评</button>':'')
    + '<button class="btn primary" id="evReport">'+App.icon('file')+'演练报告导出</button></div></div>'
    + '<div class="sim-banner">'+App.icon('alert')+'<span>考评由系统按演练数据自动计算：<b>基础版</b>为完整诱导演练，仅对处置时长打分（逐节点处置时长达成率）；<b>实战版</b>任务中心只展示已发现的系统故障，由参演人员在角色工作台自主选择处置动作，按<b>与剧本基线偏离、处置超时、未处置、偏离剧本的额外操作</b>扣分。所有数据均为演练记录。</span></div>'
    + '<div class="grid" style="grid-template-columns:1.55fr 1fr;gap:16px">'
    +   '<div class="card"><div class="card-title">'+App.icon('score')+'考评明细<span class="more" id="evTitle"></span></div><div id="evItems"><div class="loading-block">正在加载考评数据…</div></div></div>'
    +   '<div class="col gap4">'
    +     '<div class="card"><div class="card-title">'+App.icon('dashboard')+'评估汇总</div>'
    +       '<div class="flex" style="align-items:baseline;gap:10px"><span class="ev-total" id="smTotal">—</span><span class="muted" id="smMax"></span><span class="right tag" id="smRate"></span></div>'
    +       '<div class="progress mt3"><div class="bar" id="smBar" style="width:0%"></div></div>'
    +       '<div class="flex mt3" style="justify-content:space-between;align-items:center"><span class="small dim">评估等级（自动）</span><span id="smGrade"></span></div>'
    +       '<div class="tiny dim mt2" id="smFormula"></div>'
    +       '<div class="section-title mt4">演练模式</div><div class="ev-mode" id="smMode"></div>'
    +       '<div class="section-title mt4">关键统计</div><div id="smStats"></div></div>'
    +     '<div class="card"><div class="card-title">'+App.icon('edit')+'改进建议（自动生成）</div>'
    +       '<div class="small" id="evSug" style="line-height:1.9;white-space:pre-wrap">—</div></div>'
    +   '</div>'
    + '</div>'
    + '<div class="card" id="evStepsCard" style="margin-top:14px"></div>';

  document.getElementById('evReport').onclick = function(){ location.href = 'report.html'; };
  var btnRe = document.getElementById('evReEval');

  /* ---------- 渲染 ---------- */
  function renderMode(){
    var mode = WB.mode;
    var isBase = mode === '基础版';
    document.getElementById('smMode').innerHTML =
      '<span class="badge '+(isBase?'base':'real')+'">'+App.esc(mode)+'</span>'
      + '<span class="tiny dim">'+(isBase
        ? '诱导演练：系统逐节点下发任务与引导提示，考评仅统计处置时长达成率'
        : '自主研判：任务中心仅展示已发现故障，参演人员在角色工作台选择处置动作，按偏离剧本与时效扣分')+'</span>'
      + '<div class="tiny dim mt2">演练模式在新建演练项目时选定，创建后不可切换（保证两种模式使用同一套剧本基线）。</div>';
  }

  function renderItems(){
    var s = WB.score;
    var baselineCnt = WB.nodes.filter(function(n){ return n.required && n.type!=='end'; }).length;
    document.getElementById('evTitle').textContent = WB.mode==='实战版'
      ? WB.mode + ' · 已发现故障 ' + s.total + ' 项 · 剧本基线 ' + baselineCnt + ' 项'
      : WB.mode + ' · 考评单元 ' + s.total + ' 项 · 覆盖基线节点 ' + baselineCnt + ' 项';
    var rows = s.nodes.map(function(n, i){
      var plan = n.plan || '—';
      var actual = n.actual || '—';
      return '<div class="ev-row">'
        + '<div class="ev-name"><div class="bold">'+(i+1)+'. '+App.esc(n.title)+'</div>'
        +   '<div class="mt2 tiny dim">'+App.esc(roleName(n.role))+' · '+App.esc(plan)+'</div></div>'
        + '<div class="ev-rule">实际：'+App.esc(actual)+'</div>'
        + '<div class="ev-ro">'+stateTag(n.state)+(WB.mode==='实战版'
            ? (n.state==='遗漏'?'<div class="tiny" style="color:var(--err);margin-top:4px">未处置基线必经环节（扣15分）</div>'
              : n.state==='决策有误'?'<div class="tiny" style="color:var(--err);margin-top:4px">与剧本基线偏离（扣20分）</div>'
              : n.state==='超时'?'<div class="tiny" style="color:var(--err);margin-top:4px">处置超时（扣10分）</div>' : '')
            : '')+'</div>'
        + '</div>';
    }).join('');
    if(!rows) rows = '<div class="empty">'+App.icon('file')+'<div>暂无考评单元</div></div>';
    document.getElementById('evItems').innerHTML = rows;
  }

  function roleName(rid){
    var r = (MOCK.ROLES||[]).filter(function(x){ return x.id===rid || x.short===rid || x.name===rid; })[0];
    return r ? r.name : (rid||'—');
  }

  function renderSummary(){
    var s = WB.score;
    document.getElementById('smTotal').textContent = s.score;
    document.getElementById('smMax').textContent = '/ 100 分';
    var rate = document.getElementById('smRate');
    rate.className = 'right tag ' + gradeCls(s.score);
    rate.textContent = WB.mode==='实战版' ? ('扣分后 '+s.score+' 分') : ('得分率 '+s.score+'%');
    var bar = document.getElementById('smBar');
    bar.style.width = Math.min(100,s.score)+'%';
    bar.className = 'bar ' + (s.score>=85?'ok':s.score>=70?'warn':'err');
    document.getElementById('smGrade').innerHTML = '<span class="tag '+gradeCls(s.score)+'"><span class="dot"></span>'+grade(s.score)+' · 系统自动考评</span>';
    document.getElementById('smFormula').textContent = s.formula;
    var pairs = WB.mode==='基础版'
      ? [['按时完成',s.ontime],['未完成/超时',s.total-s.ontime]]
      : [['符合基线',s.hit],['待处置',s.pending||0],['决策偏离',s.wrong||0],['超时',s.late||0],['未处置',s.missed],['额外操作',s.extraSteps||0]];
    document.getElementById('smStats').innerHTML = '<div class="flex gap3 wrap">'+pairs.map(function(x){
      return '<span class="small"><b style="font-family:var(--mono)">'+x[1]+'</b> <span class="dim">'+x[0]+'</span></span>';
    }).join('')+'</div>';
  }

  function renderSuggestions(){
    var s = WB.score;
    var lines = [];
    var missed = s.nodes.filter(function(n){ return !n.hit; });
    var late = s.nodes.filter(function(n){ return n.hit && !n.ontime; });
    if(WB.mode==='基础版'){
      if(late.length) lines.push('1. 时限执行：'+late.map(function(n){ return '「'+n.title+'」'; }).join('、')+' 未在处置时长内完成，建议明确各节点处置时长与责任人。');
      if(missed.length) lines.push((lines.length+1)+'. 流程执行：'+missed.length+' 项任务未按时闭环，建议在下一轮演练中重点跟踪。');
      if(!lines.length) lines.push('本次基础版演练各节点均在处置时长内完成，建议增加实战版无脚本抽测以验证真实处置能力。');
    } else {
      var wrong = s.nodes.filter(function(n){ return n.state==='决策有误'; });
      var omitted = s.nodes.filter(function(n){ return n.state==='遗漏'; });
      if(wrong.length) lines.push('1. 决策偏离：'+wrong.map(function(n){ return '「'+n.title+'」'; }).join('、')+' 所选处置与剧本基线偏离（每项扣20分），建议围绕该环节开展专项研判训练。');
      if(late.length) lines.push((lines.length+1)+'. 处置超时：'+late.map(function(n){ return '「'+n.title+'」'; }).join('、')+' 超出处置时长（每项扣10分），建议优化响应流程与值班力量配置。');
      if(omitted.length) lines.push((lines.length+1)+'. 环节未处置：'+omitted.map(function(n){ return '「'+n.title+'」（'+n.plan+'）'; }).join('、')+' 未在演练中处置（每项扣15分），建议明确责任岗位并补齐处置流程。');
      if(s.extraSteps) lines.push((lines.length+1)+'. 额外操作：另有 '+s.extraSteps+' 项操作偏离剧本基线（每项扣5分，上限20分），建议核实是否存在无效处置。');
      if(!lines.length) lines.push('实战版演练全部基线环节决策正确且处置时长达标，无扣分项，建议固化处置经验并纳入标准剧本。');
    }
    document.getElementById('evSug').textContent = lines.join('\n');
  }

  function renderSteps(){
    var card = document.getElementById('evStepsCard');
    if(WB.mode==='基础版'){
      card.innerHTML = '<div class="card-title">'+App.icon('flow')+'基础版引导流程（系统下发）</div>'
        + '<div class="tiny dim" style="margin-bottom:10px">基础版按剧本节点逐节点下发任务，并提供处置引导提示；参演人员按顺序完成即可，考评仅统计处置时长达成情况。</div>'
        + '<div class="table-wrap"><table class="table"><thead><tr><th style="width:60px">序号</th><th>剧本节点</th><th style="width:130px">责任角色</th><th style="width:100px">处置时长(分)</th><th>引导提示</th></tr></thead><tbody>'
        + WB.nodes.filter(function(n){ return n.type!=='end'; }).map(function(n,i){
            return '<tr><td class="mono">'+(i+1)+'</td><td>'+App.esc(n.title)+'</td><td class="small">'+App.esc(roleName(n.target))+'</td>'
              + '<td class="mono small">'+(n.timeout||'—')+'</td>'
              + '<td class="small muted">'+App.esc(n.guide||'—')+'</td></tr>';
          }).join('')+'</tbody></table></div>';
      return;
    }
    /* 实战版：展示角色工作台提交的处置决策记录（复盘只读） */
    var steps = WB.steps || [];
    /* 演练中只展示已发现故障；演练结束后展示全部基线环节 */
    var rows = (WB.score.nodes || []).map(function(n){
      var full = WB.nodes.filter(function(x){ return x.id===n.id; })[0] || {};
      var st = steps.filter(function(x){ return x.matched_node===n.id; })[0];
      var judge = st
        ? (st.correct===0?'<span class="tag red">决策偏离</span>':'<span class="tag green">符合基线</span>')
        : (n.state==='待处置'?'<span class="tag yellow">待处置</span>':'<span class="tag gray">未处置</span>');
      return '<tr>'
        + '<td class="mono small">'+(full.timeout?full.timeout+' 分钟':'—')+'</td>'
        + '<td><div class="small bold">'+App.esc(n.title)+' '+(full.required?'':'<span class="tag yellow">前置告警·不计分</span>')+'</div><div class="tiny dim">'+App.esc(full.target||n.role||'')+'</div></td>'
        + '<td class="small">'+(st?App.esc(st.choice||'—'):'—')+(st&&st.correct===0?'<div class="tiny" style="color:var(--err);margin-top:3px">正确做法：'+App.esc(n.title)+'</div>':'')+'</td>'
        + '<td>'+judge+'</td>'
        + '<td class="mono small">'+App.esc(st?st.step_time:'—')+'</td>'
        + '<td class="small">'+(st?App.esc(st.found||'—')+'<div class="tiny dim mt2">措施：'+App.esc(st.measure||'—')+'</div><div class="tiny dim">结果：'+App.esc(st.result||'—')+'</div>':'—')+'</td>'
        + '<td class="small">'+App.esc(st?st.user:'—')+'</td>'
        + '</tr>';
    }).join('');
    card.innerHTML = '<div class="card-title">'+App.icon('shield')+'实战版处置决策记录<span class="more">来源：角色工作台自主提交</span></div>'
      + '<div class="tiny dim" style="margin-bottom:10px">实战版在角色工作台只展示已发现的系统故障，不发布处置步骤与引导提示；参演人员从混淆方案中选择处置动作，并填写发现时间、发现情况、处置措施与处置结果。下表按剧本基线逐环节比对，复盘页仅展示记录，不提供补录入口。</div>'
      + '<div class="table-wrap"><table class="table"><thead><tr>'
      + '<th style="width:80px">处置时长</th><th>处置环节</th><th>选择方案</th><th style="width:90px">判定</th><th style="width:70px">处置时刻</th><th>发现情况 / 措施 / 结果</th><th style="width:90px">处置人</th>'
      + '</tr></thead><tbody>'+ (rows || '<tr><td colspan="7"><div class="empty">'+App.icon('shield')+'<div>暂无实战处置记录</div></div></td></tr>') +'</tbody></table></div>';
  }

  function load(){
    var btn = document.getElementById('evReEval');
    if(btn) btn.disabled = true;
    API.getDrillWorkbench(proj.id).then(function(wb){
      WB = wb;
      document.querySelector('.page-head .sub').textContent = proj.name + ' · 系统自动考评 · ' + wb.mode;
      renderMode(); renderItems(); renderSummary(); renderSuggestions(); renderSteps();
      if(btn) btn.disabled = false;
    }).catch(function(err){
      document.getElementById('evItems').innerHTML = '<div class="empty">'+App.icon('alert')+'<div>考评数据加载失败：'+App.esc((err&&err.message)||'请稍后重试')+'</div></div>';
      if(btn) btn.disabled = false;
    });
  }

  if(btnRe){
    btnRe.onclick = function(){
      var b = this; b.disabled = true; b.innerHTML = App.icon('refresh')+'自动考评计算中…';
      API.recalcDrillScore(proj.id).then(function(s){
        App.toast('自动考评完成：'+s.score+' 分（'+grade(s.score)+'）· '+s.formula,'ok');
        load();
      }).catch(function(err){
        App.toast((err&&err.message)||'考评失败','err');
        b.disabled = false; b.innerHTML = App.icon('refresh')+'重新自动考评';
      });
    };
  }

  load();
});
App.boot('evaluation');
</script>
</body>
</html>
