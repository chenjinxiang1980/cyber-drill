<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>修改密码 · 盘州市人民医院网络安全应急演练系统</title>
<link rel="icon" type="image/png" href="img/logo.png">
<link rel="stylesheet" href="styles.css">
<style>
.pwd-wrap{max-width:920px}
.pwd-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
@media(max-width:900px){.pwd-grid{grid-template-columns:1fr}}
.pwd-form .form-row{margin-bottom:14px}
.pwd-form .input{width:100%}
.pwd-rule{font-size:12px;color:var(--text3);line-height:1.9;margin-top:6px}
.pwd-rule li{list-style:none}
.pwd-rule li::before{content:'·';margin-right:6px;color:var(--accent2)}
.pwd-err{color:var(--err);font-size:12.5px;min-height:18px;margin:4px 0 8px}
.acct-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--border);font-size:13px}
.acct-row:last-child{border-bottom:none}
.acct-row .k{color:var(--text3)}
.pwd-tip{padding:10px 12px;border:1px solid rgba(210,153,34,.45);background:rgba(210,153,34,.08);border-radius:8px;font-size:12.5px;line-height:1.8;margin-bottom:14px}
</style>
</head>
<body data-page="password">
<script src="system.js"></script><script src="app.js"></script><script src="api.js"></script>
<script>
document.addEventListener('app:ready', function(e){
  var role = e.detail.role;
  var page = document.getElementById('page');
  var me = App.curUser();
  var org = sessionStorage.getItem('pzy_org') || ((DRILL.brand()||{}).unitName) || '盘州市人民医院';

  page.innerHTML =
    '<div class="page-head"><div><h1>修改登录密码</h1><div class="sub">账号与安全 · '+App.esc(me)+'（'+App.esc(role.name)+'）</div></div>'
    + '<button class="btn" id="btnHome">'+App.icon('dashboard')+'返回工作台</button></div>'
    + '<div class="pwd-wrap"><div class="pwd-grid">'
    +   '<div class="card"><div class="card-title">'+App.icon('lock')+'密码修改</div>'
    +     '<div class="pwd-tip">'+App.icon('alert')+'<span style="margin-left:6px">首次登录或使用初始密码 <b>Pzy@2026</b> 时，请立即修改为自己的密码；修改成功后需使用新密码重新登录。</span></div>'
    +     '<div class="pwd-form">'
    +       '<div class="form-row"><label class="f-label">当前密码 <span class="req">*</span></label><input class="input" id="pwdOld" type="password" autocomplete="current-password" placeholder="请输入当前登录密码"></div>'
    +       '<div class="form-row"><label class="f-label">新密码 <span class="req">*</span></label><input class="input" id="pwdNew" type="password" autocomplete="new-password" placeholder="至少 8 位，需同时包含字母与数字"></div>'
    +       '<div class="form-row"><label class="f-label">确认新密码 <span class="req">*</span></label><input class="input" id="pwdNew2" type="password" autocomplete="new-password" placeholder="请再次输入新密码"></div>'
    +       '<div class="pwd-err" id="pwdErr"></div>'
    +       '<button class="btn primary block" id="btnPwd" style="padding:9px">确认修改密码</button>'
    +     '</div></div>'
    +   '<div class="card"><div class="card-title">'+App.icon('user')+'账号信息</div>'
    +     '<div class="acct-row"><span class="k">登录账号</span><span class="mono">'+App.esc(me)+'</span></div>'
    +     '<div class="acct-row"><span class="k">参演角色</span><span>'+App.esc(role.name)+'</span></div>'
    +     '<div class="acct-row"><span class="k">所属单位/部门</span><span>'+App.esc(org)+'</span></div>'
    +     '<div class="card-title" style="margin-top:16px">'+App.icon('shield')+'密码规则</div>'
    +     '<ul class="pwd-rule">'
    +       '<li>长度不少于 8 位</li>'
    +       '<li>必须同时包含字母与数字</li>'
    +       '<li>不要与其他系统使用相同密码</li>'
    +       '<li>如忘记密码，请联系平台管理员在「系统基础管理 → 用户账号」中重置</li>'
    +     '</ul></div>'
    + '</div></div>';

  document.getElementById('btnHome').onclick = function(){ location.href = 'workbench.html'; };
  var err = function(m){ document.getElementById('pwdErr').textContent = m || ''; };
  var btn = document.getElementById('btnPwd');

  function submit(){
    var oldP = document.getElementById('pwdOld').value;
    var newP = document.getElementById('pwdNew').value;
    var newP2 = document.getElementById('pwdNew2').value;
    err('');
    if(!oldP){ err('请输入当前密码'); return; }
    if(newP.length < 8){ err('新密码长度不能少于 8 位'); return; }
    if(!/[A-Za-z]/.test(newP) || !/[0-9]/.test(newP)){ err('新密码需同时包含字母与数字'); return; }
    if(newP !== newP2){ err('两次输入的新密码不一致'); return; }
    if(newP === oldP){ err('新密码不能与当前密码相同'); return; }

    btn.disabled = true; btn.textContent = '提交中…';
    API.changePassword(oldP, newP).then(function(){
      App.toast('密码修改成功，请使用新密码重新登录','ok');
      btn.textContent = '修改成功';
      setTimeout(function(){
        API.logout().then(function(){ location.href = 'index.html'; }, function(){ location.href = 'index.html'; });
      }, 900);
    }).catch(function(e){
      btn.disabled = false; btn.textContent = '确认修改密码';
      err((e && e.message) || '密码修改失败，请稍后重试');
    });
  }

  btn.onclick = submit;
  ['pwdOld','pwdNew','pwdNew2'].forEach(function(id){
    document.getElementById(id).addEventListener('keydown', function(ev){ if(ev.key==='Enter') submit(); });
  });
});
App.boot('password');
</script>
</body>
</html>
