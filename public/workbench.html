<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>角色工作台 · 盘州市人民医院网络安全应急演练系统</title>
<link rel="icon" type="image/png" href="img/logo.png">
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="workbench">
<script src="system.js"></script>
<script src="app.js"></script>
<script src="api.js"></script>
<script>
document.addEventListener('app:ready', function(e){
  var role = e.detail.role;
  var page = document.getElementById('page');
  var proj = API.activeProject();
  var isExternal = !!role.external;
  var isPractical = proj.mode === '实战版';

  /* 各角色关注态势（工作台统一承载待办任务与处置执行） */
  var FEED = {
    commander:'messages', duty:'messages', netsec:'evidence', sysadmin:'impact', itlead:'messages',
    medlead:'impact', clinical:'impact', healthbureau:'docs', cac:'docs_opinion',
    cyberpolice:'docs', platformadmin:'audit'
  };
  var feed = FEED[role.id] || 'messages';

  /* 演练事件模拟数据：按当前项目场景取 SIM_DATA，供表单自动预填与自动取证截图（全部虚拟数据） */
  var SCEN = (MOCK.SCENARIOS||[]).filter(function(s){ return s.id===proj.scenarioId; })[0] || null;
  /* 剧本故障通报：演练开始后先弹窗展示，再在页面正上方固定显示；内容来自剧本编排「演练初始故障通报」 */
  var ALERT = String((SCEN && SCEN.alert) || '').trim()
    || (SCEN ? (SCEN.type+'事件：'+SCEN.desc) : '');
  var started = proj.status === '演练中';
  /* 实战版：可选下一节点接收角色 + 取证材料完成情况（未归档不允许结束演练） */
  var RECEIVERS = [];
  var EV = { done:0, total:0, pending:0, pendingItems:[] };
  var SIM = MOCK.SIM_DATA || {};
  var FACTS = (SCEN && SIM[SCEN.type]) || SIM['通用'] || {
    sys:'院内业务系统（模拟地址 10.20.x.x）', fault:'模拟故障现象（通用兜底，请按实际修改）',
    alert:'态势感知平台（模拟）：推送安全告警', ip:'10.20.x.x（模拟可疑IP）',
    sample:'模拟样本摘要（占位）', scope:'模拟范围（无真实业务影响）',
    action:'按预案模拟处置', progress:'按剧本推进中（模拟）',
    backup:'备份有效性校验（模拟）', impact:'无真实业务影响（模拟）', measure:'按预案启用纸质/人工兜底（模拟）'
  };

  function p2(n){ return n<10 ? '0'+n : String(n); }
  function fmtSize(b){ return b<1024 ? b+' B' : b<1048576 ? (b/1024).toFixed(1)+' KB' : (b/1048576).toFixed(1)+' MB'; }

  page.innerHTML =
    '<div class="page-head"><div><h1>'+App.esc(role.name)+' · 工作台</h1>'
    + '<div class="sub">'+App.esc(proj.name)+' · '+(isPractical?'实战版：自主研判处置':'基础版：按剧本流程逐步执行')+(isExternal?' · <span style="color:var(--warn)">外部单位受限视图</span>':'')+'</div></div>'
    + '<div class="acts">'
    + '<button class="btn" id="btnFault">'+App.icon('alert')+'查看故障通报</button>'
    + (isPractical && proj.status==='演练中' && ['commander','platformadmin','itlead'].indexOf(role.id)>=0
        ? '<button class="btn danger" id="btnFinish">'+App.icon('check')+'完成演练</button>' : '')
    + '<button class="btn" id="btnRefresh">'+App.icon('refresh')+'刷新</button></div></div>'
    + '<div id="wbFault"></div>'
    + '<div class="sim-banner">'+App.icon('alert')+'<span>工作台所有处置动作均为<b>演练模拟记录</b>（写入审计日志与取证模块），系统不会向医院真实网络、HIS/EMR等生产系统下发任何命令。</span></div>'
    + '<div class="wb-grid">'
    +   '<div class="card"><div class="card-title">'+App.icon('shield')+'岗位职责</div>'
    +     '<div class="kv">'
    +     '<span class="k">角色</span><span class="bold">'+App.esc(role.name)+' <span class="tag gray">'+App.esc(role.short)+'</span>'+(isExternal?' <span class="tag yellow">外部单位</span>':'')+'</span>'
    +     '<span class="k">职责描述</span><span class="small">'+App.esc(role.desc)+'</span>'
    +     '<span class="k">当前用户</span><span class="small">'+App.esc(App.curUser())+'</span>'
    +     '<span class="k">可见模块</span><span class="small muted">'+App.esc((role.nav||[]).length)+' 个（分级权限隔离）</span>'
    +     '</div>'
    +     (isExternal?'<div class="tiny dim mt3">依据分级权限策略：外部单位仅可查看医院主动上报的文书与公告材料，不可查看内网原始技术日志、告警明细与会商内部讨论。</div>':'')
    +   '</div>'
    +   '<div class="card"><div class="card-title">'+App.icon('tasks')+'角色待办任务<span class="more">'+(isPractical?'已发现故障 · 自主处置':'按剧本流程逐步执行')+'</span></div>'
    +     '<div id="wbTasks"><div class="small dim">加载中…</div></div></div>'
    +   '<div class="card"><div class="card-title">'+App.icon('score')+'演练评分<span class="more">'+(isPractical?'偏离/超时扣分':'时限达成率')+'</span></div><div id="wbScore" class="small dim">正在汇总…</div></div>'
    +   '<div class="card"><div class="card-title">'+App.icon('eye')+'本角色关注态势</div><div id="wbFeed"><div class="small dim">加载中…</div></div></div>'
    + '</div>';

  document.getElementById('btnRefresh').onclick = function(){
    App.toast('正在刷新工作台数据…','ok');
    if(isPractical){ renderPractical(); renderScore(); } else { renderBasic(); renderScore(); }
  };

  /* ---------- 关联剧本节点 ---------- */
  function nodeForTask(t){
    var list = MOCK.SCRIPT_NODES || [];
    var n = t.nodeId ? list.filter(function(x){ return x.id===t.nodeId; })[0] : null;
    if(n) return n;
    if(t.forms && t.forms.length) n = list.filter(function(x){ return x.form===t.forms[0]; })[0];
    return n || null;
  }

  /* ---------- 表单字段解析与分步填写向导 ---------- */
  function fieldOf(fl){
    if(typeof fl === 'string') return { label:String(fl||'').trim(), hint:'', required:true, type:'auto', options:[] };
    return {
      label:String((fl&&(fl.label||fl.name))||'').trim(),
      hint:String((fl&&fl.hint)||''),
      required:!(fl&&fl.required===false),
      type:(fl&&fl.type)||'auto',
      options:Array.isArray(fl&&fl.options)?fl.options.slice():(typeof (fl&&fl.options)==='string'?fl.options.split(/[、,，|｜]/).map(function(s){return String(s).trim();}).filter(Boolean):[])
    };
  }
  function wizFields(raw){
    return (raw||[]).map(fieldOf).filter(function(x){ return !!x.label; });
  }
  /* 控件类型：模板显式指定优先，否则按字段名识别 */
  function wizType(f){
    if(f.type==='select' && f.options && f.options.length) return 'select';
    if(f.type==='textarea' || f.type==='text' || f.type==='datetime') return f.type;
    if(/时间$|日期$/.test(f.label)) return 'datetime';
    if(/说明|描述|意见|摘要|进展|清单|方案|依据|经过|情况|范围|措施|过程|计划|整改|现象|判断|趋势|建议|次数/.test(f.label)) return 'textarea';
    return 'text';
  }
  /* 下拉值归一：模拟/预填数据必须落在选项范围内（忽略空格差异，允许包含匹配） */
  function fitOption(opts, v){
    v = String(v||'').trim();
    var norm = function(x){ return String(x||'').replace(/\s+/g,''); };
    if(!v || !opts || !opts.length) return '';
    if(opts.indexOf(v) >= 0) return v;
    for(var i=0;i<opts.length;i++){ if(norm(opts[i]) === norm(v)) return opts[i]; }
    for(var j=0;j<opts.length;j++){
      var o = norm(opts[j]);
      if(o && (o.indexOf(norm(v)) >= 0 || norm(v).indexOf(o) >= 0)) return opts[j];
    }
    return '';
  }

  /* ---------- 表单字段模拟值（按剧本与场景生成，全部为虚拟数据） ---------- */
  function simValue(fd, t, node){
    var d = new Date();
    var tm = (node && node.time) || t.deadline || '09:00';
    if(/起止/.test(fd)) return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+' '+tm+' 至 '+(parseInt(tm,10)+1)+':30（模拟）';
    if(/时间|日期/.test(fd)) return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+'T'+tm;
    if(/发现方式/.test(fd)) return String(FACTS.alert||'').split('：')[0] || '安全告警系统';
    if(/受攻击系统|受影响系统|涉及系统/.test(fd)) return FACTS.sys;
    if(/IP|域名/i.test(fd)) return FACTS.ip;
    if(/基本情况|事件经过/.test(fd)) return (SCEN?SCEN.desc:FACTS.fault)+'；发现方式：'+FACTS.alert+'（模拟数据，请核对修改）';
    if(/现场处置过程|处置过程/.test(fd)) return '1. 接报后初步核实并留存告警截图；2. 隔离受影响主机（'+FACTS.ip+'）；3. 封堵攻击源并保留取证记录（模拟处置）';
    if(/事件处置结果|处置结果/.test(fd)) return '受影响业务已恢复，故障现象消除，未发现数据外泄（模拟结果，请核对）';
    if(/整改|工作计划/.test(fd)) return '1. 修补漏洞并更新防护策略；2. 完善备份与恢复演练；3. 责任部门：信息科，7 个工作日内完成复查（模拟计划）';
    if(/异常现象|描述|现象/.test(fd)) return FACTS.fault;
    if(/判断/.test(fd)) return '结合告警与样本特征（'+FACTS.sample+'），初步判定为'+(SCEN?SCEN.type:'模拟')+'类事件（模拟判定）';
    if(/核实人|确认人|审批人|联系人|报送人|填报人|研判人|报案人|评估人/.test(fd)) return App.curUser()||role.short;
    if(/影响范围|范围/.test(fd)) return FACTS.scope;
    if(/进展/.test(fd)) return FACTS.progress;
    if(/建议响应等级/.test(fd)){
      var lv = (SCEN&&SCEN.level)||t.level||'较大';
      return lv==='特别重大'?'Ⅰ级':(lv==='重大'?'Ⅱ级':(lv==='较大'?'Ⅲ级':'Ⅳ级'));
    }
    if(/风险等级/.test(fd)) return '低';
    if(/等级/.test(fd)) return (SCEN&&SCEN.level)||t.level||'较大';
    if(/类型/.test(fd)) return SCEN?SCEN.type:'模拟事件';
    if(/单位/.test(fd)) return (proj.units&&proj.units[0])||'盘州市人民医院';
    if(/摘要|依据/.test(fd)) return (SCEN?SCEN.desc:FACTS.fault)+'（系统自动填充，请核对修改）';
    if(/患者数/.test(fd)) return '0（虚拟数据，无真实患者）';
    if(/损失/.test(fd)) return FACTS.impact;
    if(/证据清单/.test(fd)) return FACTS.sample+'、告警与故障截图（自动取证）';
    if(/校验|备份/.test(fd)) return FACTS.backup;
    if(/验证结果|结果/.test(fd)) return '业务功能验证通过（模拟，无真实影响）';
    if(/兜底|方案/.test(fd)) return FACTS.measure;
    if(/措施/.test(fd)) return FACTS.action;
    if(/意见/.test(fd)) return '同意，按预案执行（模拟审批）';
    if(/监测渠道/.test(fd)) return '网信办舆情监测、院内值班巡查（模拟）';
    if(/传播趋势/.test(fd)) return '传播缓慢，未发现大范围扩散（模拟）';
    if(/口径建议/.test(fd)) return '统一由院宣传部门答复，不透露患者信息（模拟口径）';
    if(/恢复系统/.test(fd)) return FACTS.sys;
    if(/清单/.test(fd)) return FACTS.sys;
    return '模拟数据·自动填充';
  }

  /* 向导状态：key → { fields, values, step, done } */
  var WIZ = {};
  function wizState(key, fields, t, node, prefill){
    if(!WIZ[key]) WIZ[key] = { fields: fields, values: {}, step: 0, done: false, inited: false, t: t, node: node };
    var s = WIZ[key];
    s.fields = fields; s.t = t; s.node = node;
    if(!s.inited){
      fields.forEach(function(f){
        var v = prefill ? String(simValue(f.label, t, node)||'') : '';
        if(prefill && wizType(f) === 'select' && f.options.length){
          v = fitOption(f.options, v) || f.options[0];
        }
        s.values[f.label] = v;
      });
      s.inited = true;
    }
    return s;
  }

  /* 在容器内渲染分步填写向导：逐字段展示说明，支持一键模拟数据与上一步/下一步 */
  function mountWizard(host, key, opts){
    var fields = wizFields(opts.fields);
    if(!fields.length){ host.innerHTML = ''; return null; }
    var s = wizState(key, fields, opts.t, opts.node, !!opts.prefill);
    var name = opts.name || '表单';

    function paint(){
      if(s.done){
        host.innerHTML = '<div class="wz-head"><span class="bold">'+App.esc(name)+'</span><span class="tag green">已完成 '+fields.length+' / '+fields.length+'</span></div>'
          + '<div class="wz-sum">' + fields.map(function(f){
              var dv = String(s.values[f.label]||'—');
              if(wizType(f) === 'datetime') dv = dv.replace('T',' ');
              return '<div class="wz-item"><span class="k">'+App.esc(f.label)+'</span><span class="v">'+App.esc(dv)+'</span></div>';
            }).join('') + '</div>'
          + '<div class="wz-acts"><button class="btn sm" data-edit>'+App.icon('edit')+'返回修改</button><span class="grow"></span><span class="tiny dim">已逐字段完成填写，可提交</span></div>';
        host.querySelector('[data-edit]').onclick = function(){ s.done = false; s.step = 0; paint(); };
        return;
      }
      var f = fields[s.step];
      var type = wizType(f);
      var val = String(s.values[f.label]||'');
      var ctl;
      if(type === 'select'){
        ctl = '<select class="input" id="wzInp"><option value="">请选择</option>'
          + f.options.map(function(o){ return '<option value="'+App.esc(o)+'"'+(val===o?' selected':'')+'>'+App.esc(o)+'</option>'; }).join('')
          + '</select>';
      } else if(type === 'datetime'){
        ctl = '<input class="input" id="wzInp" type="datetime-local" step="60" value="'+App.esc(val)+'">'
          + '<div class="tiny dim mt2">'+App.icon('clock')+' 使用日期时间选择器填写，统一为 YYYY-MM-DD HH:mm 格式</div>';
      } else {
        ctl = type === 'textarea'
          ? '<textarea class="textarea" id="wzInp" rows="3" placeholder="请按字段说明填写">'+App.esc(val)+'</textarea>'
          : '<input class="input" id="wzInp" value="'+App.esc(val)+'" placeholder="请按字段说明填写">';
      }
      host.innerHTML = '<div class="wz-head"><span class="bold">'+App.esc(name)+'</span><span class="tiny dim">字段 '+(s.step+1)+' / '+fields.length+'</span></div>'
        + '<div class="wz-bar"><i style="width:'+Math.round((s.step+1)/fields.length*100)+'%"></i></div>'
        + '<div class="wz-hint"><b>字段说明</b><span>'+(f.hint?App.esc(f.hint):'请按实际情况填写')+'</span></div>'
        + '<label class="f-label" style="display:block;margin:8px 0 4px">'+App.esc(f.label)+(f.required?'<span class="req"> *</span>':'<span class="tiny dim">（选填）</span>')+'</label>'
        + ctl
        + '<div class="wz-acts"><button class="btn sm" data-sim>'+App.icon('refresh')+'一键模拟数据</button><span class="grow"></span>'
        + '<button class="btn sm" data-prev'+(s.step===0?' disabled':'')+'>上一步</button>'
        + '<button class="btn primary sm" data-next>'+(s.step===fields.length-1?'完成填写':'下一步')+'</button></div>'
        + '<div class="tiny dim mt2">一键模拟数据按当前演练剧本与场景生成（虚拟数据），请核对修改后提交。</div>';

      var inp = host.querySelector('#wzInp');
      if(inp){
        inp.oninput = function(){ s.values[f.label] = inp.value; };
        if(type === 'select' || type === 'datetime') inp.onchange = function(){ s.values[f.label] = inp.value; };
      }

      host.querySelector('[data-sim]').onclick = function(){
        fields.forEach(function(x){
          var v = String(simValue(x.label, opts.t, opts.node)||'');
          /* 下拉控件必须落在选项范围内，避免生成非法值 */
          if(wizType(x) === 'select' && x.options.length && x.options.indexOf(v) < 0){
            v = fitOption(x.options, v) || x.options[0];
          }
          s.values[x.label] = v;
        });
        paint();
        App.toast('已按剧本生成模拟数据，请逐字段核对修改','ok');
      };
      var prev = host.querySelector('[data-prev]');
      if(prev) prev.onclick = function(){ if(s.step>0){ s.step--; paint(); } };
      host.querySelector('[data-next]').onclick = function(){
        var v = String(s.values[f.label]||'').trim();
        if(f.required && !v){ App.toast('请填写「'+f.label+'」后再继续','err'); return; }
        if(s.step < fields.length-1){ s.step++; paint(); }
        else { s.done = true; paint(); }
      };
    }
    paint();
    return s;
  }

  /* 基础版表单：逐字段引导填写（初始按剧本自动填充模拟数据） */
  function formsHtml(t, node){
    var forms = (t.forms||[]).map(function(fid){
      return (MOCK.FORM_TEMPLATES||[]).filter(function(f){ return f.id===fid; })[0];
    }).filter(Boolean);
    if(!forms.length) return '';
    return '<div class="section-title mt3">'+App.icon('edit')+'需提交表单 <span class="tiny dim" style="font-weight:400">已按场景【'+App.esc(SCEN?SCEN.type:'通用')+'】生成模拟数据，请按字段说明逐项核对</span></div>'
      + forms.map(function(f, fi){
          var key = 'b-'+t.id+'-'+f.id;
          return '<div class="card mb3" style="padding:12px 14px"><div class="small bold mb2">'+App.esc(f.name)+' <span class="tag gray">'+f.id+'</span></div>'
            + '<div class="wz-host" data-wz="'+App.esc(key)+'" data-wzfid="'+App.esc(f.id)+'"></div>'
            + '<div class="flex gap3 mt3" style="align-items:center;flex-wrap:wrap"><button class="btn primary sm" data-form="'+t.id+'|'+fi+'">'+App.icon('upload')+'提交表单（模拟）</button>'
            + '<span class="tiny dim">点击「下一步」逐字段填写并核对，完成全部字段后可提交</span></div></div>';
        }).join('');
  }

  /* ---------- 基础版：仅显示当前正确流程，完成后进入下一步 ---------- */
  function stepCard(t, node, idx, total){
    var action = node ? (node.action || '应急处置') : '应急处置';
    var desc = node ? node.desc : (t.desc || '按预案完成本岗处置');
    var guide = node ? node.guide : '';
    var limit = (node && node.timeout) ? node.timeout+' 分钟' : '—';
    return '<div class="section-title">'+App.icon('flow')+'当前步骤 '+idx+' / '+total+' <span class="tiny dim" style="font-weight:400">完成本步骤后自动进入下一流程</span></div>'
      + '<div class="card" style="padding:14px 16px;border-color:rgba(47,129,247,.35)">'
      +   '<div class="flex" style="justify-content:space-between;align-items:flex-start;gap:10px">'
      +     '<div><div class="small bold">'+App.esc(t.title)+'</div>'
      +     '<div class="tk-meta mt2"><span class="mono">'+App.esc(t.id)+'</span><span class="mono">计划 '+App.esc(node&&node.time||t.deadline||'—')+'</span><span>时限 '+limit+'</span>'+App.levelTag(t.level)+'</div></div>'
      +     App.statusTag(t.status)+'</div>'
      +   '<div class="kv mt3">'
      +     '<span class="k">处置动作</span><span class="bold">'+App.esc(action)+'</span>'
      +     '<span class="k">处置内容</span><span class="small" style="line-height:1.75">'+App.esc(desc)+'</span>'
      +     (node&&node.receiver?'<span class="k">下一节点接收人</span><span class="bold">'+App.esc(node.receiver)+' <span class="tag gray">剧本预设</span></span>':'')
      +   '</div>'
      +   (guide?'<div class="tiny mt3" style="color:var(--accent2);line-height:1.8">'+App.icon('flow')+' 引导：'+App.esc(guide)+'</div>':'')
      +   '<div class="section-title mt3">需完成事项</div>'
      +   '<div class="small" style="line-height:1.95">1. 按引导提示完成本节点处置动作<br>'

  /* 列表行：完成态可查看归档记录，当前步点击打开完整处置表单弹窗 */
  function basicRow(t, node, state, idx, total){
    var done = state === 'done';
    var meta = '<span class="mono">'+App.esc(t.id)+'</span>'
      + '<span>计划 '+App.esc((node&&node.time)||t.deadline||'—')+'</span>'
      + (node&&node.timeout?'<span>时限 '+node.timeout+' 分钟</span>':'')
      + (node&&node.action?'<span>'+App.esc(node.action)+'</span>':'');
    return '<div class="tn-row '+(done?'done':'cur')+'" data-'+(done?'view':'open')+'="'+App.esc(t.id)+'" role="button" tabindex="0">'
      + '<span class="tn-ic">'+(done?App.icon('check'):App.icon('alert'))+'</span>'
      + '<div class="tn-main"><div class="tn-title">'+App.esc(t.title)+'</div><div class="tn-meta">'+meta+'</div></div>'
      + (done?'<span class="tag green">已完成</span>':'<span class="tag red">当前步骤 '+idx+' / '+total+'</span>')
      + '<span class="tn-go">'+(done?'查看归档记录 ›':'打开处置表单 ›')+'</span></div>';
  }

  function renderBasic(){
    var host = document.getElementById('wbTasks');
    host.innerHTML = '<div class="small dim">正在加载本角色待办任务…</div>';
    API.getTasks().then(function(ts){
      var mine = (ts||[]).filter(function(t){ return t.projectId===proj.id && t.role===role.id; });
      if(!mine.length){
        host.innerHTML = '<div class="empty">'+App.icon('check')+'<div>本角色暂无待办任务</div><div class="tiny dim mt2">剧本基线中未分配本角色节点，或任务已完成</div></div>';
        return;
      }
      var done = mine.filter(function(t){ return t.status==='已完成'; });
      var idx = -1;
      for(var i=0;i<mine.length;i++){ if(mine[i].status!=='已完成'){ idx=i; break; } }
      var head = '<div class="tiny dim" style="margin-bottom:10px">本角色流程进度 <b>'+done.length+' / '+mine.length+'</b> 步 · 点击列表行打开完整处置表单（弹窗形式）</div>';
      var rows = done.map(function(t){ return basicRow(t, nodeForTask(t), 'done', 0, mine.length); }).join('');
      if(idx<0){
        host.innerHTML = head + '<div class="task-nav">'+rows+'</div>'
          + '<div class="empty mt3">'+App.icon('check')+'<div>本角色负责的流程已全部完成</div><div class="tiny dim mt2">可前往复盘评估查看时限达成情况</div></div>';
      } else {
        rows += basicRow(mine[idx], nodeForTask(mine[idx]), 'cur', idx+1, mine.length);
        host.innerHTML = head + '<div class="task-nav">'+rows+'</div>'
          + '<div class="tiny dim mt2">当前步骤需点开弹窗核对处置动作、提交表单与附件；完成后列表自动推进到下一步。</div>';
      }
      host.querySelectorAll('[data-open]').forEach(function(row){
        row.onclick = function(){
          var t = mine.filter(function(x){ return String(x.id)===String(row.dataset.open); })[0];
          if(t) openBasicTask(t, idx+1, mine.length);
        };
      });
      host.querySelectorAll('[data-view]').forEach(function(row){
        row.onclick = function(){
          var t = mine.filter(function(x){ return String(x.id)===String(row.dataset.view); })[0];
          if(t) openBasicDone(t);
        };
      });
    }).catch(function(err){
      host.innerHTML = '<div class="tiny dim">'+App.esc((err&&err.message)||'任务加载失败')+'</div>';
    });
  }

  function bindBasic(t, host, onDone){
    var forms = (t.forms||[]).map(function(fid){
      return (MOCK.FORM_TEMPLATES||[]).filter(function(f){ return f.id===fid; })[0];
    }).filter(Boolean);

    /* 表单改为分步向导：初始按剧本预填模拟数据 */
    var node = nodeForTask(t);
    host.querySelectorAll('[data-wz]').forEach(function(h){
      var fid = h.dataset.wzfid;
      var f = forms.filter(function(x){ return x.id===fid; })[0];
      if(!f) return;
      mountWizard(h, h.dataset.wz, { name:f.name, fields:f.fields, t:t, node:node, prefill:true });
    });

    host.querySelectorAll('[data-form]').forEach(function(b){
      b.onclick = function(){
        var parts = b.dataset.form.split('|');
        var fi = +parts[1];
        var f = forms[fi];
        if(!f) return;
        var key = 'b-'+t.id+'-'+f.id;
        var st = WIZ[key];
        if(!st){ App.toast('表单尚未加载完成，请关闭后重新打开','err'); return; }
        if(!st.done){ App.toast('请先按「下一步」逐字段完成《'+f.name+'》填写','err'); return; }
        var data = {}, missing = [];
        st.fields.forEach(function(fd){
          var v = String(st.values[fd.label]||'').trim();
          if(wizType(fd) === 'datetime') v = v.replace('T',' ');
          if(fd.required && !v) missing.push(fd.label);
          else if(v) data[fd.label] = v;
        });
        if(missing.length){ App.toast('《'+f.name+'》仍有必填项：'+missing.slice(0,3).join('、'),'err'); return; }
        b.disabled = true; b.textContent = '提交中…';
        API.submitForm(t.id, f.id, data).then(function(){
          b.disabled = false; b.innerHTML = App.icon('upload')+'重新提交表单';
          App.toast('《'+f.name+'》已提交并归档至取证模块','ok');
        }).catch(function(err){
          b.disabled = false; b.innerHTML = App.icon('upload')+'提交表单（模拟）';
          App.toast((err&&err.message)||'表单提交失败','err');
        });
      };
    });

    host.querySelectorAll('[data-att]').forEach(function(b){
      b.onclick = function(){ openAttUpload(t, host); };
    });
    var attBox = host.querySelector('#watt-'+t.id);
    if(attBox) attBox.onclick = function(ev){
      var chip = ev.target.closest ? ev.target.closest('.att-img') : null;
      if(!chip) return;
      var im = chip.querySelector('img');
      if(!im) return;
      App.modal({ title:'证据预览 · '+t.id, wide:true,
        body:'<img src="'+im.src+'" style="max-width:100%;display:block;border-radius:6px">',
        foot:'<button class="btn" id="pvNo">关闭</button>',
        onOpen:function(m){ m.querySelector('#pvNo').onclick = m.close; } });
    };

    var fin = host.querySelector('[data-finish]');
    if(fin) fin.onclick = function(){
      App.confirmSim('确认完成「'+t.title+'」？完成后归档并自动进入下一流程（演练模拟）。', function(){
        fin.disabled = true; fin.textContent = '提交中…';
        var chain = Promise.resolve();
        if(t.status==='待处理'||t.status==='超时') chain = chain.then(function(){ return API.acceptTask(t.id); });
        chain.then(function(){ return API.submitTask(t.id, '基础版按引导流程完成本节点处置'); })
          .then(function(){ return API.completeTask(t.id); })
          .then(function(){
            App.toast('本步骤已完成，演练流程进入下一步','ok');
            App.refreshShell();
            if(onDone) onDone(); else { renderBasic(); renderScore(); }
          })
          .catch(function(err){
            fin.disabled = false; fin.innerHTML = App.icon('check')+'完成本步骤，进入下一流程';
            App.toast((err&&err.message)||'操作失败','err');
          });
      });
    };
  }

  /* ---------- 附件与截图取证 ---------- */
  var BAD_EXT = /\.(exe|bat|cmd|vbs|scr|msi|com|pif|jar)$/i;
  var IMG_EXT = /\.(png|jpe?g|gif|bmp|webp|svg)$/i;
  var MAX_MB = 20;

  function guessType(name, mime){
    var n = String(name||'').toLowerCase();
    if(/^image\//.test(mime||'') || IMG_EXT.test(n)) return '截图';
    if(/\.(pcap|cap|pcapng)$/.test(n)) return '流量包摘要';
    if(/\.(log|txt|csv)$/.test(n)) return '日志片段';
    if(/\.(cfg|conf|ini|yaml|yml|json)$/.test(n)) return '配置备份';
    return '文档';
  }
  function attHtml(t){
    return (t.atts||[]).map(function(a){
      var auto = (a.by==='系统自动' || a.auto) ? '⚙ ' : '';
      var nm = App.esc(a.name||'附件');
      var meta = (a.time?a.time+' · ':'')+(a.by||'')+(a.size?(' · '+a.size):'');
      if(a.by==='系统自动' || a.auto) meta = '自动生成 · '+meta;
      var isImg = a.url && (/^data:image/.test(a.url) || /\.(png|jpe?g|gif|webp|bmp)$/i.test(String(a.url).split('?')[0]));
      if(isImg){
        return '<span class="file-chip att-img" title="点击放大预览" style="padding:4px 8px 4px 4px;cursor:pointer"><img src="'+App.esc(a.url)+'" alt="" style="width:56px;height:40px;object-fit:cover;border-radius:4px;display:block;flex:none">'+auto+nm+'<span class="fc-size">'+meta+'</span></span>';
      }
      var dl = a.url ? ' <a href="'+App.esc(a.url)+'" target="_blank" rel="noopener" style="color:var(--accent2);margin-left:4px">下载</a>' : '';
      return '<span class="file-chip">'+App.icon('file')+auto+nm+'<span class="fc-size">'+meta+'</span>'+dl+'</span>';
    }).join('') || '<span class="small dim">暂无附件</span>';
  }
  function refreshAtt(t, host){
    var box = host && host.querySelector ? host.querySelector('#watt-'+t.id) : null;
    if(box) box.innerHTML = attHtml(t);
  }
  function pushAutoAtt(t, att, host){
    API.addEvidence({ type: att.type || '截图', name: att.name, size: att.size || '-',
      taskId: t.id, auto: true, asAttachment: true, dataUrl: att.url }).then(function(r){
      var rec = { id: r.attId, name: att.name, type: att.type || '截图', size: r.size || att.size || '-',
        url: r.url || att.url, by: '系统自动', time: att.time, auto: true };
      t.atts = t.atts || [];
      var dup = t.atts.filter(function(x){ return x && x.name === att.name; })[0];
      if(dup){ dup.url = rec.url; dup.size = rec.size; } else t.atts.push(rec);
      refreshAtt(t, host);
    }).catch(function(){});
  }
  function openAttUpload(t, host){
    var picked = [];
    App.modal({ title:'上传证据附件 · '+t.id,
      body:'<div class="sim-banner">'+App.icon('alert')+'<span>真实文件上传：可选择本地证据文件，或直接<b>屏幕截图</b>取证。<b>严禁上传可执行程序/脚本/恶意样本</b>，单文件限 '+MAX_MB+'MB。</span></div>'
        + '<div class="flex wrap gap2 mb3">'
        + '<button class="btn primary" id="attPick">'+App.icon('file')+'选择文件</button>'
        + '<button class="btn" id="attShot">'+App.icon('camera')+'屏幕截图</button>'
        + '<input type="file" id="attFile" multiple style="display:none">'
        + '</div>'
        + '<div id="attList" class="small muted">尚未选择文件</div>',
      foot:'<button class="btn" id="attNo">取消</button><button class="btn primary" id="attYes">'+App.icon('upload')+'上传归档</button>',
      onOpen:function(ov){
        var listBox = ov.querySelector('#attList');
        var fileIn = ov.querySelector('#attFile');
        function renderPicked(){
          if(!picked.length){ listBox.innerHTML = '<span class="small muted">尚未选择文件</span>'; return; }
          listBox.innerHTML = picked.map(function(p){
            var bad = BAD_EXT.test(p.name) ? ' <span style="color:var(--err)">不允许的类型</span>' : (p.size>MAX_MB*1048576 ? ' <span style="color:var(--err)">超出'+MAX_MB+'MB</span>' : ' <span class="tag green">通过校验</span>');
            return '<div style="padding:6px 0;border-bottom:1px dashed var(--line)">'+App.esc(p.name)+' · '+fmtSize(p.size)+bad+'</div>';
          }).join('');
        }
        ov.querySelector('#attPick').onclick = function(){ fileIn.click(); };
        fileIn.onchange = function(){
          Array.prototype.forEach.call(fileIn.files||[], function(f){ picked.push(f); });
          renderPicked();
        };
        ov.querySelector('#attShot').onclick = function(){
          if(!(navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia)){
            App.toast('当前浏览器不支持屏幕截图，请使用“选择文件”上传截图','err'); return;
          }
          navigator.mediaDevices.getDisplayMedia({video:true}).then(function(stream){
            var video = document.createElement('video');
            video.muted = true; video.srcObject = stream;
            video.onloadedmetadata = function(){
              video.play();
              setTimeout(function(){
                var c = document.createElement('canvas');
                c.width = video.videoWidth || 1280; c.height = video.videoHeight || 720;
                c.getContext('2d').drawImage(video, 0, 0, c.width, c.height);
                stream.getTracks().forEach(function(tr){ tr.stop(); });
                var url = c.toDataURL('image/png');
                var nm = '屏幕截图-'+t.id+'-'+p2(new Date().getHours())+p2(new Date().getMinutes())+p2(new Date().getSeconds())+'.png';
                pushAutoAtt(t, { name:nm, time:new Date().toTimeString().slice(0,5), type:'截图', size:fmtSize(Math.round(url.length*0.75)), url:url }, host);
                App.toast('屏幕截图已归档为证据附件','ok');
                ov.close();
              }, 350);
            };
            video.onerror = function(){ App.toast('截图失败：无法读取屏幕画面','err'); };
          }, function(){});
        };
        ov.querySelector('#attNo').onclick = ov.close;
        ov.querySelector('#attYes').onclick = function(){
          if(!picked.length){ App.toast('请先选择文件','err'); return; }
          var valid = [], rejected = 0;
          picked.forEach(function(f){
            if(BAD_EXT.test(f.name) || f.size>MAX_MB*1048576) rejected++;
            else valid.push(f);
          });
          if(!valid.length){ App.toast('所选文件均未通过类型/大小校验','err'); return; }
          var fd = new FormData();
          valid.forEach(function(f){ fd.append('files', f); });
          API.uploadTaskAttachments(t.id, fd).then(function(r){
            var list = r.attachments || [];
            t.atts = t.atts || [];
            list.forEach(function(a){ t.atts.push(a); });
            refreshAtt(t, host);
            ov.close();
            App.toast(list.length+' 个附件已上传并归档至取证模块'+(rejected?('，'+rejected+' 个被拦截'):''), rejected?'warn':'ok');
          }).catch(function(err){ App.toast((err&&err.message)||'上传失败','err'); });
        };
      } });
  }

  /* ---------- 自动取证截图（canvas 本地绘制模拟界面） ---------- */
  function wrapLines(g, text, maxW){
    var lines = [], cur = '', chars = String(text||'').split('');
    for(var i=0;i<chars.length;i++){
      var trial = cur + chars[i];
      if(g.measureText(trial).width > maxW && cur){ lines.push(cur); cur = chars[i]; }
      else cur = trial;
    }
    if(cur) lines.push(cur);
    return lines;
  }

      g.fillStyle='#f6f8fa'; g.fillRect(60,74,520,178);

      g.beginPath(); g.arc(96,112,16,0,Math.PI*2); g.fillStyle='#f85149'; g.fill();
      g.strokeStyle='#ffffff'; g.lineWidth=3;
      g.beginPath(); g.moveTo(89,105); g.lineTo(103,119); g.moveTo(103,105); g.lineTo(89,119); g.stroke();
      g.fillStyle='#1f2328'; g.font='bold 15px "Microsoft YaHei",sans-serif';
      g.fillText('系统连接异常（模拟故障界面）',124,117);

      lines = wrapLines(g, FACTS.fault, 470);
      y = 146;
      for(i=0;i<lines.length;i++){ g.fillText(lines[i],80,y); y+=19; }
      g.fillStyle='#2f81f7'; g.fillRect(368,214,96,28);
      g.fillStyle='#ffffff'; g.font='13px "Microsoft YaHei",sans-serif';
      g.fillText('重试连接',392,232);

  var autoDone = {};
  function ensureAutoAtts(t, host){

     { name:'自动取证-系统故障截图-'+t.id+'.png', kind:'fault' }].forEach(function(s){

  /* ---------- 实战版：本角色全部候选处置流程（正确流程与混淆流程外观一致） ---------- */
  function flowRow(d){
    var sub = d.submitted;
    var skipped = !!(sub && sub.skipped);
    var statusTag = skipped
      ? '<span class="tag gray">已跳过</span>'
      : (sub
        ? '<span class="tag '+(sub.correct?'green':'red')+'">已提交</span>'
        : '<span class="tag red">待处置</span>');
    var meta = '<span class="mono">计划 '+App.esc(d.time||'—')+'</span>'
      + (d.timeout?'<span>时限 '+d.timeout+' 分钟</span>':'')
      + (d.action?'<span>'+App.esc(d.action)+'</span>':'')
      + (d.formName?'<span>表单：'+App.esc(d.formName)+'</span>':'');
    return '<div class="tn-row '+(sub?'done':'cur')+'" data-flow="'+App.esc(d.nodeId)+'" role="button" tabindex="0">'
      + '<span class="tn-ic">'+(sub?App.icon('check'):App.icon('alert'))+'</span>'
      + '<div class="tn-main"><div class="tn-title">'+App.esc(d.title||d.action||'处置流程')+'</div>'
      + '<div class="tn-meta">'+meta+'</div></div>'
      + statusTag
      + (!sub ? '<button class="btn sm outline" data-skip="'+App.esc(d.nodeId)+'" title="判定该流程不属于本岗处置动作，不执行">跳过（不执行）</button>' : '')
      + '<span class="tn-go">'+(skipped?'查看跳过记录 ›':(sub?'查看处置记录 ›':'填写处置表单 ›'))+'</span></div>';
  }

        + '<div class="form-grid">'+recv+'</div>'

  function openFlow(d){
    var sub = d.submitted;
    App.modal({
      title:'处置流程 · '+App.esc(d.title||d.action||'系统故障'),
      wide:true,
      body:'<div class="fm-strip">'+App.icon('alert')+'<span><b>'+App.esc(d.title||'')+'</b><br>'+App.esc(d.desc||'请结合故障通报研判本流程是否属于本岗正确处置动作')+'</span></div>'
        + '<div class="kv mb3"><span class="k">计划时刻</span><span class="mono">'+App.esc(d.time||'—')+'</span>'
        + '<span class="k">节点时限</span><span>'+(d.timeout?d.timeout+' 分钟':'—')+'</span>'
        + '<span class="k">责任角色</span><span>'+App.esc(d.target||'—')+'</span></div>'
        + '<div id="wbFlowBody">'+(sub?flowDoneBody(d):flowForm(d))+'</div>',
      foot:'<button class="btn" id="wbFlowClose">关闭</button>'+(sub?'':'<button class="btn primary" id="wbFlowSubmit">'+App.icon('check')+'提交处置记录</button>'),
      onOpen:function(ov){
        ov.querySelector('#wbFlowClose').onclick = ov.close;
        if(sub) return;
        /* 打开处置表单即标记为处置中（导调中心同步展示） */
        if(d.nodeId) API.startNode(d.nodeId).catch(function(){});
        var box = ov.querySelector('#wbFlowBody');
        /* 模板字段改为分步向导：实战版初始为空表，字段说明引导填写，可一键生成模拟数据 */
        var wizHost = box.querySelector('#pfWiz');
        var wkey = 'p-'+proj.id+'-'+d.nodeId;
        if(wizHost) mountWizard(wizHost, wkey, {
          name: d.formName || '实战处置表单', fields: d.fields,
          t: { id: d.nodeId, deadline: d.time, level: '' }, node: { time: d.time }, prefill: false
        });
        box.insertAdjacentHTML('beforeend','<div class="divider"></div>'
          + '<div class="form-grid">'
          + '<div class="form-row span2"><label class="f-label">发现情况 <span class="tiny dim">（可选）</span></label><textarea class="textarea" id="flFound" rows="2" placeholder="记录观察到的异常现象、涉及主机/IP、影响范围等"></textarea></div>'
          + '<div class="form-row span2"><label class="f-label">实际处置措施 <span class="req">*</span> <span class="tiny dim">不少于6字</span></label><textarea class="textarea" id="flMeasure" rows="2" placeholder="如实记录本流程实际执行的动作"></textarea></div>'
          + '<div class="form-row span2"><label class="f-label">处置结果 <span class="req">*</span></label><input class="input" id="flResult" placeholder="如：已隔离2台主机，业务验证恢复正常"></div>'
          + '<div class="form-row span2"><label class="f-label">证据材料说明 <span class="tiny dim">（可选）</span></label><input class="input" id="flEvidence" placeholder="如：已截图并归档至取证模块"></div>'
          + '</div>'
          + '<div class="tiny dim mt2">实战版不提供预填数据与正确流程提示：请自行研判该流程是否属于本岗正确处置动作。误选混淆流程按该流程分值直接扣分；正确流程超时完成按分值的 90% 计分。表单可按字段说明逐项填写，也可一键生成模拟数据后核对修改。</div>');
        var btn = ov.querySelector('#wbFlowSubmit');
        btn.onclick = function(){
          var forms = {}, missing = [];
          var wst = wizFields(d.fields).length ? WIZ[wkey] : null;
          if(wst){
            if(!wst.done){ App.toast('请先按「下一步」逐字段完成表单填写','err'); return; }
            wst.fields.forEach(function(f){
              var v = String(wst.values[f.label]||'').trim();
              if(wizType(f) === 'datetime') v = v.replace('T',' ');
              if(f.required && !v) missing.push(f.label);
              else if(v) forms[f.label] = v;
            });
          }
          var measure = box.querySelector('#flMeasure').value.trim();
          var result = box.querySelector('#flResult').value.trim();
          var evidence = box.querySelector('#flEvidence').value.trim();
          var found = box.querySelector('#flFound').value.trim();
          var receiverBox = box.querySelector('#flReceiverBox');
          var receivers = receiverBox
            ? Array.prototype.slice.call(receiverBox.querySelectorAll('input:checked')).map(function(c){ return c.value; })
            : [];
          if(!receivers.length){ App.toast('请选择下一节点接收人（可多选）','err'); return; }
          if(missing.length){ App.toast('请完整填写表单：'+missing.slice(0,3).join('、'),'err'); return; }
          if(measure.length<6){ App.toast('实际处置措施不少于6字','err'); return; }
          if(!result){ App.toast('请填写处置结果','err'); return; }
          btn.disabled = true; btn.textContent = '提交中…';
          API.submitDrillFlow({
            projectId: proj.id, nodeId: d.nodeId, forms: forms, receiver: receivers,
            measure: measure, result: result, evidence: evidence, found: found
          }).then(function(r){
            var recvTip = r.correct && r.receiverOk===0 ? '（接收人选择错误，扣本流程10%）' : '';
            App.toast(r.correct
              ? '处置记录已提交：正确流程，得分 +'+r.delta+(r.ontime?'':';超出计划时限')+recvTip
              : '处置记录已提交：混淆流程，扣分 '+Math.abs(r.delta),
              r.correct && r.receiverOk!==0 ? 'ok':'warn');
            ov.close();
            App.refreshShell();
            renderPractical(); renderScore();
          }).catch(function(err){
            btn.disabled = false; btn.innerHTML = App.icon('check')+'提交处置记录';
            App.toast((err&&err.message)||'提交失败','err');
          });
        };
      }
    });
  }

  /* 跳过流程：判定该流程不属于本岗处置动作，不执行且无需填写表单 */
  function skipFlow(d){
    App.modal({
      title:'跳过处置流程',
      body:'<div class="fm-strip">'+App.icon('alert')+'<span>请确认流程 <b>'+App.esc(d.title||'')+'</b> 不属于本岗应执行的处置动作，将标记为「已跳过（不执行）」，不可撤销。</span></div>'
        + '<div class="tiny dim mt2">跳过混淆流程可获得少量奖励分；若跳过的是正确流程，结束演练时按该流程分值扣分。</div>',
      foot:'<button class="btn" id="wbSkipCancel">取消</button><button class="btn danger" id="wbSkipOk">'+App.icon('check')+'确认跳过</button>',
      onOpen:function(ov){
        ov.querySelector('#wbSkipCancel').onclick = ov.close;
        var btn = ov.querySelector('#wbSkipOk');
        btn.onclick = function(){
          btn.disabled = true; btn.textContent = '提交中…';
          API.skipDrillFlow(proj.id, d.nodeId).then(function(r){
            App.toast('已跳过该流程'+(r.delta>0?'（+'+r.delta+' 分）':''), r.delta>0?'ok':'warn');
            ov.close();
            App.refreshShell();
            renderPractical(); renderScore();
          }).catch(function(err){
            btn.disabled = false; btn.innerHTML = App.icon('check')+'确认跳过';
            App.toast((err&&err.message)||'跳过失败','err');
          });
        };
      }
    });
  }

  /* 完成演练按钮：取证材料未全部归档时禁用（与取证归档模块联动） */
  function updateFinishBtn(){
    var b = document.getElementById('btnFinish');
    if(!b) return;
    if(EV.pending > 0){
      b.disabled = true;
      b.innerHTML = App.icon('lock')+'完成演练（取证 '+EV.done+'/'+EV.total+'）';
      b.title = '尚有 '+EV.pending+' 项取证材料未归档，请先在取证与材料归档模块完成取证';
    } else {
      b.disabled = false;
      b.innerHTML = App.icon('check')+'完成演练';
      b.title = '取证材料已全部归档（'+EV.done+'/'+EV.total+'），可结束演练';
    }
  }

  function renderPractical(){
    var host = document.getElementById('wbTasks');
    host.innerHTML = '<div class="small dim">正在加载本角色处置流程…</div>';
    API.getDrillFlows(proj.id).then(function(data){
      var flows = data.flows || [];
      RECEIVERS = data.receivers || [];
      EV = data.evidence || EV;
      updateFinishBtn();
      var pending = flows.filter(function(d){ return !d.submitted; }).length;
      if(!flows.length){
        host.innerHTML = '<div class="empty">'+App.icon('lock')+'<div>本角色暂无可处置流程</div>'
          + '<div class="tiny dim mt2">剧本基线中未分配本角色处置节点</div></div>';
        return;
      }
      host.innerHTML = '<div class="tiny dim" style="margin-bottom:10px">本角色候选处置流程 <b>'+flows.length+'</b> 个（待处置 <b style="color:var(--err)">'+pending+'</b> 个）· 点击列表行填写完整处置表单，判定不属于本岗动作可点「跳过（不执行）」</div>'
        + '<div class="task-nav">'+flows.map(flowRow).join('')+'</div>'
        + '<div class="tiny dim mt2">列表同时包含正确处置流程与混淆流程，外观一致、不提示属性：误选混淆流程按该流程分值直接扣分；正确流程超时完成按 90% 计分；跳过混淆流程可加少量分，跳过正确流程则在结束演练时按该流程分值扣分。</div>';
      host.querySelectorAll('[data-flow]').forEach(function(row){
        row.onclick = function(){
          var d = flows.filter(function(x){ return String(x.nodeId)===String(row.dataset.flow); })[0];
          if(d) openFlow(d);
        };
      });
      host.querySelectorAll('[data-skip]').forEach(function(b){
        b.onclick = function(ev){
          ev.stopPropagation();
          var d = flows.filter(function(x){ return String(x.nodeId)===String(b.dataset.skip); })[0];
          if(d) skipFlow(d);
        };
      });
    }).catch(function(err){
      host.innerHTML = '<div class="tiny dim">'+App.esc((err&&err.message)||'处置流程加载失败，请稍后刷新')+'</div>';
    });
  }

  /* ---------- 评分卡 ---------- */
  function renderScore(){
    var el = document.getElementById('wbScore');
    API.getDrillWorkbench(proj.id).then(function(wb){
      var s = wb.score || {};
      var ded = s.deductions || [];
      if(!isPractical){
        el.innerHTML = '<div class="kpi info" style="margin-bottom:10px"><div class="k-label">剧本流程得分</div><div class="k-value">'+s.score+'<span class="small dim">分</span></div><div class="k-foot">'+App.esc(s.grade||'—')+' · 正确流程满分 '+s.maxScore+'</div></div>'
          + '<div class="tiny">正确流程 <b>'+s.hit+'</b>/'+s.total+' · 超时完成 <b style="color:var(--err)">'+(s.late||0)+'</b>'+(s.missed?(' · 未完成 <b style="color:var(--err)">'+s.missed+'</b>'):'')+'</div>'
          + '<div class="tiny dim mt2">基础版按剧本正确流程的分值累计得分，超时完成按分值的 90% 计分；演练结束时未完成的正确流程扣该流程全部分值。</div>'
          + (ded.length?'<div class="tiny dim mt2">'+ded.slice(0,4).map(function(x){ return App.esc(x.title)+' '+x.point+'分（'+App.esc(x.type)+'）'; }).join('；')+(ded.length>4?' 等':'')+'</div>':'');
        return;
      }
      var items = ded.concat(s.bonuses||[]);
      el.innerHTML = '<div class="kpi info" style="margin-bottom:10px"><div class="k-label">即时评分</div><div class="k-value">'+s.score+'<span class="small dim">分</span></div><div class="k-foot">'+App.esc(s.grade||'—')+' · 正确流程满分 '+s.maxScore+'</div></div>'
        + '<div class="tiny">正确流程 <b>'+s.hit+'</b>/'+s.total+' · 待处置 <b>'+(s.pending||0)+'</b> · 已跳过 <b>'+(s.skipped||0)+'</b> · 混淆流程误选 <b style="color:var(--err)">'+(s.wrong||0)+'</b> · 超时完成 <b style="color:var(--err)">'+(s.late||0)+'</b>'+(s.missed?(' · 未完成 <b style="color:var(--err)">'+s.missed+'</b>'):'')+'</div>'
        + '<div class="tiny dim mt2">实战版计分：正确流程按设置分值得分，超时完成按 90% 计；接收人与剧本预设不一致按 90% 计；混淆流程按分值扣分；跳过混淆流程 +2 分；跳过正确流程在结束演练时扣该流程全部分值。</div>'
        + (items.length?'<div class="tiny dim mt2">'+items.slice(0,4).map(function(x){ return App.esc(x.title)+' '+(x.point>0?'+':'')+x.point+'分（'+App.esc(x.type)+'）'; }).join('；')+(items.length>4?' 等':'')+'</div>':'<div class="tiny dim mt2">尚无扣分项</div>');
    }).catch(function(){ el.innerHTML = '<div class="tiny dim">评分加载失败</div>'; });
  }

  /* ---------- 本角色关注态势 ---------- */
  function docList(){
    return MOCK.EVIDENCE.filter(function(x){ return x.type==='表单文书' || x.type==='处置记录'; });
  }
  /* 关注态势统一时间格式：YYYY-MM-DD HH:mm */
  function fmtTime(t){
    var s = String(t||'');
    if(!s) return '';
    if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,16);
    var p = API.activeProject();
    var d = new Date();
    var day = (p && /^\d{4}-\d{2}-\d{2}/.test(String(p.date||''))) ? String(p.date).slice(0,10)
      : (d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()));
    return day + ' ' + s.slice(0,5);
  }

  function renderFeed(){
    var box = document.getElementById('wbFeed');
    if(feed==='docs' || feed==='docs_opinion'){
      var docs = docList();
      box.innerHTML = '<div class="small muted mb3">医院已上报文书/公告材料（外部单位可见范围）</div>'
        + docs.map(function(d){
            return '<div class="file-chip" style="display:flex;margin-bottom:8px;width:100%">'+App.icon('file')+'<span class="grow ellip">'+App.esc(d.name)+'</span><span class="fc-size">'+fmtTime(d.time)+' · '+App.esc(d.uploader)+'</span></div>';
          }).join('')
        + (feed==='docs_opinion'
            ? '<div class="section-title mt3">'+App.icon('opinion')+'院方公告文稿</div>'
              + MOCK.OPINION.filter(function(o){ return o.source==='院办提交'; }).map(function(o){
                  return '<div class="file-chip" style="display:flex;margin-bottom:8px;width:100%">'+App.icon('opinion')+'<span class="grow ellip">'+App.esc(o.title)+'</span><span class="fc-size">'+fmtTime(o.time)+' · '+App.esc(o.status)+'</span></div>';
                }).join('')
            : '')
        + '<div class="tiny dim mt2">内网原始告警、操作日志、会商内部讨论不在外部单位权限范围内（演练模拟权限隔离）</div>';
    } else if(feed==='impact'){
      API.getImpact().then(function(imp){
        box.innerHTML = '<div class="small muted mb3">业务系统影响态势（演练模拟）</div>'
          + imp.map(function(i){
              var c = i.pct>=100?'ok':i.pct>=60?'warn':'err';
              return '<div style="margin-bottom:10px"><div class="flex small" style="justify-content:space-between"><span>'+App.esc(i.sys)+'</span><span class="tag '+c+'">'+App.esc(i.state)+'</span></div><div class="progress mt2"><div class="bar '+c+'" style="width:'+i.pct+'%"></div></div></div>';
            }).join('');
      });
    } else if(feed==='evidence'){
      API.getEvidence().then(function(ev){
        var mine = ev.filter(function(x){ return x.role===role.id || x.type==='操作日志' || x.type==='附件截图'; });
        box.innerHTML = '<div class="small muted mb3">取证留痕（技术类，本角色可见）</div>'
          + mine.map(function(d){
              return '<div class="file-chip" style="display:flex;margin-bottom:8px;width:100%">'+App.icon(d.type==='操作日志'?'db':'file')+'<span class="grow ellip">'+App.esc(d.name)+'</span><span class="fc-size">'+fmtTime(d.time)+' · '+App.esc(d.type)+'</span></div>';
            }).join('');
      });
    } else if(feed==='audit'){
      API.getAuditLogs().then(function(logs){
        box.innerHTML = '<div class="small muted mb3">平台审计日志（仅查看，不可删改）</div>'
          + '<div class="timeline">'+logs.slice(-6).reverse().map(function(l){
              return '<div class="tl-item gray"><span class="tl-dot"></span><div class="tl-time">'+fmtTime(l.time)+'</div>'
                + '<div class="tl-title">'+App.esc(l.user)+' · '+App.esc(l.action)+'</div>'
                + '<div class="tl-desc mono tiny">IP '+App.esc(l.ip)+'</div></div>';
            }).join('')+'</div>';
      });
    } else {
      API.getMessages().then(function(ms){
        var mine = ms.filter(function(m){ return (m.targets||[]).indexOf(role.id)>=0 || (m.targets||[]).indexOf('*')>=0; }).slice(-6).reverse();
        box.innerHTML = '<div class="small muted mb3">与本角色相关的消息流（演练模拟）</div>'
          + '<div class="timeline">'+ (mine.length ? mine.map(function(m){
              return '<div class="tl-item '+(m.level==='P0'?'err':m.level==='P1'?'warn':'gray')+'"><span class="tl-dot"></span>'
                + '<div class="tl-time">'+fmtTime(m.time)+' · '+App.esc(m.source)+'</div>'
                + '<div class="tl-desc">'+App.levelTag(m.level)+' '+App.esc(m.text)+'</div></div>';
            }).join('') : '<div class="small dim">暂无定向消息</div>') + '</div>';
      });
    }
  }

  var bf = document.getElementById('btnFault');
  if(bf) bf.onclick = function(){ faultModal(true); };
  var bfin = document.getElementById('btnFinish');
  if(bfin) bfin.onclick = function(){
    if(EV.pending > 0){
      App.toast('取证材料尚未完成归档（已归档 '+EV.done+'/'+EV.total+'，待归档 '+EV.pending+' 项），不可结束演练','err');
      return;
    }
    App.confirmSim('确认结束本次演练？结束前未完成的正确流程将按各自分值扣分（混淆流程误选已实时扣分），结束后不可再提交处置记录。', function(){
      bfin.disabled = true; bfin.textContent = '提交中…';
      API.finishDrill(proj.id).then(function(r){
        App.toast('演练已结束，综合得分 '+(r.score&&r.score.score!=null?r.score.score:'—')+' 分','ok');
        bfin.remove();
        App.refreshShell();
        renderPractical(); renderScore();
      }).catch(function(err){
        bfin.disabled = false; bfin.innerHTML = App.icon('check')+'完成演练';
        App.toast((err&&err.message)||'结束演练失败','err');
        renderPractical();
      });
    });
  };
  renderFaultBanner();
  if(isPractical){ renderPractical(); renderScore(); }
  else { renderBasic(); renderScore(); }
  faultModal(false);
  renderFeed();
});
App.boot('workbench');
</script>
</body>
</html>
