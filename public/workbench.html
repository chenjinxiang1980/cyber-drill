      foot:'<button class="btn" id="wbDiscardNo">继续填写</button><button class="btn danger" id="wbDiscardYes">确定关闭</button>',
      onOpen:function(m){
        m.querySelector('#wbDiscardNo').onclick = m.close;
        m.querySelector('#wbDiscardYes').onclick = function(){ m.close(); onOk(); };
      }
    });
  }

  /* 判定处置弹窗内是否已有未提交内容（含分步向导各字段） */
  function flowHasInput(ov, nodeId){
    var box = ov.querySelector('#wbFlowBody');
    if(!box) return false;
    var texts = box.querySelectorAll('#flFound,#flMeasure,#flResult,#flEvidence');
    for(var i=0;i<texts.length;i++){ if(String(texts[i].value||'').trim()) return true; }
    var rc = box.querySelector('#flReceiverBox');
    if(rc && rc.querySelector('input:checked')) return true;
    var s = WIZ['p-'+proj.id+'-'+nodeId];
    if(s && s.values){
      for(var k in s.values){ if(String(s.values[k]||'').trim()) return true; }
    }
    return false;
  }

  function openFlow(d){
    var sub = d.submitted;
    var predWrapId = 'wbPred-'+d.nodeId;
    var submitting = false; /* 提交请求未返回期间禁止关闭，避免出现半提交状态 */
    App.modal({
      title:'处置流程 · '+App.esc(d.title||d.action||'系统故障'),
      wide:true,
      /* 关闭方式收敛为两条：右上角 ×（含未提交内容确认）与提交成功后的自动关闭。
       * persist 关闭遮罩点击关闭；全站无 Esc 关闭监听，故 Esc 不会关闭本弹窗。 */
      persist:true,
      body: '<div class="wb-split">'
        /* 左：研判参考区（当前节点处置内容 + 上一节点处置情况）；实战版不展示剧本引导信息 */
        + '<div class="wb-split-left">'
        +   '<div class="section-title" style="margin-top:0">'+App.icon('alert')+'当前节点处置内容</div>'
        +   '<div class="fm-strip">'+App.icon('alert')+'<span><b>'+App.esc(d.title||'')+'</b><br>'+App.esc(d.desc||'请结合故障通报研判本流程是否属于本岗正确处置动作')+'</span></div>'
        +   '<div class="kv mb3"><span class="k">标准处置时长</span><span>'+(d.timeout?d.timeout+' 分钟':'未设置')+'</span>'
        +   '<span class="k">责任角色</span><span>'+App.esc(roleDisplayName(d.role||d.roleId||d.target)||'—')+'</span></div>'
        +   predecessorSectionSkel(predWrapId)
        + '</div>'
        /* 右：处置表单与提交区 */
        + '<div class="wb-split-right">'
        +   '<div id="wbFlowBody">'+(sub?flowDoneBody(d):flowForm(d))+'</div>'
        + '</div>'
        + '</div>',
      foot: (sub || isExternal) ? '' : '<button class="btn primary" id="wbFlowSubmit">'+App.icon('check')+'提交处置记录</button>',
      onOpen:function(ov){
        /* 处置弹窗改为左右分栏（左研判参考 / 右表单） */
        var mEl = ov.querySelector('.modal');
        if(mEl) mEl.classList.add('wb-split-modal');
        /* 唯一手工关闭入口：右上角 ×（底部「关闭」已移除，避免出现第三条关闭路径） */
        ov.querySelector('.x').onclick = function(){
          if(submitting) return; /* 请求未返回：不允许关闭，避免半提交状态 */
          if(!sub && flowHasInput(ov, d.nodeId)){ confirmDiscard(ov.close); return; }
          ov.close();
        };
        /* 无论已提交/未提交，都异步加载前置节点处置情况供研判参考 */
        if(d.nodeId && proj.id) API.getPredecessor(d.nodeId, proj.id).then(function(data){
          fillPredecessorSection(predWrapId, data);
        }).catch(function(){
          var st = ov.querySelector('[data-pred-state]');
          if(st){ st.textContent = '加载失败'; st.className = 'tag gray'; }
          var bd = ov.querySelector('[data-pred-body="'+predWrapId+'"]');
          if(bd) bd.innerHTML = '<div class="tiny dim">前置节点处置情况加载失败，请刷新后重试。</div>';
        });
        if(sub) return;
        /* 外部单位只读：不标记处置中、不挂载可编辑表单、不绑定提交 */
        if(isExternal) return;
        /* 打开处置表单即标记为处置中（导调中心同步展示） */
        if(d.nodeId) API.startNode(d.nodeId).catch(function(){});
        var box = ov.querySelector('#wbFlowBody');
        /* 模板字段改为分步向导：实战版初始为空表，字段说明引导填写，可一键生成模拟数据 */
        var wizHost = box.querySelector('#pfWiz');
        var wkey = 'p-'+proj.id+'-'+d.nodeId;
        if(wizHost) mountWizard(wizHost, wkey, {
          name: App.formDisplayName({name:d.formName||'实战处置表单', mode:d.formMode}), fields: d.fields,
          t: { id: d.nodeId, deadline: '', level: '' }, node: { time: '' }, prefill: false
        });
        box.insertAdjacentHTML('beforeend','<div class="divider"></div>'
          + '<div class="form-grid">'
          + '<div class="form-row span2"><label class="f-label">发现情况 <span class="tiny dim">（可选）</span></label><textarea class="textarea" id="flFound" rows="2" placeholder="记录观察到的异常现象、涉及主机/IP、影响范围等"></textarea></div>'
          + '<div class="form-row span2"><label class="f-label">实际处置措施 <span class="req">*</span> <span class="tiny dim">不少于6字</span></label><textarea class="textarea" id="flMeasure" rows="2" placeholder="如实记录本流程实际执行的动作"></textarea></div>'
          + '<div class="form-row span2"><label class="f-label">处置结果 <span class="req">*</span></label><input class="input" id="flResult" placeholder="如：已隔离2台主机，业务验证恢复正常"></div>'
          + '<div class="form-row span2"><label class="f-label">证据材料说明 <span class="tiny dim">（可选）</span></label><input class="input" id="flEvidence" placeholder="如：已截图并归档至取证模块"></div>'
          + '</div>'
          + '<div class="tiny dim mt2">实战版不提供预填数据与正确流程提示：请自行研判该流程是否属于本岗正确处置动作。误选混淆流程按该流程分值直接扣分；正确流程超时完成扣本节点分值的 20%，接收人选择错误扣 30%，处置文本命中本节点关键词少于 2 个扣 30%，证据要求未提交或未命中扣 20%（单节点合计不超过 80%）。表单可按字段说明逐项填写，也可一键生成模拟数据后核对修改。</div>');
        var btn = ov.querySelector('#wbFlowSubmit');
        btn.onclick = function(){
          if(submitting) return; /* 防重复提交 */
          var forms = {}, missing = [];
          var wst = wizFields(d.fields).length ? WIZ[wkey] : null;
          if(wst){
            if(!wst.done){
              var missNow = wst.fields.filter(function(f){
                return f.required && !String(wst.values[f.label]||'').trim();
              }).map(function(f){ return f.label; });
              App.toast(missNow.length ? '请完整填写表单：'+missNow.slice(0,3).join('、') : '请先按「下一步」逐字段完成表单填写','err');
              return;
            }
            wst.fields.forEach(function(f){
              var v = String(wst.values[f.label]||'').trim();
              if(wizType(f) === 'datetime') v = v.replace('T',' ');
              if(f.required && !v) missing.push(f.label);
              else if(v) forms[f.label] = v;
            });
          }
          var measure = box.querySelector('#flMeasure').value.trim();
          var result = box.querySelector('#flResult').value.trim();
          var evidence = box.querySelector('#flEvidence').value.trim();
          var found = box.querySelector('#flFound').value.trim();
          var receiverBox = box.querySelector('#flReceiverBox');
          var receivers = receiverBox
            ? Array.prototype.slice.call(receiverBox.querySelectorAll('input:checked')).map(function(c){ return c.value; })
            : [];
          if(!receivers.length){ App.toast('请选择下一节点接收人（可多选）','err'); return; }
          if(missing.length){ App.toast('请完整填写表单：'+missing.slice(0,3).join('、'),'err'); return; }
          if(measure.length<6){ App.toast('实际处置措施不少于6字','err'); return; }
          if(!result){ App.toast('请填写处置结果','err'); return; }
          btn.disabled = true; btn.textContent = '提交中…';
          submitting = true;
          API.submitDrillFlow({
            projectId: proj.id, nodeId: d.nodeId, forms: forms, receiver: receivers,
            measure: measure, result: result, evidence: evidence, found: found
          }).then(function(r){
            var recvBad = r.receiverOk===0 || r.receiverOk===false;
            var recvTip = r.correct && recvBad ? '（接收人选择错误，扣本流程30%）' : '';
            App.toast(r.correct
              ? '处置记录已提交：正确流程，得分 +'+r.delta+(r.ontime?'':';超出标准处置时长')+recvTip
              : '处置记录已提交：混淆流程，扣分 '+Math.abs(r.delta),
              r.correct && !recvBad ? 'ok':'warn');
            ov.close();
            App.refreshShell();
            renderPractical(); renderScore();
          }).catch(function(err){
            submitting = false;
            btn.disabled = false; btn.innerHTML = App.icon('check')+'提交处置记录';
            App.toast((err&&err.message)||'提交失败','err');
          });
        };
      }
    });
  }

  /* 跳过流程：判定该流程不属于本岗处置动作，不执行且无需填写表单
   * 混淆节点跳过时后端强制要求填写原因；正确流程跳过原因可选 */
  function skipFlow(d){
    App.modal({
      title:'跳过处置流程',
      body:'<div class="fm-strip">'+App.icon('alert')+'<span>请确认流程 <b>'+App.esc(d.title||'')+'</b> 不属于本岗应执行的处置动作，将标记为「已跳过（不执行）」，不可撤销。</span></div>'
        + '<div class="tiny dim mt2">跳过混淆流程无扣分无奖励；跳过正确流程将在结束演练时按该流程分值扣分。</div>'
        + '<div style="margin-top:12px"><label class="small bold">跳过原因 <span style="color:var(--warn)">(混淆节点必填)</span></label>'
        + '<textarea id="wbSkipReason" rows="3" maxlength="500" placeholder="请简要说明为何判定该流程为干扰项或不属于本岗职责范围…" style="width:100%;margin-top:4px;padding:8px;border-radius:6px;border:1px solid rgba(47,129,247,.35);background:rgba(15,23,42,.5);color:#e2e8f0;font-family:inherit;font-size:13px;resize:vertical;outline:none"></textarea>'
        + '<div id="wbSkipErr" class="tiny" style="color:var(--err);display:none;margin-top:4px"></div></div>',
      foot:'<button class="btn" id="wbSkipCancel">取消</button><button class="btn danger" id="wbSkipOk">'+App.icon('check')+'确认跳过</button>',
      onOpen:function(ov){
        ov.querySelector('#wbSkipCancel').onclick = ov.close;
        var btn = ov.querySelector('#wbSkipOk');
        var ta = ov.querySelector('#wbSkipReason');
        var errBox = ov.querySelector('#wbSkipErr');
        ta.focus();
        btn.onclick = function(){
          var reason = String(ta.value || '').trim();
          btn.disabled = true; btn.textContent = '提交中…';
          errBox.style.display = 'none'; errBox.textContent = '';
          API.skipDrillFlow(proj.id, d.nodeId, reason).then(function(r){
            App.toast('已跳过该流程','ok');
            ov.close();
            App.refreshShell();
            renderPractical(); renderScore();
          }).catch(function(err){
            btn.disabled = false; btn.innerHTML = App.icon('check')+'确认跳过';
            if(err && err.needReason){
              errBox.textContent = err.error || '跳过混淆节点必须填写原因';
              errBox.style.display = 'block';
              ta.focus();
            } else {
              App.toast((err&&err.message)||'跳过失败','err');
            }
          });
        };
      }
    });
  }

  /* 完成演练按钮：核心证据未齐仍可点击（走缺项说明流程），非核心缺失只扣分不阻断 */
  function updateFinishBtn(){
    var b = document.getElementById('btnFinish');
    if(!b) return;
    b.disabled = false;
    if(EV.corePending > 0){
      b.innerHTML = App.icon('alert')+'完成演练（核心证据 '+EV.coreDone+'/'+EV.core+'）';
      b.title = '核心证据尚有 '+EV.corePending+' 项未归档，需补齐或填写缺项说明（原因/责任人/补录时限/批准人）后结束';
    } else if(EV.supportPending > 0){
      b.innerHTML = App.icon('check')+'完成演练';
      b.title = '核心证据已全部归档（'+EV.coreDone+'/'+EV.core+'）；另有 '+EV.supportPending+' 项非核心证据未归档，仅扣分不阻断';
    } else {
      b.innerHTML = App.icon('check')+'完成演练';
      b.title = '取证材料已全部归档（'+EV.done+'/'+EV.total+'），可结束演练';
    }
  }

  /* 结束核对清单 + 有缺项结束登记 */
  function openFinishChecklist(){
    var bfin = document.getElementById('btnFinish');
    if(bfin){ bfin.disabled = true; }

      if(bfin){ bfin.disabled = false; }
      showFinishModal(r && r.checklist);
    }).catch(function(err){
      if(bfin){ bfin.disabled = false; }
      App.toast((err && err.message) || '结束核对失败', 'err');
      updateFinishBtn();
    });

  function showFinishModal(ck){
    ck = ck || {};
    var coreMissing = ck.coreMissing || [];
    var reqMissing = ck.requiredMissing || [];
    var html = '<div class="tiny dim">结束前一次性核对：必做节点完成 <b>'+ck.requiredDone+'/'+ck.requiredTotal+'</b>；'
      + '取证归档 <b>'+ck.evidenceDone+'/'+ck.evidenceTotal+'</b>（'+ck.evidenceRate+'%）；'
      + '核心证据 <b style="color:'+(ck.corePending>0?'var(--err)':'var(--ok)')+'">'+ck.coreDone+'/'+ck.coreTotal+'</b>'
      + (ck.supportPending>0 ? ('；非核心缺失 <b>'+ck.supportPending+'</b> 项（仅扣分）') : '') + '</div>';
    html += '<div class="sim-banner mt2">'+App.icon('alert')+'<span>'+App.esc(ck.hint || '')+'</span></div>';
    if(reqMissing.length){
      html += '<div class="section-title mt4">必做节点缺项</div><div class="tiny dim">'
        + reqMissing.map(function(n){ return App.esc(n.title)+'（'+App.esc(n.target||'—')+'）'; }).join('、') + '</div>';
    }
    if(coreMissing.length){
      html += '<div class="section-title mt4">核心证据缺项</div><div class="tiny dim">'
        + coreMissing.map(function(x){ return App.esc(x.name)+'（'+App.esc(x.nodeTitle)+' · '+App.esc(x.target||'—')+'）'; }).join('<br>') + '</div>';
    }
    if(ck.supportPending > 0){
      html += '<div class="section-title mt4">非核心证据</div><div class="tiny dim">'+ck.supportPending+' 项未归档，仅扣分、不阻断结束。</div>';
    }
    if(ck.needsException){
      html += '<div class="section-title mt4">有缺项结束登记（必填）</div>'
        + '<div class="form-row"><label>缺项原因</label><textarea id="exReason" class="input" rows="2" placeholder="说明核心证据缺失原因及处置安排"></textarea></div>'
        + '<div class="form-row"><label>补录责任人</label><input id="exOwner" class="input" placeholder="姓名/岗位"></div>'
        + '<div class="form-row"><label>补录时限</label><input id="exDeadline" class="input" value="'+App.esc(ck.suggestedDeadline||'')+'" placeholder="YYYY-MM-DD HH:mm"></div>'
        + '<div class="form-row"><label>批准人</label><input id="exApprover" class="input" placeholder="批准人姓名/岗位"></div>';
    }
    var ov = App.modal({
      title: '结束演练核对' + (ck.needsException ? ' · 有缺项' : ''),
      wide: true, persist: true,
      body: html,
      foot: '<button class="btn" id="finCancel">取消（继续演练）</button>'
        + '<button class="btn '+(ck.needsException?'':'primary')+'" id="finOk">'+(ck.needsException?'确认有缺项结束':'确认结束演练')+'</button>',
      onOpen: function(ovEl){
        ovEl.querySelector('#finCancel').onclick = ovEl.close;
        ovEl.querySelector('#finOk').onclick = function(){
          var ex = null;
          if(ck.needsException){
            ex = {
              reason: (ovEl.querySelector('#exReason').value || '').trim(),
              owner: (ovEl.querySelector('#exOwner').value || '').trim(),
              deadline: (ovEl.querySelector('#exDeadline').value || '').trim(),
              approver: (ovEl.querySelector('#exApprover').value || '').trim()
            };
            if(ex.reason.length < 5 || !ex.owner || !ex.deadline || !ex.approver){
              App.toast('请完整填写缺项原因（≥5字）、责任人、补录时限、批准人', 'err');
              return;
            }
          }
          ovEl.close();
          doFinish(ex);
        };
      }
    });
    return ov;
  }

  function doFinish(exception){
    var bfin = document.getElementById('btnFinish');
    if(bfin){ bfin.disabled = true; bfin.textContent = '提交中…'; }
    var payload = { projectId: proj.id };
    if(exception) payload.exception = exception;
    DRILL.post('/drill/finish', payload).then(function(r){
      var s = (r && r.sealed) ? r.sealed : null;
      App.toast('演练已结束' + (s ? ('，评级 '+(s.grade||'—')+'（快照 v'+s.version+'）') : ''), 'ok');
      if(bfin){ bfin.remove(); }
      App.refreshShell();
      renderPractical(); renderScore();
    }).catch(function(err){
      if(bfin){ bfin.disabled = false; bfin.innerHTML = App.icon('check')+'完成演练'; }
      App.toast((err && err.message) || '结束演练失败', 'err');
      renderPractical();
      updateFinishBtn();
    });
  }

  function renderPractical(){
    var host = document.getElementById('wbTasks');
    host.innerHTML = '<div class="small dim">正在加载本角色处置流程…</div>';
    API.getDrillFlows(proj.id).then(function(data){
      var flows = data.flows || [];
      RECEIVERS = data.receivers || [];
      EV = data.evidence || EV;
      updateFinishBtn();
      /* 处置流程随演练启动下发：未开始时只展示等待启动空态，不渲染流程、不提供可点击入口
       * 状态以项目真实状态字段为准（优先取接口回显 projectStatus） */
      var pstatus = data.projectStatus || proj.status;
      if(pstatus === '未开始'){
        host.innerHTML = '<div class="empty">'+App.icon('clock')+'<div>演练尚未开始，请等待平台管理员启动</div>'
          + '<div class="tiny dim mt2">启动后本角色候选处置流程将自动下发至此</div></div>';
        return;
      }
      var lockedCount = flows.filter(function(d){ return !d.submitted && d.locked; }).length;
      var pending = flows.filter(function(d){ return !d.submitted && !d.locked; }).length;
      announceNewTasks(flows.filter(function(d){ return !d.submitted && !d.locked; }).map(function(d){ return d.nodeId; }), '处置流程');
      if(!flows.length){
        host.innerHTML = '<div class="empty">'+App.icon('lock')+'<div>本角色暂无可处置流程</div>'
          + '<div class="tiny dim mt2">剧本基线中未分配本角色处置节点</div></div>';
        return;
      }
      host.innerHTML = '<div class="tiny dim" style="margin-bottom:10px">本角色候选处置流程 <b>'+flows.length+'</b> 个（待处置 <b style="color:var(--err)">'+pending+'</b> 个'
        + (lockedCount?'，前置未完成 <b>'+lockedCount+'</b> 个':'')+'）· 点击列表行填写完整处置表单，判定不属于本岗动作可点「跳过（不执行）」</div>'
        + '<div class="task-nav">'+flows.map(flowRow).join('')+'</div>'
        + '<div class="tiny dim mt2">列表同时包含正确处置流程与混淆流程，外观一致、不提示属性：误选混淆流程按该流程分值直接扣分；正确流程超时完成扣本节点分值的 20%；跳过混淆流程无扣分无奖励，跳过正确流程则在结束演练时按该流程分值扣分。未满足前置条件的流程会置灰锁定，前置完成后自动开放。</div>';
      host.querySelectorAll('[data-flow]').forEach(function(row){
        row.onclick = function(){
          var d = flows.filter(function(x){ return String(x.nodeId)===String(row.dataset.flow); })[0];
          if(!d) return;
          if(!d.submitted && d.locked){
            App.toast('前置流程未完成'+(d.blockedBy&&d.blockedBy.length?'：'+d.blockedBy.map(function(x){ return x.title||x.id; }).join('、'):'')+'，完成后自动开放','warn');
            return;
          }
          openFlow(d);
        };
      });
      host.querySelectorAll('[data-skip]').forEach(function(b){
        b.onclick = function(ev){
          ev.stopPropagation();
          var d = flows.filter(function(x){ return String(x.nodeId)===String(b.dataset.skip); })[0];
          if(d) skipFlow(d);
        };
      });
    }).catch(function(err){
      host.innerHTML = '<div class="tiny dim">'+App.esc((err&&err.message)||'处置流程加载失败，请稍后刷新')+'</div>';
    });
  }

  /* ---------- 本角色关注态势 ---------- */
  function docList(){
    return MOCK.EVIDENCE.filter(function(x){ return x.type==='表单文书' || x.type==='处置记录'; });
  }
  /* 关注态势统一时间格式：YYYY-MM-DD HH:mm */
  function fmtTime(t){
    var s = String(t||'');
    if(!s) return '';
    if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,16);
    var p = API.activeProject();
    var d = new Date();
    var day = (p && /^\d{4}-\d{2}-\d{2}/.test(String(p.date||''))) ? String(p.date).slice(0,10)
      : (d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()));
    return day + ' ' + s.slice(0,5);
  }

  faultModal(false);
  renderFeed();
});
App.boot('workbench');
</script>
