<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>剧本可视化编排 · 盘州市人民医院网络安全应急演练系统</title>
<link rel="icon" type="image/png" href="img/logo.png">
<link rel="stylesheet" href="styles.css">
<style>
.se-layout{display:flex;gap:16px;align-items:flex-start}
.se-palette{width:230px;flex:none}
.pal-item{display:flex;align-items:center;gap:10px;border:1px dashed var(--border2);border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:pointer;font-size:12.5px;color:var(--text2);transition:.15s}
.pal-item:hover{border-color:var(--accent);color:var(--text);background:var(--accent-dim)}
.pal-item svg{width:16px;height:16px;flex:none}
.pal-item small{margin-left:auto;color:var(--text3);font-size:10.5px}
.se-canvas{flex:1;min-width:0;display:flex;flex-direction:column;gap:0}
.nd-row{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--border2);border-radius:10px;padding:12px 16px;cursor:grab;transition:.12s}
.nd-row:active{cursor:grabbing}
.nd-row:hover{border-color:var(--accent)}
.nd-row.is-branch{border-color:var(--purple);box-shadow:inset 3px 0 0 var(--purple)}
.nd-row.active{border-color:var(--accent);background:var(--accent-dim);box-shadow:0 0 0 3px var(--accent-dim)}
.nd-row.drag-over{border-top:2px solid var(--accent)}
.nd-ic{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none}
.nd-ic svg{width:17px;height:17px}
.nd-main{flex:1;min-width:0}
.nd-title{font-size:13.5px;font-weight:600}
.nd-meta{font-size:11px;color:var(--text3);margin-top:4px;display:flex;gap:12px;flex-wrap:wrap}
.nd-go{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.nd-go .tag{font-size:10.5px}
.nd-ops{display:flex;gap:6px;flex:none}
.nd-idx{font-family:var(--mono);font-size:11px;color:var(--text3);width:26px;flex:none;text-align:right}
.se-link{display:flex;justify-content:center;color:var(--text3);font-size:16px;line-height:1;padding:4px 0}
</style>
</head>
<body data-page="script-editor">
<script src="system.js"></script>
<script src="app.js"></script>
<script src="api.js"></script>
<script>
document.addEventListener('app:ready', function(e){
  var role = e.detail.role;
  var page = document.getElementById('page');

  var TYPES = {
    alert:  { label:'告警', icon:'bell',   color:'var(--err)',    dim:'var(--err-dim)' },
    task:   { label:'任务', icon:'tasks',  color:'var(--accent)', dim:'var(--accent-dim)' },
    branch: { label:'分支', icon:'flow',   color:'var(--purple)', dim:'var(--purple-dim)' },
    report: { label:'上报', icon:'send',   color:'var(--info)',   dim:'var(--info-dim)' },
    end:    { label:'终止', icon:'power',  color:'var(--text2)',  dim:'var(--elev)' }
  };

  function scenarioById(id){ return MOCK.SCENARIOS.filter(function(s){ return s.id===id; })[0]; }
  function clone(x){ return JSON.parse(JSON.stringify(x)); }
  var ACTION_TYPES = ['告警核实','隔离处置','处置恢复','取证留痕','上报审批','业务兜底','协同沟通','其他'];
  function kwText(n){ var k = n.keywords; return Array.isArray(k) ? k.join(',') : (k||''); }
  function fallbackNodes(s){
    return [
      { id:'FN1', type:'alert', title:'T+0 '+s.type+'模拟告警推送', target:'信息科值班员', time:'09:00', timeout:10, desc:'推送「'+s.name+'」场景模拟告警（实战版仅原始告警）' },
      { id:'FN2', type:'task', title:'核实与初步处置', target:'网络安全管理员', time:'09:20', timeout:15, desc:'按预案核实异常并执行模拟处置、留存证据' },
      { id:'FN3', type:'report', title:'研判简报上报指挥部', target:'信息科负责人', time:'10:00', timeout:10, form:'F2', desc:'形成研判简报并提交院应急指挥部' },
      { id:'FN4', type:'end', title:'演练终止与复盘', target:'院应急指挥部', time:'11:00', desc:'下达终止指令，进入复盘评估' }
    ];
  }
  function loadNodes(id){
    var s = scenarioById(id);
    var own = (MOCK.SCRIPT_NODES || []).filter(function(n){ return n.scenarioId===id; });
    if(own.length) return clone(own);
    return (id==='S01') ? clone((MOCK.SCRIPT_NODES || []).filter(function(n){ return !n.scenarioId; })) : fallbackNodes(s);
  }
  function nextTime(){
    if(!nodes.length) return '09:00';
    var t = nodes[nodes.length-1].time || '09:00';
    var p = t.split(':'); var m = (+p[0])*60 + (+p[1]) + 15;
    var h = Math.floor(m/60)%24, mm = m%60;
    return (h<10?'0':'')+h+':'+(mm<10?'0':'')+mm;
  }

  var qs = new URLSearchParams(location.search).get('scenario');
  var curId = (qs && scenarioById(qs)) ? qs : 'S01';
  var nodes = loadNodes(curId);
  var diff = (scenarioById(curId).difficulty||'基础版').indexOf('实战')>=0 ? '实战版' : '基础版';
  var playTimer = null, dragIdx = null;

  page.innerHTML =
    '<div class="page-head"><div><h1>剧本可视化编排</h1><div class="sub">纵向节点时序画布 · 拖拽调整顺序 · 分支判定与超时提醒配置</div></div>'
    + '<div class="acts">'
    + '<select class="select" id="scSel" style="min-width:230px">'+MOCK.SCENARIOS.map(function(s){ return '<option value="'+s.id+'"'+(s.id===curId?' selected':'')+'>'+s.id+' · '+App.esc(s.name)+'</option>'; }).join('')+'</select>'
    + '<button class="btn" id="btnAdd">'+App.icon('plus')+'添加节点</button>'
    + '<button class="btn" id="btnPlay">'+App.icon('play')+'预览推演</button>'
    + '<button class="btn primary" id="btnSave">'+App.icon('check')+'保存剧本</button></div></div>'
    + '<div class="sim-banner">'+App.icon('alert')+'<span>编排操作仅写入演练平台剧本库（模拟），不会向任何真实网络、系统下发指令。节点数据为虚拟演练内容。</span></div>'
    + '<div class="se-layout">'
    +   '<div class="card se-palette">'
    +     '<div class="card-title">'+App.icon('flow')+'节点类型</div>'
    +     Object.keys(TYPES).map(function(k){ return '<div class="pal-item" data-type="'+k+'"><span style="color:'+TYPES[k].color+'">'+App.icon(TYPES[k].icon)+'</span>'+TYPES[k].label+'节点<small>点击添加</small></div>'; }).join('')
    +     '<div class="divider"></div>'
    +     '<div class="section-title">演练难度</div>'
    +     '<div class="seg" style="width:100%"><div class="s-opt'+(diff==='基础版'?' on':'')+'" data-d="基础版" style="flex:1;text-align:center">基础版</div><div class="s-opt'+(diff==='实战版'?' on':'')+'" data-d="实战版" style="flex:1;text-align:center">实战版</div></div>'
    +     '<div class="tiny dim mt2">'+(diff==='基础版'?'基础版：节点附引导提示与表单预填。':'实战版：仅推送原始告警，无引导提示。')+'</div>'
    +   '</div>'
    +   '<div class="canvas se-canvas" id="canvasFlow"></div>'
    + '</div>';

  function formName(fid){ var t = MOCK.FORM_TEMPLATES.filter(function(x){ return x.id===fid; })[0]; return t?t.name:''; }

  function render(){
    var c = document.getElementById('canvasFlow');
    if(!nodes.length){ c.innerHTML = '<div class="empty">'+App.icon('flow')+'<div>画布为空，从左侧类型面板添加节点</div></div>'; return; }
    c.innerHTML = nodes.map(function(n,i){
      var t = TYPES[n.type]||TYPES.task;
      var branchHtml = (n.type==='branch' && n.branches) ? '<div class="nd-go"><span class="tag purple">是 → '+App.esc(n.branches[0]||'条件成立')+'</span><span class="tag purple">否 → '+App.esc(n.branches[1]||'条件不成立')+'</span></div>' : '';
      return '<div class="nd-row'+(n.type==='branch'?' is-branch':'')+'" draggable="true" data-i="'+i+'">'
      + '<span class="nd-idx">'+(i+1)+'</span>'
      + '<span class="nd-ic" style="background:'+t.dim+';color:'+t.color+'">'+App.icon(t.icon)+'</span>'
      + '<div class="nd-main"><div class="nd-title">'+App.esc(n.title)+'</div>'
      + '<div class="nd-meta"><span class="mono">'+n.time+'</span><span>接收：'+App.esc(n.target||'—')+'</span>'
      + (n.form?'<span>关联表单：'+formName(n.form)+'</span>':'')
      + (n.timeout?'<span>超时 '+n.timeout+' 分钟提醒</span>':'')
      + (n.action?'<span class="tag blue" style="font-size:10px">'+App.esc(n.action)+'</span>':'')
      + (n.required===false?'<span class="tag gray" style="font-size:10px">可选步骤</span>':'<span class="tag green" style="font-size:10px">必经</span>')
      + (kwText(n)?'<span>关键词：'+App.esc(kwText(n))+'</span>':'')
      + '<span class="tag gray" style="font-size:10px">'+t.label+'</span></div>'
      + branchHtml + '</div>'
      + '<div class="nd-ops"><button class="btn sm" data-edit="'+i+'">'+App.icon('edit')+'配置</button>'
      + '<button class="btn sm danger" data-del="'+i+'" title="删除节点（演练模拟）">'+App.icon('x')+'</button></div>'
      + '</div>' + (i<nodes.length-1?'<div class="se-link">↓</div>':'');
    }).join('');

    c.querySelectorAll('.nd-row').forEach(function(row){
      row.addEventListener('dragstart', function(){ dragIdx = +row.dataset.i; });
      row.addEventListener('dragover', function(ev){ ev.preventDefault(); row.classList.add('drag-over'); });
      row.addEventListener('dragleave', function(){ row.classList.remove('drag-over'); });
      row.addEventListener('drop', function(ev){
        ev.preventDefault(); row.classList.remove('drag-over');
        var to = +row.dataset.i;
        if(dragIdx===null || dragIdx===to){ return; }
        var it = nodes.splice(dragIdx,1)[0];
        nodes.splice(dragIdx<to?to-1:to, 0, it);
        dragIdx = null; render();
        App.toast('节点顺序已调整（演练模拟），保存剧本后生成新版本时序','ok');
      });
    });
    c.querySelectorAll('[data-edit]').forEach(function(b){ b.onclick = function(){ openDrawer(+b.dataset.edit); }; });
    c.querySelectorAll('[data-del]').forEach(function(b){ b.onclick = function(){
      var n = nodes[+b.dataset.del];
      App.confirmSim('从画布移除节点「'+App.esc(n.title)+'」（演练模拟，保存后生效）。', function(){
        nodes.splice(+b.dataset.del,1); render(); App.toast('节点已移除（演练模拟）','ok');
      });
    }; });
  }

  function openDrawer(i){
    var n = nodes[i];
    var t = TYPES[n.type]||TYPES.task;
    var targetOpts = MOCK.ROLES.map(function(r){ return '<option value="'+App.esc(r.name)+'"'+(n.target===r.name?' selected':'')+'>'+r.name+'</option>'; }).join('');
    if(MOCK.ROLES.map(function(r){ return r.name; }).indexOf(n.target)<0){
      targetOpts = '<option value="'+App.esc(n.target||'')+'" selected>'+App.esc(n.target||'（未指定）')+'</option>' + targetOpts;
    }
    var body =
      '<div class="form-row"><label class="f-label">节点标题<span class="req">*</span></label><input class="input" id="ndTitle" value="'+App.esc(n.title||'')+'"></div>'
      + '<div class="form-grid">'
      + '<div class="form-row"><label class="f-label">节点类型</label><select class="select" id="ndType">'+Object.keys(TYPES).map(function(k){ return '<option value="'+k+'"'+(n.type===k?' selected':'')+'>'+TYPES[k].label+'节点</option>'; }).join('')+'</select></div>'
      + '<div class="form-row"><label class="f-label">接收角色</label><select class="select" id="ndTarget">'+targetOpts+'</select></div>'
      + '<div class="form-row"><label class="f-label">关联表单</label><select class="select" id="ndForm"><option value="">— 无 —</option>'+MOCK.FORM_TEMPLATES.map(function(ft){ return '<option value="'+ft.id+'"'+(n.form===ft.id?' selected':'')+'>'+ft.name+'</option>'; }).join('')+'</select></div>'
      + '<div class="form-row"><label class="f-label">超时提醒（分钟）</label><input class="input" id="ndTimeout" type="number" min="1" value="'+(n.timeout||'')+'" placeholder="留空则不提醒"></div>'
      + '</div>'
      + '<div class="form-row"><label class="f-label">消息内容 / 处置说明</label><textarea class="textarea" id="ndDesc">'+App.esc(n.desc||'')+'</textarea></div>'
      + '<div class="divider"></div><div class="section-title">判定与引导配置（基础版引导 / 实战版评分基准）</div>'
      + '<div class="form-grid">'
      + '<div class="form-row"><label class="f-label">动作类型</label><select class="select" id="ndAction"><option value="">— 未分类 —</option>'+ACTION_TYPES.map(function(a){ return '<option value="'+a+'"'+(n.action===a?' selected':'')+'>'+a+'</option>'; }).join('')+'</select></div>'
      + '<div class="form-row"><label class="f-label">必经步骤</label><div class="flex gap2" style="align-items:center;min-height:34px"><label class="check"><input type="checkbox" id="ndRequired"'+(n.required===false?'':' checked')+'>实战版遗漏判定必查</label></div></div>'
      + '</div>'
      + '<div class="form-row"><label class="f-label">判定关键词（逗号分隔，实战版匹配用）</label><input class="input" id="ndKeywords" value="'+App.esc(kwText(n))+'"+ placeholder="如：隔离,断网,封堵"></div>'
      + '<div class="form-row"><label class="f-label">引导提示（基础版下发给参演人员）</label><textarea class="textarea" id="ndGuide" placeholder="如：隔离前记录主机IP与MAC，隔离后确认无新增加密告警。">'+App.esc(n.guide||'')+'</textarea></div>'
      + '<div id="ndBranchRow"'+(n.type==='branch'?'':' style="display:none"')+'>'
      + '<div class="divider"></div><div class="section-title">分支判断条件</div>'
      + '<div class="form-grid"><div class="form-row"><label class="f-label">条件「是」去向描述</label><input class="input" id="ndB0" value="'+App.esc((n.branches&&n.branches[0])||'')+'" placeholder="如：一般事件 → 科内处置"></div>'
      + '<div class="form-row"><label class="f-label">条件「否」去向描述</label><input class="input" id="ndB1" value="'+App.esc((n.branches&&n.branches[1])||'')+'" placeholder="如：较大及以上 → 上报指挥部"></div></div></div>'
      + '<div class="tiny dim">节点时刻：'+n.time+'（拖拽画布行可调整顺序）</div>';
    App.drawer({ title:'节点配置 · '+App.esc(n.title), body:body, onOpen:function(ov){
      ov.querySelector('#ndType').onchange = function(){ ov.querySelector('#ndBranchRow').style.display = this.value==='branch'?'':'none'; };
      ov.querySelector('.d-body').insertAdjacentHTML('beforeend','<div class="mt4 flex gap2"><button class="btn grow" id="ndCancel">取消</button><button class="btn primary grow" id="ndSave">保存节点</button></div>');
      ov.querySelector('#ndCancel').onclick = ov.close;
      ov.querySelector('#ndSave').onclick = function(){
        var title = ov.querySelector('#ndTitle').value.trim();
        if(!title){ App.toast('节点标题不能为空','err'); return; }
        var ty = ov.querySelector('#ndType').value;
        n.title = title; n.type = ty;
        n.target = ov.querySelector('#ndTarget').value;
        n.form = ov.querySelector('#ndForm').value || undefined;
        var tm = parseInt(ov.querySelector('#ndTimeout').value,10);
        if(tm>0){ n.timeout = tm; } else { delete n.timeout; }
        n.desc = ov.querySelector('#ndDesc').value.trim();
        n.action = ov.querySelector('#ndAction').value;
        n.required = ov.querySelector('#ndRequired').checked;
        n.guide = ov.querySelector('#ndGuide').value.trim();
        n.keywords = ov.querySelector('#ndKeywords').value.split(/[,，、;；\s]+/).filter(function(x){ return !!x; });
        if(ty==='branch'){ n.branches = [ ov.querySelector('#ndB0').value.trim()||'条件成立', ov.querySelector('#ndB1').value.trim()||'条件不成立' ]; }
        else { delete n.branches; }
        ov.close(); render(); App.toast('节点配置已更新（演练模拟），保存剧本后生效为新版本','ok');
      };
    } });
  }

  function addNode(type){
    var t = TYPES[type]||TYPES.task;
    var n = { id:'N'+Date.now(), type:type, title:'新'+t.label+'节点', target:'信息科值班员', time:nextTime(), desc:'' };
    if(type==='branch'){ n.branches = ['条件成立','条件不成立']; }
    nodes.push(n); render();
    openDrawer(nodes.length-1);
  }

  page.querySelectorAll('.pal-item').forEach(function(p){ p.onclick = function(){ addNode(p.dataset.type); }; });
  document.getElementById('btnAdd').onclick = function(){ addNode('task'); };

  page.querySelectorAll('.seg .s-opt').forEach(function(o){ o.onclick = function(){
    diff = o.dataset.d;
    page.querySelectorAll('.seg .s-opt').forEach(function(x){ x.classList.toggle('on', x===o); });
    App.toast('演练模拟：难度已切换为'+diff+(diff==='实战版'?'（隐藏引导提示与表单预填）':'（附引导提示）'),'ok');
  }; });

  document.getElementById('scSel').onchange = function(){
    curId = this.value; nodes = loadNodes(curId);
    diff = (scenarioById(curId).difficulty||'基础版').indexOf('实战')>=0?'实战版':'基础版';
    page.querySelectorAll('.seg .s-opt').forEach(function(x){ x.classList.toggle('on', x.dataset.d===diff); });
    render();
    App.toast('已切换至场景 '+curId+(curId==='S01'?'（完整节点数据）':'（示例节点结构，演练模拟）'),'ok');
  };

  document.getElementById('btnSave').onclick = function(){
    var s = scenarioById(curId);
    App.confirmSim('保存《'+App.esc(s.name)+'》当前编排（共 '+nodes.length+' 个节点，难度：'+diff+'）为新版本。', function(){
      API.saveScriptNodes(curId, nodes, diff).then(function(r){
        App.toast('剧本《'+s.name+'》已保存，场景剧本库版本更新为 '+r.version+'（共 '+r.count+' 个节点）','ok');
      }).catch(function(e){
        App.toast((e && e.message) || '剧本保存失败，请稍后重试','err');
      });
    });
  };

  var btnPlay = document.getElementById('btnPlay');
  btnPlay.onclick = function(){
    if(playTimer){ stopPlay('预览已停止'); return; }
    var rows = document.querySelectorAll('.nd-row');
    if(!rows.length){ App.toast('画布为空，无法预览','warn'); return; }
    var i = 0;
    btnPlay.innerHTML = App.icon('pause')+'停止预览';
    btnPlay.classList.add('danger');
    playTimer = setInterval(function(){
      rows.forEach(function(r){ r.classList.remove('active'); });
      if(i<rows.length){ rows[i].classList.add('active'); rows[i].scrollIntoView({block:'nearest'}); i++; }
      else { stopPlay('演练模拟：推演预览播放完成（'+nodes.length+' 个节点）'); }
    }, 900);
  };
  function stopPlay(msg){
    if(playTimer){ clearInterval(playTimer); playTimer = null; }
    document.querySelectorAll('.nd-row').forEach(function(r){ r.classList.remove('active'); });
    var b = document.getElementById('btnPlay');
    b.innerHTML = App.icon('play')+'预览推演'; b.classList.remove('danger');
    if(msg) App.toast(msg,'ok');
  }

  render();
});
App.boot('script-editor');
</script>
</body>
</html>
