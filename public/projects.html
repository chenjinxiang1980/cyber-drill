<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>演练项目管理 · 示例医院网络安全应急演练系统</title>
<link rel="icon" type="image/png" href="img/logo.png">
<link rel="stylesheet" href="styles.css?v=20261104b">
<style>
.pj-prog{display:flex;align-items:center;gap:8px;min-width:130px}
.pj-prog .progress{flex:1}
.pj-ops{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.grp-kv{display:grid;grid-template-columns:88px 1fr;gap:8px 14px;font-size:13px;margin-top:14px}
.grp-kv .k{color:var(--text3)}
.notice-preview{background:rgba(46,204,113,.06);border:1px solid rgba(46,204,113,.25);border-radius:8px;padding:12px 14px;margin-bottom:12px;font-size:13px;line-height:1.7}
.notice-preview .np-title{font-weight:600;margin-bottom:4px;color:#2c3e50}
.notice-preview .np-body{color:var(--text2)}
.notice-sent{background:rgba(46,204,113,.08);border:1px solid rgba(46,204,113,.3);border-radius:6px;padding:10px 12px;font-size:13px;color:#16a085;display:flex;align-items:center;gap:8px}
</style>
</head>
<body data-page="projects">
<script src="system.js"></script>
<script src="app.js"></script>
<script src="api.js"></script>
<script>
document.addEventListener('app:ready', function(e){
  var role = e.detail.role;
  var page = document.getElementById('page');
  var canOp = !role.external && ['commander','itlead','platformadmin'].indexOf(role.id)>=0;
  var canDel = role.id === 'platformadmin';

  function projById(id){ return MOCK.PROJECTS.filter(function(p){ return p.id===id; })[0]; }
  function scenarioName(sid){ var s = MOCK.SCENARIOS.filter(function(x){ return x.id===sid; })[0]; return s?s.name:sid; }

  page.innerHTML =
    '<div class="page-head"><div><h1>演练项目管理</h1><div class="sub">演练项目全生命周期：未开始 → 演练中 → 暂停 → 已结束 → 已归档'+(canOp?'':' · 当前角色为查看权限')+'</div></div>'
    + '<div class="acts">'
    + (canOp?'<button class="btn primary" id="btnNew">'+App.icon('plus')+'新建演练项目</button>':'')
    + '</div></div>'
    + '<div class="sim-banner">'+App.icon('alert')+'<span>启动/暂停/结束/归档均为演练推演模拟操作，系统不控制任何真实网络与业务系统，全部数据为虚拟演练数据。</span></div>'
    + '<div class="table-wrap"><table class="table"><thead><tr>'
    + '<th>项目编号</th><th>项目名称</th><th>演练类型</th><th>演练模式</th><th>关联剧本</th><th>参演单位</th><th>计划日期</th><th>状态</th><th>当前进度</th><th style="text-align:right">操作</th>'
    + '</tr></thead><tbody id="pjBody"></tbody></table></div>'
    + '<div class="tiny dim mt3">进度依据实际演练数据自动计算 · 脚本已自动屏蔽所有混淆节点与终止节点。</div>';

  function opsHtml(p){
    var del = canDel ? '<button class="btn sm danger" data-act="del" data-id="'+p.id+'">'+App.icon('trash')+'删除</button>' : '';
    var scriptBtn = '<button class="btn sm" data-act="script" data-id="'+p.id+'">'+App.icon('file-text')+'脚本</button>';
    var notifyBtn = canOp ? '<button class="btn sm" data-act="notify" data-id="'+p.id+'">'+App.icon('bell')+'通知</button>' : '';
    if(!canOp || p.status==='已归档'){
      return '<button class="btn sm" data-act="grp" data-id="'+p.id+'">'+App.icon('user')+'编组</button>'
      + scriptBtn + notifyBtn
      + (p.status==='已归档'?'<span class="tag gray">只读</span>':'') + del;
    }
    var b = '<button class="btn sm" data-act="grp" data-id="'+p.id+'">'+App.icon('user')+'编组</button>' + scriptBtn + notifyBtn;
    if(p.status==='未开始') b += '<button class="btn sm" data-act="rehearse" data-id="'+p.id+'">'+App.icon('eye')+'预演</button><button class="btn sm primary" data-act="start" data-id="'+p.id+'">'+App.icon('play')+'启动演练</button>';
    else if(p.status==='演练中') b += '<button class="btn sm" data-act="pause" data-id="'+p.id+'">'+App.icon('pause')+'暂停</button><button class="btn sm ok" data-act="end" data-id="'+p.id+'">'+App.icon('power')+'结束</button>';
    else if(p.status==='暂停') b += '<button class="btn sm primary" data-act="resume" data-id="'+p.id+'">'+App.icon('play')+'继续</button><button class="btn sm ok" data-act="end" data-id="'+p.id+'">'+App.icon('power')+'结束</button>';
    else if(p.status==='已结束') b += '<button class="btn sm" data-act="archive" data-id="'+p.id+'">'+App.icon('archive')+'归档</button>';
    return b + del;
  }

  function render(){
    API.getProjects().then(function(list){
      MOCK.PROJECTS = list || [];
      renderTable();
    }).catch(function(){ renderTable(); });
  }
  function renderTable(){
    document.getElementById('pjBody').innerHTML = MOCK.PROJECTS.map(function(p){
      var pct = (typeof p.progress === 'number') ? p.progress : 0;
      return '<tr data-row="'+p.id+'">'
      + '<td class="mono">'+p.id+'</td>'
      + '<td><div class="bold">'+App.esc(p.name)+'</div><div class="tiny dim">'+(p.members?p.members.length:0)+' 名参演角色 · 目标：'+App.esc(p.target||'—')+'</div></td>'
      + '<td>'+p.type+'</td>'
      + '<td>'+(p.mode==='实战版'
          ? '<span class="tag red">实战版</span><div class="tiny dim">仅显示已发现故障</div>'
          : '<span class="tag green">基础版</span><div class="tiny dim">任务中心逐步提示</div>')+'</td>'
      + '<td><span class="t-link" data-act="script-edit" data-id="'+p.scenarioId+'">'+scenarioName(p.scenarioId)+'</span></td>'
      + '<td class="small">'+(p.units?p.units.join('<br>'):'—')+'</td>'
      + '<td class="mono small">'+p.date+'</td>'
      + '<td data-st="'+p.id+'">'+App.statusTag(p.status)+'</td>'
      + '<td><div class="pj-prog"><div class="progress"><div class="bar '+(pct>=100?'ok':pct>0?'':'')+'" style="width:'+pct+'%"></div></div><span class="mono tiny dim">'+pct+'%</span></div></td>'
      + '<td><div class="pj-ops">'+opsHtml(p)+'</div></td></tr>';
    }).join('');
    page.querySelectorAll('[data-act]').forEach(function(b){
      b.onclick = function(){
        var id = b.dataset.id;
        if(b.dataset.act==='script-edit'){ location.href='scenarios.html?edit=1&scenario='+id; return; }
        if(b.dataset.act==='script'){ openScript(projById(id)); return; }
        if(b.dataset.act==='notify'){ openNotify(projById(id)); return; }
        if(b.dataset.act==='grp'){ openGroup(projById(id)); return; }
        var p = projById(id);
        if(b.dataset.act==='del'){ confirmDelete(p); return; }
        if(b.dataset.act==='rehearse'){ App.toast('演练模拟：预演推演已发起，按剧本时序校验节点可达性','ok'); return; }
        if(b.dataset.act==='start') changeStatus(p,'演练中','启动演练项目《'+p.name+'》');
        if(b.dataset.act==='pause') changeStatus(p,'暂停','暂停演练《'+p.name+'》');
        if(b.dataset.act==='resume') changeStatus(p,'演练中','恢复演练《'+p.name+'》');
        if(b.dataset.act==='end') changeStatus(p,'已结束','结束演练《'+p.name+'》');
        if(b.dataset.act==='archive') changeStatus(p,'已归档','归档演练《'+p.name+'》');
      };
    });
  }

  /* ===== 演练脚本（共用 App.openScript，只读） ===== */
  function openScript(p){
    if(!p){ App.toast('演练项目不存在','err'); return; }
    if(!p.scenarioId){ App.toast('该项目未关联剧本','warn'); return; }
    App.openScript(p, {canExport:true});
  }

  /* ===== 演练通知（手动生成 + Word 导出） ===== */
  function openNotify(p){
    if(!p){ App.toast('演练项目不存在','err'); return; }
    if(!canOp){ App.toast('无权限生成演练通知','err'); return; }
    App.modal({ title:'演练通知 · '+App.esc(p.name), body:
      '<div class="notice-sent" style="margin-bottom:14px">'+App.icon('bell')+' <strong>演练通知已在创建项目时自动推送</strong>，可手动再次推送或导出 Word。</div>'
      + '<div class="script-section">'
      +   '<h3>通知内容预览</h3>'
      +   '<div class="notice-preview">'
      +     '<div class="np-title">演练项目「'+App.esc(p.name)+'」已创建</div>'
      +     '<div class="np-body">'
      +       '演练模式：'+App.esc(p.mode)+'<br>'
      +       '关联剧本：'+App.esc(scenarioName(p.scenarioId))+'<br>'
      +       '计划日期：'+App.esc(p.date)+'<br>'
      +       '参演角色：'+(p.members?p.members.length:0)+' 个<br>'
      +       '事件等级：'+App.esc(p.level||'一般')
      +     '</div>'
      +   '</div>'
      + '</div>'
      + '<div class="script-section">'
      +   '<h3>可用操作</h3>'
      +   '<div class="tiny dim">手动推送会再次发送站内消息给所有参演角色；导出为 Word 可打印分发。</div>'
      + '</div>',
      foot:'<button class="btn" id="npClose">关闭</button>'
        + '<button class="btn" id="npGen">'+App.icon('bell')+'手动推送</button>'
        + '<a class="btn ok" id="npWord" style="text-decoration:none" target="_blank">'+App.icon('download')+'导出 Word</a>',
      onOpen:function(ov){
        ov.querySelector('#npClose').onclick = ov.close;
        ov.querySelector('#npWord').onclick = function(ev){
          ev.preventDefault();
          API.downloadWithAuth(API.exportProjectNotifyUrl(p.id), 'notify_' + p.id + '.doc')
            .catch(function(err){ App.toast(err.message || '导出失败'); });
        };
        ov.querySelector('#npGen').onclick = function(){
          var btn = ov.querySelector('#npGen');
          btn.disabled = true; btn.textContent = '推送中…';
          API.generateProjectNotify(p.id).then(function(){
            btn.disabled = false; btn.textContent = '手动推送通知';
            App.toast('演练通知已推送至所有参演角色的站内消息','ok');
          }).catch(function(err){
            btn.disabled = false; btn.textContent = '手动推送通知';
            App.toast((err&&err.message)||'推送失败','err');
          });
        };
      } });
  }

  /* ===== 删除 / 状态变更 / 编组 ===== */
  function confirmDelete(p){
    App.modal({ title:'删除演练项目 · '+App.esc(p.name), body:
      '<div class="sim-banner">'+App.icon('alert')+'<span>删除后不可恢复。</span></div>'
      + '<p style="font-size:13.5px">确认删除演练项目「'+App.esc(p.name)+'」（'+p.id+'）？</p>',
      foot:'<button class="btn" id="pjDelNo">取消</button><button class="btn danger" id="pjDelYes">确认删除</button>',
      onOpen:function(ov){
        ov.querySelector('#pjDelNo').onclick = ov.close;
        ov.querySelector('#pjDelYes').onclick = function(){
          var btn = ov.querySelector('#pjDelYes');
          btn.disabled = true; btn.textContent = '删除中…';
          API.deleteProject(p.id).then(function(){
            ov.close(); render(); App.refreshShell();
            App.toast('演练项目「'+p.name+'」已删除','ok');
          }).catch(function(err){
            btn.disabled = false; btn.textContent = '确认删除';
            App.toast((err && err.message) ? err.message : '删除失败','err');
          });
        };
      } });
  }
  function changeStatus(p, to, msg){
    App.confirmSim(msg, function(){
      API.updateProjectStatus(p.id, to).then(function(){
        render();
        App.toast('演练模拟：项目状态已变更为「'+to+'」','ok');
      }).catch(function(err){
        var body = (err && err.body) || {};
        var ck = body.checklist;
        if (body.needsException && ck) {
          /* 结束演练有缺项：必须给出明确提示与去向，不能静默失败 */
          var req = (ck.requiredMissing || []).map(function(x){ return '「'+App.esc(x.title||x.nodeId||'')+'」'; });
          var core = (ck.coreMissing || []).map(function(x){ return '「'+App.esc(x.nodeTitle||x.target||'')+'」'+App.esc(x.name||''); });
          var lines = [];
          if (req.length) lines.push('未完成的必做节点：' + req.join('、'));
          if (core.length) lines.push('未归档的核心取证：' + core.join('、'));
          if (!lines.length) lines.push(App.esc(body.error || '存在未满足的结束条件'));
          App.modal({
            title: '结束演练 · 存在缺项',
            body: '<div style="line-height:1.9">'
              + '<div class="tiny dim" style="margin-bottom:8px">'+App.esc(ck.hint || '请补齐缺项，或填写缺项说明后结束。')+'</div>'
              + lines.join('<br>')
              + '<div class="tiny dim" style="margin-top:10px">如需按缺项结束，请在「演练工作台」走结束流程，填写原因/责任人/补录时限。</div>'
              + '</div>',
            foot: '<button class="btn" id="pjEndCancel">取消</button><a class="btn primary" href="workbench.html">前往工作台结束演练</a>',
            onOpen: function(ov){
              var b = ov.querySelector('#pjEndCancel');
              if (b) b.onclick = function(){ ov.close(); };
            }
          });
          return;
        }
        App.toast((err && err.message) || '状态变更失败', 'err');
      });
    });
  }

  function openGroup(p){
    App.drawer({ title:'编组管理 · '+App.esc(p.name), body:'<div id="grpBody"></div>', onOpen:function(o){ refreshGrp(o, p); } });
  }
  function refreshGrp(ov, p){
    var body = ov.querySelector('#grpBody');
    body.innerHTML =
      '<div class="flex gap2" style="justify-content:space-between"><div class="section-title" style="margin-bottom:0">参演编组</div>'
      + (canOp?'<button class="btn sm" id="addMem">'+App.icon('plus')+'添加</button>':'')+'</div>'
      + '<div class="table-wrap mt3"><table class="table"><thead><tr><th>参演角色</th><th>职责</th></tr></thead><tbody>'
      + ((p.members&&p.members.length)?p.members.map(function(m){ var r = MOCK.ROLES.filter(function(x){ return x.id===m.role; })[0]; return '<tr><td class="bold">'+(r?r.name:m.role)+'</td><td class="tiny dim">'+(r?App.esc(r.desc):'')+'</td></tr>'; }).join('')
          :'<tr><td colspan="2" class="dim small">尚未添加参演角色</td></tr>')
      + '</tbody></table></div>';
    var btn = body.querySelector('#addMem');
    if(btn) btn.onclick = function(){
      var used = (p.members||[]).map(function(m){ return m.role; });
      var avail = MOCK.ROLES.filter(function(r){ return used.indexOf(r.id)<0; });
      if(!avail.length){ App.toast('全部角色已在编组中','warn'); return; }
      App.modal({ title:'添加参演角色', body:'<div class="form-row"><label class="f-label">参演角色</label><select class="select" id="amRole">'
        + avail.map(function(r){ return '<option value="'+r.id+'">'+r.name+'</option>'; }).join('')+'</select></div>',
        foot:'<button class="btn" id="amNo">取消</button><button class="btn primary" id="amYes">加入</button>',
        onOpen:function(m){
          m.querySelector('#amNo').onclick = m.close;
          m.querySelector('#amYes').onclick = function(){
            var rid = m.querySelector('#amRole').value;
            var next = (p.members||[]).map(function(x){ return { role:x.role }; }).concat([{ role:rid }]);
            API.updateProjectMembers(p.id, next).then(function(){
              p.members = next;
              m.close(); refreshGrp(ov, p); render();
              App.toast('角色已加入编组','ok');
            });
          };
        } });
    };
  }

  /* ===== 新建项目向导 ===== */
  var enabledScs = MOCK.SCENARIOS.filter(function(s){ return s.status==='启用'; });

  var nb = document.getElementById('btnNew');
  if(nb) nb.onclick = function(){
    App.modal({ title:'新建演练项目', wide:true, body:'<div class="form-grid">'
      + '<div class="form-row span2"><label class="f-label">项目名称<span class="req">*</span></label><input class="input" id="npName" placeholder="如：2026年勒索病毒应急演练"></div>'
      + '<div class="form-row"><label class="f-label">演练类型</label><select class="select" id="npType">'+MOCK.DICT.projTypes.map(function(t){ return '<option>'+t+'</option>'; }).join('')+'</select></div>'
      + '<div class="form-row"><label class="f-label">关联剧本</label><select class="select" id="npSc">'+enabledScs.map(function(s){ return '<option value="'+s.id+'">'+s.id+' · '+App.esc(s.name)+'（'+s.level+' · '+(s.category||'网络安全演练')+'）</option>'; }).join('')+'</select></div>'
      + '<div class="form-row span2"><label class="f-label">演练模式<span class="req">*</span></label><div class="flex gap3 wrap">'
      +   '<label class="check"><input type="radio" name="npMode" value="基础版" checked>基础版（按剧本提示逐步操作）</label>'
      +   '<label class="check"><input type="radio" name="npMode" value="实战版">实战版（自主选择处置方案）</label>'
      + '</div><div class="tiny dim" style="margin-top:4px">基础版仅时限评分，实战版按偏离/超时/未完成扣分。</div></div>'
      + '<div class="form-row"><label class="f-label">计划日期<span class="req">*</span></label><input class="input" id="npDate" type="date" value="2026-11-20"></div>'
      + '<div class="form-row span2"><label class="f-label">参演角色</label><div class="flex gap3 wrap" id="npRoles">'
      +   MOCK.ROLES.map(function(r){ return '<label class="check"><input type="checkbox" value="'+r.id+'"'+(r.id==='commander'?' checked':'')+'>'+r.name+'</label>'; }).join('')
      + '</div></div>'
      + '</div>',
      foot:'<button class="btn" id="npNo">取消</button><button class="btn primary" id="npYes">创建项目</button>',
      onOpen:function(ov){ ov.querySelector('#npNo').onclick=ov.close; ov.querySelector('#npYes').onclick=function(){
        var name = ov.querySelector('#npName').value.trim();
        var date = ov.querySelector('#npDate').value;
        var members = Array.prototype.slice.call(ov.querySelectorAll('#npRoles input:checked')).map(function(c){ return { role:c.value }; });
        if(!name){ App.toast('请填写项目名称','err'); return; }
        if(!date){ App.toast('请选择计划日期','err'); return; }
        if(!members.length){ App.toast('请至少选择一个参演角色','err'); return; }
        var sc = MOCK.SCENARIOS.filter(function(s){ return s.id===ov.querySelector('#npSc').value; })[0];
        var btn = ov.querySelector('#npYes');
        btn.disabled = true; btn.textContent = '创建中…';
        var modeEl = ov.querySelector('input[name="npMode"]:checked');
        var mode = modeEl ? modeEl.value : '基础版';
        API.createProject({
          name:name, type:ov.querySelector('#npType').value, date:date, mode:mode,
          scenarioId:sc?sc.id:'', level:sc?sc.level:'一般',
          units:undefined, members:members,
          target:'验证'+ov.querySelector('#npType').value+'流程与协同时效'
        }).then(function(res){
          ov.close();
          MOCK.PROJECTS.unshift(res.project);
          render();
          showPostCreateActions(res.project);
        }).catch(function(err){
          btn.disabled = false; btn.textContent = '创建项目';
          App.toast((err && err.message) ? err.message : '创建失败','err');
        });
      }; } });
  };

  function showPostCreateActions(p){
    App.modal({
      title:'演练项目创建成功',
      body:
        '<div class="notice-sent" style="margin-bottom:14px">'+App.icon('check-circle')+' 演练项目「'+App.esc(p.name)+'」已创建（'+p.id+'）</div>'
        + '<div class="script-section" style="margin-bottom:14px"><h3>下一步</h3>'
        +   '<div class="notice-preview"><div class="np-title">'+App.icon('bell')+' 演练通知已自动生成</div><div class="np-body">所有参演角色登录后可通过站内消息查收。可手动再次推送或导出为 HTML 打印分发。</div></div>'
        +   '<div class="notice-preview" style="margin-top:10px"><div class="np-title">'+App.icon('file-text')+' 演练脚本已就绪</div><div class="np-body">'+(p.mode==='实战版'?'实战版仅展示主流节点流程，混淆节点已屏蔽。':'基础版含完整主流节点与演练提示信息。')+'</div></div>'
        + '</div>',
      foot:'<button class="btn" id="pcaClose">返回列表</button>'
        + '<button class="btn" id="pcaNotify">'+App.icon('bell')+'通知</button>'
        + '<button class="btn primary" id="pcaScript">'+App.icon('file-text')+'查看脚本</button>',
      onOpen:function(ov){
        ov.querySelector('#pcaClose').onclick = ov.close;
        ov.querySelector('#pcaNotify').onclick = function(){ ov.close(); openNotify(p); };
        ov.querySelector('#pcaScript').onclick = function(){ ov.close(); openScript(p); };
      }
    });
  }

  render();
});
App.boot('projects');
</script>
</body>
</html>
